name: Validate PR 429 exact OAuth diagnostic head

on:
  pull_request:
    branches:
      - nightjar/402-token-exchange-reason
    paths:
      - .github/workflows/apply-429-malformed-payload-repair.yml
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  REQUIRED_SOURCE_SHA: 03a8582bfc36ef58adffff91c229d849876f3761

jobs:
  validate:
    if: github.head_ref == 'nightjar/429-malformed-response-repair-exec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REQUIRED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUIRED_SOURCE_SHA"
          test "$(git diff --name-only "$REQUIRED_SOURCE_SHA^" "$REQUIRED_SOURCE_SHA" | sort | tr '\n' ' ')" = "src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts "
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run focused authentication tests
        run: bun test test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
      - name: Run typecheck
        run: bun run typecheck
      - name: Run Bun tests
        run: bun test
      - name: Run Convex tests
        run: bun run test:convex
      - name: Bundle Cloudflare Worker
        run: bun run worker:check
