name: Apply PR 535 GitHub context integration

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-pr-535-github-context
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mercury/492-github-project-context-recovery
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Wire GitHub context into the ledger and MCP registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one exact anchor, found {text.count(old)}")
              target.write_text(text.replace(old, new, 1))

          sqlite_path = Path("src/github-issue-context-sqlite.ts")
          sqlite = sqlite_path.read_text()
          marker = "function prepareAcceptance(\n"
          listing = '''export function listCurrentSqliteGitHubIssueContexts(
            store: StensiblyStore,
            input: { workspace: string; project: string; limit?: number },
          ): GitHubIssueContextRecord[] {
            ensureGitHubIssueContextSchema(store);
            const workspace = boundedWorkspace(input.workspace, "Workspace");
            const project = boundedWorkspace(input.project, "Project");
            const limit = input.limit ?? 20;
            if (!Number.isSafeInteger(limit) || limit < 1 || limit > 100) {
              throw new RangeError("GitHub issue context list limit must be between 1 and 100");
            }
            return store.db.query<GitHubIssueContextRow, [string, string, number]>(`
              SELECT *
              FROM github_issue_contexts
              WHERE workspace_id = ?1
                AND project_id = ?2
                AND is_current = 1
              ORDER BY external_id ASC
              LIMIT ?3
            `).all(workspace, project, limit).map(mapRecord);
          }

          '''
          if "export function listCurrentSqliteGitHubIssueContexts" not in sqlite:
              if sqlite.count(marker) != 1:
                  raise SystemExit("GitHub context acceptance marker missing or duplicated")
              sqlite = sqlite.replace(marker, listing + marker, 1)
              sqlite_path.write_text(sqlite)

          replace_exact(
              "src/sqlite-ledger.ts",
              'import {\n  readBoundedItemArtifacts,',
              'import {\n  getSqliteGitHubProjectContext,\n  type GetGitHubProjectContextInput,\n  type GitHubProjectContextLedger,\n} from "./github-project-context.js";\nimport { ensureGitHubIssueContextSchema } from "./github-issue-context-sqlite.js";\nimport {\n  readBoundedItemArtifacts,',
          )
          replace_exact(
              "src/sqlite-ledger.ts",
              "  ProjectAttachmentLedger,\n  OperationReceiptLedger\n",
              "  ProjectAttachmentLedger,\n  OperationReceiptLedger,\n  GitHubProjectContextLedger\n",
          )
          replace_exact(
              "src/sqlite-ledger.ts",
              "    ensureProjectAttachmentSchema(store);\n",
              "    ensureProjectAttachmentSchema(store);\n    ensureGitHubIssueContextSchema(store);\n",
          )
          replace_exact(
              "src/sqlite-ledger.ts",
              "  async getProjectAttachment(project: string) {\n    return getSqliteProjectAttachment(this.store, project);\n  }\n\n",
              "  async getProjectAttachment(project: string) {\n    return getSqliteProjectAttachment(this.store, project);\n  }\n\n  async getGitHubProjectContext(input: GetGitHubProjectContextInput) {\n    return getSqliteGitHubProjectContext(this.store, input);\n  }\n\n",
          )

          replace_exact(
              "src/mcp.ts",
              'import { registerContextPacketTools } from "./context-mcp.js";\n',
              'import { registerContextPacketTools } from "./context-mcp.js";\nimport { registerGitHubProjectContextTools } from "./github-project-context-mcp.js";\n',
          )
          replace_exact(
              "src/mcp.ts",
              '        "Start with get_brief when entering an existing project, then use get_project_attachment to read its accepted repository policy and durable context.",\n',
              '        "Start with get_brief when entering an existing project, then use get_project_attachment to read its accepted repository policy and durable context.",\n        "Use get_github_project_context when direct GitHub tools are unavailable or when you need the last accepted issue set, synchronization freshness, direct GitHub links, and connector recovery steps.",\n        "Treat GitHub as canonical; a degraded Stensibly projection requires direct GitHub reconciliation before consequential work.",\n',
          )
          replace_exact(
              "src/mcp.ts",
              "  registerOperationReceiptTools(server, ledger);\n",
              "  registerGitHubProjectContextTools(server, ledger);\n  registerOperationReceiptTools(server, ledger);\n",
          )

          replace_exact(
              "src/mcp-http.ts",
              '  "get_brief",\n',
              '  "get_brief",\n  "get_github_project_context",\n',
          )
          replace_exact(
              "src/mcp-http.ts",
              '    toolName === "get_brief"\n    || toolName === "get_project_attachment"\n',
              '    toolName === "get_brief"\n    || toolName === "get_github_project_context"\n    || toolName === "get_project_attachment"\n',
          )

          replace_exact(
              "src/mcp-diagnostics.ts",
              '  "get_continuation",\n  "get_item",\n',
              '  "get_continuation",\n  "get_github_project_context",\n  "get_item",\n',
          )

          snapshot = {
              "snapshotVersion": 1,
              "manifestVersion": 1,
              "toolCount": 27,
              "toolManifestFingerprint": "sha256:0e7353a9a48b1b9d6d618a8a4a19b4520a97ba54f1ba4c91fb54294fbbe6f516",
              "tools": [
                  "attach_artifact",
                  "block_work",
                  "claim_work",
                  "complete_work",
                  "create_item",
                  "edit_continuation",
                  "get_brief",
                  "get_continuation",
                  "get_github_project_context",
                  "get_item",
                  "get_operation_receipt",
                  "get_project_attachment",
                  "get_runner_context",
                  "handoff_work",
                  "list_artifacts",
                  "list_continuation_inbox",
                  "list_continuations",
                  "list_work",
                  "propose_continuation",
                  "queue_continuation_for_supervisor",
                  "record_event",
                  "release_work",
                  "renew_claim",
                  "resolve_continuation",
                  "run_continuation_supervisor_policy",
                  "survey_workspace",
                  "unblock_work",
              ],
              "requiredAdminActionAfterChange": "refresh_or_recreate_chatgpt_app",
              "reviewedOn": "2026-07-29",
          }
          Path("docs/chatgpt-app-actions.json").write_text(json.dumps(snapshot, indent=2) + "\n")

          recovery_path = Path("docs/chatgpt-app-recovery.md")
          recovery = recovery_path.read_text()
          recovery = recovery.replace("Current `main` defines **26** public MCP tools", "Current `main` defines **27** public MCP tools", 1)
          recovery = recovery.replace(
              "sha256:ecbae4d7efe2b6757b321a80d301fe06b81e70641717ddd682f9ceab0d4165bb",
              "sha256:0e7353a9a48b1b9d6d618a8a4a19b4520a97ba54f1ba4c91fb54294fbbe6f516",
          )
          recovery = recovery.replace(
              "The incident conversation exposed 25 Stensibly actions. The missing action is `get_operation_receipt`, added after the earlier ChatGPT app scan. Treat a 25-action scan as a stale ChatGPT app snapshot.",
              "The incident conversation exposed 25 Stensibly actions. A 25-action scan is stale because it lacks `get_operation_receipt` and later tools. A 26-action scan is also stale after this slice when it lacks `get_github_project_context`.",
              1,
          )
          recovery = recovery.replace(
              "Confirm the app shows 26 actions and includes `get_operation_receipt`.",
              "Confirm the app shows 27 actions and includes both `get_operation_receipt` and `get_github_project_context`.",
              1,
          )
          recovery = recovery.replace(
              "Confirm 26 actions and create a fresh draft.",
              "Confirm 27 actions and create a fresh draft.",
              1,
          )
          recovery = recovery.replace(
              "2. Stensibly: `survey_workspace` or `get_brief`.",
              "2. Stensibly: `survey_workspace`, `get_brief`, or `get_github_project_context` for the accepted issue set and recovery guidance.",
              1,
          )
          recovery = recovery.replace(
              "- ChatGPT exposes 25 actions while the checked-in snapshot expects 26;\n- `get_operation_receipt` is absent;",
              "- ChatGPT exposes fewer than 27 actions while the checked-in snapshot expects 27;\n- `get_operation_receipt` or `get_github_project_context` is absent;",
              1,
          )
          recovery = recovery.replace(
              "confirmation that the expected server manifest is 26 tools with fingerprint",
              "confirmation that the expected server manifest is 27 tools with fingerprint",
              1,
          )
          guide_marker = "## Layer diagnosis\n"
          guide = '''## Back out of a narrowed connector context

When one conversation becomes trapped in a narrow tool binding or GitHub disappears:

1. preserve the first exact failure and do not blindly repeat a possibly completed write;
2. use `get_github_project_context` while Stensibly remains reachable to recover canonical GitHub links, last accepted issue state, synchronization freshness, and the accepted instruction identity;
3. return to a normal ChatGPT conversation rather than agent mode or company knowledge;
4. explicitly select both GitHub and Stensibly;
5. start a new conversation when schemas appear but calls fail before any Stensibly Worker receipt;
6. refresh or recreate the Stensibly app when the checked-in 27-action manifest is not visible;
7. reconnect OAuth only when the request reaches Stensibly and reports authentication failure.

Stensibly cannot restore the first-party GitHub connector from its server. It can keep the direct GitHub URL and recovery procedure visible so the worker can leave the failed chat or tool call and resume from the public source.

'''
          if "## Back out of a narrowed connector context" not in recovery:
              if recovery.count(guide_marker) != 1:
                  raise SystemExit("recovery layer marker missing or duplicated")
              recovery = recovery.replace(guide_marker, guide + guide_marker, 1)
          recovery_path.write_text(recovery)

          persistence_path = Path("docs/github-issue-context-persistence.md")
          persistence = persistence_path.read_text()
          persistence = persistence.replace(
              "A later reviewed #492 slice can expose this read model through one project-scoped REST/MCP projection and bind the accepted instruction-set ID into one context packet and run record. Outbound GitHub proposals, exact grants, receipts, ambiguity handling, and read-after-write verification remain a separate consequential-mutation lane.",
              "The reviewed `get_github_project_context` MCP projection now exposes the current accepted issue set, bounded issue history, synchronization freshness, direct GitHub links, accepted instruction-set identity, and connector recovery guidance under project-scoped read authorization. The next #492 slice can bind the instruction-set ID into one context packet and run record. Outbound GitHub proposals, exact grants, receipts, ambiguity handling, and read-after-write verification remain a separate consequential-mutation lane.",
              1,
          )
          persistence_path.write_text(persistence)

          diagnostics_path = Path("docs/mcp-connector-diagnostics.md")
          diagnostics = diagnostics_path.read_text()
          note = '''

When Stensibly remains reachable but the direct GitHub connector disappears, `get_github_project_context` returns the last accepted issue set, canonical GitHub URLs, synchronization freshness, and bounded conversation-recovery guidance. This is a recovery projection, not proof that GitHub is currently reachable or authority to mutate GitHub.
'''
          if "get_github_project_context" not in diagnostics:
              diagnostics_path.write_text(diagnostics.rstrip() + note + "\n")
          PY
      - name: Validate integration
        run: |
          bun install --frozen-lockfile
          bun test test/mcp-github-project-context.test.ts test/github-issue-context-sqlite.test.ts test/chatgpt-app-actions-snapshot.test.ts
          bun run typecheck
      - name: Commit integration and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Mercury GitHub context integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-535-github-context.yml
          git add src/github-issue-context-sqlite.ts src/sqlite-ledger.ts src/mcp.ts src/mcp-http.ts src/mcp-diagnostics.ts docs/chatgpt-app-actions.json docs/chatgpt-app-recovery.md docs/github-issue-context-persistence.md docs/mcp-connector-diagnostics.md
          git commit -m "feat: expose accepted GitHub project context"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:mercury/492-github-project-context-recovery
