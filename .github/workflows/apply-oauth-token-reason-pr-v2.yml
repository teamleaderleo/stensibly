name: Apply OAuth token reason diagnostic from PR v2

on:
  pull_request:
    branches:
      - nightjar/402-token-exchange-reason
    paths:
      - .github/workflows/apply-oauth-token-reason-pr-v2.yml
      - oauth-token-reason.patch
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'nightjar/402-token-reason-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nightjar/402-token-exchange-reason
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact source patch
        shell: bash
        run: |
          set -uo pipefail
          git show "origin/${{ github.head_ref }}:oauth-token-reason.patch" > /tmp/oauth-token-reason.patch
          git apply --recount --check --verbose /tmp/oauth-token-reason.patch > /tmp/oauth-token-reason-apply.txt 2>&1
          status=$?
          cat /tmp/oauth-token-reason-apply.txt
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          git apply --recount /tmp/oauth-token-reason.patch
      - name: Upload patch-check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-token-reason-apply-output
          path: /tmp/oauth-token-reason-apply.txt
          if-no-files-found: ignore
          retention-days: 1
      - run: bun install
      - name: Run focused authentication tests
        run: bun test test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
      - name: Run full repository gate
        run: |
          bun run typecheck
          bun test
          bun run test:convex
          bun run worker:check
      - name: Commit source-only candidate and remove applicators
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nightjar"
          git config user.email "teamleaderleo@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
          git commit -m "Classify GitHub token exchange rejection reasons"
          git rm .github/workflows/apply-oauth-token-reason-once.yml .github/workflows/apply-oauth-token-reason-trigger.yml
          git commit -m "Remove OAuth reason applicators"
          git push origin HEAD:nightjar/402-token-exchange-reason
