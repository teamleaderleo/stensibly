name: Apply OAuth token reason diagnostic from PR

on:
  pull_request:
    branches:
      - nightjar/402-token-exchange-reason
    paths:
      - .github/workflows/apply-oauth-token-reason-pr.yml
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'nightjar/402-token-reason-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nightjar/402-token-exchange-reason
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Execute the reviewed exact-replacement applicator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/apply-oauth-token-reason-once.yml").read_text().splitlines()
          start = source.index("          from pathlib import Path")
          end = source.index("          PY", start)
          block = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          script = "\n".join(line[indent:] for line in block) + "\n"
          exec(compile(script, "oauth-token-reason-applicator.py", "exec"), {})
          PY
      - run: bun install
      - name: Run focused authentication tests
        run: bun test test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
      - name: Run full repository gate
        run: |
          bun run typecheck
          bun test
          bun run test:convex
          bun run worker:check
      - name: Commit source-only candidate and remove branch applicators
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nightjar"
          git config user.email "teamleaderleo@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
          git commit -m "Classify GitHub token exchange rejection reasons"
          git rm .github/workflows/apply-oauth-token-reason-once.yml .github/workflows/apply-oauth-token-reason-trigger.yml
          git commit -m "Remove OAuth reason applicators"
          git push origin HEAD:nightjar/402-token-exchange-reason
