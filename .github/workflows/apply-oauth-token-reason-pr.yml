name: Apply OAuth token reason diagnostic from PR

on:
  pull_request:
    branches:
      - nightjar/402-token-exchange-reason
    paths:
      - .github/workflows/apply-oauth-token-reason-pr.yml
      - scripts/apply-oauth-token-reason.py
      - scripts/run-oauth-token-reason-applicator.py
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'nightjar/402-token-reason-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution source
        uses: actions/checkout@v6
        with:
          ref: nightjar/402-token-reason-pr-trigger
          path: trigger
          fetch-depth: 0
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: nightjar/402-token-exchange-reason
          path: candidate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact source and test repair
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python ../trigger/scripts/run-oauth-token-reason-applicator.py 2>&1 | tee applicator-output.txt
      - name: Install dependencies
        working-directory: candidate
        run: bun install
      - name: Run focused authentication tests
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          bun test test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts 2>&1 | tee focused-test-output.txt
      - name: Run typecheck
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.txt
      - name: Run full Bun tests
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee bun-test-output.txt
      - name: Run Convex tests
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          bun run test:convex 2>&1 | tee convex-test-output.txt
      - name: Bundle Worker
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          bun run worker:check 2>&1 | tee worker-check-output.txt
      - name: Upload execution output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-reason-execution-output
          path: |
            candidate/applicator-output.txt
            candidate/focused-test-output.txt
            candidate/typecheck-output.txt
            candidate/bun-test-output.txt
            candidate/convex-test-output.txt
            candidate/worker-check-output.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Commit source-only candidate and remove branch applicators
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nightjar"
          git config user.email "teamleaderleo@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
          git commit -m "Classify GitHub token exchange rejection reasons"
          git rm .github/workflows/apply-oauth-token-reason-once.yml .github/workflows/apply-oauth-token-reason-trigger.yml
          git commit -m "Remove OAuth reason applicators"
          git push origin HEAD:nightjar/402-token-exchange-reason
