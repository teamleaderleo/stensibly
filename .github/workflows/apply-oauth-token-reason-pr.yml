name: Apply OAuth token payload shape repair from PR

on:
  pull_request:
    branches:
      - nightjar/402-token-exchange-reason
    paths:
      - .github/workflows/apply-oauth-token-reason-pr.yml
      - scripts/apply-oauth-payload-shape-repair.py
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'nightjar/402-token-reason-pr-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution source
        uses: actions/checkout@v6
        with:
          ref: nightjar/402-token-reason-pr-trigger
          path: trigger
          fetch-depth: 0
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: nightjar/402-token-exchange-reason
          path: candidate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact review repair
        working-directory: candidate
        run: python ../trigger/scripts/apply-oauth-payload-shape-repair.py
      - name: Install dependencies
        working-directory: candidate
        run: bun install
      - name: Run focused authentication tests
        working-directory: candidate
        run: bun test test/hosted-auth-github-http-client.test.ts test/hosted-auth.test.ts
      - name: Run typecheck
        working-directory: candidate
        run: bun run typecheck
      - name: Run full Bun tests
        working-directory: candidate
        run: bun run test
      - name: Run Convex tests
        working-directory: candidate
        run: bun run test:convex
      - name: Bundle Worker
        working-directory: candidate
        run: bun run worker:check
      - name: Commit repaired source-only candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nightjar"
          git config user.email "teamleaderleo@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts
          git commit -m "Reject non-object GitHub token payloads"
          git push origin HEAD:nightjar/402-token-exchange-reason
