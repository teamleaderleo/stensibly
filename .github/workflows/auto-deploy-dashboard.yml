name: Queue Dashboard Release Window

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Queue the latest main revision even when no new dashboard diff is detected
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: stensibly-dashboard-auto-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: Queue latest eligible dashboard release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Evaluate the two-hour release window
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_DASHBOARD_RELEASE: ${{ inputs.force || false }}
        run: bun scripts/dashboard-release-window.ts
