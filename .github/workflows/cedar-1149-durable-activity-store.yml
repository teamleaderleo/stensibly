      - uses: oven-sh/setup-bun@v2

      - name: Validate durable activity slice
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/orchestrator-activity-ingestion.test.ts \
            test/orchestrator-activity-convex-store.test.ts
          bunx vitest run convex/orchestratorActivity.test.ts
          git diff --check

      - name: Publish one workflow-free current-main commit
        shell: bash
        env:
          MAIN: e78ae196c31cc8ba9416bb8d8a050a98cb61a32a
          CARRIER_SHA: ${{ github.sha }}
          HEAD_REF: cedar/1149-durable-activity-ingestion
        run: |
          set -euo pipefail
          rm .github/workflows/cedar-1149-durable-activity-store.yml
          git reset --mixed "$MAIN"
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          test "${#changed[@]}" -eq 7
          test "$(printf '%s\n' "${changed[@]}" | grep -c '^\.github/' || true)" -eq 0
          for path in \
            convex/orchestratorActivity.test.ts \
            convex/orchestratorActivity.ts \
            convex/schema.ts \
            src/orchestrator-activity-convex-store.ts \
            src/orchestrator-activity-ingestion-contract.ts \
            src/orchestrator-activity-ingestion.ts \
            test/orchestrator-activity-convex-store.test.ts; do
            printf '%s\n' "${changed[@]}" | grep -qx "$path"
          done
          git config user.name "Cedar"
          git config user.email "actions@users.noreply.github.com"
          git add convex src test
          git diff --cached --check
          git commit -m "Persist orchestrator activity ingestion in Convex"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$CARRIER_SHA"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${CARRIER_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
