name: Cedar 1245 final carrier lease

on:
  push:
    branches:
      - cedar/1238-observation-hardening-convergence
    paths:
      - .github/workflows/cedar-1245-final-lease-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: cedar-1245-final-carrier-lease
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/1238-observation-hardening-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact final carrier parent and strengthened error control
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: cedar/1238-observation-hardening-convergence
          CARRIER_BLOB: 030c7382daacabcef40cd9aa44918326ddda754c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "b76d0502969f73de469fbb9caf4fd334b832a61b"
          test "$(git rev-parse HEAD:.github/workflows/cedar-1238-observation-hardening.yml)" = "$CARRIER_BLOB"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/cedar-1238-observation-hardening.yml')
          text = path.read_text()

          old_parent = '          PARENT: e08caf4fe7c7149d1a2fc6fb466154cad33382fb\n'
          new_parent = f'          PARENT: {os.environ["EXPECTED_HEAD"]}\n'
          if text.count(old_parent) != 2:
              raise SystemExit(f'carrier parent anchors moved: {text.count(old_parent)}')
          text = text.replace(old_parent, new_parent)

          old_error_ref = '          ERROR_CONTROL: 6f03a7acd3b88f1b94aa3f2f1ac5598e458a459d\n'
          new_error_ref = '          ERROR_CONTROL: 0618d50624474dbe487e62b0763e2944bf357058\n'
          if text.count(old_error_ref) != 2:
              raise SystemExit(f'error-control ref anchors moved: {text.count(old_error_ref)}')
          text = text.replace(old_error_ref, new_error_ref)

          old_control = '          test "$(git rev-parse $ERROR_CONTROL:test/github-repository-observation-convex-error-boundary.test.ts)" = "$(git rev-parse $ERROR_CONTROL:test/github-repository-observation-convex-error-boundary.test.ts)"\n'
          new_control = '          test "$(git rev-parse $ERROR_CONTROL:test/github-repository-observation-convex-error-boundary.test.ts)" = "ff39709374d198fdc5793b4e61dbd69e2cc06c82"\n'
          if text.count(old_control) != 1:
              raise SystemExit(f'error-control lease anchor moved: {text.count(old_control)}')
          text = text.replace(old_control, new_control, 1)

          old_map = '''    if (error instanceof GitHubRepositoryObservationConflictError) return error;
    if (error instanceof GitHubRepositoryObservationStorageError) return error;'''
          new_map = '''    if (error instanceof GitHubRepositoryObservationConflictError) {
      return new GitHubRepositoryObservationConflictError();
    }
    if (error instanceof GitHubRepositoryObservationStorageError) {
      return new GitHubRepositoryObservationStorageError();
    }'''
          if text.count(old_map) != 1:
              raise SystemExit(f'fixed error rematerialization anchor moved: {text.count(old_map)}')
          path.write_text(text.replace(old_map, new_map, 1))
          PY
          git rm .github/workflows/cedar-1245-final-lease-bootstrap.yml
          git add .github/workflows/cedar-1238-observation-hardening.yml
          git diff --cached --check
          git config user.name "Cedar"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind final repository observation carrier"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
