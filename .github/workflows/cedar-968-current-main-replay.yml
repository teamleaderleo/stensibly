name: Cedar 968 current-main replay

on:
  push:
    branches:
      - juniper/525-private-label-assignee-writes
    paths:
      - .github/workflows/cedar-968-current-main-replay.yml

permissions:
  contents: write

concurrency:
  group: cedar-968-current-main-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/525-private-label-assignee-writes
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and current main
        env:
          SOURCE: d366b0160355c03ecb8732a857721a3b10a5254d
          OLD_BASE: dfb6b61dfbb1f895d9dc4dec4b58c3093dcd96b3
          MAIN: 286958de6fd954753ffc8c31a3db7d0d9cc9c4f5
          REPAIR_CARRIER: de36f66b6698cce2cf022349757278aa237fb905
        run: |
          set -euo pipefail
          test "$(git rev-parse "$SOURCE^")" = "$OLD_BASE"
          test "$(git diff --name-only "$SOURCE" HEAD)" = ".github/workflows/cedar-968-current-main-replay.yml"
          git fetch --no-tags origin "$MAIN"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN"
          git show "$REPAIR_CARRIER:.github/workflows/lumen-968-init-snapshot-repair.yml" > /tmp/lumen-968.yml

      - name: Replay exact private packet
        env:
          SOURCE: d366b0160355c03ecb8732a857721a3b10a5254d
          OLD_BASE: dfb6b61dfbb1f895d9dc4dec4b58c3093dcd96b3
          MAIN: 286958de6fd954753ffc8c31a3db7d0d9cc9c4f5
        run: |
          set -euo pipefail
          git config user.name "Cedar"
          git config user.email "actions@users.noreply.github.com"
          git rebase --onto "$MAIN" "$OLD_BASE" "$SOURCE"
          test "$(git rev-parse HEAD^)" = "$MAIN"

      - name: Apply final RequestInit snapshot repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('/tmp/lumen-968.yml').read_text()
          python_marker = '''      - name: Apply one-pass RequestInit snapshot repair
                shell: python
                run: |
          '''
          python_marker = textwrap.dedent(python_marker)
          start = text.index(python_marker) + len(python_marker)
          end = text.index('\n      - name: Add exact getter and method-snapshot controls', start)
          Path('/tmp/repair.py').write_text(textwrap.dedent(text[start:end]))

          shell_marker = '''      - name: Add exact getter and method-snapshot controls
                shell: bash
                run: |
          '''
          shell_marker = textwrap.dedent(shell_marker)
          start = text.index(shell_marker) + len(shell_marker)
          end = text.index('\n      - name: Verify repaired private packet', start)
          Path('/tmp/add-control.sh').write_text(textwrap.dedent(text[start:end]))
          PY
          python3 /tmp/repair.py
          bash /tmp/add-control.sh
          git add src test
          git commit --amend --no-edit

          MAIN=286958de6fd954753ffc8c31a3db7d0d9cc9c4f5
          mapfile -t changed < <(git diff --name-only "$MAIN" HEAD | sort)
          test "${#changed[@]}" -eq 40
          test "$(printf '%s\n' "${changed[@]}" | grep -c '^src/')" -eq 10
          test "$(printf '%s\n' "${changed[@]}" | grep -c '^test/')" -eq 30
          test "$(printf '%s\n' "${changed[@]}" | grep -c '^\.github/')" -eq 0
          printf '%s\n' "${changed[@]}" | grep -qx 'src/hosted-github-issue-provider.ts'
          printf '%s\n' "${changed[@]}" | grep -qx 'test/github-provider-bounded-response-init-single-snapshot.test.ts'
          printf '%s\n' "${changed[@]}" | grep -qx 'test/hosted-github-issue-set-write-provider.test.ts'
          git diff --check "$MAIN" HEAD

      - uses: oven-sh/setup-bun@v2

      - name: Validate replayed private packet
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/hosted-github-issue-set-write-provider.test.ts \
            test/hosted-github-issue-set-write-boundaries.test.ts \
            test/github-rest-issue-set-write-assignee-limit.test.ts \
            test/github-rest-issue-set-write-request-id.test.ts \
            test/github-rest-issue-set-write-stream-bound.test.ts \
            test/github-issue-provider-call-local-readback.test.ts \
            test/github-issue-provider-request-id-retention.test.ts \
            test/github-provider-bounded-response-init-single-snapshot.test.ts \
            test/github-provider-bounded-response-signal-setup-cleanup.test.ts

      - name: Publish workflow-free current-main packet
        env:
          CARRIER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/juniper/525-private-label-assignee-writes:refs/remotes/origin/juniper/525-private-label-assignee-writes
          test "$(git rev-parse refs/remotes/origin/juniper/525-private-label-assignee-writes)" = "$CARRIER_SHA"
          git push --force-with-lease=refs/heads/juniper/525-private-label-assignee-writes:$CARRIER_SHA \
            origin HEAD:refs/heads/juniper/525-private-label-assignee-writes
