name: CI

on:
  pull_request:

concurrency:
  group: marlin-659-source-export-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-export:
    if: github.head_ref == 'marlin/659-source-export-windows'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Produce repaired source bytes
        id: export
        continue-on-error: true
        shell: pwsh
        run: |
          bun test test/marlin-659-source-export.test.ts 2>&1 |
            Tee-Object -FilePath marlin-659-export-output.txt
          exit $LASTEXITCODE
      - name: Verify intentional export completion
        shell: pwsh
        run: |
          if ('${{ steps.export.outcome }}' -ne 'failure') {
            throw 'Export control unexpectedly passed.'
          }
          if (-not (Select-String -Path marlin-659-export-output.txt -SimpleMatch 'marlin_659_repaired_source_export_complete')) {
            throw 'Expected export completion marker was absent.'
          }
          New-Item -ItemType Directory -Force -Path exported/src/runner-adapters | Out-Null
          New-Item -ItemType Directory -Force -Path exported/test | Out-Null
          Copy-Item src/runner-adapters/openai-agents.ts exported/src/runner-adapters/openai-agents.ts
          Copy-Item test/openai-agents-runner-adapter.test.ts exported/test/openai-agents-runner-adapter.test.ts
          Copy-Item test/openai-agents-runner-adapter-boundaries.test.ts exported/test/openai-agents-runner-adapter-boundaries.test.ts
          Get-FileHash -Algorithm SHA256 `
            exported/src/runner-adapters/openai-agents.ts, `
            exported/test/openai-agents-runner-adapter.test.ts, `
            exported/test/openai-agents-runner-adapter-boundaries.test.ts |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } |
            Set-Content exported/SHA256SUMS
      - name: Upload repaired source evidence
        uses: actions/upload-artifact@v4
        with:
          name: marlin-659-repaired-source-windows-${{ github.sha }}
          path: exported
          if-no-files-found: error
          retention-days: 3
