name: Repair hosted context projection freeze

on:
  pull_request:

concurrency:
  group: loom-908-projection-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'loom/901-hosted-context-current-main' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: loom/901-hosted-context-current-main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact repair lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
      - uses: oven-sh/setup-bun@v2
      - name: Deep-freeze the bounded projection
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/github-project-context-convex-ledger.ts')
          text = path.read_text()
          old = '''  const issues = records.map(projectIssue);
  return Object.freeze({
'''
          new = '''  const issues = records.map(projectIssue);
  return deepFreezeProjection({
'''
          if text.count(old) != 1:
              raise SystemExit('projection return marker changed')
          helper = '''

function deepFreezeProjection<T>(value: T): T {
  if (value && typeof value === "object" && !Object.isFrozen(value)) {
    for (const child of Object.values(value as Record<string, unknown>)) {
      deepFreezeProjection(child);
    }
    Object.freeze(value);
  }
  return value;
}
'''
          if 'function deepFreezeProjection<' in text:
              raise SystemExit('projection freeze helper already exists')
          path.write_text(text.replace(old, new, 1) + helper)
          PY
      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-project-context-convex-ledger.test.ts
      - name: Restore canonical CI and publish repaired source
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/github-project-context-convex-ledger.ts
          git diff --cached --quiet && { echo "No repair delta produced" >&2; exit 1; }
          git commit -m "Deep-freeze hosted GitHub context projection"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}"
