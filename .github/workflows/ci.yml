name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run typecheck
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.txt
      - name: Run Bun tests
        run: |
          set -o pipefail
          bun run test 2>&1 | tee test-output.txt
      - name: Run Convex tests
        run: |
          set -o pipefail
          bun run test:convex 2>&1 | tee convex-test-output.txt
      - name: Bundle Cloudflare Worker
        run: |
          set -o pipefail
          bun run worker:check 2>&1 | tee worker-check-output.txt
      - name: Upload failing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            typecheck-output.txt
            test-output.txt
            convex-test-output.txt
            worker-check-output.txt
          if-no-files-found: ignore

  runtime-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: bun install
      - name: Run Bun, Node, and native workerd receiver checks
        run: |
          set -o pipefail
          bun run test:runtime-parity 2>&1 | tee runtime-parity-output.txt
      - name: Upload runtime parity diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-diagnostics
          path: runtime-parity-output.txt
          if-no-files-found: ignore

  publish-review-observations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/aster/591-review-observations'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aster/591-review-observations
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase and add content-minimised review observations
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name aster-stensibly
          git config user.email aster-stensibly@users.noreply.github.com
          git fetch origin main
          git rebase origin/main
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/github-repository-observation.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              old = dedent(old).strip('\n')
              new = dedent(new).strip('\n')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor matched {count} times')
              text = text.replace(old, new, 1)

          replace_once('''
            "pull_request",
            "issues",
          ''', '''
            "pull_request",
            "pull_request_review",
            "issues",
          ''', 'event list')

          replace_once('''
            | "pull_request"
            | "issue"
          ''', '''
            | "pull_request"
            | "pull_request_review"
            | "issue"
          ''', 'subject kind')

          replace_once('''
            readonly name: "title" | "body" | "comment_body";
          ''', '''
            readonly name: "title" | "body" | "comment_body" | "review_body";
          ''', 'content revision union')

          replace_once('''
            : eventType === "pull_request"
            ? mapPullRequest(payload, common)
            : eventType === "issues"
          ''', '''
            : eventType === "pull_request"
            ? mapPullRequest(payload, common)
            : eventType === "pull_request_review"
            ? mapPullRequestReview(payload, common)
            : eventType === "issues"
          ''', 'dispatch')

          mapper = dedent('''
            function mapPullRequestReview(
              payload: Record<string, unknown>,
              common: CommonMapping,
            ): MappedSemantics {
              const action = exactPullRequestReviewAction(payload.action);
              const pullRequest = requiredRecord(
                payload.pull_request,
                "GitHub pull request review pull request",
              );
              const review = requiredRecord(
                payload.review,
                "GitHub pull request review payload",
              );
              const number = positiveInteger(
                pullRequest.number,
                "GitHub pull request review pull request number",
              );
              const reviewId = providerId(review.id, "GitHub pull request review ID");
              const revision = canonicalRevision(
                requiredString(review.commit_id, "GitHub pull request review revision"),
                "GitHub pull request review revision",
              );
              const state = exactReviewState(review.state);
              const time = sourceTime(
                review.submitted_at ?? pullRequest.updated_at,
                "GitHub pull request review updated time",
                common.receivedAt,
              );
              return {
                action,
                subject: {
                  kind: "pull_request_review",
                  externalId:
                    `github:${common.repository}#pull/${number}/review/${reviewId}`,
                },
                relationships: relationships(common.repository, {
                  revision,
                  pullRequestNumber: number,
                  issueNumber: number,
                }),
                facts: { state, reviewId },
                contentRevisions: canonicalContentRevisions([
                  contentRevision("review_body", review.body),
                ]),
                ...time,
              };
            }

          ''')
          anchor = 'function mapIssue(\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'mapIssue anchor matched {text.count(anchor)} times')
          text = text.replace(anchor, mapper + anchor, 1)

          helpers = dedent('''
            function exactPullRequestReviewAction(
              value: unknown,
            ): "submitted" | "edited" | "dismissed" {
              if (value === "submitted" || value === "edited" || value === "dismissed") {
                return value;
              }
              throw new RangeError("GitHub pull request review action is invalid");
            }

            function exactReviewState(
              value: unknown,
            ): "approved" | "changes_requested" | "commented" | "dismissed" | "pending" {
              if (
                value === "approved"
                || value === "changes_requested"
                || value === "commented"
                || value === "dismissed"
                || value === "pending"
              ) {
                return value;
              }
              throw new RangeError("GitHub pull request review state is invalid");
            }

          ''')
          anchor = 'function exactRefType(value: unknown): "branch" | "tag" {\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'exactRefType anchor matched {text.count(anchor)} times')
          text = text.replace(anchor, helpers + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > test/github-pull-request-review-observation.test.ts <<'EOF'
          import { describe, expect, test } from "bun:test";
          import {
            digestGitHubWebhookPayload,
            mapGitHubRepositoryWebhook,
          } from "../src/github-repository-observation.ts";

          const repository = "teamleaderleo/stensibly";
          const revision = "a".repeat(40);
          const receivedAt = "2026-07-31T03:30:05.000Z";

          function map(payload: Record<string, unknown>, deliveryId = "delivery-review") {
            const body = new TextEncoder().encode(JSON.stringify(payload));
            return mapGitHubRepositoryWebhook({
              eventType: "pull_request_review",
              deliveryId,
              payloadDigest: digestGitHubWebhookPayload(body),
              payload,
              signatureVerified: true,
              receivedAt,
              expectedRepository: repository,
            })!;
          }

          function payload(overrides: Record<string, unknown> = {}) {
            return {
              action: "submitted",
              repository: { full_name: repository },
              sender: { login: "Reviewer" },
              pull_request: {
                number: 634,
                updated_at: "2026-07-31T03:29:00.000Z",
              },
              review: {
                id: "9007199254740993",
                commit_id: revision,
                state: "approved",
                body: "Private review prose\r\nwith detail",
                submitted_at: "2026-07-31T03:30:00.000Z",
              },
              ...overrides,
            };
          }

          describe("GitHub pull request review observations", () => {
            test("maps review identity and revision without retaining prose", () => {
              const observation = map(payload());
              expect(observation).toMatchObject({
                eventType: "pull_request_review",
                action: "submitted",
                repository,
                actor: "reviewer",
                subject: {
                  kind: "pull_request_review",
                  externalId:
                    `github:${repository}#pull/634/review/9007199254740993`,
                },
                relationships: {
                  revision,
                  pullRequestNumber: 634,
                  issueNumber: 634,
                },
                facts: {
                  state: "approved",
                  reviewId: "9007199254740993",
                },
                sourceTime: "2026-07-31T03:30:00.000Z",
                sourceTimeSource: "provider",
              });
              expect(observation.contentRevisions[0]).toMatchObject({
                name: "review_body",
                present: true,
                byteLength: Buffer.byteLength("Private review prose\nwith detail", "utf8"),
              });
              expect(JSON.stringify(observation)).not.toContain("Private review prose");
              expect(Object.isFrozen(observation)).toBe(true);
              expect(Object.isFrozen(observation.relationships)).toBe(true);
              expect(Object.isFrozen(observation.contentRevisions)).toBe(true);
            });

            test("maps edited and dismissed reviews with bounded time fallbacks", () => {
              const edited = map(payload({
                action: "edited",
                review: {
                  id: 42,
                  commit_id: revision,
                  state: "commented",
                  body: null,
                },
              }), "delivery-edited");
              expect(edited).toMatchObject({
                action: "edited",
                facts: { state: "commented", reviewId: "42" },
                sourceTime: "2026-07-31T03:29:00.000Z",
                sourceTimeSource: "provider",
              });
              expect(edited.contentRevisions[0]).toMatchObject({
                name: "review_body",
                present: false,
                byteLength: 0,
              });

              const dismissed = map(payload({
                action: "dismissed",
                pull_request: { number: 634 },
                review: {
                  id: 43,
                  commit_id: revision,
                  state: "dismissed",
                  body: null,
                },
              }), "delivery-dismissed");
              expect(dismissed).toMatchObject({
                action: "dismissed",
                sourceTime: receivedAt,
                sourceTimeSource: "received",
              });
            });

            test("keeps delivery identity separate from review semantics", () => {
              const first = map(payload(), "delivery-one");
              const second = map(payload(), "delivery-two");
              expect(first.observationId).not.toBe(second.observationId);
              expect(first.semanticFingerprint).toBe(second.semanticFingerprint);
              expect(first.payloadDigest).toBe(second.payloadDigest);
            });

            test("rejects unknown actions, states, identities, and revisions", () => {
              expect(() => map(payload({ action: "created" })))
                .toThrow("review action is invalid");
              expect(() => map(payload({
                review: { id: 42, commit_id: revision, state: "unknown" },
              }))).toThrow("review state is invalid");
              expect(() => map(payload({
                review: { id: 0, commit_id: revision, state: "approved" },
              }))).toThrow("positive safe integer");
              expect(() => map(payload({
                review: { id: 42, commit_id: "abc", state: "approved" },
              }))).toThrow("full Git revision");
            });
          });
          EOF

          cat > test/github-repository-observation-fingerprint.test.ts <<'EOF'
          import { expect, test } from "bun:test";
          import {
            digestGitHubWebhookPayload,
            mapGitHubRepositoryWebhook,
          } from "../src/github-repository-observation.ts";

          test("keeps the original push observation fingerprint stable", () => {
            const payload = {
              repository: { full_name: "teamleaderleo/stensibly" },
              sender: { login: "github-actions[bot]" },
              ref: "refs/heads/main",
              before: "1".repeat(40),
              after: "2".repeat(40),
              created: false,
              deleted: false,
              forced: false,
              size: 2,
              head_commit: { timestamp: "2026-07-30T17:59:00.000Z" },
            };
            const body = new TextEncoder().encode(JSON.stringify(payload));
            const observation = mapGitHubRepositoryWebhook({
              eventType: "push",
              deliveryId: "delivery-push",
              payloadDigest: digestGitHubWebhookPayload(body),
              payload,
              signatureVerified: true,
              receivedAt: "2026-07-30T18:00:00.000Z",
              expectedRepository: "teamleaderleo/stensibly",
            })!;
            expect(observation.semanticFingerprint).toBe(
              "sha256:cd9cc50b186a137108fda4786d6b70df490a044306f94769a1aa03b8b728227e",
            );
          });
          EOF

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26"

      - name: Run exact candidate gates
        run: |
          set -euxo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-repository-observation.test.ts test/github-pull-request-review-observation.test.ts test/github-repository-observation-fingerprint.test.ts test/github-webhook-events.test.ts test/github-webhook-shared-ingress-parity.test.ts
          bun run test
          bun run test:convex
          bun run worker:check
          bun run test:runtime-parity

      - name: Publish source-only head
        run: |
          set -euxo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          git add src test .github/workflows/ci.yml
          git commit -m 'feat: map pull request review observations'
          git push --force-with-lease=refs/heads/aster/591-review-observations:$GITHUB_SHA \
            origin HEAD:refs/heads/aster/591-review-observations
