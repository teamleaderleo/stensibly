name: CI

on:
  pull_request:

concurrency:
  group: marlin-659-source-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-export:
    if: github.head_ref == 'marlin/659-source-export-evidence'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Produce repaired source bytes
        id: export
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test test/marlin-659-source-export.test.ts 2>&1 \
            | tee marlin-659-export-output.txt
      - name: Verify intentional export completion
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.export.outcome }}" != "failure" ]]; then
            echo "Export control unexpectedly passed." >&2
            exit 1
          fi
          grep -F "marlin_659_repaired_source_export_complete" \
            marlin-659-export-output.txt
          mkdir -p \
            exported/src/runner-adapters \
            exported/test
          cp src/runner-adapters/openai-agents.ts \
            exported/src/runner-adapters/openai-agents.ts
          cp test/openai-agents-runner-adapter.test.ts \
            exported/test/openai-agents-runner-adapter.test.ts
          cp test/openai-agents-runner-adapter-boundaries.test.ts \
            exported/test/openai-agents-runner-adapter-boundaries.test.ts
          shasum -a 256 \
            exported/src/runner-adapters/openai-agents.ts \
            exported/test/openai-agents-runner-adapter.test.ts \
            exported/test/openai-agents-runner-adapter-boundaries.test.ts \
            > exported/SHA256SUMS
      - name: Upload repaired source evidence
        uses: actions/upload-artifact@v4
        with:
          name: marlin-659-repaired-source-${{ github.sha }}
          path: exported
          if-no-files-found: error
          retention-days: 3
