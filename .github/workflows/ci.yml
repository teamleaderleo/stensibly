name: Diagnose canonical PR 927 Bun gate

on:
  pull_request:

concurrency:
  group: lark-927-canonical-bun-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.ref == 'lark/927-full-suite-diagnostic' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: lark/927-full-suite-diagnostic
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Capture first canonical Bun failure
        shell: bash
        run: |
          set -uo pipefail
          bun install --frozen-lockfile >/dev/null
          mkdir -p .github/diagnostics
          set +e
          bun test ./test/*.test.ts --bail=1 > /tmp/pr927-canonical.log 2>&1
          code=$?
          set -e
          {
            printf 'exit_code=%s\n' "$code"
            tail -n 180 /tmp/pr927-canonical.log \
              | sed -E 's/(gh[pousr]_|github_pat_|sk-(proj-)?|stn\.tok_|xox[baprs]-)[A-Za-z0-9._-]+/[REDACTED]/g' \
              | sed -E 's/Bearer [A-Za-z0-9._~+\/-]+/Bearer [REDACTED]/g'
          } > .github/diagnostics/pr-927-canonical-bun.txt
      - name: Restore CI and publish diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/diagnostics/pr-927-canonical-bun.txt
          git commit -m "Record PR 927 canonical Bun failure"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}"
