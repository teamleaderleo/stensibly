name: Repair checkpoint chronology and authority

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: repair-875-checkpoint-integrity
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'rook/659-future-replay-repair' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: rook/659-future-replay-repair
      PARENT_BRANCH: aster/openai-agents-adapter-641
      EXPECTED_PARENT_HEAD: 530c4088579cddb9a41eb7646aa0f8f2c01c5fd7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact branch and parent leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch origin \
            "+refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${PARENT_BRANCH})" = "${EXPECTED_PARENT_HEAD}"
          git config user.name "stensibly-repair-bot"
          git config user.email "stensibly-repair-bot@users.noreply.github.com"
      - name: Apply accepted checkpoint repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/runner-adapters/openai-agents.ts")
          text = path.read_text()
          text = once(
              text,
              '      || (input.replayed === false && record.createdAt !== append.proposedCreatedAt)\n',
              '''      || (
        input.replayed
          ? record.createdAt > append.proposedCreatedAt
          : record.createdAt !== append.proposedCreatedAt
      )
''',
              "checkpoint replay chronology",
          )
          text = once(
              text,
              '''    assertControlAuthorityActive(input, clock.baseMilliseconds);
    const checkpoint = this.#latestCheckpoints.get(controlKey(input));
    if (!checkpoint) {
      throw new RangeError(
        "OpenAI Agents latest checkpoint reference is unknown to this adapter instance",
      );
    }
    this.#assertControlBinding(input);
    return checkpoint;
''',
              '''    assertControlAuthorityActive(input, clock.baseMilliseconds);
    this.#assertControlBinding(input);
    const checkpoint = this.#latestCheckpoints.get(controlKey(input));
    if (!checkpoint) {
      throw new RangeError(
        "OpenAI Agents latest checkpoint reference is unknown to this adapter instance",
      );
    }
    return checkpoint;
''',
              "checkpoint authority ordering",
          )
          path.write_text(text)

          path = Path("test/openai-agents-runner-adapter-boundaries.test.ts")
          text = path.read_text()
          text = once(
              text,
              '''    expect(candidateFactory.prepareCalls).toBe(1);
    expect(store.checkpointWrites).toBe(2);
  });
''',
              '''    expect(candidateFactory.prepareCalls).toBe(1);
    expect(store.checkpointWrites).toBe(2);

    await expect(
      (candidate.adapter.requestCheckpoint as any)({
        ...checkpointCommand(),
        authority: {
          ...controlAuthority(),
          holderId: "competing-boundary-actor",
        },
      }),
    ).rejects.toThrow("authority holder is stale");
  });
''',
              "competing holder regression",
          )
          text = once(
              text,
              '''      serializedState: "{}",
      stateDigest: `sha256:${"0".repeat(64)}`,
      runtimeManifest: {},
''',
              '''      serializedState: "{}",
      runtimeManifest: {},
''',
              "hostile state digest fixture",
          )
          text = once(
              text,
              '''    Object.defineProperty(record, "stateDigest", {
      enumerable: true,
      get() {
''',
              '''    Object.defineProperty(record, "stateDigest", {
      enumerable: true,
      configurable: true,
      get() {
''',
              "hostile state digest accessor",
          )
          path.write_text(text)

          path = Path("test/openai-agents-runner-adapter.test.ts")
          text = path.read_text()
          text = once(
              text,
              '''function resumeCommand(
  checkpointRef: RunnerExternalReferenceV1,
  leaseGeneration = 1,
): RunnerResumeCommandV1 {
''',
              '''function resumeCommand(
  checkpointRef: RunnerExternalReferenceV1,
  leaseGeneration = 1,
  holderId = "runner-actor",
): RunnerResumeCommandV1 {
''',
              "resume command holder",
          )
          text = once(
              text,
              '''      "2026-07-31T00:10:00.000Z",
      leaseGeneration,
    ),
''',
              '''      "2026-07-31T00:10:00.000Z",
      leaseGeneration,
      holderId,
    ),
''',
              "resume command base call",
          )
          text = once(
              text,
              '''function commandBase(
  commandId: string,
  issuedAt: string,
  leaseGeneration: number,
) {
''',
              '''function commandBase(
  commandId: string,
  issuedAt: string,
  leaseGeneration: number,
  holderId = "runner-actor",
) {
''',
              "command base holder",
          )
          text = once(
              text,
              '''      holderId: leaseGeneration === 1 ? "runner-actor" : "competing-actor",
''',
              '''      holderId,
''',
              "holder derivation",
          )
          text = once(
              text,
              '''      candidate.adapter.resume(resumeCommand(checkpoint, 2)),
''',
              '''      candidate.adapter.resume(resumeCommand(checkpoint, 2, "runner-actor")),
''',
              "competing lease regression",
          )
          path.write_text(text)
          PY
          git show 6d5606e3b50973c8eb7be0319f4d2e95535cd441:test/openai-agents-runner-adapter-future-replay.test.ts \
            > test/openai-agents-runner-adapter-future-replay.test.ts
          git checkout "refs/remotes/origin/${PARENT_BRANCH}" -- .github/workflows/ci.yml
          rm -f \
            .github/workflows/rook-659-future-replay-repair.yml \
            .github/rook-659-trigger.txt
      - uses: oven-sh/setup-bun@v2
      - name: Validate focused adapter fence
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/openai-agents-runner-adapter.test.ts \
            test/openai-agents-runner-adapter-review-repairs.test.ts \
            test/openai-agents-runner-adapter-boundaries.test.ts \
            test/openai-agents-runner-adapter-future-replay.test.ts
      - name: Publish source-only repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Bind checkpoint chronology and authority"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
