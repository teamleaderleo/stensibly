name: Finalize guarded Actions job-detail composition

on:
  pull_request:

concurrency:
  group: lark-697-actions-job-detail-mount-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lark/697-actions-job-detail-mount' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: lark/697-actions-job-detail-mount
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
      - uses: oven-sh/setup-bun@v2
      - name: Mount guarded Actions job-detail reads
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} marker changed: {count} matches")
              return text.replace(old, new, 1)

          provider_path = Path("src/hosted-github-delegated-read-provider.ts")
          provider = provider_path.read_text()
          provider = replace_once(
              provider,
              'import { GitHubRestActionsRunAdapter } from "./github-rest-actions-run-adapter.js";\n',
              'import { GitHubRestActionsJobDetailAdapter } from "./github-rest-actions-job-detail-adapter.js";\nimport { GitHubRestActionsRunAdapter } from "./github-rest-actions-run-adapter.js";\n',
              "job-detail adapter import",
          )
          provider = replace_once(
              provider,
              '''  "fetch_commit_workflow_runs",
  "fetch_workflow_run_jobs",
] as const);''',
              '''  "fetch_commit_workflow_runs",
  "fetch_workflow_run_jobs",
  "fetch_workflow_job_steps",
  "fetch_workflow_job_logs",
] as const);''',
              "ten-tool declaration",
          )
          provider = replace_once(
              provider,
              '''const actionsTools = new Set<string>([
  "fetch_commit_workflow_runs",
  "fetch_workflow_run_jobs",
]);''',
              '''const actionsRunTools = new Set<string>([
  "fetch_commit_workflow_runs",
  "fetch_workflow_run_jobs",
]);
const actionsJobDetailTools = new Set<string>([
  "fetch_workflow_job_steps",
  "fetch_workflow_job_logs",
]);''',
              "Actions routing sets",
          )
          provider = replace_once(
              provider,
              ' * Mounts a private eight-tool delegated-read service when the explicit hosted\n',
              ' * Mounts a private ten-tool delegated-read service when the explicit hosted\n',
              "ten-tool documentation",
          )
          provider = replace_once(
              provider,
              '''  const statusAdapter = new GitHubRestCommitStatusAdapter(adapterOptions);
  const actionsAdapter = new GitHubRestActionsRunAdapter(adapterOptions);''',
              '''  const statusAdapter = new GitHubRestCommitStatusAdapter(adapterOptions);
  const actionsAdapter = new GitHubRestActionsRunAdapter(adapterOptions);
  const actionsJobDetailAdapter = new GitHubRestActionsJobDetailAdapter(
    adapterOptions,
  );''',
              "job-detail adapter composition",
          )
          provider = replace_once(
              provider,
              '''    ) => input.tool === "get_commit_combined_status"
      ? statusAdapter.callReadTool(input)
      : actionsTools.has(input.tool)
      ? actionsAdapter.callReadTool(input)
      : pullRequestAdapter.callReadTool(input),''',
              '''    ) => input.tool === "get_commit_combined_status"
      ? statusAdapter.callReadTool(input)
      : actionsJobDetailTools.has(input.tool)
      ? actionsJobDetailAdapter.callReadTool(input)
      : actionsRunTools.has(input.tool)
      ? actionsAdapter.callReadTool(input)
      : pullRequestAdapter.callReadTool(input),''',
              "job-detail adapter routing",
          )
          provider_path.write_text(provider)

          capability_path = Path("src/github-capability-mcp.ts")
          capability = capability_path.read_text()
          capability = replace_once(
              capability,
              'The public subset includes repository metadata, one file at an immutable commit, exact pull-request metadata, bounded pull-request diff or patch text, bounded pull-request review threads, exact combined commit status, exact-commit workflow runs, and exact-run job metadata. Steps, logs, and artifacts remain unavailable.',
              'The public subset includes repository metadata, one file at an immutable commit, exact pull-request metadata, bounded pull-request diff or patch text, bounded pull-request review threads, exact combined commit status, exact-commit workflow runs, exact-run job metadata, bounded workflow-job steps, and bounded workflow-job text logs. Artifacts and writes remain unavailable.',
              "public description",
          )
          capability = replace_once(
              capability,
              '''          z.object({
            run_id: z.number().int().min(1),
          }).strict(),
        ]),''',
              '''          z.object({
            run_id: z.number().int().min(1),
          }).strict(),
          z.object({
            job_id: z.number().int().min(1),
          }).strict(),
        ]),''',
              "public job ID schema",
          )
          capability_path.write_text(capability)

          stale_blocks = {
            "test/hosted-github-delegated-pr-diff-provider.test.ts": '''
  test("keeps Actions step and remaining delegated reads outside private authority", async () => {
    let externalCalls = 0;
    const mounted = mountHostedGitHubDelegatedReadProviderFromEnv(
      fakeLedger(),
      providerEnv(),
      {
        now: () => fixedNow,
        fetch: (async () => {
          externalCalls += 1;
          return Response.json({ message: "must not dispatch" }, { status: 500 });
        }) as unknown as typeof fetch,
      },
    );

    await expect(mounted.callGitHubDelegatedRead!({
      ...callBase(),
      tool: "fetch_workflow_job_steps",
      arguments: { job_id: 91345873454 },
    })).rejects.toThrow("authority denied");
    expect(externalCalls).toBe(0);
  });
''',
            "test/hosted-github-delegated-pr-info-provider.test.ts": '''
  test("keeps Actions step and remaining delegated contracts outside private authority", async () => {
    let externalCalls = 0;
    const mounted = mountHostedGitHubDelegatedReadProviderFromEnv(
      fakeLedger(),
      providerEnv(),
      {
        now: () => fixedNow,
        fetch: (async () => {
          externalCalls += 1;
          return Response.json({ message: "must not dispatch" }, { status: 500 });
        }) as unknown as typeof fetch,
      },
    );

    await expect(mounted.callGitHubDelegatedRead!({
      ...callBase(),
      tool: "fetch_workflow_job_steps",
      arguments: { job_id: 91345873454 },
    })).rejects.toThrow("authority denied");
    expect(externalCalls).toBe(0);
  });
''',
            "test/hosted-github-commit-status-delegated-read-provider.test.ts": '''
  test("denies an unmounted Actions step read before token or provider activity", async () => {
    let externalCalls = 0;
    const mounted = mountHostedGitHubDelegatedReadProviderFromEnv(
      fakeLedger(),
      providerEnv(),
      {
        now: () => fixedNow,
        fetch: (async () => {
          externalCalls += 1;
          return Response.json({ message: "must not dispatch" }, { status: 500 });
        }) as unknown as typeof fetch,
      },
    );

    await expect(mounted.callGitHubDelegatedRead!({
      ...callBase(),
      tool: "fetch_workflow_job_steps",
      arguments: { job_id: 91345873454 },
    })).rejects.toThrow("authority denied");
    expect(externalCalls).toBe(0);
  });
''',
          }
          for name, block in stale_blocks.items():
              path = Path(name)
              path.write_text(replace_once(path.read_text(), block, "\n", f"remove stale denial from {name}"))

          generic_path = Path("test/hosted-github-delegated-read-provider.test.ts")
          generic = generic_path.read_text()
          generic = replace_once(
              generic,
              '''    await expect(mounted.callGitHubDelegatedRead!({
      ...callBase(),
      tool: "fetch_workflow_job_steps",
      arguments: { job_id: 91345873454 },
    })).rejects.toThrow("authority denied");
''',
              "",
              "remove generic stale step denial",
          )
          generic_path.write_text(generic)

          Path("test/hosted-github-actions-delegated-read-provider.test.ts").write_text(r'''import { describe, expect, test } from "bun:test";
import { generateKeyPairSync } from "node:crypto";
import { GitHubCapabilityCatalogueService } from "../src/github-capability-service.ts";
import {
  hostedGitHubDelegatedReadTools,
  mountHostedGitHubDelegatedReadProviderFromEnv,
} from "../src/hosted-github-delegated-read-provider.ts";
import type { WorkLedger } from "../src/ledger.ts";
import type {
  ProjectAttachmentLedger,
  ProjectAttachmentRecord,
} from "../src/project-attachment-ledger.ts";
import {
  compileProjectContract,
  renderProjectContract,
} from "../src/project-contract.ts";

const repositoryFullName = "teamleaderleo/stensibly";
const project = "oauth-dogfood";
const fixedNow = Date.parse("2026-08-01T08:00:00.000Z");
const commitSha = "d".repeat(40);
const runId = 30691104156;
const jobId = 91345873454;
const catalogueFingerprint = new GitHubCapabilityCatalogueService().registry.fingerprint;
const jobUrl = `https://api.github.test/repos/teamleaderleo/stensibly/actions/jobs/${jobId}`;
const logsUrl = `${jobUrl}/logs`;
const downloadUrl = "https://results-receiver.actions.githubusercontent.com/job-logs/91345873454?sig=bounded";
const logText = "2026-08-01T08:02:00Z Run tests\nAll checks passed";
const privateKey = generateKeyPairSync("rsa", {
  modulusLength: 2048,
  publicKeyEncoding: { type: "spki", format: "pem" },
  privateKeyEncoding: { type: "pkcs8", format: "pem" },
}).privateKey;

const snapshot = compileProjectContract(renderProjectContract({
  version: 1,
  project,
  repositories: [repositoryFullName],
  runnerProfiles: [],
  concurrency: { project: 1, global: 1 },
  autonomousActions: ["inspect"],
  approvalRequired: ["write"],
  checks: [],
  tags: [],
  relatedProjects: [],
}, {
  goal: "Exercise guarded hosted GitHub Actions reads.",
  boundaries: "Keep artifacts, credentials, and writes outside this slice.",
  evidenceAndHandoff: "Return bounded run, job, step, and log receipts.",
  escalation: "Stop before dispatch when authority or binding changes.",
}));

const attachment: ProjectAttachmentRecord = {
  id: "attach_hosted_actions_reads",
  project,
  snapshot,
  sourceRevision: "main@hosted-actions-read-test",
  acceptedBy: "test",
  authorityWidening: false,
  acceptedAt: "2026-08-01T08:00:00.000Z",
};

describe("private hosted GitHub Actions delegated reads", () => {
  test("routes run, job, step, and log reads through exact actions authority", async () => {
    const calls: Array<{ url: string; authorization: string | null; body: unknown }> = [];
    const mounted = mountHostedGitHubDelegatedReadProviderFromEnv(
      fakeLedger(),
      providerEnv(),
      {
        now: () => fixedNow,
        fetch: (async (input: RequestInfo | URL, init?: RequestInit) => {
          const url = String(input);
          const headers = new Headers(init?.headers);
          const body = init?.body ? JSON.parse(String(init.body)) : null;
          calls.push({ url, authorization: headers.get("authorization"), body });
          if (url.endsWith("/app/installations/98765/access_tokens")) {
            return Response.json({
              token: "actions-installation-token-secret",
              expires_at: "2026-08-01T09:00:00Z",
              permissions: { actions: "read", metadata: "read" },
              repository_selection: "selected",
              repositories: [{ full_name: "TeamLeaderLeo/Stensibly" }],
            }, { status: 201 });
          }
          if (url === `https://api.github.test/repos/teamleaderleo/stensibly/actions/runs?head_sha=${commitSha}&per_page=50&page=1`) {
            return Response.json({ total_count: 1, workflow_runs: [workflowRun()] }, {
              headers: { "x-github-request-id": "ACTIONS:RUNS:1" },
            });
          }
          if (url === `https://api.github.test/repos/teamleaderleo/stensibly/actions/runs/${runId}/jobs?filter=latest&per_page=100&page=1`) {
            return Response.json({ total_count: 1, jobs: [workflowJob()] }, {
              headers: { "x-github-request-id": "ACTIONS:JOBS:1" },
            });
          }
          if (url === jobUrl) {
            return Response.json(workflowJobDetail(), {
              headers: { "x-github-request-id": "ACTIONS:JOB:DETAIL" },
            });
          }
          if (url === logsUrl) {
            return new Response(null, {
              status: 302,
              headers: {
                location: downloadUrl,
                "x-github-request-id": "ACTIONS:JOB:LOGS",
              },
            });
          }
          if (url === downloadUrl) {
            expect(headers.get("authorization")).toBeNull();
            return new Response(logText, {
              status: 200,
              headers: { "content-type": "text/plain; charset=utf-8" },
            });
          }
          return Response.json({ message: "unexpected request" }, { status: 500 });
        }) as typeof fetch,
      },
    );

    expect(mounted.delegatedGitHubReadTools).toBe(hostedGitHubDelegatedReadTools);
    expect(mounted.delegatedGitHubReadTools).toEqual([
      "get_repo",
      "fetch_file",
      "get_pr_info",
      "get_pr_diff",
      "list_pull_request_review_threads",
      "get_commit_combined_status",
      "fetch_commit_workflow_runs",
      "fetch_workflow_run_jobs",
      "fetch_workflow_job_steps",
      "fetch_workflow_job_logs",
    ]);

    const runReceipt = await mounted.callGitHubDelegatedRead!({
      ...callBase(), tool: "fetch_commit_workflow_runs", arguments: { commit_sha: commitSha },
    });
    const jobsReceipt = await mounted.callGitHubDelegatedRead!({
      ...callBase(), tool: "fetch_workflow_run_jobs", arguments: { run_id: runId },
    });
    const stepsReceipt = await mounted.callGitHubDelegatedRead!({
      ...callBase(), tool: "fetch_workflow_job_steps", arguments: { job_id: jobId },
    });
    const logsReceipt = await mounted.callGitHubDelegatedRead!({
      ...callBase(), tool: "fetch_workflow_job_logs", arguments: { job_id: jobId },
    });

    expect(runReceipt).toMatchObject({ tool: "fetch_commit_workflow_runs", providerRequestId: "ACTIONS:RUNS:1" });
    expect(jobsReceipt).toMatchObject({ tool: "fetch_workflow_run_jobs", providerRequestId: "ACTIONS:JOBS:1" });
    expect(stepsReceipt).toMatchObject({
      tool: "fetch_workflow_job_steps",
      providerRequestId: "ACTIONS:JOB:DETAIL",
      result: { repositoryFullName, jobId, runId, totalCount: 2 },
    });
    expect(logsReceipt).toMatchObject({
      tool: "fetch_workflow_job_logs",
      providerRequestId: "ACTIONS:JOB:LOGS",
      result: {
        repositoryFullName,
        jobId,
        runId,
        byteCount: Buffer.byteLength(logText, "utf8"),
        lineCount: 2,
        text: logText,
      },
    });
    expect(Object.isFrozen(stepsReceipt)).toBe(true);
    expect(Object.isFrozen(logsReceipt)).toBe(true);

    const tokenCalls = calls.filter((call) => call.url.endsWith("/access_tokens"));
    expect(tokenCalls).toHaveLength(1);
    expect(tokenCalls[0]?.body).toEqual({
      repositories: ["stensibly"],
      permissions: { actions: "read" },
    });
    const downloadCall = calls.find((call) => call.url === downloadUrl);
    expect(downloadCall?.authorization).toBeNull();
    const serialized = JSON.stringify({ runReceipt, jobsReceipt, stepsReceipt, logsReceipt });
    expect(serialized).not.toContain(privateKey);
    expect(serialized).not.toContain("installation-token-secret");
    expect(serialized).not.toContain(downloadUrl);
  });

  test("rejects malformed job arguments before token or provider activity", async () => {
    let externalCalls = 0;
    const mounted = mountHostedGitHubDelegatedReadProviderFromEnv(
      fakeLedger(), providerEnv(), {
        now: () => fixedNow,
        fetch: (async () => {
          externalCalls += 1;
          return Response.json({ message: "must not dispatch" }, { status: 500 });
        }) as unknown as typeof fetch,
      },
    );
    await expect(mounted.callGitHubDelegatedRead!({
      ...callBase(),
      tool: "fetch_workflow_job_logs",
      arguments: { job_id: 0 },
    })).rejects.toThrow("workflow job ID");
    expect(externalCalls).toBe(0);
  });
});

function callBase() {
  return {
    project,
    repository: repositoryFullName,
    actorId: "api-token:test",
    clientId: "mcp:api-token:test",
    catalogueFingerprint,
  };
}

function fakeLedger(): WorkLedger & ProjectAttachmentLedger {
  return {
    async getProjectAttachment(requestedProject: string) {
      return requestedProject === project ? attachment : null;
    },
    async acceptProjectAttachment() {
      throw new Error("acceptProjectAttachment is outside this test");
    },
  } as unknown as WorkLedger & ProjectAttachmentLedger;
}

function providerEnv(): Record<string, string> {
  return {
    STENSIBLY_GITHUB_DELEGATED_READS_ENABLED: "true",
    STENSIBLY_GITHUB_APP_ID: "12345",
    STENSIBLY_GITHUB_APP_PRIVATE_KEY: privateKey,
