}
''')

          Path("test/mcp-github-actions-delegated-read.test.ts").write_text(r'''import { describe, expect, test } from "bun:test";
import { Client } from "@modelcontextprotocol/sdk/client/index.js";
import { InMemoryTransport } from "@modelcontextprotocol/sdk/inMemory.js";
import { GitHubCapabilityCatalogueService } from "../src/github-capability-service.ts";
import type {
  HostedGitHubDelegatedReadInput,
  HostedGitHubDelegatedReadProvider,
} from "../src/hosted-github-delegated-read-provider.ts";
import { hostedGitHubDelegatedReadTools } from "../src/hosted-github-delegated-read-provider.ts";
import { createMcpServer } from "../src/mcp.ts";
import { SqliteWorkLedger } from "../src/sqlite-ledger.ts";
import { StensiblyStore } from "../src/store.ts";
import type { TokenPrincipal } from "../src/token-contracts.ts";

const project = "scrapbook";
const repository = "teamleaderleo/stensibly";
const commitSha = "d".repeat(40);
const runId = 30691104156;
const jobId = 91345873454;
const catalogueFingerprint = new GitHubCapabilityCatalogueService().registry.fingerprint;

describe("guarded GitHub Actions delegated-read MCP dispatch", () => {
  test("advertises and dispatches run, job, step, and log reads", async () => {
    const calls: HostedGitHubDelegatedReadInput[] = [];
    const mounted = mountedLedger(calls);
    const server = createMcpServer(mounted.ledger, { principal: readPrincipal() });
    const client = new Client(
      { name: "github-actions-job-detail-mounted", version: "0.0.1" },
      { capabilities: {} },
    );
    const [clientTransport, serverTransport] = InMemoryTransport.createLinkedPair();
    try {
      await server.connect(serverTransport);
      await client.connect(clientTransport);

      const toolsets = await call<{ delegatedDispatchEnabled: boolean; delegatedTools: string[] }>(
        client, "github_list_toolsets", {},
      );
      expect(toolsets).toMatchObject({
        delegatedDispatchEnabled: true,
        delegatedTools: [...hostedGitHubDelegatedReadTools],
      });
      for (const name of [
        "fetch_commit_workflow_runs",
        "fetch_workflow_run_jobs",
        "fetch_workflow_job_steps",
        "fetch_workflow_job_logs",
      ]) {
        const capability = await call<{ delegatedDispatchEnabled: boolean; recommendedAction: string }>(
          client, "github_get_tool", { name },
        );
        expect(capability.delegatedDispatchEnabled).toBe(true);
        expect(capability.recommendedAction).toContain("github_call_tool");
      }

      const requests = [
        ["fetch_commit_workflow_runs", { commit_sha: commitSha }],
        ["fetch_workflow_run_jobs", { run_id: runId }],
        ["fetch_workflow_job_steps", { job_id: jobId }],
        ["fetch_workflow_job_logs", { job_id: jobId }],
      ] as const;
      for (const [tool, argumentsValue] of requests) {
        const receipt = await call<Record<string, unknown>>(client, "github_call_tool", {
          project,
          repository,
          tool,
          arguments: argumentsValue,
          catalogueFingerprint,
        });
        expect(receipt).toMatchObject({
          project,
          repositoryFullName: repository,
          tool,
          actorId: "api-token:delegated-actions-token",
          clientId: "mcp:api-token:delegated-actions-token",
        });
      }
      expect(calls.map((call) => call.tool)).toEqual(requests.map(([tool]) => tool));
      expect(calls[2]?.arguments).toEqual({ job_id: jobId });
      expect(calls[3]?.arguments).toEqual({ job_id: jobId });

      for (const argumentsValue of [
        {
          project,
          repository,
          tool: "fetch_workflow_job_steps",
          arguments: { job_id: 0 },
          catalogueFingerprint,
        },
        {
          project,
          repository,
          tool: "fetch_workflow_run_artifacts",
          arguments: { run_id: runId },
          catalogueFingerprint,
        },
      ]) {
        const denied = await client.callTool({ name: "github_call_tool", arguments: argumentsValue });
        expect(denied.isError).toBe(true);
        expect(calls).toHaveLength(4);
      }

      const stale = await client.callTool({
        name: "github_call_tool",
        arguments: {
          project,
          repository,
          tool: "fetch_workflow_job_logs",
          arguments: { job_id: jobId },
          catalogueFingerprint: `sha256:${"0".repeat(64)}`,
        },
      });
      expect(stale.isError).toBe(true);
      expect(textContent(stale)).toContain("catalogue fingerprint is stale");
      expect(calls).toHaveLength(4);
    } finally {
      await client.close();
      await server.close();
      mounted.store.close();
    }
  });

  test("rejects reordered or decorated hosted tool declarations", () => {
    for (const tools of [
      [...hostedGitHubDelegatedReadTools].reverse(),
      Object.assign([...hostedGitHubDelegatedReadTools], { extra: true }),
    ]) {
      const store = new StensiblyStore(":memory:");
      const ledger = new SqliteWorkLedger(store);
      const provider: HostedGitHubDelegatedReadProvider = {
        delegatedGitHubReadTools: tools as unknown as typeof hostedGitHubDelegatedReadTools,
        async callGitHubDelegatedRead() {
          throw new Error("must not dispatch");
        },
      };
      try {
        expect(() => createMcpServer(
          Object.assign(ledger, provider),
          { principal: readPrincipal() },
        )).toThrow("tool declaration is invalid");
      } finally {
        store.close();
      }
    }
  });
});

function mountedLedger(calls: HostedGitHubDelegatedReadInput[]) {
  const store = new StensiblyStore(":memory:");
  const ledger = new SqliteWorkLedger(store);
  const provider: HostedGitHubDelegatedReadProvider = {
    delegatedGitHubReadTools: hostedGitHubDelegatedReadTools,
    async callGitHubDelegatedRead(input) {
      if (input.catalogueFingerprint !== catalogueFingerprint) {
        throw new Error("GitHub delegated catalogue fingerprint is stale");
      }
      calls.push(input);
      let result: Readonly<Record<string, unknown>>;
      if (input.tool === "fetch_commit_workflow_runs") {
        result = Object.freeze({ commitSha: input.arguments.commit_sha });
      } else if (input.tool === "fetch_workflow_run_jobs") {
        result = Object.freeze({ runId: input.arguments.run_id });
      } else if (input.tool === "fetch_workflow_job_steps") {
        result = Object.freeze({ jobId: input.arguments.job_id, totalCount: 0, steps: Object.freeze([]) });
      } else {
        result = Object.freeze({ jobId: input.arguments.job_id, byteCount: 7, lineCount: 1, text: "bounded" });
      }
      return Object.freeze({
        version: 1,
        project: input.project,
        repositoryFullName: input.repository.toLowerCase(),
        tool: input.tool,
        actorId: input.actorId,
        clientId: input.clientId,
        connectionId: "ghconn_actions_dispatch",
        installationId: "98765",
        bindingId: "ghbind_actions_dispatch",
        attachmentId: "attach_actions_dispatch",
        attachmentSnapshotSha256: `sha256:${"b".repeat(64)}`,
        capabilityGrantId: null,
        approvalId: null,
        catalogueFingerprint: input.catalogueFingerprint,
        parametersSha256: `sha256:${"c".repeat(64)}`,
        providerRequestId: "ACTIONS:PUBLIC:1",
        resultSha256: `sha256:${"d".repeat(64)}`,
        result,
      });
    },
  };
  return { store, ledger: Object.assign(ledger, provider) };
}

function readPrincipal(): TokenPrincipal {
  return {
    tokenId: "delegated-actions-token",
    name: "delegated actions test",
    scopes: ["read"],
    projects: [project],
  };
}

async function call<T>(
  client: Client,
  name: string,
  args: Record<string, unknown>,
): Promise<T> {
  const result = await client.callTool({ name, arguments: args });
  if (result.isError) throw new Error(textContent(result));
  return JSON.parse(textContent(result)) as T;
}

function textContent(result: unknown): string {
  const content = (result as { content?: unknown }).content;
  if (!Array.isArray(content) || content.length === 0) {
    throw new Error("MCP result had no content");
  }
  const first = content[0] as { type?: unknown; text?: unknown };
  if (first.type !== "text" || typeof first.text !== "string") {
    throw new Error("MCP result did not contain text");
  }
  return first.text;
}
