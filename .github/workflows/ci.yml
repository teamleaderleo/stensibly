name: Finalize hosted GitHub context replay

on:
  pull_request:

concurrency:
  group: loom-901-hosted-context-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'loom/901-hosted-context-current-main' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: loom/901-hosted-context-current-main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact carrier lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
      - uses: oven-sh/setup-bun@v2
      - name: Execute reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/loom-901-hosted-context-finalize.yml').read_text().splitlines()
          start_name = '      - name: Apply reviewed hosted-context integrity repairs'
          next_name = '      - name: Validate repaired source packet'
          try:
              start = lines.index(start_name)
              stop = lines.index(next_name)
              run_index = lines.index('        run: |', start, stop)
          except ValueError as exc:
              raise SystemExit('reviewed repair payload marker changed') from exc
          body = []
          for line in lines[run_index + 1:stop]:
              if line and not line.startswith('          '):
                  raise SystemExit('reviewed repair payload indentation changed')
              body.append(line[10:] if line else '')
          Path('/tmp/loom-901-repair.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/loom-901-repair.sh
      - name: Validate repaired source packet
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test:convex
          bun run worker:check
      - name: Restore canonical CI and publish source-only head
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            .github/workflows/loom-901-hosted-context-finalize.yml \
            convex/schema.ts convex/githubProjectContexts.ts \
            convex/githubProjectContexts-current-row-integrity-review.test.ts
          git diff --cached --quiet && { echo "No repair delta produced" >&2; exit 1; }
          git commit -m "Complete hosted GitHub context integrity"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}"
