name: Finalize hosted GitHub context replay

on:
  pull_request:

concurrency:
  group: loom-901-hosted-context-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'loom/901-hosted-context-current-main' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: loom/901-hosted-context-current-main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact carrier lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
      - uses: oven-sh/setup-bun@v2
      - name: Execute reviewed repair payload
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/loom-901-hosted-context-finalize.yml')
          lines = workflow.read_text().splitlines()
          start = lines.index('      - name: Apply reviewed hosted-context integrity repairs')
          stop = lines.index('      - name: Validate repaired source packet')
          run_index = lines.index('        run: |', start, stop)
          body = [
              line[10:] if line.startswith('          ') else line
              for line in lines[run_index + 1:stop]
          ]
          payload = '\n'.join(body) + '\n'
          if not payload.startswith('set -euo pipefail\n'):
              raise SystemExit('reviewed repair payload prefix changed')
          Path('/tmp/loom-901-repair.sh').write_text(payload)
          PY

          set +e
          bash /tmp/loom-901-repair.sh 2>&1 | tee /tmp/loom-901-repair.log
          payload_status="${PIPESTATUS[0]}"
          set -e
          if [[ "${payload_status}" -ne 0 ]]; then
            grep -Fx 'current-row admission marker changed' /tmp/loom-901-repair.log
            grep -Fq 'githubProjectContexts: defineTable({' convex/schema.ts
            python3 <<'PY'
          from pathlib import Path

          context_path = Path('convex/githubProjectContexts.ts')
          context = context_path.read_text()
          old = "\n".join([
              "    const classification = classifyGitHubIssueContextAcceptance(",
              "      current === null",
              "        ? null",
              "        : {",
              "          sourceRevision: current.sourceRevision,",
              "          contentSha256: current.contentSha256,",
              "          providerUpdatedAt: new Date(current.providerUpdatedAt).toISOString(),",
              "          instructionSetId: current.instructionSetId,",
              "          observedAt: new Date(current.observedAt).toISOString(),",
              "        },",
              "      {",
              "",
          ])
          new = "\n".join([
              "    const admittedCurrent = current === null",
              "      ? null",
              "      : admitStoredRecord(current, workspaceSlug, projectSlug);",
              "    const classification = classifyGitHubIssueContextAcceptance(",
              "      admittedCurrent === null",
              "        ? null",
              "        : {",
              "          sourceRevision: admittedCurrent.sourceRevision,",
              "          contentSha256: admittedCurrent.contentSha256,",
              "          providerUpdatedAt: admittedCurrent.providerUpdatedAt,",
              "          instructionSetId: admittedCurrent.instructionSetId,",
              "          observedAt: admittedCurrent.observedAt,",
              "        },",
              "      {",
              "",
          ])
          if context.count(old) != 1:
              raise SystemExit('current source classification block changed')
          context_path.write_text(context.replace(old, new, 1))

          workflow_lines = Path('.github/workflows/loom-901-hosted-context-finalize.yml').read_text().splitlines()
          heredoc_start = workflow_lines.index(
              "          cat > convex/githubProjectContexts-current-row-integrity-review.test.ts <<'EOF'"
          )
          heredoc_stop = workflow_lines.index('          EOF', heredoc_start + 1)
          test_body = [
              line[10:] if line.startswith('          ') else line
              for line in workflow_lines[heredoc_start + 1:heredoc_stop]
          ]
          Path('convex/githubProjectContexts-current-row-integrity-review.test.ts').write_text(
              '\n'.join(test_body) + '\n'
          )
          PY
            rm .github/workflows/loom-901-hosted-context-finalize.yml
          fi
      - name: Validate repaired source packet
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test:convex
          bun run worker:check
      - name: Restore canonical CI and publish source-only head
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            .github/workflows/loom-901-hosted-context-finalize.yml \
            convex/schema.ts convex/githubProjectContexts.ts \
            convex/githubProjectContexts-current-row-integrity-review.test.ts
          git diff --cached --quiet && { echo "No repair delta produced" >&2; exit 1; }
          git commit -m "Complete hosted GitHub context integrity"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}"
