name: Cicada 783 signed CI browser profile repair

on:
  push:
    branches:
      - cicada/783-browser-profile-controls-v2
    paths:
      - .github/workflows/cicada-783-browser-profile-repair.yml

permissions:
  contents: write

concurrency:
  group: cicada-783-browser-profile-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cicada/783-browser-profile-controls-v2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply browser profile and snapshot repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} changed: expected one marker, found {count}')
              return text.replace(old, new, 1)

          def literal_sub(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              result, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=flags,
              )
              if count != 1:
                  raise SystemExit(f'{label} changed: expected one marker, found {count}')
              return result

          exact_helpers = textwrap.dedent('''
          function exactRecord(
            value: unknown,
            keys: readonly string[],
            label: string,
          ): Record<string, unknown> {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
              throw new RangeError(`${label} must be a plain object`);
            }
            const prototype = Object.getPrototypeOf(value);
            if (prototype !== Object.prototype && prototype !== null) {
              throw new RangeError(`${label} must be a plain object`);
            }
            const descriptors = Object.getOwnPropertyDescriptors(value);
            const suppliedKeys = Reflect.ownKeys(descriptors);
            const allowed = new Set(keys);
            const result = Object.create(null) as Record<string, unknown>;
            for (const key of suppliedKeys) {
              if (typeof key !== "string" || !allowed.has(key)) {
                throw new RangeError(`${label} contains unknown fields`);
              }
              const descriptor = descriptors[key]!;
              if (!descriptor.enumerable || !("value" in descriptor)) {
                throw new RangeError(`${label} fields must be enumerable data properties`);
              }
              result[key] = descriptor.value;
            }
            for (const key of keys) {
              if (!Object.hasOwn(descriptors, key)) {
                throw new RangeError(`${label} is missing required fields`);
              }
            }
            return result;
          }

          function exactArray(
            value: unknown,
            label: string,
            minimum: number,
            maximum: number,
          ): unknown[] {
            if (!Array.isArray(value) || Object.getPrototypeOf(value) !== Array.prototype) {
              throw new RangeError(`${label} must be a plain array`);
            }
            const descriptors = Object.getOwnPropertyDescriptors(value);
            const lengthDescriptor = descriptors.length;
            if (
              !lengthDescriptor
              || lengthDescriptor.enumerable !== false
              || !("value" in lengthDescriptor)
              || !Number.isSafeInteger(lengthDescriptor.value)
              || (lengthDescriptor.value as number) < minimum
              || (lengthDescriptor.value as number) > maximum
            ) {
              throw new RangeError(`${label} must contain between ${minimum} and ${maximum} entries`);
            }
            const length = lengthDescriptor.value as number;
            const allowed = new Set<string>(["length"]);
            for (let index = 0; index < length; index += 1) allowed.add(String(index));
            const suppliedKeys = Reflect.ownKeys(descriptors);
            if (
              suppliedKeys.length !== allowed.size
              || suppliedKeys.some((key) => typeof key !== "string" || !allowed.has(key))
            ) {
              throw new RangeError(`${label} contains unsupported fields`);
            }
            const result: unknown[] = [];
            for (let index = 0; index < length; index += 1) {
              const descriptor = descriptors[String(index)];
              if (!descriptor) throw new RangeError(`${label} must be dense`);
              if (!descriptor.enumerable || !("value" in descriptor)) {
                throw new RangeError(`${label} entries must be enumerable data properties`);
              }
              result.push(descriptor.value);
            }
            return result;
          }

          ''').lstrip()

          normalized_path = Path('src/github-actions-ci-receipt-normalized.ts')
          normalized = normalized_path.read_text()
          normalized = replace_once(
              normalized,
              '''export const GITHUB_ACTIONS_CI_JOB_NAMES = [
  "test",
  "runtime-parity",
  "serial-full",
] as const;
''',
              '''export const GITHUB_ACTIONS_CI_JOB_NAMES = [
  "browser-evidence",
  "test",
  "runtime-parity",
  "serial-full",
] as const;
''',
              'canonical job names',
          )
          normalized = replace_once(
              normalized,
              'const jobs = exactArray(input.jobs, "GitHub Actions CI jobs", 3, 3)\n',
              'const jobs = exactArray(input.jobs, "GitHub Actions CI jobs", 4, 4)\n',
              'normalized job count',
          )
          normalized = literal_sub(
              normalized,
              r'const credentialPattern =\n\s*/.*?/iu;\nconst fallbackFailedStep',
              'const credentialPattern = /(?:Bearer\\s+[A-Za-z0-9._~+\\/-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|stn\\.tok_[A-Za-z0-9._-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|(?:env|secret):\\/\\/[^\\s]+|eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,})/iu;\nconst fallbackFailedStep',
              'normalized credential detector',
              re.DOTALL,
          )

          topology_start = normalized.index('function validateProfileTopology(')
          topology_end = normalized.index('function failedStep(', topology_start)
          normalized = normalized[:topology_start] + textwrap.dedent('''
          function validateProfileTopology(
            event: ParsedRun["event"],
            runConclusion: CiRunConclusion,
            profile: GitHubActionsCiValidationProfile,
            jobs: readonly ParsedJob[],
          ): void {
            if (event !== "workflow_dispatch" && profile !== "full_parallel") {
              throw new RangeError("Only manually dispatched CI may use the serial validation profile");
            }
            const byName = new Map(jobs.map((job) => [job.name, job]));
            const browser = byName.get("browser-evidence")!;
            const test = byName.get("test")!;
            const parity = byName.get("runtime-parity")!;
            const serial = byName.get("serial-full")!;
            if (profile === "full_parallel") {
              if (serial.conclusion !== "skipped") {
                throw new RangeError("Full-parallel CI requires the serial job to be skipped");
              }
              const active = [browser, test, parity];
              if (runConclusion === "success" && active.some((job) => job.conclusion === "skipped")) {
                throw new RangeError("Successful full-parallel CI requires every parallel job");
              }
              requireProfileOutcomeEvidence(runConclusion, active);
              return;
            }
            if (
              browser.conclusion !== "skipped"
              || test.conclusion !== "skipped"
              || parity.conclusion !== "skipped"
            ) {
              throw new RangeError("Serial-full CI requires every parallel job to be skipped");
            }
            if (runConclusion === "success" && serial.conclusion === "skipped") {
              throw new RangeError("Successful serial-full CI requires the serial job");
            }
            requireProfileOutcomeEvidence(runConclusion, [serial]);
          }

          function requireProfileOutcomeEvidence(
            runConclusion: CiRunConclusion,
            activeJobs: readonly ParsedJob[],
          ): void {
            const required = runConclusion === "failure"
              ? "failure"
              : runConclusion === "timed_out"
                ? "timed_out"
                : runConclusion === "neutral"
                  ? "neutral"
                  : null;
            if (required !== null && !activeJobs.some((job) => job.conclusion === required)) {
              throw new RangeError("GitHub Actions run outcome lacks active-profile job evidence");
            }
          }

          ''').lstrip() + normalized[topology_end:]

          normalized = literal_sub(
              normalized,
              r'function diagnosticsFingerprint\([\s\S]*?\n\}\n\nfunction concurrencyGroup\(',
              '''function diagnosticsFingerprint(
  jobName: ParsedJob["name"],
  artifacts: readonly ParsedArtifact[],
): string | null {
  if (jobName === "browser-evidence") return null;
  const artifactName = jobName === "test"
    ? "diagnostics"
    : jobName === "runtime-parity"
    ? "runtime-parity-diagnostics"
    : "serial-full-diagnostics";
  return artifacts.find((artifact) => artifact.name === artifactName)?.digest ?? null;
}

function concurrencyGroup(''',
              'browser diagnostics projection',
          )
          helper_start = normalized.index('function exactRecord(')
          helper_end = normalized.index('function repositoryName(', helper_start)
          normalized = normalized[:helper_start] + exact_helpers + normalized[helper_end:]
          normalized_path.write_text(normalized)

          wrapper_path = Path('src/github-actions-ci-receipt.ts')
          wrapper = wrapper_path.read_text()
          wrapper = replace_once(
              wrapper,
              'const jobs = exactArray(input.jobs, "GitHub Actions CI jobs", 3, 3)\n',
              'const jobs = exactArray(input.jobs, "GitHub Actions CI jobs", 4, 4)\n',
              'wrapper job count',
          )
          wrapper = replace_once(
              wrapper,
              '    "(?:^|[._:/\\\\s-])sk-proj-[A-Za-z0-9_-]+",\n    "(?:^|[._:/\\\\s-])sk-[A-Za-z0-9_-]{20,}",\n',
              '    "(?:^|[._:/\\\\s-])sk-(?:proj-)?[A-Za-z0-9_-]{20,}",\n',
              'wrapper OpenAI credential detector',
          )
          helper_start = wrapper.index('function exactRecord(')
          helper_end = wrapper.index('function repositoryName(', helper_start)
          wrapper = wrapper[:helper_start] + exact_helpers + wrapper[helper_end:]
          wrapper_path.write_text(wrapper)

          test_path = Path('test/github-actions-ci-receipt.test.ts')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '    id: name === "test" ? 10 : name === "runtime-parity" ? 20 : 30,\n',
              '    id: name === "browser-evidence" ? 5 : name === "test" ? 10 : name === "runtime-parity" ? 20 : 30,\n',
              'test job IDs',
          )
          pattern = re.compile(
              r'(jobs: \[\n(?P<indent>\s*))job\("test", "(?P<conclusion>success|failure|cancelled|skipped)"',
          )
          def add_browser(match: re.Match[str]) -> str:
              conclusion = match.group('conclusion')
              browser = 'success' if conclusion == 'failure' else conclusion
              indent = match.group('indent')
              return f'{match.group(1)}job("browser-evidence", "{browser}"),\n{indent}job("test", "{conclusion}"'
          tests, replacements = pattern.subn(add_browser, tests)
          if replacements < 1 or pattern.search(tests):
              raise SystemExit('browser job fixture rewrite was incomplete')
          tests = tests.replace('task-sk-research', 'task-sk-proj-research')
          tests = tests.replace('runner-sk-review', 'runner-sk-proj-review')
          tests = tests.replace('Run sk-review checks', 'Run sk-proj-review checks')
          test_path.write_text(tests)

          review_path = Path('test/github-actions-ci-receipt-browser-profile-review.test.ts')
          review = review_path.read_text()
          review += r'''

test("retains browser-only failure evidence", () => {
  const input = receiptBundle([
    completedJob("browser-evidence", "failure", {
      steps: [{ number: 1, name: "Run frontend browser evidence", status: "completed", conclusion: "failure" }],
    }),
    completedJob("test", "success"),
    completedJob("runtime-parity", "success"),
    completedJob("serial-full", "skipped"),
  ]);
  input.run = { ...(input.run as Record<string, unknown>), conclusion: "failure" };
  const receipt = compile(input);
  expect(receipt.jobs.find((job) => job.name === "browser-evidence")).toMatchObject({
    conclusion: "failure",
    failedStep: "Run frontend browser evidence",
    diagnosticsFingerprint: null,
  });
});

test("rejects failed profiles without active job evidence", () => {
  const input = receiptBundle([
    completedJob("browser-evidence", "skipped"),
    completedJob("test", "skipped"),
    completedJob("runtime-parity", "skipped"),
    completedJob("serial-full", "skipped"),
  ]);
  input.run = { ...(input.run as Record<string, unknown>), conclusion: "failure" };
  expect(() => compile(input)).toThrow("lacks active-profile job evidence");
});

test("rejects realistic long project keys", () => {
  const secret = `sk-proj-${"A".repeat(24)}`;
  const input = receiptBundle([
    completedJob("browser-evidence", "success"),
    completedJob("test", "failure", {
      steps: [{ number: 1, name: secret, status: "completed", conclusion: "failure" }],
    }),
    completedJob("runtime-parity", "success"),
    completedJob("serial-full", "skipped"),
  ]);
  input.run = { ...(input.run as Record<string, unknown>), conclusion: "failure" };
  expect(() => compile(input)).toThrow("GitHub Actions step name is invalid");
});

test("uses one descriptor snapshot for records and arrays", () => {
  const record = receiptBundle([
    completedJob("browser-evidence", "success"),
    completedJob("test", "success"),
    completedJob("runtime-parity", "success"),
    completedJob("serial-full", "skipped"),
  ]);
  Object.defineProperty(record, "escapedAdmission", { enumerable: true, value: true });
  let recordReads = 0;
  const recordProxy = new Proxy(record, {
    ownKeys(target) {
      recordReads += 1;
      const keys = Reflect.ownKeys(target);
      return recordReads === 1 ? keys : keys.filter((key) => key !== "escapedAdmission");
    },
  });
  expect(() => compile(recordProxy)).toThrow("contains unknown fields");

  const clean = receiptBundle([
    completedJob("browser-evidence", "success"),
    completedJob("test", "success"),
    completedJob("runtime-parity", "success"),
    completedJob("serial-full", "skipped"),
  ]);
  const jobs = clean.jobs as Record<string, unknown>[] & { escapedAdmission?: boolean };
  Object.defineProperty(jobs, "escapedAdmission", { enumerable: true, value: true });
  let arrayReads = 0;
  const jobsProxy = new Proxy(jobs, {
    ownKeys(target) {
      arrayReads += 1;
      const keys = Reflect.ownKeys(target);
      return arrayReads === 1 ? keys : keys.filter((key) => key !== "escapedAdmission");
    },
  });
  clean.jobs = jobsProxy;
  expect(() => compile(clean)).toThrow("contains unsupported fields");
});
'''
          review_path.write_text(review)

          docs_path = Path('docs/github-actions-ci-receipt-emitter.md')
          docs = docs_path.read_text()
          docs = replace_once(
              docs,
              '- exactly one record for each canonical `test`, `runtime-parity`, and `serial-full` job;\n',
              '- exactly one record for each canonical `browser-evidence`, `test`, `runtime-parity`, and `serial-full` job;\n',
              'evidence job documentation',
          )
          docs = replace_once(
              docs,
              '`full_parallel` requires `test` and `runtime-parity`; `serial-full` remains skipped. `serial_full` is admitted only for `workflow_dispatch`, requires `serial-full`, and keeps both parallel jobs skipped. All profiles carry the same ordered six-command contract.\n',
              '`full_parallel` requires the adjunct `browser-evidence` job beside `test` and `runtime-parity`; `serial-full` remains skipped. `serial_full` is admitted only for `workflow_dispatch`, requires `serial-full`, and keeps all three parallel jobs skipped. Both profiles retain the same six-command core contract. Browser commands remain owned by `ci-browser-evidence-profile/v1`; this receipt records the adjunct job outcome without synthesizing the separate success-only browser evidence receipt.\n',
              'topology documentation',
          )
          docs = docs.replace(
              'task-sk-research`, `runner-sk-review`, and `Run sk-review checks',
              'task-sk-proj-research`, `runner-sk-proj-review`, and `Run sk-proj-review checks',
          )
          docs = replace_once(
              docs,
              '1. collect one completed `workflow_run` and the three matching completed `workflow_job` observations behind the existing signed webhook route;\n',
              '1. collect one completed `workflow_run` and the four matching completed `workflow_job` observations behind the existing signed webhook route;\n',
              'mount job count documentation',
          )
          docs_path.write_text(docs)
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          bun run typecheck
          bun test \
            test/ci-queue-receipt-cancelled-before-start.test.ts \
            test/github-actions-ci-receipt.test.ts \
            test/github-actions-ci-receipt-browser-profile-review.test.ts
      - name: Publish clean source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cicada-783-browser-profile-repair.yml
          git config user.name 'Cicada'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/github-actions-ci-receipt-normalized.ts \
            src/github-actions-ci-receipt.ts \
            test/github-actions-ci-receipt.test.ts \
            test/github-actions-ci-receipt-browser-profile-review.test.ts \
            docs/github-actions-ci-receipt-emitter.md \
            .github/workflows/cicada-783-browser-profile-repair.yml
          git diff --cached --check
          git commit -m 'Repair signed CI browser profile admission'
          git push origin HEAD:cicada/783-browser-profile-controls-v2
