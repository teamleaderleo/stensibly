name: Cicada 886 next-evidence repair

on:
  push:
    branches:
      - cicada/886-next-evidence-control
    paths:
      - .github/workflows/cicada-886-next-evidence-repair.yml

permissions:
  contents: write

concurrency:
  group: cicada-886-next-evidence-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cicada/886-next-evidence-control
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Close received-result evidence state
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          printf 'SOURCE_HEAD=%s\n' "$source_head" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/execution-certainty.ts')
          source = source_path.read_text()
          old_source = '''      nextEvidence: "remote_result",
          '''
          new_source = '''      nextEvidence: "none",
          '''
          if source.count(old_source) != 1:
              raise SystemExit('received-result projection changed')
          source_path.write_text(source.replace(old_source, new_source, 1))

          test_path = Path('test/execution-certainty.test.ts')
          test = test_path.read_text()
          old_test = '''        nextEvidence: "remote_result",
          '''
          new_test = '''        nextEvidence: "none",
          '''
          if test.count(old_test) != 1:
              raise SystemExit('received-result expectation changed')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
          rm test/execution-certainty-next-evidence-review.test.ts
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify closed evidence state
        run: |
          bun run typecheck
          bun test test/execution-certainty.test.ts
      - name: Publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cicada'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cicada-886-next-evidence-repair.yml
          git add src/execution-certainty.ts test/execution-certainty.test.ts
          git add -u test/execution-certainty-next-evidence-review.test.ts
          git diff --cached --check
          git commit -m 'Close received execution evidence state'
          git push \
            --force-with-lease=refs/heads/cicada/886-next-evidence-control:${SOURCE_HEAD} \
            origin HEAD:cicada/886-next-evidence-control
