name: Cicada 891 next-evidence repair

on:
  push:
    branches:
      - cicada/891-next-evidence-repair
    paths:
      - .github/workflows/cicada-891-next-evidence-repair.yml

permissions:
  contents: write

concurrency:
  group: cicada-891-next-evidence-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cicada/891-next-evidence-repair
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Close received-result evidence state
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          printf 'SOURCE_HEAD=%s\n' "$source_head" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("src/execution-certainty.ts")
          source = source_path.read_text()
          old_source = '      nextEvidence: "remote_result",\n'
          new_source = '      nextEvidence: "none",\n'
          if source.count(old_source) != 1:
              raise SystemExit("received-result projection changed")
          source_path.write_text(source.replace(old_source, new_source, 1))

          test_path = Path("test/execution-certainty.test.ts")
          test = test_path.read_text()
          old_test = '        nextEvidence: "remote_result",\n'
          new_test = '        nextEvidence: "none",\n'
          if test.count(old_test) != 1:
              raise SystemExit("received-result expectation changed")
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          bun run typecheck
          bun test test/execution-certainty.test.ts test/execution-certainty-final-review.test.ts
      - name: Publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cicada'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cicada-891-next-evidence-repair.yml
          git add src/execution-certainty.ts test/execution-certainty.test.ts
          git diff --cached --check
          git commit -m 'Close received execution evidence state'
          git push \
            --force-with-lease=refs/heads/cicada/891-next-evidence-repair:${SOURCE_HEAD} \
            origin HEAD:cicada/891-next-evidence-repair
