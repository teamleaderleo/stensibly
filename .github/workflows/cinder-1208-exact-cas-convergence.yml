name: Cinder 1208 exact CAS integration convergence

on:
  push:
    branches:
      - juniper/1163-updaterefs-cas-integration
    paths:
      - .github/workflows/cinder-1208-exact-cas-convergence.yml

permissions:
  contents: write

concurrency:
  group: cinder-1208-exact-cas-integration
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-updaterefs-cas-integration
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact integration parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "226946ccba11dc6501931a6f536854f19be1d3cc"
          test "$(git rev-parse HEAD:src/github-update-refs-cas.ts)" = "9ccb6869e211d282473cfa8f53146c83b88aac36"
          test "$(git rev-parse HEAD:src/github-rest-repository-write-atomic-publication.ts)" = "dace75741348e3d7883fa11bc490bcc515274169"
          test "$(git rev-parse HEAD:test/github-rest-repository-write-atomic-publication.test.ts)" = "5e88c397d4aaae29deb4efef5d346f9b9f11aa5b"
          test "$(git rev-parse HEAD:test/github-rest-repository-write-atomic-mode-preservation.test.ts)" = "e53d5f9c0b07aa214a2a3ee301a3604d41320134"

      - uses: oven-sh/setup-bun@v2

      - name: Import small-tree reversing control
        env:
          CONTROL_HEAD: 701fa8691c63342c12bd7252c506a8db26723253
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_HEAD"
          test "$(git rev-parse "$CONTROL_HEAD":test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts)" = "56984c6b78cc9b98b640802613c3b1e552507780"
          git show "$CONTROL_HEAD":test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts \
            > test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts

      - name: Finish tree admission and integration fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          atomic_path = Path("src/github-rest-repository-write-atomic-publication.ts")
          atomic = atomic_path.read_text()
          start = atomic.index('function exactArray(')
          end = atomic.index('function exactRecord(', start)
          repaired = '''function exactArray(
  value: unknown,
  label: string,
  maximumLength: number,
): unknown[] {
  let isArray: boolean;
  let prototype: object | null;
  let lengthDescriptor: PropertyDescriptor | undefined;
  try {
    isArray = Array.isArray(value);
    prototype = isArray && value !== null ? Object.getPrototypeOf(value) : null;
    lengthDescriptor = isArray && value !== null
      ? Object.getOwnPropertyDescriptor(value, "length")
      : undefined;
  } catch {
    throw invalidResponse(`${label} were malformed`);
  }
  if (!isArray || prototype !== Array.prototype) {
    throw invalidResponse(`${label} were malformed`);
  }
  const lengthValue = lengthDescriptor && "value" in lengthDescriptor
    ? lengthDescriptor.value
    : undefined;
  if (
    typeof lengthValue !== "number"
    || !Number.isSafeInteger(lengthValue)
    || lengthValue < 0
    || lengthValue > maximumLength
  ) {
    throw invalidResponse(`${label} were malformed`);
  }
  const result: unknown[] = [];
  for (let index = 0; index < lengthValue; index += 1) {
    let descriptor: PropertyDescriptor | undefined;
    try {
      descriptor = Object.getOwnPropertyDescriptor(value, String(index));
    } catch {
      throw invalidResponse(`${label} were malformed`);
    }
    if (!descriptor || descriptor.enumerable !== true || !("value" in descriptor)) {
      throw invalidResponse(`${label} were malformed`);
    }
    result.push(descriptor.value);
  }
  return result;
}

'''
          atomic_path.write_text(atomic[:start] + repaired + atomic[end:])

          def import_compiler(text: str) -> str:
            statement = 'import { buildGitHubUpdateRefsCasRequest } from "../src/github-update-refs-cas.ts";\n'
            if statement in text:
              return text
            marker = 'import { describe, expect, test } from "bun:test";\n'
            if marker in text:
              return text.replace(marker, marker + statement, 1)
            marker = 'import { expect, test } from "bun:test";\n'
            if marker in text:
              return text.replace(marker, marker + statement, 1)
            raise SystemExit("test import anchor moved")

          def add_helper(text: str, anchor: str, helper: str) -> str:
            if helper in text:
              return text
            if text.count(anchor) != 1:
              raise SystemExit(f"helper anchor moved: {anchor}")
            return text.replace(anchor, helper + anchor, 1)

          # Atomic publication fixtures.
          p = Path("test/github-rest-repository-write-atomic-publication.test.ts")
          text = import_compiler(p.read_text())
          literal = '`stensibly-write-${nextCommitSha.slice(0, 16)}`'
          if text.count(literal) != 2:
            raise SystemExit(f"atomic publication identity fixtures moved: {text.count(literal)}")
          text = text.replace(literal, 'atomicClientMutationId()')
          helper = '''function atomicClientMutationId(): string {
  return buildGitHubUpdateRefsCasRequest({
    apiBaseUrl,
    repositoryFullName,
    repositoryId,
    targetRef,
    expectedHeadSha: parentSha,
    newHeadSha: nextCommitSha,
  }).clientMutationId;
}

'''
          text = add_helper(text, 'function updateRefsBody(): unknown {', helper)
          p.write_text(text)

          # Mode-preservation fixtures.
          p = Path("test/github-rest-repository-write-atomic-mode-preservation.test.ts")
          text = import_compiler(p.read_text())
          if text.count(literal) != 2:
            raise SystemExit(f"mode identity fixtures moved: {text.count(literal)}")
          text = text.replace(literal, 'modeClientMutationId()')
          helper = '''function modeClientMutationId(): string {
  return buildGitHubUpdateRefsCasRequest({
    apiBaseUrl,
    repositoryFullName,
    repositoryId,
    targetRef,
    expectedHeadSha: parentSha,
    newHeadSha: nextCommitSha,
  }).clientMutationId;
}

'''
          text = add_helper(text, 'function updateRefsBody(): unknown {', helper)
          p.write_text(text)

          # Adapter fixtures.
          p = Path("test/github-rest-repository-write-adapter.test.ts")
          text = import_compiler(p.read_text())
          adapter_literal = '`stensibly-write-${commitSha.slice(0, 16)}`'
          if text.count(adapter_literal) != 2:
            raise SystemExit(f"adapter identity fixtures moved: {text.count(adapter_literal)}")
          text = text.replace(adapter_literal, 'adapterClientMutationId()')
          helper = '''function adapterClientMutationId(): string {
  return buildGitHubUpdateRefsCasRequest({
    apiBaseUrl,
    repositoryFullName,
    repositoryId,
    targetRef,
    expectedHeadSha: parentSha,
    newHeadSha: commitSha,
  }).clientMutationId;
}

'''
          text = add_helper(text, 'function updateRefsBody(): unknown {', helper)
          p.write_text(text)

          # SHA-256 parity fixture.
          p = Path("test/github-rest-repository-write-adapter-fence-parity.test.ts")
          text = import_compiler(p.read_text())
          parity_literal = '`stensibly-write-${commit64.slice(0, 16)}`'
          if text.count(parity_literal) != 2:
            raise SystemExit(f"parity identity fixtures moved: {text.count(parity_literal)}")
          text = text.replace(parity_literal, 'parityClientMutationId()')
          helper = '''function parityClientMutationId(): string {
  return buildGitHubUpdateRefsCasRequest({
    apiBaseUrl: "https://api.github.com",
    repositoryFullName,
    repositoryId,
    targetRef: "topic/review",
    expectedHeadSha: parent64,
    newHeadSha: commit64,
  }).clientMutationId;
}

'''
          text = add_helper(text, 'function repositoryUrl(): string {', helper)
          p.write_text(text)

          # Provider URL spelling fixture.
          p = Path("test/github-rest-repository-write-provider-url-spelling.test.ts")
          text = import_compiler(p.read_text())
          provider_literal = '`stensibly-write-${commitSha.slice(0, 16)}`'
          if text.count(provider_literal) != 1:
            raise SystemExit(f"provider URL identity fixture moved: {text.count(provider_literal)}")
          text = text.replace(provider_literal, 'providerUrlClientMutationId()')
          helper = '''function providerUrlClientMutationId(): string {
  return buildGitHubUpdateRefsCasRequest({
    apiBaseUrl: "https://api.github.com",
    repositoryFullName,
    repositoryId,
    targetRef,
    expectedHeadSha: parentSha,
    newHeadSha: commitSha,
  }).clientMutationId;
}

'''
          text = add_helper(text, 'function isRepositoryNodeQuery(body: unknown): boolean {', helper)
          p.write_text(text)
          PY

          # The direct integration must not retain the old truncated mutation identity.
          if grep -R --line-number 'slice(0, 16)' \
              test/github-rest-repository-write-adapter.test.ts \
              test/github-rest-repository-write-adapter-fence-parity.test.ts \
              test/github-rest-repository-write-atomic-publication.test.ts \
              test/github-rest-repository-write-atomic-mode-preservation.test.ts \
              test/github-rest-repository-write-provider-url-spelling.test.ts; then
            echo "stale truncated mutation identity remains" >&2
            exit 1
          fi
          git diff --check

      - name: Validate remaining exact-CAS integration boundary
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-update-refs-cas.test.ts \
            test/github-update-refs-cas-input-inspection.test.ts \
            test/github-update-refs-cas-node-id.test.ts \
            test/github-update-refs-cas-api-base-security.test.ts \
            test/github-update-refs-cas-mutation-identity.test.ts \
            test/github-update-refs-cas-hostile-response.test.ts \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-adapter-fence-parity.test.ts \
            test/github-rest-repository-write-provider-url-spelling.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-atomic-ancestor-regression.test.ts \
            test/github-rest-repository-write-atomic-tree-prelimit.test.ts \
            test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts

      - name: Publish workflow-free integration head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cinder-1208-exact-cas-convergence.yml
          git add \
            src/github-rest-repository-write-atomic-publication.ts \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-adapter-fence-parity.test.ts \
            test/github-rest-repository-write-provider-url-spelling.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts
          git diff --cached --check
          git config user.name "Cinder"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Finish exact old-ref repository publication"
          git fetch origin refs/heads/juniper/1163-updaterefs-cas-integration:refs/remotes/origin/juniper/1163-updaterefs-cas-integration
          test "$(git rev-parse refs/remotes/origin/juniper/1163-updaterefs-cas-integration)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/juniper/1163-updaterefs-cas-integration:$EXPECTED_HEAD \
            origin HEAD:refs/heads/juniper/1163-updaterefs-cas-integration
