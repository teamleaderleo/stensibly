name: Cinder 1210 provider endpoint binding

on:
  push:
    branches:
      - loom/1201-cas-core-source-repair
    paths:
      - .github/workflows/cinder-1210-provider-endpoint-binding.yml

permissions:
  contents: write

concurrency:
  group: cinder-1210-provider-endpoint-binding
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: loom/1201-cas-core-source-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "84d25680cfd3dbfe0c6dba874c2ecf22204e053d"
          test "$(git rev-parse HEAD:src/github-update-refs-cas.ts)" = "bf7b452b1b82d55c83f8d033e9e43433a40a5faa"
          test "$(git rev-parse HEAD:test/github-update-refs-cas.test.ts)" = "ae58edd4424b106401b8b0d6b35ad5960e2a86af"
          test "$(git rev-parse HEAD:test/github-update-refs-cas-repository-identity.test.ts)" = "83a8958f8c9acaeb9e3f18625b74d455600d7eed"

      - uses: oven-sh/setup-bun@v2

      - name: Import exact endpoint-binding control
        env:
          CONTROL_HEAD: a574e6f1a129eab99d2f18c341c35ea9512f1aa4
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_HEAD"
          test "$(git rev-parse "$CONTROL_HEAD":test/github-update-refs-cas-provider-endpoint-binding.test.ts)" = "79a725c970255e9bfbc2cfcb7e696bfdc7c4b900"
          git show "$CONTROL_HEAD":test/github-update-refs-cas-provider-endpoint-binding.test.ts \
            > test/github-update-refs-cas-provider-endpoint-binding.test.ts

      - name: Bind response admission to exact lookup endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/github-update-refs-cas.ts")
          source = source_path.read_text()
          old = '''export function admitGitHubRepositoryNodeIdResponse(
            value: unknown,
            apiBaseUrl: string,
            expectedRepositoryFullName: string,
          ): Readonly<GitHubRepositoryNodeIdentity> {
            const graphqlUrl = githubGraphqlUrl(apiBaseUrl).href;
            const expectedRepository = admitGitHubRepositoryFullName(
              expectedRepositoryFullName,
            );'''
          new = '''export function admitGitHubRepositoryNodeIdResponse(
            value: unknown,
            expectedRepositoryFullName: string,
            expectedGraphqlUrl: string,
          ): Readonly<GitHubRepositoryNodeIdentity> {
            let graphqlUrl: string;
            try {
              graphqlUrl = admittedGraphqlEndpoint(expectedGraphqlUrl).href;
            } catch {
              throw invalidGraphqlResponse();
            }
            const expectedRepository = admitGitHubRepositoryFullName(
              expectedRepositoryFullName,
            );'''
          if source.count(old) != 1:
            raise SystemExit("repository response signature anchor moved")
          source_path.write_text(source.replace(old, new, 1))

          # Main contract suite.
          p = Path("test/github-update-refs-cas.test.ts")
          text = p.read_text()
          text = text.replace(
            '''function admittedRepository(
              base = apiBaseUrl,
              expected = repositoryFullName,
              nameWithOwner = expected,
              id = repositoryId,
            ) {
              return admitGitHubRepositoryNodeIdResponse({
                data: { repository: { id, nameWithOwner } },
              }, base, expected);
            }''',
            '''function admittedRepository(
              endpoint = graphqlUrl,
              expected = repositoryFullName,
              nameWithOwner = expected,
              id = repositoryId,
            ) {
              return admitGitHubRepositoryNodeIdResponse({
                data: { repository: { id, nameWithOwner } },
              }, expected, endpoint);
            }''',
            1,
          )
          text = text.replace(
            'admittedRepository(\n        apiBaseUrl,\n        repositoryFullName,',
            'admittedRepository(\n        graphqlUrl,\n        repositoryFullName,',
          )
          text = text.replace(
            'expect(admittedRepository("https://github.example.com/api/v3")).toEqual({\n      graphqlUrl: "https://github.example.com/api/graphql",',
            'expect(admittedRepository("https://github.example.com/api/graphql")).toEqual({\n      graphqlUrl: "https://github.example.com/api/graphql",',
            1,
          )
          text = text.replace(
            '    }, apiBaseUrl, repositoryFullName)).toThrow(',
            '    }, repositoryFullName, graphqlUrl)).toThrow(',
          )
          text = text.replace(
            '      apiBaseUrl,\n      repositoryFullName,\n    )).toEqual({ graphqlUrl, repositoryFullName, repositoryId });',
            '      repositoryFullName,\n      graphqlUrl,\n    )).toEqual({ graphqlUrl, repositoryFullName, repositoryId });',
            1,
          )
          text = text.replace(
            '      apiBaseUrl,\n      repositoryFullName,\n    )).toThrow("GitHub updateRefs GraphQL response is invalid");',
            '      repositoryFullName,\n      graphqlUrl,\n    )).toThrow("GitHub updateRefs GraphQL response is invalid");',
            1,
          )
          p.write_text(text)

          # Node-ID suite.
          p = Path("test/github-update-refs-cas-node-id.test.ts")
          text = p.read_text()
          text = text.replace('const apiBaseUrl = "https://api.github.com";\n', 'const graphqlUrl = "https://api.github.com/graphql";\n', 1)
          text = text.replace('  }, apiBaseUrl, repositoryFullName);', '  }, repositoryFullName, graphqlUrl);')
          text = text.replace('  }, apiBaseUrl, repositoryFullName)).toThrow(', '  }, repositoryFullName, graphqlUrl)).toThrow(')
          p.write_text(text)

          # Mutation-identity suite.
          p = Path("test/github-update-refs-cas-mutation-identity.test.ts")
          text = p.read_text()
          text = text.replace(
            '''function admittedRepository(
              apiBaseUrl: string,
              repositoryFullName: string,
              repositoryId: string,
            ) {''',
            '''function admittedRepository(
              graphqlUrl: string,
              repositoryFullName: string,
              repositoryId: string,
            ) {''',
            1,
          )
          text = text.replace('  }, apiBaseUrl, repositoryFullName);', '  }, repositoryFullName, graphqlUrl);', 1)
          text = text.replace('"https://api.github.com",', '"https://api.github.com/graphql",')
          text = text.replace('"https://github.example.com/api/v3",', '"https://github.example.com/api/graphql",')
          p.write_text(text)

          # Repository-identity suite.
          p = Path("test/github-update-refs-cas-repository-identity.test.ts")
          text = p.read_text()
          text = text.replace(
            '  }, "https://api.github.com", repositoryFullName);',
            '  }, repositoryFullName, request.url.href);',
            1,
          )
          text = text.replace(
            '  }, "https://api.github.com", repositoryFullName)).toThrow(',
            '  }, repositoryFullName, "https://api.github.com/graphql")).toThrow(',
            1,
          )
          text = text.replace(
            '  }, "https://github.example.com/api/v3", repositoryFullName);',
            '  }, repositoryFullName, "https://github.example.com/api/graphql");',
            1,
          )
          p.write_text(text)

          # Input-inspection suite.
          p = Path("test/github-update-refs-cas-input-inspection.test.ts")
          text = p.read_text()
          text = text.replace(
            '  }, repositoryFullName);',
            '  }, repositoryFullName, "https://api.github.com/graphql");',
            1,
          )
          p.write_text(text)
          PY

          # No repository-response admission should still accept a REST base in the positive suites.
          if grep -R --line-number 'admitGitHubRepositoryNodeIdResponse' \
              test/github-update-refs-cas*.test.ts | grep 'apiBaseUrl'; then
            echo "repository response admission still reconstructs endpoint from REST base" >&2
            exit 1
          fi
          git diff --check

      - name: Validate endpoint-bound CAS contract
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-update-refs-cas*.test.ts

      - name: Publish workflow-free endpoint-bound packet
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cinder-1210-provider-endpoint-binding.yml
          git add \
            src/github-update-refs-cas.ts \
            test/github-update-refs-cas.test.ts \
            test/github-update-refs-cas-input-inspection.test.ts \
            test/github-update-refs-cas-node-id.test.ts \
            test/github-update-refs-cas-mutation-identity.test.ts \
            test/github-update-refs-cas-repository-identity.test.ts \
            test/github-update-refs-cas-provider-endpoint-binding.test.ts
          git diff --cached --check
          git config user.name "Cinder"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind CAS repository receipt to provider endpoint"
          git fetch origin refs/heads/loom/1201-cas-core-source-repair:refs/remotes/origin/loom/1201-cas-core-source-repair
          test "$(git rev-parse refs/remotes/origin/loom/1201-cas-core-source-repair)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/loom/1201-cas-core-source-repair:$EXPECTED_HEAD \
            origin HEAD:refs/heads/loom/1201-cas-core-source-repair
