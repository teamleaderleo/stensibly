name: Clean PR 518 formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: clean-pr-518-formatting
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: quill/490-gateway-diagnostic-stages
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply exact formatting cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/mcp-http.ts')
          source = source_path.read_text()
          old = '''  return jsonRpcError(
            403,
            -32001,
            `Host is not allowed: ${host ?? "missing"}`,
            null,
            { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },
            "request_failure",
          );'''
          new = '''  return jsonRpcError(
              403,
              -32001,
              `Host is not allowed: ${host ?? "missing"}`,
              null,
              { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },
              "request_failure",
            );'''
          if source.count(old) != 1:
              raise SystemExit('Host formatting anchor missing or duplicated')
          source_path.write_text(source.replace(old, new))

          test_path = Path('test/mcp-diagnostics.test.ts')
          tests = test_path.read_text()
          tests = tests.replace('\n}\n\n\ndescribe("MCP gateway validation diagnostics"', '\n}\n\ndescribe("MCP gateway validation diagnostics"')
          test_path.write_text(tests)
          PY
      - name: Validate cleanup
        run: |
          bun install --frozen-lockfile
          bun test test/mcp-diagnostics.test.ts
          bun run typecheck
      - name: Commit cleanup and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill reliability worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-518-formatting.yml
          git add src/mcp-http.ts test/mcp-diagnostics.test.ts
          git commit -m "style: align MCP gateway diagnostic repair"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:quill/490-gateway-diagnostic-stages
