name: context-token-count

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - STENSIBLY.md
      - .github/workflows/context-token-count.yml

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tokenizer
        run: python -m pip install --disable-pip-version-check tiktoken==0.11.0
      - name: Count o200k_base tokens
        env:
          BASE_SHA: 71bc7dbc07b55c3e8a251c38fcd4b6b0828d17a5
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tiktoken

          enc = tiktoken.get_encoding("o200k_base")
          files = ["README.md", "AGENTS.md", "STENSIBLY.md"]
          total_before = 0
          total_after = 0
          print("encoding=o200k_base")
          print("file\tbefore\tafter\tremoved\treduction")
          for path in files:
              before = subprocess.check_output(
                  ["git", "show", f"{os.environ['BASE_SHA']}:{path}"]
              ).decode("utf-8")
              after = pathlib.Path(path).read_text(encoding="utf-8")
              before_count = len(enc.encode(before, disallowed_special=()))
              after_count = len(enc.encode(after, disallowed_special=()))
              removed = before_count - after_count
              reduction = removed / before_count * 100
              print(f"{path}\t{before_count}\t{after_count}\t{removed}\t{reduction:.2f}%")
              total_before += before_count
              total_after += after_count
          removed = total_before - total_after
          reduction = removed / total_before * 100
          print(f"TOTAL\t{total_before}\t{total_after}\t{removed}\t{reduction:.2f}%")
          PY
