name: Delete browser evidence incident artifact

on:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  delete-exact-artifact:
    if: github.event.pull_request.head.ref == 'cinder/667-delete-browser-evidence-incident'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and delete exact leaked artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          artifact_id = 8800884100
          expected = {
              "id": artifact_id,
              "name": "browser-evidence-diagnostics",
              "size_in_bytes": 5031,
              "digest": "sha256:df3093e1aa5a933a0ca5aac56d55c2c72eaf1b8b0d73c768c7dfec8b17aeaae2",
              "expired": False,
          }
          expected_run = {
              "id": 30649698639,
              "repository_id": 1310091990,
              "head_repository_id": 1310091990,
              "head_branch": "cinder/667-playwright-browser-evidence",
              "head_sha": "84f2018ee7ec6eb368ddcaa1f8b1efb50d138a5f",
          }

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"Unexpected artifact metadata status: {response.status}")
              artifact = json.load(response)

          for key, value in expected.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"Artifact metadata mismatch for {key}")
          run = artifact.get("workflow_run")
          if not isinstance(run, dict):
              raise SystemExit("Artifact lacks workflow run identity")
          for key, value in expected_run.items():
              if run.get(key) != value:
                  raise SystemExit(f"Workflow run metadata mismatch for {key}")

          request = urllib.request.Request(url, headers=headers, method="DELETE")
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"Unexpected artifact deletion status: {response.status}")

          try:
              urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit("Deleted artifact remains readable")

          print("Deleted exact privacy-incident artifact 8800884100; metadata endpoint now returns 404.")
          PY
