name: OIDC Worker deployment status once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-status-once.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record exact OIDC Worker deploy run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: a9c6b579d0b287467c06291f912cc0d846c08632
        run: |
          set -euo pipefail
          runs="$(gh api "/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=20")"
          receipt="$(jq '{runs: [.workflow_runs[] | {id,name,event,status,conclusion,created_at,updated_at}]}' <<<"$runs")"
          encoded="$(printf '%s\n' "$receipt" | base64 -w 0)"
          path='.smoke/oidc-deploy-status.json'
          existing_sha="$(gh api "/repos/$REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "/repos/$REPOSITORY/contents/$path" -f message='Record OIDC Worker deploy status' -f content="$encoded")
          if [[ -n "$existing_sha" ]]; then args+=(-f sha="$existing_sha"); fi
          gh api "${args[@]}" >/dev/null
