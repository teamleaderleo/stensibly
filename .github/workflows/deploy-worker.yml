name: Deploy Worker Production

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "config/worker-production-bindings.json"
      - "scripts/worker-production-release.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      project:
        description: Optional project slug for scoped-token verification
        required: false
        type: string
      oauth_expectation:
        description: Expected public OAuth state after deployment
        required: true
        default: enabled
        type: choice
        options:
          - disabled
          - enabled

permissions:
  contents: read

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate deployment ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_REF" != "refs/heads/main" ]]; then
            echo "Production Worker deployments must run from main; received $DEPLOY_REF" >&2
            exit 1
          fi

  test:
    name: Validate production candidate
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run Bun tests
        run: bun run test

      - name: Run Convex tests
        run: bun run test:convex

      - name: Bundle Cloudflare Worker
        run: bun run worker:check

  deploy:
    name: Deploy and verify
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.stensibly.com/health
    env:
      OAUTH_EXPECTATION: ${{ github.event_name == 'workflow_dispatch' && inputs.oauth_expectation || 'enabled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate workflow inputs and secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_READ_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          VERIFY_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STENSIBLY_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production environment secret: $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ -n "$VERIFY_PROJECT" && ! "$VERIFY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "The optional project must be a lowercase project slug" >&2
            exit 1
          fi
          case "$OAUTH_EXPECTATION" in
            disabled|enabled) ;;
            *) echo "OAuth expectation must be disabled or enabled" >&2; exit 1 ;;
          esac

      - name: Verify production Worker secret inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          secret_inventory="$(bunx wrangler secret list --name stensibly-api --format json --config wrangler.jsonc)"
          for name in \
            CONVEX_URL \
            STENSIBLY_SERVICE_SECRET \
            STENSIBLY_GITHUB_APP_ID \
            STENSIBLY_GITHUB_APP_PRIVATE_KEY \
            STENSIBLY_GITHUB_INSTALLATION_ID \
            STENSIBLY_GITHUB_WEBHOOK_SECRET; do
            if ! jq -e --arg name "$name" 'any(.[]; .name == $name)' \
              <<< "$secret_inventory" >/dev/null; then
              echo "Missing required production Worker secret: $name" >&2
              exit 1
            fi
          done

      - name: Release exact production Worker candidate
        id: release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          VERIFY_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          args=(
            --expected-sha "$GITHUB_SHA"
            --oauth-expectation "$OAUTH_EXPECTATION"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$VERIFY_PROJECT" ]]; then
            args+=(--project "$VERIFY_PROJECT")
          fi
          bun run worker:deploy -- "${args[@]}"

      - name: Record deployment summary
        if: ${{ success() }}
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BASELINE_DEPLOYMENT_ID: ${{ steps.release.outputs.baseline_deployment_id }}
          CANDIDATE_VERSION_ID: ${{ steps.release.outputs.candidate_version_id }}
        run: |
          {
            echo "### Stensibly Worker deployed"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Baseline deployment: \`$BASELINE_DEPLOYMENT_ID\`"
            echo "- Worker version: \`$CANDIDATE_VERSION_ID\`"
            echo "- Worker fallback: https://stensibly-api.leoli-082000.workers.dev"
            echo "- Official endpoint: https://api.stensibly.com"
            echo "- Declared OAuth state: \`$OAUTH_EXPECTATION\`"
            echo "- Exact current-main check: passed before upload and promotion"
            echo "- Uploaded production binding inventory: passed"
            echo "- Candidate preview verification: passed before promotion"
            echo "- Hosted API + MCP verification: passed on both origins"
            echo "- Public auth/OAuth verification: passed on both origins"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed release and recovery state
        if: ${{ failure() && steps.release.outputs.candidate_version_id != '' }}
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BASELINE_DEPLOYMENT_ID: ${{ steps.release.outputs.baseline_deployment_id }}
          CANDIDATE_VERSION_ID: ${{ steps.release.outputs.candidate_version_id }}
          RECOVERED: ${{ steps.release.outputs.recovered || 'false' }}
        run: |
          {
            echo "### Stensibly Worker release failed"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Candidate Worker version: \`$CANDIDATE_VERSION_ID\`"
            echo "- Preserved baseline deployment: \`$BASELINE_DEPLOYMENT_ID\`"
            echo "- Automatic baseline recovery completed: \`$RECOVERED\`"
            if [[ "$RECOVERED" == "true" ]]; then
              echo "- Result: captured baseline was restored and health-checked"
            else
              echo "- Result: active deployment is unknown; manually reconcile Cloudflare before retrying"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
