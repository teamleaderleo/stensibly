name: Deploy Worker Production

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      project:
        description: Optional project slug for scoped-token verification
        required: false
        type: string
      oauth_expectation:
        description: Expected public OAuth state after deployment
        required: true
        default: enabled
        type: choice
        options:
          - disabled
          - enabled

permissions:
  contents: read

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate deployment ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_REF" != "refs/heads/main" ]]; then
            echo "Production Worker deployments must run from main; received $DEPLOY_REF" >&2
            exit 1
          fi

  test:
    name: Validate production candidate
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run Bun tests
        run: bun run test

      - name: Run Convex tests
        run: bun run test:convex

      - name: Bundle Cloudflare Worker
        run: bun run worker:check

  deploy:
    name: Deploy and verify
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.stensibly.com/health
    env:
      OAUTH_EXPECTATION: ${{ github.event_name == 'workflow_dispatch' && inputs.oauth_expectation || 'enabled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate workflow inputs and secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_READ_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          VERIFY_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STENSIBLY_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production environment secret: $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ -n "$VERIFY_PROJECT" && ! "$VERIFY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "The optional project must be a lowercase project slug" >&2
            exit 1
          fi
          case "$OAUTH_EXPECTATION" in
            disabled|enabled) ;;
            *) echo "OAuth expectation must be disabled or enabled" >&2; exit 1 ;;
          esac

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy

      - name: Verify Worker fallback bearer compatibility
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          STENSIBLY_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun run verify:hosted -- --endpoint https://stensibly-api.leoli-082000.workers.dev; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Verify official endpoint bearer compatibility
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          STENSIBLY_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun run verify:hosted; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Verify Worker fallback public OAuth state
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun run verify:oauth -- \
              --endpoint https://stensibly-api.leoli-082000.workers.dev \
              --issuer https://api.stensibly.com \
              --expect "$OAUTH_EXPECTATION"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Verify official endpoint public OAuth state
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun run verify:oauth -- --expect "$OAUTH_EXPECTATION"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Record deployment summary
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Stensibly Worker deployed"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Worker fallback: https://stensibly-api.leoli-082000.workers.dev"
            echo "- Official endpoint: https://api.stensibly.com"
            echo "- Declared OAuth state: \`$OAUTH_EXPECTATION\`"
            echo "- Legacy bearer verification: passed on both origins"
            echo "- Public auth/OAuth verification: passed on both origins"
          } >> "$GITHUB_STEP_SUMMARY"
