name: Ember 1046 raw path repair

on:
  push:
    branches:
      - ember/987-encoded-invalid-identity-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@v6
        with:
          ref: ember/987-encoded-invalid-identity-repair
          fetch-depth: 2

      - name: Verify carrier ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ba8744bfaf6f8baeccad076aa9cf115dc4e4da79"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/ember-1046-raw-path-repair.yml"

      - name: Repair raw path admission
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/github-outbound-text-preflight.ts",
              "    const routePrefix = parseRoutePrefix(parsed.pathname);",
              "    const routePrefix = parseRoutePrefix(raw?.[4] ?? parsed.pathname);",
          )

          replace_once(
              "test/github-outbound-text-preflight-final-boundaries.test.ts",
              '''      `example/eyJ${"a".repeat(8)}.eyJ${"b".repeat(8)}.${"c".repeat(8)}`,''',
              '''      `example/eyj${"a".repeat(8)}.eyj${"b".repeat(8)}.${"c".repeat(8)}`,''',
          )
          PY

          rm .github/workflows/ember-1046-raw-path-repair.yml

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify focused repair
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test \
            test/github-outbound-text-preflight-encoded-invalid-identity.test.ts \
            test/github-outbound-text-preflight-percent-encoded-continuation.test.ts \
            test/github-outbound-text-preflight-unicode-boundary.test.ts \
            test/github-outbound-text-preflight-unicode-symbol-boundary.test.ts \
            test/github-outbound-text-preflight-final-boundaries.test.ts

      - name: Publish workflow-free repaired head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ember"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use raw GitHub URL path for encoded-route admission"
          git push origin HEAD:ember/987-encoded-invalid-identity-repair
