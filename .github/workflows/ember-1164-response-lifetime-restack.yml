name: Ember 1164 response lifetime restack

on:
  push:
    branches:
      - juniper/1163-total-response-lifetime
    paths:
      - .github/workflows/ember-1164-response-lifetime-restack.yml

permissions:
  contents: write

concurrency:
  group: ember-1164-response-lifetime-restack
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-total-response-lifetime
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact carrier and obsolete parent
        shell: bash
        env:
          EXPECTED_CARRIER: ${{ github.sha }}
          OBSOLETE_PARENT: a8426216cca738ceca31bbddf65ff89fb9caa242
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CARRIER}"
          test "$(git rev-parse HEAD^)" = "${OBSOLETE_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/ember-1164-response-lifetime-restack.yml"
          test "$(git rev-parse HEAD^:src/github-rest-repository-write-adapter.ts)" = \
            "f0f740640dfe62f4210b02c75f2b50a1e8cc8d15"

      - uses: oven-sh/setup-bun@v2

      - name: Rebuild lifetime child on final atomic parent
        shell: bash
        env:
          SOURCE_HEAD: 17fc44c514c092ba1f9670dd6ac88f0c3f2df8be
          FINAL_PARENT: bd3614400f7ffc0eccd9cb2f1a3d9b0f16de9510
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${SOURCE_HEAD}" "${FINAL_PARENT}"
          git cat-file -e "${SOURCE_HEAD}^{commit}"
          git cat-file -e "${FINAL_PARENT}^{commit}"
          test "$(git rev-parse "${FINAL_PARENT}:src/github-rest-repository-write-adapter.ts")" = \
            "f0f740640dfe62f4210b02c75f2b50a1e8cc8d15"

          git show "${SOURCE_HEAD}:src/github-provider-bounded-response.ts" \
            > /tmp/github-provider-bounded-response.ts
          git show "${SOURCE_HEAD}:src/github-rest-repository-write-adapter.ts" \
            > /tmp/github-rest-repository-write-adapter.ts
          git show "${SOURCE_HEAD}:test/github-rest-repository-write-response-lifetime.test.ts" \
            > /tmp/github-rest-repository-write-response-lifetime.test.ts

          git reset --hard "${FINAL_PARENT}"
          cp /tmp/github-provider-bounded-response.ts src/github-provider-bounded-response.ts
          cp /tmp/github-rest-repository-write-adapter.ts src/github-rest-repository-write-adapter.ts
          cp /tmp/github-rest-repository-write-response-lifetime.test.ts \
            test/github-rest-repository-write-response-lifetime.test.ts

          python3 - <<'PY'
          from pathlib import Path

          adapter = Path("src/github-rest-repository-write-adapter.ts")
          text = adapter.read_text()
          before = '''async function readJson(response: Response, operation: string): Promise<unknown> {
            let text: string;'''
          after = '''async function readJson(response: Response, operation: string): Promise<unknown> {
            const declared = response.headers.get("content-length");
            if (declared !== null) {
              if (!/^(?:0|[1-9][0-9]*)$/u.test(declared)) {
                discardGitHubProviderResponse(response);
                throw invalidResponse(`GitHub ${operation} response length was invalid`);
              }
              const declaredBytes = Number(declared);
              if (
                !Number.isSafeInteger(declaredBytes)
                || declaredBytes > maximumResponseBytes
              ) {
                discardGitHubProviderResponse(response);
                throw invalidResponse(
                  `GitHub ${operation} response exceeded its byte limit`,
                );
              }
            }
            let text: string;'''
          count = text.count(before)
          if count != 1:
              raise SystemExit(f"expected one adapter read anchor, found {count}")
          adapter.write_text(text.replace(before, after, 1))

          tests = Path("test/github-rest-repository-write-response-lifetime.test.ts")
          text = tests.read_text()
          replacements = [
            (
              '    let signal: AbortSignal | null = null;\n',
              '    const signal = { value: null as AbortSignal | null };\n',
            ),
            (
              '      signal = init?.signal as AbortSignal;\n',
              '      signal.value = init?.signal as AbortSignal;\n',
            ),
            (
              '    expect(signal?.aborted).toBe(true);\n',
              '    expect(signal.value?.aborted).toBe(true);\n',
            ),
            (
              '    let resolveFetch: ((response: Response) => void) | null = null;\n',
              '    const resolveFetch = { value: null as ((response: Response) => void) | null };\n',
            ),
            (
              '      resolveFetch = resolve;\n',
              '      resolveFetch.value = resolve;\n',
            ),
            (
              '    resolveFetch?.(new Response(body, { status: 200 }));\n',
              '    resolveFetch.value?.(new Response(body, { status: 200 }));\n',
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one response test anchor, found {count}: {old!r}")
              text = text.replace(old, new, 1)
          tests.write_text(text)
          PY

          git add \
            src/github-provider-bounded-response.ts \
            src/github-rest-repository-write-adapter.ts \
            test/github-rest-repository-write-response-lifetime.test.ts
          git diff --cached --check
          printf '%s\n' \
            src/github-provider-bounded-response.ts \
            src/github-rest-repository-write-adapter.ts \
            test/github-rest-repository-write-response-lifetime.test.ts \
            | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Validate exact final-parent child
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-rest-repository-write-response-lifetime.test.ts \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-adapter-fence-parity.test.ts \
            test/github-rest-repository-write-provider-url-spelling.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-provider-bounded-response.test.ts

      - name: Publish workflow-free source packet
        shell: bash
        env:
          EXPECTED_CARRIER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "Ember"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bound native repository response lifetime"
          git fetch origin \
            refs/heads/juniper/1163-total-response-lifetime:refs/remotes/origin/juniper/1163-total-response-lifetime
          test "$(git rev-parse refs/remotes/origin/juniper/1163-total-response-lifetime)" = \
            "${EXPECTED_CARRIER}"
          git push \
            --force-with-lease=refs/heads/juniper/1163-total-response-lifetime:${EXPECTED_CARRIER} \
            origin HEAD:refs/heads/juniper/1163-total-response-lifetime
