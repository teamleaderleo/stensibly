name: Ember 1193 cleanup metadata containment

on:
  push:
    branches:
      - turnstile/537-hosted-stable-mcp-read
    paths:
      - .github/workflows/ember-1193-cleanup-metadata.yml

permissions:
  contents: write

concurrency:
  group: ember-1193-cleanup-metadata
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: turnstile/537-hosted-stable-mcp-read
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source lease
        shell: bash
        env:
          SOURCE_HEAD: 8326fbc8a7971010e152a4c5ddf786880c84b2f4
          SOURCE_BLOB: 39e3fe9ac203e0cae6f2889b30ef5b677b1ae6af
          CONTROL_SHA: 0c0a386512bfa256b8aeacb4beba284ca4c61130
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD:src/verify-hosted-stable-read.ts)" = "$SOURCE_BLOB"
          git fetch --no-tags origin "$CONTROL_SHA"
          git show "$CONTROL_SHA":test/verify-hosted-stable-read-cleanup-metadata.test.ts \
            > /tmp/verify-hosted-stable-read-cleanup-metadata.test.ts
          test "$(git hash-object /tmp/verify-hosted-stable-read-cleanup-metadata.test.ts)" = "31b37dab49fb809859760996ad854bc15bb88959"

      - uses: oven-sh/setup-bun@v2

      - name: Contain provider cleanup metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/verify-hosted-stable-read.ts")
          text = path.read_text()
          old = '''async function cancelResponseBody(response: Response): Promise<void> {
            if (!response.body || response.body.locked) return;
            try {
              await response.body.cancel();
            } catch {
              // Cancellation is best-effort after a fixed verifier decision.
            }
          }'''
          new = '''async function cancelResponseBody(response: Response): Promise<void> {
            try {
              const body = response.body;
              if (!body || body.locked) return;
              await body.cancel();
            } catch {
              // Cancellation is best-effort after a fixed verifier decision.
            }
          }'''
          if text.count(old) != 1:
              raise SystemExit(f"cleanup helper anchor moved: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          cp /tmp/verify-hosted-stable-read-cleanup-metadata.test.ts \
            test/verify-hosted-stable-read-cleanup-metadata.test.ts
          git diff --check

      - name: Validate focused stable-read verifier
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/verify-hosted-stable-read.test.ts \
            test/verify-hosted-stable-read-protocol-boundaries.test.ts \
            test/verify-hosted-stable-read-chunk-detachment.test.ts \
            test/verify-hosted-stable-read-proxy-byte-control.test.ts \
            test/verify-hosted-stable-read-cleanup-metadata.test.ts

      - name: Publish workflow-free repair
        shell: bash
        env:
          CARRIER_SHA: ${{ github.sha }}
          HEAD_REF: turnstile/537-hosted-stable-mcp-read
        run: |
          set -euo pipefail
          git add \
            src/verify-hosted-stable-read.ts \
            test/verify-hosted-stable-read-cleanup-metadata.test.ts
          git rm .github/workflows/ember-1193-cleanup-metadata.yml
          git diff --cached --check
          git config user.name "Ember"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Contain stable-read cleanup metadata"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$CARRIER_SHA"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${CARRIER_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"