name: Ember 744 descriptor repair

on:
  push:
    branches:
      - ember/744-synchronization-state-compiler

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ember/744-synchronization-state-compiler
          fetch-depth: 0
      - name: Apply bounded descriptor repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/synchronization-state.ts")
          source = source_path.read_text()
          old = '''function exactRecord(
            value: unknown,
            fields: readonly string[],
            label: string,
          ): Record<string, unknown> {
            if (typeof value !== "object" || value === null || Array.isArray(value)) {
              throw new TypeError(`${label} must be a plain object`);
            }
            const prototype = Object.getPrototypeOf(value);
            if (prototype !== Object.prototype && prototype !== null) {
              throw new TypeError(`${label} must use a plain or null prototype`);
            }
            if (Object.getOwnPropertySymbols(value).length !== 0) {
              throw new TypeError(`${label} must not contain symbol keys`);
            }
            const keys = Object.keys(value);
            if (keys.length !== fields.length || fields.some((field) => !keys.includes(field))) {
              throw new TypeError(`${label} fields were invalid`);
            }
            for (const field of fields) {
              const descriptor = Object.getOwnPropertyDescriptor(value, field);
              if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
                throw new TypeError(`${label} fields must be enumerable data properties`);
              }
            }
            return value as Record<string, unknown>;
          }

          function denseArray(value: unknown, maximum: number, label: string): unknown[] {
            if (!Array.isArray(value) || value.length > maximum) {
              throw new TypeError(`${label} must be a bounded array`);
            }
            if (Object.getOwnPropertySymbols(value).length !== 0) {
              throw new TypeError(`${label} must not contain symbol keys`);
            }
            const keys = Object.keys(value);
            if (keys.length !== value.length) {
              throw new TypeError(`${label} must be dense and undecorated`);
            }
            for (let index = 0; index < value.length; index += 1) {
              if (keys[index] !== String(index)) {
                throw new TypeError(`${label} must be dense and undecorated`);
              }
              const descriptor = Object.getOwnPropertyDescriptor(value, String(index));
              if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
                throw new TypeError(`${label} entries must be enumerable data properties`);
              }
            }
            return value;
          }
          '''
          new = '''function exactRecord(
            value: unknown,
            fields: readonly string[],
            label: string,
          ): Record<string, unknown> {
            if (typeof value !== "object" || value === null || Array.isArray(value)) {
              throw new TypeError(`${label} must be a plain object`);
            }
            const prototype = Object.getPrototypeOf(value);
            if (prototype !== Object.prototype && prototype !== null) {
              throw new TypeError(`${label} must use a plain or null prototype`);
            }
            if (Object.getOwnPropertySymbols(value).length !== 0) {
              throw new TypeError(`${label} must not contain symbol keys`);
            }
            const names = Object.getOwnPropertyNames(value);
            if (names.length !== fields.length || fields.some((field) => !names.includes(field))) {
              throw new TypeError(`${label} fields were invalid`);
            }
            for (const field of fields) {
              const descriptor = Object.getOwnPropertyDescriptor(value, field);
              if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
                throw new TypeError(`${label} fields must be enumerable data properties`);
              }
            }
            return value as Record<string, unknown>;
          }

          function denseArray(value: unknown, maximum: number, label: string): unknown[] {
            if (!Array.isArray(value) || value.length > maximum) {
              throw new TypeError(`${label} must be a bounded array`);
            }
            if (Object.getOwnPropertySymbols(value).length !== 0) {
              throw new TypeError(`${label} must not contain symbol keys`);
            }
            const names = Object.getOwnPropertyNames(value);
            if (
              names.length !== value.length + 1
              || names[names.length - 1] !== "length"
              || names.slice(0, -1).some((name, index) => name !== String(index))
            ) {
              throw new TypeError(`${label} must be dense and undecorated`);
            }
            for (let index = 0; index < value.length; index += 1) {
              const descriptor = Object.getOwnPropertyDescriptor(value, String(index));
              if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
                throw new TypeError(`${label} entries must be enumerable data properties`);
              }
            }
            const lengthDescriptor = Object.getOwnPropertyDescriptor(value, "length");
            if (!lengthDescriptor || !("value" in lengthDescriptor) || lengthDescriptor.enumerable) {
              throw new TypeError(`${label} length must be a non-enumerable data property`);
            }
            return value;
          }
          '''
          if source.count(old) != 1:
            raise SystemExit("descriptor helper block did not match exactly once")
          source_path.write_text(source.replace(old, new))

          test_path = Path("test/synchronization-state-descriptor-admission.test.ts")
          test_path.write_text('''import { expect, test } from "bun:test";\nimport { compileSynchronizationState } from "../src/synchronization-state.ts";\n\nconst base = {\n  schemaVersion: 1 as const,\n  policyVersion: "policy-v1",\n  evaluatedAt: "2026-08-01T00:00:00.000Z",\n  subject: {\n    owner: "github" as const,\n    repository: "teamleaderleo/stensibly",\n    kind: "pull_request" as const,\n    id: "github:pull_request:838",\n    revision: "91b98a95281dd7d9dfcf29e4c218f2ae9c1b1962",\n  },\n  source: null,\n  evidence: null,\n  operation: null,\n  authority: null,\n  coordination: null,\n  declaredConflicts: [],\n};\n\ntest("rejects non-enumerable extra object fields", () => {\n  const input = { ...base } as Record<string, unknown>;\n  Object.defineProperty(input, "hidden", { value: "caller-data" });\n  expect(() => compileSynchronizationState(input)).toThrow("fields were invalid");\n});\n\ntest("rejects non-enumerable array decorations", () => {\n  const conflicts: unknown[] = [];\n  Object.defineProperty(conflicts, "hidden", { value: "caller-data" });\n  expect(() => compileSynchronizationState({\n    ...base,\n    declaredConflicts: conflicts,\n  })).toThrow("dense and undecorated");\n});\n\ntest("retains plain null-prototype records and dense arrays", () => {\n  const input = Object.assign(Object.create(null), base);\n  const projection = compileSynchronizationState(input);\n  expect(projection.state).toBe("unknown");\n});\n''')

          Path(".github/workflows/ember-744-descriptor-repair.yml").unlink()
          PY
      - name: Publish source-only repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/synchronization-state.ts test/synchronization-state-descriptor-admission.test.ts .github/workflows/ember-744-descriptor-repair.yml
          git commit -m "Harden synchronization descriptor admission"
          git push origin HEAD:ember/744-synchronization-state-compiler
