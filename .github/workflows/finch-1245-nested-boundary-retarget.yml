name: Finch 1245 complete observation boundary retarget

on:
  push:
    branches:
      - cedar/1238-observation-hardening-convergence
    paths:
      - .github/workflows/finch-1245-nested-boundary-retarget.yml

permissions:
  contents: write

concurrency:
  group: finch-1245-complete-observation-boundary
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/1238-observation-hardening-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Add nested observation boundary to finalizer
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: cedar/1238-observation-hardening-convergence
          SOURCE_PARENT: b76d0502969f73de469fbb9caf4fd334b832a61b
          FINALIZER_BLOB: 030c7382daacabcef40cd9aa44918326ddda754c
          NESTED_CONTROL: 5e95b2044b390f627649c9f4f427cfc7f6c783df
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-parse HEAD:.github/workflows/cedar-1238-observation-hardening.yml)" = "$FINALIZER_BLOB"
          git fetch --no-tags origin "$NESTED_CONTROL"
          test "$(git rev-parse $NESTED_CONTROL:test/github-repository-observation-nested-boundary.test.ts)" = "c295d653f75922ce54dcad08078c06f0af6fc683"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/cedar-1238-observation-hardening.yml')
          text = path.read_text()

          old_parent = '          PARENT: e08caf4fe7c7149d1a2fc6fb466154cad33382fb\n'
          new_parent = f'          PARENT: {os.environ["EXPECTED_HEAD"]}\n'
          if text.count(old_parent) != 2:
              raise SystemExit(f'finalizer parent anchors moved: {text.count(old_parent)}')
          text = text.replace(old_parent, new_parent)

          old_env = '          ERROR_CONTROL: 6f03a7acd3b88f1b94aa3f2f1ac5598e458a459d\n'
          new_env = old_env + '          NESTED_CONTROL: 5e95b2044b390f627649c9f4f427cfc7f6c783df\n'
          if text.count(old_env) != 2:
              raise SystemExit(f'nested control env anchors moved: {text.count(old_env)}')
          text = text.replace(old_env, new_env)

          old_fetch = '            "$ERROR_CONTROL"\n'
          new_fetch = '            "$ERROR_CONTROL" \\\n            "$NESTED_CONTROL"\n'
          if text.count(old_fetch) != 1:
              raise SystemExit(f'control fetch anchor moved: {text.count(old_fetch)}')
          text = text.replace(old_fetch, new_fetch, 1)

          old_error_check = '          test "$(git rev-parse $ERROR_CONTROL:test/github-repository-observation-convex-error-boundary.test.ts)" = "$(git rev-parse $ERROR_CONTROL:test/github-repository-observation-convex-error-boundary.test.ts)"\n'
          new_error_check = (
              '          test "$(git rev-parse $ERROR_CONTROL:test/github-repository-observation-convex-error-boundary.test.ts)" = "29bb21b998492f8168350d43ee0f727ca20a684b"\n'
              '          test "$(git rev-parse $NESTED_CONTROL:test/github-repository-observation-nested-boundary.test.ts)" = "c295d653f75922ce54dcad08078c06f0af6fc683"\n'
          )
          if text.count(old_error_check) != 1:
              raise SystemExit(f'error-control check anchor moved: {text.count(old_error_check)}')
          text = text.replace(old_error_check, new_error_check, 1)

          old_copy = '''          git show "$ERROR_CONTROL":test/github-repository-observation-convex-error-boundary.test.ts \\
            > test/github-repository-observation-convex-error-boundary.test.ts
'''
          new_copy = old_copy + '''          git show "$NESTED_CONTROL":test/github-repository-observation-nested-boundary.test.ts \\
            > test/github-repository-observation-nested-boundary.test.ts
'''
          if text.count(old_copy) != 1:
              raise SystemExit(f'nested test copy anchor moved: {text.count(old_copy)}')
          text = text.replace(old_copy, new_copy, 1)

          old_nested = '''          new = '''  const observation = snapshotBoundedJson(
    snapshot.observation,
    "GitHub repository observation",
  );
  if (!isRecord(observation)) {
'''
          new_nested = '''          new = '''  const observation = snapshotHostedObservation(snapshot.observation);
  if (!isRecord(observation)) {
'''
          if text.count(old_nested) != 1:
              raise SystemExit(f'nested observation transform anchor moved: {text.count(old_nested)}')
          text = text.replace(old_nested, new_nested, 1)

          helper_end = '''  return snapshot;
}

'''
          helper_add = r'''  return snapshot;
}

function snapshotHostedObservation(value: unknown): Record<string, unknown> {
  const snapshot = snapshotClosedRecord(
    value,
    topLevelKeys,
    "GitHub repository observation",
  );
  snapshot.subject = snapshotClosedRecord(
    snapshot.subject,
    subjectKeys,
    "GitHub repository observation subject",
  );
  snapshot.relationships = snapshotClosedRecord(
    snapshot.relationships,
    relationshipKeys,
    "GitHub repository observation relationships",
  );
  snapshot.contentRevisions = snapshotClosedRecordArray(
    snapshot.contentRevisions,
    contentRevisionKeys,
    "GitHub repository observation content revisions",
  );
  snapshot.facts = snapshotClosedFacts(snapshot.facts, snapshot.eventType);
  return snapshot;
}

function snapshotClosedRecordArray(
  value: unknown,
  keys: readonly string[],
  label: string,
): Record<string, unknown>[] {
  if (!value || typeof value !== "object") {
    throw new RangeError(`${label} must be an ordinary array`);
  }
  let isArray: boolean;
  let prototype: object | null;
  let lengthDescriptor: PropertyDescriptor | undefined;
  try {
    isArray = Array.isArray(value);
    prototype = isArray ? Object.getPrototypeOf(value) : null;
    lengthDescriptor = isArray
      ? Object.getOwnPropertyDescriptor(value, "length")
      : undefined;
  } catch {
    throw new RangeError(`${label} could not be inspected`);
  }
  const length = lengthDescriptor && "value" in lengthDescriptor
    ? lengthDescriptor.value
    : undefined;
  if (
    !isArray
    || prototype !== Array.prototype
    || !lengthDescriptor
    || lengthDescriptor.enumerable
    || typeof length !== "number"
    || !Number.isSafeInteger(length)
    || length < 0
    || length > maximumArrayLength
  ) {
    throw new RangeError(`${label} has an invalid array length`);
  }
  const result: Record<string, unknown>[] = new Array(length);
  for (let index = 0; index < length; index += 1) {
    let descriptor: PropertyDescriptor | undefined;
    try {
      descriptor = Object.getOwnPropertyDescriptor(value, String(index));
    } catch {
      throw new RangeError(`${label} could not be inspected`);
    }
    if (!descriptor || !descriptor.enumerable || !("value" in descriptor)) {
      throw new RangeError(`${label} must contain dense enumerable data slots`);
    }
    result[index] = snapshotClosedRecord(
      descriptor.value,
      keys,
      `${label}[${index}]`,
    );
  }
  return result;
}

function snapshotClosedFacts(
  value: unknown,
  eventType: unknown,
): Record<string, unknown> {
  switch (eventType) {
    case "push":
      return snapshotClosedRecord(
        value,
        ["commitCount", "created", "deleted", "forced"] as const,
        "GitHub push facts",
      );
    case "create":
    case "delete":
      return snapshotClosedRecord(value, [] as const, "GitHub ref lifecycle facts");
    case "pull_request":
      return snapshotClosedRecord(
        value,
        ["draft", "locked", "merged", "state"] as const,
        "GitHub pull request facts",
      );
    case "pull_request_review":
      return snapshotClosedRecord(
        value,
        ["reviewId", "state"] as const,
        "GitHub pull request review facts",
      );
    case "pull_request_review_comment":
      return snapshotClosedRecord(
        value,
        ["inReplyToId", "reviewId"] as const,
        "GitHub pull request review comment facts",
      );
    case "issues":
      return snapshotClosedRecord(
        value,
        ["locked", "state", "stateReason"] as const,
        "GitHub issue facts",
      );
    case "issue_comment":
      return snapshotClosedRecord(
        value,
        ["onPullRequest"] as const,
        "GitHub issue comment facts",
      );
    default:
      return snapshotClosedRecord(
        value,
        [] as const,
        "GitHub repository observation facts",
      );
  }
}

'''
          # The finalizer helper string contains exactly one generated snapshotClosedRecord body.
          helper_pos = text.find(helper_end, text.find("          helper = '''function snapshotClosedRecord("))
          if helper_pos < 0:
              raise SystemExit('generated snapshotClosedRecord terminator moved')
          text = text[:helper_pos] + helper_add + text[helper_pos + len(helper_end):]

          old_add = '''            test/github-repository-observation-convex-secret.test.ts \\
            test/github-repository-observation-convex-error-boundary.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
'''
          new_add = '''            test/github-repository-observation-convex-secret.test.ts \\
            test/github-repository-observation-convex-error-boundary.test.ts \\
            test/github-repository-observation-nested-boundary.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
'''
          if text.count(old_add) != 1:
              raise SystemExit(f'final source fence anchor moved: {text.count(old_add)}')
          text = text.replace(old_add, new_add, 1)

          path.write_text(text)
          PY

          git rm -f \
            .github/workflows/finch-1245-nested-boundary-retarget.yml \
            .github/workflows/cedar-1245-final-lease-bootstrap.yml \
            .github/workflows/cedar-1245-carrier-cleanup-bootstrap.yml \
            .github/workflows/cinder-repository-observation-envelope-admission.yml
          git add .github/workflows/cedar-1238-observation-hardening.yml
          git diff --cached --check
          git config user.name "Finch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind complete repository observation boundary"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
