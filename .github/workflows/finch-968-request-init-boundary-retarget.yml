name: Finch 968 RequestInit boundary retarget

on:
  push:
    branches:
      - juniper/525-private-label-assignee-writes
    paths:
      - .github/workflows/finch-968-request-init-boundary-retarget.yml

permissions:
  contents: write

concurrency:
  group: finch-968-request-init-boundary-retarget
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/525-private-label-assignee-writes
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact bounded RequestInit repair to Cedar replay
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: juniper/525-private-label-assignee-writes
          SOURCE_PARENT: a9758ac02903f202bd17d7976d3d968eddb27ba5
          CEDAR_BLOB: 03034abd67180c4610a461cfc11f99e360f2c848
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-parse HEAD:.github/workflows/cedar-968-current-main-replay.yml)" = "$CEDAR_BLOB"
          test -f .github/workflows/lumen-968-cedar-retarget-bootstrap.yml

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/cedar-968-current-main-replay.yml')
          text = path.read_text()

          old_parent = '          PREVIOUS_CARRIER: a09d4bc1194991067422193ea78e10c448170f2f\n'
          new_parent = f'          PREVIOUS_CARRIER: {os.environ["EXPECTED_HEAD"]}\n'
          if text.count(old_parent) != 1:
              raise SystemExit(f'Cedar parent lease anchor moved: {text.count(old_parent)}')
          text = text.replace(old_parent, new_parent, 1)

          setup_anchor = '      - uses: oven-sh/setup-bun@v2\n'
          repair_step = r"""      - name: Bound standard RequestInit snapshot and absorb exact control
        shell: bash
        env:
          CONTROL_SHA: 4940302a5367bdca51733f29d623042e9f500908
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_SHA"
          test "$(git rev-parse $CONTROL_SHA:test/github-provider-bounded-response-init-key-budget.test.ts)" = "8602e0d214e3b4520989a6ad14741ce312827612"
          git show "$CONTROL_SHA":test/github-provider-bounded-response-init-key-budget.test.ts \
            > test/github-provider-bounded-response-init-key-budget.test.ts

          python3 - <<'PY2'
          from pathlib import Path

          source_path = Path("src/github-provider-bounded-response.ts")
          source = source_path.read_text()
          start = source.index("function snapshotRequestInit(")
          end = source.index("function maximumFacadeTextBytesForRequest(", start)
          replacement = '''const requestInitSnapshotFields = [
  "body",
  "cache",
  "credentials",
  "headers",
  "integrity",
  "keepalive",
  "mode",
  "priority",
  "redirect",
  "referrer",
  "referrerPolicy",
  "window",
  "duplex",
] as const;

function snapshotRequestInit(
  init: RequestInit | undefined,
  signal: AbortSignal,
): RequestInit {
  try {
    const method = init?.method;
    const snapshot: Record<PropertyKey, unknown> = {};
    if (
      init !== undefined
      && init !== null
      && (typeof init === "object" || typeof init === "function")
    ) {
      for (const key of requestInitSnapshotFields) {
        const descriptor = Reflect.getOwnPropertyDescriptor(init, key);
        if (!descriptor?.enumerable) continue;
        const value = "value" in descriptor
          ? descriptor.value
          : Reflect.get(init, key, init);
        Object.defineProperty(snapshot, key, {
          value,
          enumerable: true,
          configurable: true,
          writable: true,
        });
      }
    }
    if (init !== undefined && init !== null) {
      Object.defineProperty(snapshot, "method", {
        value: method,
        enumerable: true,
        configurable: true,
        writable: true,
      });
    }
    Object.defineProperty(snapshot, "signal", {
      value: signal,
      enumerable: true,
      configurable: true,
      writable: true,
    });
    return snapshot as RequestInit;
  } catch {
    throw new GitHubProviderResponseReadError();
  }
}

'''
          source_path.write_text(source[:start] + replacement + source[end:])
          PY2
          git diff --check

"""
          if text.count(setup_anchor) != 1:
              raise SystemExit(f'Cedar setup anchor moved: {text.count(setup_anchor)}')
          text = text.replace(setup_anchor, repair_step + setup_anchor, 1)

          replacements = [
              ('          test "${#changed[@]}" -eq 40\n', '          test "${#changed[@]}" -eq 41\n'),
              ('          test "$(printf \'%s\\n\' "${changed[@]}" | grep -c \'^test/\')" -eq 30\n', '          test "$(printf \'%s\\n\' "${changed[@]}" | grep -c \'^test/\')" -eq 31\n'),
              ("          printf '%s\\n' \"${changed[@]}\" | grep -qx 'test/github-provider-bounded-response-init-single-snapshot.test.ts'\n", "          printf '%s\\n' \"${changed[@]}\" | grep -qx 'test/github-provider-bounded-response-init-single-snapshot.test.ts'\n          printf '%s\\n' \"${changed[@]}\" | grep -qx 'test/github-provider-bounded-response-init-key-budget.test.ts'\n"),
              ('            test/github-provider-bounded-response-init-single-snapshot.test.ts \\\n', '            test/github-provider-bounded-response-init-single-snapshot.test.ts \\\n            test/github-provider-bounded-response-init-key-budget.test.ts \\\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Cedar validation anchor moved: {old!r} count={text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git rm -f \
            .github/workflows/finch-968-request-init-boundary-retarget.yml \
            .github/workflows/lumen-968-cedar-retarget-bootstrap.yml
          git add .github/workflows/cedar-968-current-main-replay.yml
          git diff --cached --check
          git config user.name "Finch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Retarget private issue-write RequestInit boundary"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
