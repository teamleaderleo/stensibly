name: Finch 987 revoked input convergence

on:
  push:
    branches:
      - lumen/971-unicode-symbol-repair
    paths:
      - .github/workflows/finch-987-revoked-input-retarget.yml

permissions:
  contents: write

concurrency:
  group: finch-987-revoked-input-convergence
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/971-unicode-symbol-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Add revoked-input repair to sole Loom replay
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: lumen/971-unicode-symbol-repair
          SOURCE_PARENT: 3dce5c97d4fe46bc275f1b1e045d4e814a903c31
          REVOKED_CONTROL: 2ff1f6b6efd9916d85431c8e920d90a9a6de689c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test -f .github/workflows/loom-987-current-main-replay.yml
          git fetch --no-tags origin "$REVOKED_CONTROL"
          test "$(git rev-parse $REVOKED_CONTROL:test/github-outbound-text-preflight-revoked-input.test.ts)" = "dc17670a68f2505e37026bfaae567039ae47f38e"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/loom-987-current-main-replay.yml')
          text = path.read_text()

          old_stale = '          STALE_CARRIER: ecba873543a49d31aaef64d4be28a09a2ca719e8\n'
          new_stale = f'          STALE_CARRIER: {os.environ["EXPECTED_HEAD"]}\n'
          if text.count(old_stale) != 1:
              raise SystemExit(f'Loom stale-carrier anchor moved: {text.count(old_stale)}')
          text = text.replace(old_stale, new_stale, 1)

          old_file_tail = '''            test/github-outbound-text-preflight-whatwg-url-normalization.test.ts
          )'''
          new_file_tail = '''            test/github-outbound-text-preflight-whatwg-url-normalization.test.ts
            test/github-outbound-text-preflight-revoked-input.test.ts
          )'''
          if text.count(old_file_tail) != 1:
              raise SystemExit(f'packet file-list anchor moved: {text.count(old_file_tail)}')
          text = text.replace(old_file_tail, new_file_tail, 1)

          old_env = '          ROUTE_TEST_SHA: 6f0e1ec0a04bb33fe128745ab7ca718c9f4e03e7\n'
          new_env = old_env + '          REVOKED_TEST_SHA: 2ff1f6b6efd9916d85431c8e920d90a9a6de689c\n'
          if text.count(old_env) != 1:
              raise SystemExit(f'revoked env anchor moved: {text.count(old_env)}')
          text = text.replace(old_env, new_env, 1)

          old_fetch = '''            "${ROUTE_TEST_SHA}" \\
            main'''
          new_fetch = '''            "${ROUTE_TEST_SHA}" \\
            "${REVOKED_TEST_SHA}" \\
            main'''
          if text.count(old_fetch) != 1:
              raise SystemExit(f'revoked fetch anchor moved: {text.count(old_fetch)}')
          text = text.replace(old_fetch, new_fetch, 1)

          old_copy = '''          git show "${ROUTE_TEST_SHA}":test/github-outbound-text-preflight-encoded-invalid-identity.test.ts \\
            > test/github-outbound-text-preflight-encoded-invalid-identity.test.ts
'''
          new_copy = old_copy + '''          git show "${REVOKED_TEST_SHA}":test/github-outbound-text-preflight-revoked-input.test.ts \\
            > test/github-outbound-text-preflight-revoked-input.test.ts
'''
          if text.count(old_copy) != 1:
              raise SystemExit(f'revoked test copy anchor moved: {text.count(old_copy)}')
          text = text.replace(old_copy, new_copy, 1)

          write_anchor = '          wrapper_path.write_text(wrapper)\n'
          helper_patch = r'''          record_start = wrapper.index('function snapshotExactRecord')
          record_end = wrapper.index('function snapshotDenseDataArray', record_start)
          record_repair = '''function snapshotExactRecord<const K extends readonly string[]>(
  value: unknown,
  keys: K,
  label: string,
): DataRecord {
  if (value === null || typeof value !== "object") {
    throw new TypeError(`${label} must be an object`);
  }
  let isArray: boolean;
  let prototype: object | null;
  let descriptors: Record<PropertyKey, PropertyDescriptor>;
  try {
    isArray = Array.isArray(value);
    prototype = isArray ? null : Object.getPrototypeOf(value);
    descriptors = isArray ? {} : Object.getOwnPropertyDescriptors(value);
  } catch {
    throw new TypeError(`${label} could not be inspected`);
  }
  if (isArray) throw new TypeError(`${label} must be an object`);
  if (prototype !== Object.prototype && prototype !== null) {
    throw new TypeError(`${label} must use a plain prototype`);
  }
  const ownKeys = Reflect.ownKeys(descriptors);
  if (ownKeys.some((key) =>
    typeof key !== "string" || !(keys as readonly string[]).includes(key)
  )) {
    throw new TypeError(`${label} contains unknown fields`);
  }
  if (ownKeys.length !== keys.length) {
    throw new TypeError(`${label} is missing required fields`);
  }
  const output = Object.create(null) as DataRecord;
  for (const key of keys) {
    const descriptor = descriptors[key];
    if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
      throw new TypeError(`${label} fields must be enumerable data properties`);
    }
    output[key] = descriptor.value;
  }
  return output;
}

'''
          wrapper = wrapper[:record_start] + record_repair + wrapper[record_end:]

          array_start = wrapper.index('function snapshotDenseDataArray')
          array_end = wrapper.index('function detectNormalizedDirectReferences', array_start)
          array_repair = '''function snapshotDenseDataArray(
  value: unknown,
  label: string,
  maximum: number,
): readonly unknown[] {
  if (value === null || typeof value !== "object") {
    throw new TypeError(`${label} must be an array`);
  }
  let isArray: boolean;
  let prototype: object | null;
  let lengthDescriptor: PropertyDescriptor | undefined;
  try {
    isArray = Array.isArray(value);
    prototype = isArray ? Object.getPrototypeOf(value) : null;
    lengthDescriptor = isArray
      ? Object.getOwnPropertyDescriptor(value, "length")
      : undefined;
  } catch {
    throw new TypeError(`${label} could not be inspected`);
  }
  if (!isArray) throw new TypeError(`${label} must be an array`);
  if (prototype !== Array.prototype) {
    throw new TypeError(`${label} must use Array.prototype`);
  }
  if (
    !lengthDescriptor
    || !("value" in lengthDescriptor)
    || !Number.isSafeInteger(lengthDescriptor.value)
    || lengthDescriptor.value < 0
  ) {
    throw new TypeError(`${label} must contain only dense data entries`);
  }
  const length = lengthDescriptor.value as number;
  if (length > maximum) {
    throw new RangeError(`${label} accepts at most ${maximum} entries`);
  }
  const entries: unknown[] = [];
  for (let index = 0; index < length; index += 1) {
    let descriptor: PropertyDescriptor | undefined;
    try {
      descriptor = Object.getOwnPropertyDescriptor(value, String(index));
    } catch {
      throw new TypeError(`${label} could not be inspected`);
    }
    if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
      throw new TypeError(`${label} must contain only dense data entries`);
    }
    entries.push(descriptor.value);
  }
  return Object.freeze(entries);
}

'''
          wrapper = wrapper[:array_start] + array_repair + wrapper[array_end:]
'''
          if text.count(write_anchor) != 1:
              raise SystemExit(f'wrapper write anchor moved: {text.count(write_anchor)}')
          text = text.replace(write_anchor, helper_patch + write_anchor, 1)

          path.write_text(text)
          PY

          git rm -f \
            .github/workflows/finch-987-revoked-input-retarget.yml \
            .github/workflows/lumen-987-loom-retarget-bootstrap.yml
          git add .github/workflows/loom-987-current-main-replay.yml
          git diff --cached --check
          git config user.name "Finch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind outbound replay revoked input boundary"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
