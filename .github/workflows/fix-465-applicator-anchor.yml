name: Fix PR 465 applicator anchor

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-pr-465-applicator-anchor
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nightjar/453-tool-capability-grants
          fetch-depth: 0
          persist-credentials: false
      - name: Replace indentation-sensitive anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-465-authority-boundary.yml')
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if 'max_uses_anchor =' in line)
          end = next(
              i for i, line in enumerate(lines[start:], start)
              if 'source = source.replace(max_uses_anchor, max_uses_replacement)' in line
          )
          replacement = [
              "          approval_anchor = '    const approval = canonicalApproval('",
              "          approval_insertion = '''    if (highImpactActions.has(request.action) && maxUses !== 1) {",
              "              throw new RangeError(`High-impact action ${request.action} must be limited to one use`);",
              "            }",
              "            const approval = canonicalApproval('''",
              "          if source.count(approval_anchor) != 1:",
              "              raise SystemExit('approval anchor missing or duplicated')",
              "          source = source.replace(approval_anchor, approval_insertion)",
          ]
          path.write_text('\n'.join(lines[:start] + replacement + lines[end + 1:]) + '\n')
          PY
      - name: Commit applicator repair and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill capability repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-465-applicator-anchor.yml
          git add .github/workflows/repair-465-authority-boundary.yml
          git commit -m "chore: make capability repair anchor exact"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:nightjar/453-tool-capability-grants
