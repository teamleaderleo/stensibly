name: Fix MCP gateway diagnostic stages

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-mcp-gateway-diagnostic-stages.yml

permissions:
  contents: write

concurrency:
  group: fix-mcp-gateway-diagnostic-stages
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'nightjar/490-gateway-diagnostic-stages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nightjar/490-gateway-diagnostic-stages
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply exact gateway diagnostic repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mcp-http.ts')
          source = path.read_text()
          origin_marker = '    null,\n    {},\n    "cors_rejection",'
          origin_replacement = '    null,\n    { [MCP_FAILURE_STAGE_HEADER]: "origin_validation" },\n    "cors_rejection",'
          host_marker = '  return jsonRpcError(403, -32001, `Host is not allowed: ${host ?? "missing"}`, null);'
          host_replacement = '''  return jsonRpcError(
            403,
            -32001,
            `Host is not allowed: ${host ?? "missing"}`,
            null,
            { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },
            "request_failure",
          );'''
          if source.count(origin_marker) != 1:
              raise SystemExit('origin denial marker missing or duplicated')
          if source.count(host_marker) != 1:
              raise SystemExit('host denial marker missing or duplicated')
          path.write_text(source.replace(origin_marker, origin_replacement).replace(host_marker, host_replacement))
          PY

          cat > test/mcp-gateway-validation-diagnostics.test.ts <<'EOF'
          import { describe, expect, test } from "bun:test";
          import { MCP_FAILURE_STAGE_HEADER } from "../src/mcp-diagnostics.ts";
          import { createServerApp } from "../src/server-app.ts";
          import { StensiblyStore } from "../src/store.ts";

          const initialize = {
            jsonrpc: "2.0",
            id: 1,
            method: "initialize",
            params: {
              protocolVersion: "2025-06-18",
              capabilities: {},
              clientInfo: { name: "gateway-diagnostic-test", version: "0.0.1" },
            },
          };

          describe("MCP gateway validation diagnostics", () => {
            test("classifies rejected origins as gateway origin validation", async () => {
              const store = new StensiblyStore(":memory:");
              try {
                const app = createServerApp(store, {
                  mcp: { allowedOrigins: ["https://allowed.example"] },
                });
                const response = await app.request("https://api.example/mcp", {
                  method: "POST",
                  headers: {
                    "content-type": "application/json",
                    origin: "https://blocked.example",
                    "x-request-id": "origin-rejected-1",
                  },
                  body: JSON.stringify(initialize),
                });
                expect(response.status).toBe(403);
                expect(response.headers.get(MCP_FAILURE_STAGE_HEADER)).toBe("origin_validation");
                const payload = await response.json() as {
                  error?: { data?: Record<string, unknown> };
                };
                expect(payload.error?.data).toMatchObject({
                  layer: "gateway",
                  stage: "origin_validation",
                  requestId: "origin-rejected-1",
                  retryable: false,
                  reconciliation: "not_required",
                  recommendedAction: "fix_request",
                  method: "initialize",
                });
              } finally {
                store.close();
              }
            });

            test("classifies rejected hosts as gateway host validation", async () => {
              const store = new StensiblyStore(":memory:");
              try {
                const app = createServerApp(store, {
                  mcp: { allowedHosts: ["allowed.example"] },
                });
                const response = await app.request("https://blocked.example/mcp", {
                  method: "POST",
                  headers: {
                    "content-type": "application/json",
                    "x-request-id": "host-rejected-1",
                  },
                  body: JSON.stringify(initialize),
                });
                expect(response.status).toBe(403);
                expect(response.headers.get(MCP_FAILURE_STAGE_HEADER)).toBe("host_validation");
                const payload = await response.json() as {
                  error?: { data?: Record<string, unknown> };
                };
                expect(payload.error?.data).toMatchObject({
                  layer: "gateway",
                  stage: "host_validation",
                  requestId: "host-rejected-1",
                  retryable: false,
                  reconciliation: "not_required",
                  recommendedAction: "fix_request",
                  method: "initialize",
                });
              } finally {
                store.close();
              }
            });
          });
          EOF
      - name: Validate repaired candidate
        run: |
          bun install --frozen-lockfile
          bun test test/mcp-gateway-validation-diagnostics.test.ts test/mcp-diagnostics.test.ts
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
          git diff --check
      - name: Commit validated repair and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Nightjar gateway repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mcp-gateway-diagnostic-stages.yml
          git add src/mcp-http.ts test/mcp-gateway-validation-diagnostics.test.ts
          git commit -m "Fix MCP gateway diagnostic classifications"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:nightjar/490-gateway-diagnostic-stages
