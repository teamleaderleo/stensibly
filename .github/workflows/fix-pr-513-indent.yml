name: Fix PR 513 indentation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-pr-513-indent.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'nightjar/490-gateway-diagnostic-stages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nightjar/490-gateway-diagnostic-stages
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply line-indexed indentation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mcp-http.ts')
          lines = path.read_text().splitlines()
          function_index = lines.index('function validateHost(request: Request, allowedHosts?: string[]): Response | null {')
          block_index = lines.index('  return jsonRpcError(', function_index)
          expected = [
              '  return jsonRpcError(',
              '  403,',
              '  -32001,',
              '  `Host is not allowed: ${host ?? "missing"}`,',
              '  null,',
              '  { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },',
              '  "request_failure",',
              ');',
          ]
          if lines[block_index:block_index + len(expected)] != expected:
              raise SystemExit('unformatted Host denial block changed unexpectedly')
          replacement = [
              '  return jsonRpcError(',
              '    403,',
              '    -32001,',
              '    `Host is not allowed: ${host ?? "missing"}`,',
              '    null,',
              '    { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },',
              '    "request_failure",',
              '  );',
          ]
          lines[block_index:block_index + len(expected)] = replacement
          path.write_text('\n'.join(lines) + '\n')
          PY
          bun install --frozen-lockfile
          bun test test/mcp-gateway-validation-diagnostics.test.ts
          bun run typecheck
          git diff --check
      - name: Commit indentation fix and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Nightjar gateway repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pr-513-indent.yml
          git add src/mcp-http.ts
          git commit -m "Fix MCP Host diagnostic indentation"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:nightjar/490-gateway-diagnostic-stages
