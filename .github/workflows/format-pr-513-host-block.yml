name: Format PR 513 Host diagnostic block

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-pr-513-host-block.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'nightjar/490-gateway-diagnostic-stages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nightjar/490-gateway-diagnostic-stages
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Format exact Host denial block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mcp-http.ts')
          source = path.read_text()
          old = '''  return jsonRpcError(
            403,
            -32001,
            `Host is not allowed: ${host ?? "missing"}`,
            null,
            { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },
            "request_failure",
          );'''.replace('    403', '  403').replace('    -32001', '  -32001').replace('    `Host', '  `Host').replace('    null', '  null').replace('    { [MCP', '  { [MCP').replace('    "request', '  "request').replace('  );', ');')
          new = '''  return jsonRpcError(
            403,
            -32001,
            `Host is not allowed: ${host ?? "missing"}`,
            null,
            { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },
            "request_failure",
          );'''
          if source.count(old) != 1:
              raise SystemExit('unformatted Host denial block missing or duplicated')
          path.write_text(source.replace(old, new))
          PY
          bun install --frozen-lockfile
          bun test test/mcp-gateway-validation-diagnostics.test.ts
          bun run typecheck
          git diff --check
      - name: Commit formatting cleanup and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Nightjar gateway repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-pr-513-host-block.yml
          git add src/mcp-http.ts
          git commit -m "Format MCP Host diagnostic block"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:nightjar/490-gateway-diagnostic-stages
