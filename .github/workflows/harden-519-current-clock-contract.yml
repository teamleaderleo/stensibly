name: Harden PR 519 current row and clock contract

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: harden-pr-519-current-clock-contract
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mercury/453-capability-grant-sqlite
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply database and contract hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/tool-capability-grants-sqlite.ts')
          source = source_path.read_text()
          index = '''    CREATE UNIQUE INDEX IF NOT EXISTS idx_tool_capability_grant_one_current
              ON tool_capability_grants(workspace_id, project_id, grant_id)
              WHERE is_current = 1;
          '''
          marker = '    CREATE TABLE IF NOT EXISTS tool_capability_revocations ('
          if 'idx_tool_capability_grant_one_current' not in source:
              if source.count(marker) != 1:
                  raise SystemExit('revocation table marker missing or duplicated')
              source = source.replace(marker, index + '\n' + marker, 1)

          malformed = '''      if (
                record.fingerprint !== grant.fingerprint
                || record.acceptanceRef !== acceptanceRef
                || record.acceptedBy !== acceptedBy
              ) {'''
          formatted = '''      if (
          record.fingerprint !== grant.fingerprint
          || record.acceptanceRef !== acceptanceRef
          || record.acceptedBy !== acceptedBy
        ) {'''
          if malformed in source:
              source = source.replace(malformed, formatted, 1)
          source_path.write_text(source)

          test_path = Path('test/tool-capability-grants-sqlite.test.ts')
          tests = test_path.read_text()
          test_name = 'enforces one current grant row at the SQLite boundary'
          if test_name not in tests:
              marker = 'describe("SQLite tool capability grant acceptance", () => {\n'
              addition = '''describe("SQLite tool capability grant acceptance", () => {
            test("enforces one current grant row at the SQLite boundary", () => {
              ensureToolCapabilityGrantSchema(store);
              const index = store.db.query<{
                name: string;
                unique: number;
                partial: number;
              }, []>(`PRAGMA index_list('tool_capability_grants')`).all()
                .find((entry) => entry.name === "idx_tool_capability_grant_one_current");
              expect(index).toMatchObject({ unique: 1, partial: 1 });
            });

          '''
              if tests.count(marker) != 1:
                  raise SystemExit('acceptance describe marker missing or duplicated')
              tests = tests.replace(marker, addition, 1)
          test_path.write_text(tests)

          docs_path = Path('docs/tool-capability-grant-persistence.md')
          docs = docs_path.read_text()

          def replace_or_keep(old, new):
              global docs
              if new in docs:
                  return
              if docs.count(old) != 1:
                  raise SystemExit(f'documentation anchor missing or duplicated: {old}')
              docs = docs.replace(old, new, 1)

          replace_or_keep(
              '- have a valid canonical fingerprint;',
              '- rebuild exactly through the canonical grant builder with no extra or altered fields;',
          )
          replace_or_keep(
              '- exact acceptance replay returns the existing record;',
              '- exact acceptance replay requires the original acceptance reference and accepting actor, then returns the existing record;',
          )
          replace_or_keep(
              '- a higher generation transaction clears the previous current flag and installs one new current record.',
              '- a higher generation transaction clears the previous current flag and installs one new current record; a partial unique SQLite index enforces at most one current row per scoped grant.',
          )
          replace_or_keep(
              '- effective UTC time within the grant lifetime;',
              '- server-observed effective UTC time within the grant lifetime;',
          )
          docs = docs.replace('- current UTC time;\n', '', 1)
          replace_or_keep(
              'Before the transaction begins, the typed request builder validates and canonicalizes the request.',
              'Before the transaction begins, the typed request builder validates and canonicalizes the request. Acceptance, revocation, admission, and record times come from an internal server clock dependency and are never request or tool arguments.',
          )
          replace_or_keep(
              '1. checks exact idempotency replay;\n2. loads the current accepted grant and server-owned fingerprint;',
              '1. checks exact idempotency replay before consulting the current clock;\n2. reads the server clock, then loads the current accepted grant and server-owned fingerprint;',
          )
          replace_or_keep(
              '6. atomically increments the authorized permission use once;',
              '6. conditionally increments the authorized permission use only while the stored count remains below the exact grant maximum;',
          )
          docs = docs.replace('- canonical authorization time;\n', '', 1)
          replace_or_keep(
              'Repeating the same idempotency key and attempt returns the original admission record and does not consume another use. Reusing the key with changed time, generation, grant, subject, resource, action, or arguments conflicts before use consumption.',
              'Repeating the same idempotency key and attempt returns the original admission record and does not consume another use, even when replayed later. Reusing the key with a changed generation, grant, subject, resource, action, or arguments conflicts before use consumption.',
          )
          replace_or_keep(
              '- canonical grant fingerprints and duplicated row metadata;',
              '- full canonical grant rehydration, fingerprints, duplicated row metadata, and the one-current-row SQLite invariant;',
          )
          docs_path.write_text(docs)
          PY
      - name: Validate hardening
        run: |
          bun install --frozen-lockfile
          bun test test/tool-capability-grants-sqlite.test.ts
          bun run typecheck
      - name: Commit hardening and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill capability reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-519-current-clock-contract.yml
          git add src/tool-capability-grants-sqlite.ts test/tool-capability-grants-sqlite.test.ts docs/tool-capability-grant-persistence.md
          git commit -m "fix: enforce durable grant storage invariants"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:mercury/453-capability-grant-sqlite
