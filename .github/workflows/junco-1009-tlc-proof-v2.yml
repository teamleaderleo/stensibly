name: Junco 1009 TLC proof v2

on:
  pull_request:
    paths:
      - .github/workflows/junco-1009-tlc-proof-v2.yml

permissions:
  contents: read

concurrency:
  group: junco-1009-tlc-proof-v2
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 552a4ca21d872306de7a8097da80fa43f7984966
      PROOF_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and install TLC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          curl -L --fail --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" \
            | sha1sum --check --strict
          sha256sum /tmp/tla2tools.jar > /tmp/tla2tools.sha256
          java -version 2> /tmp/java-version.txt
          unzip -p /tmp/tla2tools.jar META-INF/MANIFEST.MF > /tmp/tla2tools-manifest.txt

      - name: Parse modules
        shell: bash
        working-directory: formal
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            CancellationSettlementWitnesses.tla \
            CancellationSettlementActiveRejoinWitnesses.tla \
            2>&1 | tee /tmp/sany.log

      - name: Run proof suite
        id: suite
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          expect_success() {
            local cfg="$1" module="$2" out="$3"
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -coverage 1 \
              -config "$cfg" "$module" > "$out" 2>&1
            local status=$?
            set -e
            if [[ $status -ne 0 ]] || ! grep -F \
              "Model checking completed. No error has been found." "$out" >/dev/null
            then
              cat "$out" >&2
              failed=1
            fi
          }

          expect_violation() {
            local cfg="$1" invariant="$2" module="$3" out="$4"
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 \
              -config "$cfg" "$module" > "$out" 2>&1
            local status=$?
            set -e
            if [[ $status -eq 0 ]] || ! grep -F \
              "Invariant ${invariant} is violated" "$out" >/dev/null
            then
              cat "$out" >&2
              failed=1
            fi
          }

          expect_success formal/CancellationSettlement.cfg \
            formal/CancellationSettlement.tla /tmp/safe-core.log
          expect_success formal/CancellationSettlementActive.cfg \
            formal/CancellationSettlementActive.tla /tmp/safe-active.log

          expect_violation formal/CancellationSettlementUnsafeFence.cfg \
            ReplacementRequiresFenceOrSettlement \
            formal/CancellationSettlement.tla /tmp/unsafe-fence.log
          expect_violation formal/CancellationSettlementUnsafe.cfg \
            StaleGenerationCannotPublish \
            formal/CancellationSettlement.tla /tmp/unsafe-stale.log

          pushd formal >/dev/null
          expect_violation CancellationSettlementPreCloseSuccess.cfg \
            PreCloseSuccessFailureWitnessAbsent \
            CancellationSettlementWitnesses.tla \
            /tmp/witness-preclose-success.log
          expect_violation CancellationSettlementPreCloseFailure.cfg \
            PreCloseFailureReconciliationWitnessAbsent \
            CancellationSettlementWitnesses.tla \
            /tmp/witness-preclose-failure.log
          expect_violation CancellationSettlementRepeatedClose.cfg \
            RepeatedCloseWitnessAbsent \
            CancellationSettlementWitnesses.tla \
            /tmp/witness-repeated-close.log
          expect_violation CancellationSettlementCancelledRetry.cfg \
            CancelledRetryWitnessAbsent \
            CancellationSettlementWitnesses.tla \
            /tmp/witness-cancelled-retry.log
          expect_violation CancellationSettlementActiveRejoin.cfg \
            ActiveRejoinWitnessAbsent \
            CancellationSettlementActiveRejoinWitnesses.tla \
            /tmp/witness-active-rejoin.log
          popd >/dev/null

          core="$(grep -E '[0-9]+ states generated, [0-9]+ distinct states found' /tmp/safe-core.log | tail -1 || true)"
          active="$(grep -E '[0-9]+ states generated, [0-9]+ distinct states found' /tmp/safe-active.log | tail -1 || true)"
          echo "core=${core}" >> "$GITHUB_OUTPUT"
          echo "active=${active}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          test "$failed" -eq 0

      - name: Build receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/cancellation-settlement-tlc
          mkdir -p "$out"
          for file in /tmp/*.log /tmp/java-version.txt /tmp/tla2tools-manifest.txt /tmp/tla2tools.sha256; do
            [[ -f "$file" ]] && cp "$file" "$out/"
          done
          cp formal/CancellationSettlement*.tla "$out/"
          cp formal/CancellationSettlement*.cfg "$out/"
          jq -n \
            --arg schemaVersion "stensibly-cancellation-settlement-tlc/2" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceRevision "$SOURCE_SHA" \
            --arg proofRevision "$PROOF_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg core "${{ steps.suite.outputs.core || 'not_run' }}" \
            --arg active "${{ steps.suite.outputs.active || 'not_run' }}" \
            --arg failed "${{ steps.suite.outputs.failed || 'not_run' }}" \
            '{schemaVersion:$schemaVersion,repository:$repository,
              sourceRevision:$sourceRevision,proofRevision:$proofRevision,
              run:{id:$runId,attempt:$runAttempt},
              tlc:{release:"v1.7.4",publishedSha1:"bee4a54f3ee3d4afc347c3240ec2d9e93b075104"},
              coreSafeStateSummary:$core,activeSafeStateSummary:$active,
              suiteFailureCount:$failed,authorizesMerge:false,authorizesMutation:false}' \
            > "$out/receipt.json"
          (cd "$out" && sha256sum -- * > SHA256SUMS)

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cancellation-settlement-tlc-${{ env.SOURCE_SHA }}
          path: artifacts/cancellation-settlement-tlc
          if-no-files-found: error
          retention-days: 14
