name: Junco 1009 TLC proof v3

on:
  pull_request:
    paths:
      - .github/workflows/junco-1009-tlc-proof-v3.yml

permissions:
  contents: read

concurrency:
  group: junco-1009-tlc-proof-v3
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 3ecc731caa1a1c513cdb7991c31d34ae09436ea7
      PROOF_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          curl -L --fail --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" \
            | sha1sum --check --strict
          sha256sum /tmp/tla2tools.jar > /tmp/tla2tools.sha256
          java -version 2> /tmp/java-version.txt
          unzip -p /tmp/tla2tools.jar META-INF/MANIFEST.MF > /tmp/tla2tools-manifest.txt

      - name: Run fail-closed proof suite
        id: proof
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          not_run() {
            local name="$1"
            output "${name}_status" "not_run"
            output "${name}_exit" "null"
            output "${name}_summary" "not_run"
          }

          safe_run() {
            local name="$1" cfg="$2" module="$3" out="$4"
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -coverage 1 \
              -config "$cfg" "$module" > "$out" 2>&1
            local exit_code=$?
            set -e
            local summary
            summary="$(grep -E '[0-9]+ states generated, [0-9]+ distinct states found' "$out" | tail -1 || true)"
            local status="passed"
            if [[ $exit_code -ne 0 ]] \
              || ! grep -F "Model checking completed. No error has been found." "$out" >/dev/null \
              || [[ -z "$summary" ]]
            then
              status="failed"
              failed=$((failed + 1))
              cat "$out" >&2
            fi
            output "${name}_status" "$status"
            output "${name}_exit" "$exit_code"
            output "${name}_summary" "${summary:-not_run}"
          }

          violation_run() {
            local name="$1" cfg="$2" invariant="$3" module="$4" out="$5"
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 \
              -config "$cfg" "$module" > "$out" 2>&1
            local exit_code=$?
            set -e
            local status="passed"
            if [[ $exit_code -eq 0 ]] \
              || ! grep -F "Invariant ${invariant} is violated" "$out" >/dev/null
            then
              status="failed"
              failed=$((failed + 1))
              cat "$out" >&2
            fi
            output "${name}_status" "$status"
            output "${name}_exit" "$exit_code"
            output "${name}_summary" "$invariant"
          }

          set +e
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/CancellationSettlementWitnesses.tla \
            formal/CancellationSettlementActiveRejoinWitnesses.tla \
            > /tmp/sany.log 2>&1
          parse_exit=$?
          set -e
          if [[ $parse_exit -eq 0 ]]; then
            parse_status="passed"
          else
            parse_status="failed"
            failed=$((failed + 1))
            cat /tmp/sany.log >&2
          fi
          output parse_status "$parse_status"
          output parse_exit "$parse_exit"
          output parse_summary "SANY exact module parse"

          if [[ "$parse_status" = "passed" ]]; then
            safe_run core_safe \
              formal/CancellationSettlement.cfg \
              formal/CancellationSettlement.tla /tmp/safe-core.log
            safe_run active_safe \
              formal/CancellationSettlementActive.cfg \
              formal/CancellationSettlementActive.tla /tmp/safe-active.log

            violation_run unsafe_fence \
              formal/CancellationSettlementUnsafeFence.cfg \
              ReplacementRequiresFenceOrSettlement \
              formal/CancellationSettlement.tla /tmp/unsafe-fence.log
            violation_run unsafe_stale \
              formal/CancellationSettlementUnsafe.cfg \
              StaleGenerationCannotPublish \
              formal/CancellationSettlement.tla /tmp/unsafe-stale.log

            pushd formal >/dev/null
            violation_run witness_preclose_success \
              CancellationSettlementPreCloseSuccess.cfg \
              PreCloseSuccessFailureWitnessAbsent \
              CancellationSettlementWitnesses.tla \
              /tmp/witness-preclose-success.log
            violation_run witness_preclose_failure \
              CancellationSettlementPreCloseFailure.cfg \
              PreCloseFailureReconciliationWitnessAbsent \
              CancellationSettlementWitnesses.tla \
              /tmp/witness-preclose-failure.log
            violation_run witness_repeated_close \
              CancellationSettlementRepeatedClose.cfg \
              RepeatedCloseWitnessAbsent \
              CancellationSettlementWitnesses.tla \
              /tmp/witness-repeated-close.log
            violation_run witness_cancelled_retry \
              CancellationSettlementCancelledRetry.cfg \
              CancelledRetryWitnessAbsent \
              CancellationSettlementWitnesses.tla \
              /tmp/witness-cancelled-retry.log
            violation_run witness_active_rejoin \
              CancellationSettlementActiveRejoin.cfg \
              ActiveRejoinWitnessAbsent \
              CancellationSettlementActiveRejoinWitnesses.tla \
              /tmp/witness-active-rejoin-terminal.log
            popd >/dev/null
          else
            for name in \
              core_safe active_safe unsafe_fence unsafe_stale \
              witness_preclose_success witness_preclose_failure \
              witness_repeated_close witness_cancelled_retry \
              witness_active_rejoin
            do
              not_run "$name"
            done
          fi

          output failure_count "$failed"
          if [[ $failed -eq 0 ]]; then
            output suite_status "passed"
          else
            output suite_status "failed"
          fi
          test "$failed" -eq 0

      - name: Build exact receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/cancellation-settlement-tlc
          mkdir -p "$out"
          for file in /tmp/*.log /tmp/java-version.txt /tmp/tla2tools-manifest.txt /tmp/tla2tools.sha256; do
            [[ -f "$file" ]] && cp "$file" "$out/"
          done
          cp formal/CancellationSettlement*.tla "$out/"
          cp formal/CancellationSettlement*.cfg "$out/"

          failure_count='${{ steps.proof.outputs.failure_count }}'
          if [[ "$failure_count" =~ ^[0-9]+$ ]]; then
            failure_json="$failure_count"
          else
            failure_json="null"
          fi

          jq -n \
            --arg schemaVersion "stensibly-cancellation-settlement-tlc/3" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceRevision "$SOURCE_SHA" \
            --arg proofRevision "$PROOF_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg suiteStatus "${{ steps.proof.outputs.suite_status || 'not_run' }}" \
            --arg parseStatus "${{ steps.proof.outputs.parse_status || 'not_run' }}" \
            --arg parseExit "${{ steps.proof.outputs.parse_exit || 'null' }}" \
            --arg coreStatus "${{ steps.proof.outputs.core_safe_status || 'not_run' }}" \
            --arg coreExit "${{ steps.proof.outputs.core_safe_exit || 'null' }}" \
            --arg coreSummary "${{ steps.proof.outputs.core_safe_summary || 'not_run' }}" \
            --arg activeStatus "${{ steps.proof.outputs.active_safe_status || 'not_run' }}" \
            --arg activeExit "${{ steps.proof.outputs.active_safe_exit || 'null' }}" \
            --arg activeSummary "${{ steps.proof.outputs.active_safe_summary || 'not_run' }}" \
            --arg unsafeFenceStatus "${{ steps.proof.outputs.unsafe_fence_status || 'not_run' }}" \
            --arg unsafeFenceExit "${{ steps.proof.outputs.unsafe_fence_exit || 'null' }}" \
            --arg unsafeStaleStatus "${{ steps.proof.outputs.unsafe_stale_status || 'not_run' }}" \
            --arg unsafeStaleExit "${{ steps.proof.outputs.unsafe_stale_exit || 'null' }}" \
            --arg precloseSuccessStatus "${{ steps.proof.outputs.witness_preclose_success_status || 'not_run' }}" \
            --arg precloseSuccessExit "${{ steps.proof.outputs.witness_preclose_success_exit || 'null' }}" \
            --arg precloseFailureStatus "${{ steps.proof.outputs.witness_preclose_failure_status || 'not_run' }}" \
            --arg precloseFailureExit "${{ steps.proof.outputs.witness_preclose_failure_exit || 'null' }}" \
            --arg repeatedCloseStatus "${{ steps.proof.outputs.witness_repeated_close_status || 'not_run' }}" \
            --arg repeatedCloseExit "${{ steps.proof.outputs.witness_repeated_close_exit || 'null' }}" \
            --arg cancelledRetryStatus "${{ steps.proof.outputs.witness_cancelled_retry_status || 'not_run' }}" \
            --arg cancelledRetryExit "${{ steps.proof.outputs.witness_cancelled_retry_exit || 'null' }}" \
            --arg activeRejoinStatus "${{ steps.proof.outputs.witness_active_rejoin_status || 'not_run' }}" \
            --arg activeRejoinExit "${{ steps.proof.outputs.witness_active_rejoin_exit || 'null' }}" \
            --argjson suiteFailureCount "$failure_json" \
            'def exitValue($v): if ($v | test("^[0-9]+$")) then ($v | tonumber) else null end;
             {schemaVersion:$schemaVersion,repository:$repository,
              sourceRevision:$sourceRevision,proofRevision:$proofRevision,
              run:{id:$runId,attempt:$runAttempt},
              tlc:{release:"v1.7.4",publishedSha1:"bee4a54f3ee3d4afc347c3240ec2d9e93b075104"},
              suiteStatus:$suiteStatus,
              suitePassed:($suiteStatus == "passed"),
              suiteFailureCount:$suiteFailureCount,
              obligations:{
                parse:{status:$parseStatus,exitCode:exitValue($parseExit),expected:"SANY exact module parse"},
                coreSafe:{status:$coreStatus,exitCode:exitValue($coreExit),stateSummary:$coreSummary,expected:"no invariant violation"},
                activeSafe:{status:$activeStatus,exitCode:exitValue($activeExit),stateSummary:$activeSummary,expected:"no invariant violation"},
                unsafeFence:{status:$unsafeFenceStatus,exitCode:exitValue($unsafeFenceExit),expected:"ReplacementRequiresFenceOrSettlement violation"},
                unsafeStale:{status:$unsafeStaleStatus,exitCode:exitValue($unsafeStaleExit),expected:"StaleGenerationCannotPublish violation"},
                preCloseSuccess:{status:$precloseSuccessStatus,exitCode:exitValue($precloseSuccessExit),expected:"PreCloseSuccessFailureWitnessAbsent violation"},
                preCloseFailure:{status:$precloseFailureStatus,exitCode:exitValue($precloseFailureExit),expected:"PreCloseFailureReconciliationWitnessAbsent violation"},
                repeatedClose:{status:$repeatedCloseStatus,exitCode:exitValue($repeatedCloseExit),expected:"RepeatedCloseWitnessAbsent violation"},
                cancelledRetry:{status:$cancelledRetryStatus,exitCode:exitValue($cancelledRetryExit),expected:"CancelledRetryWitnessAbsent violation"},
                activeRejoin:{status:$activeRejoinStatus,exitCode:exitValue($activeRejoinExit),expected:"ActiveRejoinWitnessAbsent violation"}},
              checks:{
                cancelledWaiterHasRetryCapacity:($cancelledRetryStatus == "passed"),
                activeRejoinReachesTerminal:($activeRejoinStatus == "passed")},
              authorizesMerge:false,authorizesMutation:false}' \
            > "$out/receipt.json"
          (cd "$out" && sha256sum -- * > SHA256SUMS)

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cancellation-settlement-tlc-${{ env.SOURCE_SHA }}
          path: artifacts/cancellation-settlement-tlc
          if-no-files-found: error
          retention-days: 14
