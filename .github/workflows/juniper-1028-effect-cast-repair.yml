name: Juniper 1028 effect cast repair

on:
  pull_request:
    paths:
      - .github/workflows/juniper-1028-effect-cast-repair.yml

permissions:
  contents: write

concurrency:
  group: juniper-1028-effect-cast-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: juniper/1028-clean-effect-admission
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Align focused Bun fetch test doubles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
            Path("test/github-rest-repository-write-adapter.test.ts"),
            Path("test/github-rest-repository-write-effect-admission.test.ts"),
            Path("test/github-rest-repository-write-effect-sha256.test.ts"),
            Path("test/github-rest-repository-write-effect-url-spelling.test.ts"),
          ]
          repaired = 0
          for path in paths:
            text = path.read_text()
            count = text.count("as typeof fetch")
            if count:
              path.write_text(text.replace(
                "as typeof fetch",
                "as unknown as typeof fetch",
              ))
              repaired += count
          if repaired < 1:
            raise SystemExit("no stale fetch test-double casts found")
          print(f"repaired {repaired} fetch test-double casts")
          PY
          git diff --check

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused exact-head gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-effect-admission.test.ts \
            test/github-rest-repository-write-effect-sha256.test.ts \
            test/github-rest-repository-write-effect-url-spelling.test.ts

      - name: Publish source and tests only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/juniper/1028-clean-effect-admission:refs/remotes/origin/juniper/1028-clean-effect-admission
          test "$(git rev-parse refs/remotes/origin/juniper/1028-clean-effect-admission)" = "$EXPECTED_HEAD"
          rm .github/workflows/juniper-1028-effect-cast-repair.yml
          git config user.name "Juniper"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-rest-repository-write-adapter.ts \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-effect-admission.test.ts \
            test/github-rest-repository-write-effect-sha256.test.ts \
            test/github-rest-repository-write-effect-url-spelling.test.ts \
            .github/workflows/juniper-1028-effect-cast-repair.yml
          git diff --cached --check
          git commit -m "Finalize exact repository write effects"
          git push --force-with-lease=refs/heads/juniper/1028-clean-effect-admission:$EXPECTED_HEAD \
            origin HEAD:refs/heads/juniper/1028-clean-effect-admission
