name: Juniper 1163 dense-array type repair

on:
  pull_request:
    paths:
      - .github/workflows/juniper-1163-array-type-repair.yml

permissions:
  contents: write

concurrency:
  group: juniper-1163-array-type-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1020-atomic-git-publication
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact diagnostic carrier head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "e8a33455d758a416b73c12cbce106a13fa6eb21e"

      - name: Narrow dense-array length descriptor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-rest-repository-write-atomic-publication.ts")
          text = path.read_text()
          before = (
            "  const lengthDescriptor = descriptors.length;\n"
            "  if (\n"
            "    !lengthDescriptor\n"
            "    || !(\"value\" in lengthDescriptor)\n"
            "    || !Number.isSafeInteger(lengthDescriptor.value)\n"
            "    || lengthDescriptor.value < 0\n"
            "    || lengthDescriptor.value > maximumLength\n"
            "  ) {\n"
            "    throw invalidResponse(`${label} were malformed`);\n"
            "  }\n"
            "  const length = lengthDescriptor.value as number;"
          )
          after = (
            "  const lengthDescriptor = Object.getOwnPropertyDescriptor(\n"
            "    value,\n"
            "    \"length\",\n"
            "  );\n"
            "  const lengthValue = lengthDescriptor && \"value\" in lengthDescriptor\n"
            "    ? lengthDescriptor.value\n"
            "    : undefined;\n"
            "  if (\n"
            "    typeof lengthValue !== \"number\"\n"
            "    || !Number.isSafeInteger(lengthValue)\n"
            "    || lengthValue < 0\n"
            "    || lengthValue > maximumLength\n"
            "  ) {\n"
            "    throw invalidResponse(`${label} were malformed`);\n"
            "  }\n"
            "  const length = lengthValue;"
          )
          if text.count(before) != 1:
            raise SystemExit("dense-array length source shape changed")
          path.write_text(text.replace(before, after, 1))
          PY
          rm .github/workflows/juniper-1163-array-type-repair.yml
          git add \
            src/github-rest-repository-write-atomic-publication.ts \
            .github/workflows/juniper-1163-array-type-repair.yml
          git diff --cached --check

      - uses: oven-sh/setup-bun@v2

      - name: Install committed dependencies
        run: bun install --frozen-lockfile

      - name: Capture strict TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck > typecheck-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat typecheck-output.txt
          exit 0

      - name: Upload strict TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atomic-typecheck-${{ github.event.pull_request.head.sha }}
          path: typecheck-output.txt
          if-no-files-found: error

      - name: Enforce strict TypeScript
        run: test "${{ steps.typecheck.outputs.status }}" = "0"

      - name: Run atomic publication controls
        run: bun test test/github-rest-repository-write-atomic-publication.test.ts

      - name: Run atomic mode controls
        run: bun test test/github-rest-repository-write-atomic-mode-preservation.test.ts

      - name: Run adapter controls
        run: bun test test/github-rest-repository-write-adapter.test.ts

      - name: Publish workflow-free repaired source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "Juniper"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Narrow atomic tree array length"
          git fetch origin refs/heads/juniper/1020-atomic-git-publication:refs/remotes/origin/juniper/1020-atomic-git-publication
          test "$(git rev-parse refs/remotes/origin/juniper/1020-atomic-git-publication)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/juniper/1020-atomic-git-publication:$EXPECTED_HEAD \
            origin HEAD:refs/heads/juniper/1020-atomic-git-publication
