name: Juniper 1163 post-effect service

on:
  pull_request:
    paths:
      - .github/workflows/juniper-1163-post-effect-service.yml

permissions:
  contents: write

concurrency:
  group: juniper-1163-post-effect-service
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-post-effect-service
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact evidence head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "163414af169af197554ce7885b36345589e046c0"

      - name: Apply verified post-effect service handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-repository-write-provider-service.ts")
          text = path.read_text()
          import_anchor = '''import { sha256, stableJson } from "./canonical-json.js";
          import {
            prepareRepositoryWrite,'''
          import_replacement = '''import { sha256, stableJson } from "./canonical-json.js";
          import {
            GitHubRepositoryWritePostEffectError,
          } from "./github-repository-write-post-effect-error.js";
          import {
            prepareRepositoryWrite,'''
          if text.count(import_anchor) != 1:
            raise SystemExit("post-effect import anchor changed")
          text = text.replace(import_anchor, import_replacement, 1)

          catch_anchor = '''    } catch {
            const pending = await this.#hold(
              receiptWithDispatch(receipt),
              "repository_write_provider_outcome_ambiguous",
            );
            throw new GitHubRepositoryWritePendingReconciliationError(pending);
          }

          let verified: VerifiedRepositoryWrite;'''
          catch_replacement = '''    } catch (error) {
            if (error instanceof GitHubRepositoryWritePostEffectError) {
              let postEffectVerified: VerifiedRepositoryWrite | null = null;
              try {
                postEffectVerified = await verifyRepositoryWriteResult({
                  prepared: secondPrepared,
                  providerResult: error.result,
                  refs: this.#adapter,
                  now: this.#now,
                });
              } catch {
                // Invalid or substituted carried evidence remains unverified ambiguity.
              }
              if (postEffectVerified) {
                const dispatched = receiptWithDispatch(receipt);
                let pending = receiptWithVerified(
                  dispatched,
                  postEffectVerified,
                  error.code,
                );
                try {
                  pending = await this.#store
                    .holdVerifiedRepositoryWriteForReconciliation({
                      receipt: dispatched,
                      verified: postEffectVerified,
                      code: error.code,
                      heldAt: exactTimestamp(
                        this.#now(),
                        "Repository write post-effect reconciliation time",
                      ),
                    });
                } catch {
                  // The thrown pending error retains exact admitted evidence.
                }
                throw new GitHubRepositoryWritePendingReconciliationError(pending);
              }
            }
            const pending = await this.#hold(
              receiptWithDispatch(receipt),
              "repository_write_provider_outcome_ambiguous",
            );
            throw new GitHubRepositoryWritePendingReconciliationError(pending);
          }

          let verified: VerifiedRepositoryWrite;'''
          if text.count(catch_anchor) != 1:
            raise SystemExit("post-effect catch anchor changed")
          path.write_text(text.replace(catch_anchor, catch_replacement, 1))
          PY
          rm .github/workflows/juniper-1163-post-effect-service.yml
          git add \
            src/github-repository-write-admission.ts \
            src/github-repository-write-post-effect-error.ts \
            src/github-repository-write-provider-service.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts \
            .github/workflows/juniper-1163-post-effect-service.yml
          git diff --cached --check

      - uses: oven-sh/setup-bun@v2

      - name: Validate post-effect lifecycle packet
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-repository-write-provider-service.test.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-repository-write-full-ref-admission.test.ts \
            test/github-repository-write-repository-segment-admission.test.ts \
            test/repository-write-fence.test.ts

      - name: Publish workflow-free service packet
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "Juniper"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Retain verified repository post-effect evidence"
          git fetch origin refs/heads/juniper/1163-post-effect-service:refs/remotes/origin/juniper/1163-post-effect-service
          test "$(git rev-parse refs/remotes/origin/juniper/1163-post-effect-service)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/juniper/1163-post-effect-service:$EXPECTED_HEAD \
            origin HEAD:refs/heads/juniper/1163-post-effect-service
