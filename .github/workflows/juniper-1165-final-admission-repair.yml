name: Juniper 1165 final admission repair

on:
  pull_request:
    paths:
      - .github/workflows/juniper-1165-final-admission-repair.yml

permissions:
  contents: write

concurrency:
  group: juniper-1165-final-admission-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-post-effect-service
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact repaired carrier head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "f5300c5bd2c0afb44f770d21662ed001970c36c6"

      - name: Apply verified post-effect service handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-repository-write-provider-service.ts")
          text = path.read_text()
          import_before = (
            'import { sha256, stableJson } from "./canonical-json.js";\n'
            'import {\n'
            '  prepareRepositoryWrite,'
          )
          import_after = (
            'import { sha256, stableJson } from "./canonical-json.js";\n'
            'import {\n'
            '  GitHubRepositoryWritePostEffectError,\n'
            '} from "./github-repository-write-post-effect-error.js";\n'
            'import {\n'
            '  prepareRepositoryWrite,'
          )
          if text.count(import_before) != 1:
            raise SystemExit("post-effect import source shape changed")
          text = text.replace(import_before, import_after, 1)

          catch_before = (
            '    } catch {\n'
            '      const pending = await this.#hold(\n'
            '        receiptWithDispatch(receipt),\n'
            '        "repository_write_provider_outcome_ambiguous",\n'
            '      );\n'
            '      throw new GitHubRepositoryWritePendingReconciliationError(pending);\n'
            '    }\n\n'
            '    let verified: VerifiedRepositoryWrite;'
          )
          catch_after = (
            '    } catch (error) {\n'
            '      if (error instanceof GitHubRepositoryWritePostEffectError) {\n'
            '        let postEffectVerified: VerifiedRepositoryWrite | null = null;\n'
            '        try {\n'
            '          postEffectVerified = await verifyRepositoryWriteResult({\n'
            '            prepared: secondPrepared,\n'
            '            providerResult: error.result,\n'
            '            refs: this.#adapter,\n'
            '            now: this.#now,\n'
            '          });\n'
            '        } catch {\n'
            '          // Invalid or substituted carried evidence remains unverified ambiguity.\n'
            '        }\n'
            '        if (postEffectVerified) {\n'
            '          const dispatched = receiptWithDispatch(receipt);\n'
            '          let pending = receiptWithVerified(\n'
            '            dispatched,\n'
            '            postEffectVerified,\n'
            '            error.code,\n'
            '          );\n'
            '          try {\n'
            '            pending = await this.#store\n'
            '              .holdVerifiedRepositoryWriteForReconciliation({\n'
            '                receipt: dispatched,\n'
            '                verified: postEffectVerified,\n'
            '                code: error.code,\n'
            '                heldAt: exactTimestamp(\n'
            '                  this.#now(),\n'
            '                  "Repository write post-effect reconciliation time",\n'
            '                ),\n'
            '              });\n'
            '          } catch {\n'
            '            // The thrown pending error retains exact admitted evidence.\n'
            '          }\n'
            '          throw new GitHubRepositoryWritePendingReconciliationError(pending);\n'
            '        }\n'
            '      }\n'
            '      const pending = await this.#hold(\n'
            '        receiptWithDispatch(receipt),\n'
            '        "repository_write_provider_outcome_ambiguous",\n'
            '      );\n'
            '      throw new GitHubRepositoryWritePendingReconciliationError(pending);\n'
            '    }\n\n'
            '    let verified: VerifiedRepositoryWrite;'
          )
          if text.count(catch_before) != 1:
            raise SystemExit("post-effect catch source shape changed")
          path.write_text(text.replace(catch_before, catch_after, 1))
          PY
          rm \
            .github/workflows/juniper-1163-post-effect-service.yml \
            .github/workflows/juniper-1165-final-admission-repair.yml
          git add \
            src/github-repository-write-admission.ts \
            src/github-repository-write-post-effect-error.ts \
            src/github-repository-write-provider-service.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts \
            .github/workflows/juniper-1163-post-effect-service.yml \
            .github/workflows/juniper-1165-final-admission-repair.yml
          git diff --cached --check

      - uses: oven-sh/setup-bun@v2

      - name: Validate final admission and service lifecycle
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-repository-write-provider-service.test.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts \
            test/github-repository-write-repository-segment-admission.test.ts \
            test/github-repository-write-full-ref-admission.test.ts \
            test/repository-write-fence.test.ts

      - name: Publish workflow-free service packet
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "Juniper"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Retain verified repository post-effect evidence"
          git fetch origin refs/heads/juniper/1163-post-effect-service:refs/remotes/origin/juniper/1163-post-effect-service
          test "$(git rev-parse refs/remotes/origin/juniper/1163-post-effect-service)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/juniper/1163-post-effect-service:$EXPECTED_HEAD \
            origin HEAD:refs/heads/juniper/1163-post-effect-service
