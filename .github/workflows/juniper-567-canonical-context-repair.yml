name: juniper-567-canonical-context-repair

on:
  push:
    branches:
      - juniper/564-convex-github-project-context
    paths:
      - .github/workflows/juniper-567-canonical-context-repair.yml

permissions:
  contents: write

concurrency:
  group: juniper-567-canonical-context-repair
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: juniper/564-convex-github-project-context
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce canonical nested context on write and read
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          convex = Path('convex/githubProjectContexts.ts')
          text = convex.read_text(encoding='utf-8')

          old = 'const bodyRevisionKeys = ["byteLength", "present", "sha256"] as const;'
          new = '''const bodyRevisionKeys = ["byteLength", "present", "sha256"] as const;
          const milestoneKeys = ["number", "title"] as const;
          const relationshipKeys = ["kind", "target"] as const;
          const instructionSetKeys = [
            "id",
            "projectAttachmentId",
            "projectAttachmentSnapshotSha256",
            "sha256",
            "sources",
            "version",
          ] as const;
          const instructionSourceKeys = ["contentSha256", "path", "revision"] as const;
          const relationshipKinds = ["parent", "sub_issue", "blocked_by", "blocks", "related"] as const;'''
          if text.count(old) != 1:
              raise SystemExit('Convex key constant anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''  if (current.sourceRevision === snapshot.sourceRevision) {
              if (current.contentSha256 !== snapshot.contentSha256) {
                throw new Error(
                  `GitHub issue source revision ${snapshot.sourceRevision} was reused with altered content`,
                );
              }
              if (current.instructionSetId !== instructionSetId) {
                return { outcome: "instruction_rebound", isCurrent: true };
              }
              return observedAt < current.observedAt
                ? { outcome: "stale", isCurrent: false }
                : { outcome: "synchronization_updated", isCurrent: true };
            }'''
          new = '''  if (current.sourceRevision === snapshot.sourceRevision) {
              if (current.contentSha256 !== snapshot.contentSha256) {
                throw new Error(
                  `GitHub issue source revision ${snapshot.sourceRevision} was reused with altered content`,
                );
              }
              if (observedAt < current.observedAt) {
                return { outcome: "stale", isCurrent: false };
              }
              if (current.instructionSetId !== instructionSetId) {
                return { outcome: "instruction_rebound", isCurrent: true };
              }
              return { outcome: "synchronization_updated", isCurrent: true };
            }'''
          if text.count(old) != 1:
              raise SystemExit('Convex classification anchor mismatch')
          text = text.replace(old, new, 1)

