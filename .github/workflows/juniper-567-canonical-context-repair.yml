                || !relationshipKinds.includes(entry.kind as typeof relationshipKinds[number])
              ) {
                throw new RangeError("GitHub issue relationship kind is invalid");
              }
              if (!isRecord(entry.target) || !hasExactKeys(entry.target, referenceKeys)) {
                throw new RangeError("GitHub issue relationship target is invalid");
              }
              const targetExternalId = canonicalExternalId(entry.target.externalId);
              const targetOwner = boundedGitHubOwner(entry.target.owner);
              const targetRepository = boundedGitHubRepository(entry.target.repository);
              const targetNumber = positiveInteger(entry.target.number, "GitHub issue number");
              const repositoryFullName = `${targetOwner}/${targetRepository}`;
              if (
                entry.target.provider !== "github"
                || entry.target.host !== "github.com"
                || entry.target.owner !== targetOwner
                || entry.target.repository !== targetRepository
                || entry.target.repositoryFullName !== repositoryFullName
                || targetExternalId !== `github:${repositoryFullName}#${targetNumber}`
                || entry.target.canonicalUrl !== `https://github.com/${repositoryFullName}/issues/${targetNumber}`
              ) {
                throw new RangeError("GitHub issue relationship target is not canonical");
              }
              if (targetExternalId === sourceExternalId) {
                throw new RangeError("GitHub issue relationship must not target the source issue");
              }
              return `${entry.kind}:${targetExternalId}`;
            });
            const sorted = [...keys].sort((left, right) => left < right ? -1 : left > right ? 1 : 0);
            if (new Set(keys).size !== keys.length || JSON.stringify(keys) !== JSON.stringify(sorted)) {
              throw new RangeError("GitHub issue relationships must be unique and in canonical order");
            }
          }

