name: juniper-569-bounded-refresh-v2

on:
  push:
    branches:
      - juniper/541-hosted-dashboard-refresh
    paths:
      - .github/workflows/juniper-569-bounded-refresh-v2.yml

permissions:
  contents: write

concurrency:
  group: juniper-569-bounded-refresh-repair
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: juniper/541-hosted-dashboard-refresh
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded refresh-state repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          Path('site/dashboard-refresh-policy.js').write_text(dedent(r'''
          export const DASHBOARD_REFRESH_DELAYS_MS = [15000, 45000, 90000, 180000];
          export const DASHBOARD_VISIBILITY_WAKE_MS = 1000;

          const REFRESH_STATE_KEY = 'stensiblyRefreshState';
          const LEGACY_REFRESH_KEYS = ['stensiblyRefreshLevel', 'stensiblyItemsFingerprint'];
          const FNV_OFFSET = 14695981039346656037n;
          const FNV_PRIME = 1099511628211n;
          const SECOND_OFFSET = 7809847782465536322n;
          const SECOND_PRIME = 14029467366897019727n;

          function hashEntries(entries) {
            let first = FNV_OFFSET;
            let second = SECOND_OFFSET;
            for (const entry of entries) {
              for (let index = 0; index < entry.length; index += 1) {
                const code = BigInt(entry.charCodeAt(index));
                first = BigInt.asUintN(64, (first ^ code) * FNV_PRIME);
                second = BigInt.asUintN(64, (second ^ (code + 1n)) * SECOND_PRIME);
              }
              first = BigInt.asUintN(64, (first ^ 31n) * FNV_PRIME);
              second = BigInt.asUintN(64, (second ^ 257n) * SECOND_PRIME);
            }
            return first.toString(16).padStart(16, '0')
              + second.toString(16).padStart(16, '0');
          }

          export function dashboardItemsFingerprint(items) {
            if (!Array.isArray(items)) throw new TypeError('Dashboard items must be an array.');
            const entries = items
              .map((item) => JSON.stringify([item.id, item.version, item.status, item.updatedAt]))
              .sort();
            return `v1:${items.length}:${hashEntries(entries)}`;
          }

          export function normalizeDashboardRefreshLevel(value) {
            const parsed = Number(value ?? 0);
            if (!Number.isFinite(parsed) || !Number.isInteger(parsed)) return 0;
            return Math.min(DASHBOARD_REFRESH_DELAYS_MS.length - 1, Math.max(0, parsed));
          }

          export function nextDashboardRefreshLevel({
            previousFingerprint,
            nextFingerprint,
            currentLevel,
            interactive = false,
            initial = false,
          }) {
            const level = normalizeDashboardRefreshLevel(currentLevel);
            if (interactive || initial || !previousFingerprint || previousFingerprint !== nextFingerprint) {
              return 0;
            }
            return Math.min(level + 1, DASHBOARD_REFRESH_DELAYS_MS.length - 1);
          }

          export function readDashboardRefreshState(storage) {
            try {
              const raw = storage?.getItem(REFRESH_STATE_KEY);
              if (!raw) return { level: 0, fingerprint: '' };
              const parsed = JSON.parse(raw);
              if (
                !parsed
                || typeof parsed !== 'object'
                || Array.isArray(parsed)
                || Object.keys(parsed).sort().join(',') !== 'fingerprint,level,version'
                || parsed.version !== 1
                || typeof parsed.fingerprint !== 'string'
                || !/^v1:\d{1,10}:[0-9a-f]{32}$/.test(parsed.fingerprint)
              ) {
                return { level: 0, fingerprint: '' };
              }
              return {
                level: normalizeDashboardRefreshLevel(parsed.level),
                fingerprint: parsed.fingerprint,
              };
            } catch {
              return { level: 0, fingerprint: '' };
            }
          }

          export function persistDashboardRefreshState(storage, state) {
            try {
              if (!storage) return false;
              storage.setItem(REFRESH_STATE_KEY, JSON.stringify({
                version: 1,
                level: normalizeDashboardRefreshLevel(state.level),
                fingerprint: state.fingerprint,
              }));
              for (const key of LEGACY_REFRESH_KEYS) storage.removeItem(key);
              return true;
            } catch {
              return false;
            }
          }

          export function clearDashboardRefreshState(storage) {
            let cleared = true;
            for (const key of [REFRESH_STATE_KEY, ...LEGACY_REFRESH_KEYS]) {
              try {
                storage?.removeItem(key);
              } catch {
                cleared = false;
              }
            }
            return cleared;
          }

          export function acceptDashboardRefreshResult({
            storage,
            previousFingerprint,
            currentLevel,
            nextItems,
            interactive = false,
            initial = false,
          }) {
            const fingerprint = dashboardItemsFingerprint(nextItems);
            const level = nextDashboardRefreshLevel({
              previousFingerprint,
              nextFingerprint: fingerprint,
              currentLevel,
              interactive,
              initial,
            });
            const state = { items: nextItems, level, fingerprint };
            return { ...state, persisted: persistDashboardRefreshState(storage, state) };
          }

          export function dashboardRefreshDelay(level) {
            return DASHBOARD_REFRESH_DELAYS_MS[normalizeDashboardRefreshLevel(level)];
          }

          export function dashboardRefreshMode({ hidden, level, waking = false }) {
            if (hidden) return 'auto paused · hidden';
            if (waking) return 'auto · waking';
            return `auto · ${Math.round(dashboardRefreshDelay(level) / 1000)}s`;
          }
          ''').lstrip(), encoding='utf-8')

          Path('site/dashboard-refresh-policy.d.ts').write_text(dedent('''
          export const DASHBOARD_REFRESH_DELAYS_MS: number[];
          export const DASHBOARD_VISIBILITY_WAKE_MS: number;

          export interface DashboardRefreshItem {
            id: string;
            version: number;
            status: string;
            updatedAt: string;
          }

          export interface DashboardRefreshStorage {
            getItem(key: string): string | null;
            setItem(key: string, value: string): void;
            removeItem(key: string): void;
          }

          export interface DashboardRefreshState<T extends DashboardRefreshItem = DashboardRefreshItem> {
            items: T[];
            level: number;
            fingerprint: string;
          }

          export function dashboardItemsFingerprint(items: DashboardRefreshItem[]): string;
          export function normalizeDashboardRefreshLevel(value: unknown): number;
          export function nextDashboardRefreshLevel(input: {
            previousFingerprint: string;
            nextFingerprint: string;
            currentLevel: unknown;
            interactive?: boolean;
            initial?: boolean;
          }): number;
          export function readDashboardRefreshState(
            storage: DashboardRefreshStorage | null | undefined,
          ): Pick<DashboardRefreshState, "level" | "fingerprint">;
          export function persistDashboardRefreshState(
            storage: DashboardRefreshStorage | null | undefined,
            state: Pick<DashboardRefreshState, "level" | "fingerprint">,
          ): boolean;
          export function clearDashboardRefreshState(
            storage: DashboardRefreshStorage | null | undefined,
          ): boolean;
          export function acceptDashboardRefreshResult<T extends DashboardRefreshItem>(input: {
            storage: DashboardRefreshStorage | null | undefined;
            previousFingerprint: string;
            currentLevel: unknown;
            nextItems: T[];
            interactive?: boolean;
            initial?: boolean;
          }): DashboardRefreshState<T> & { persisted: boolean };
          export function dashboardRefreshDelay(level: unknown): number;
          export function dashboardRefreshMode(input: {
            hidden: boolean;
            level: unknown;
            waking?: boolean;
          }): string;
          ''').lstrip(), encoding='utf-8')

          app = Path('site/app.js')
          text = app.read_text(encoding='utf-8')

          def block(value: str) -> str:
              return dedent(value).strip('\n')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              old = block(old)
              new = block(new)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor matched {count} times')
              text = text.replace(old, new, 1)

          replace_once('''
          import {
            DASHBOARD_VISIBILITY_WAKE_MS,
            dashboardItemsFingerprint,
            dashboardRefreshDelay,
            dashboardRefreshMode,
            nextDashboardRefreshLevel,
            normalizeDashboardRefreshLevel,
          } from './dashboard-refresh-policy.js';
          ''', '''
          import {
            DASHBOARD_VISIBILITY_WAKE_MS,
            acceptDashboardRefreshResult,
            clearDashboardRefreshState,
            dashboardRefreshDelay,
            dashboardRefreshMode,
            readDashboardRefreshState,
          } from './dashboard-refresh-policy.js';
          ''', 'policy imports')
          replace_once('''
          let items = [];
          let refreshTimer;
          let refreshLevel = normalizeDashboardRefreshLevel(sessionStorage.stensiblyRefreshLevel);
          let refreshFingerprint = sessionStorage.stensiblyItemsFingerprint || '';
          ''', '''
          const browserSessionStorage = optionalSessionStorage();
          const storedRefreshState = readDashboardRefreshState(browserSessionStorage);
          let items = [];
          let refreshTimer;
          let refreshLevel = storedRefreshState.level;
          let refreshFingerprint = storedRefreshState.fingerprint;
          ''', 'refresh state')
          replace_once("let token = sessionStorage.stensiblyToken || '';", "let token = readSessionValue('stensiblyToken');", 'token read')
          replace_once("sessionStorage.stensiblyToken = token;", "writeSessionValue('stensiblyToken', token);", 'token write')
          replace_once('''
          function acceptRefreshResult(nextItems, { interactive = false, initial = false } = {}) {
            const nextFingerprint = dashboardItemsFingerprint(nextItems);
            refreshLevel = nextDashboardRefreshLevel({
              previousFingerprint: refreshFingerprint,
              nextFingerprint,
              currentLevel: refreshLevel,
              interactive,
              initial,
            });
            refreshFingerprint = nextFingerprint;
            items = nextItems;
            sessionStorage.stensiblyRefreshLevel = String(refreshLevel);
            sessionStorage.stensiblyItemsFingerprint = refreshFingerprint;
          }
          ''', '''
          function acceptRefreshResult(nextItems, { interactive = false, initial = false } = {}) {
            const nextState = acceptDashboardRefreshResult({
              storage: browserSessionStorage,
              previousFingerprint: refreshFingerprint,
              currentLevel: refreshLevel,
              nextItems,
              interactive,
              initial,
            });
            items = nextState.items;
            refreshLevel = nextState.level;
            refreshFingerprint = nextState.fingerprint;
          }
          ''', 'accepted result')
          replace_once('''
          function resetRefreshPolicy() {
            refreshLevel = 0;
            refreshFingerprint = '';
            lastSuccessfulUpdateLabel = '';
            sessionStorage.removeItem('stensiblyRefreshLevel');
            sessionStorage.removeItem('stensiblyItemsFingerprint');
          }
          ''', '''
          function resetRefreshPolicy() {
            refreshLevel = 0;
            refreshFingerprint = '';
            lastSuccessfulUpdateLabel = '';
            clearDashboardRefreshState(browserSessionStorage);
          }
          ''', 'policy reset')
          replace_once("sessionStorage.removeItem('stensiblyToken');", "removeSessionValue('stensiblyToken');", 'token removal')
          replace_once('''
          function clearStoredToken() {
            token = '';
            removeSessionValue('stensiblyToken');
            form.elements.token.value = '';
          }

          function beginRequest() {
          ''', '''
          function clearStoredToken() {
            token = '';
            removeSessionValue('stensiblyToken');
            form.elements.token.value = '';
          }

          function optionalSessionStorage() {
            try {
              return window.sessionStorage;
            } catch {
              return null;
            }
          }

          function readSessionValue(key) {
            try {
              return browserSessionStorage?.getItem(key) || '';
            } catch {
              return '';
            }
          }

          function writeSessionValue(key, value) {
            try {
              browserSessionStorage?.setItem(key, value);
            } catch {
              // Session persistence is optional; the accepted in-memory result remains authoritative.
            }
          }

          function removeSessionValue(key) {
            try {
              browserSessionStorage?.removeItem(key);
            } catch {
              // Disconnect and reset remain available when storage access is blocked.
            }
          }

          function beginRequest() {
          ''', 'session helpers')
          if 'sessionStorage.' in text:
              raise SystemExit('direct sessionStorage property access remains')
          app.write_text(text, encoding='utf-8')
          PY

          cat > test/dashboard-refresh-policy.test.ts <<'EOF'
          import { describe, expect, test } from "bun:test";
          import {
            DASHBOARD_REFRESH_DELAYS_MS,
            DASHBOARD_VISIBILITY_WAKE_MS,
            acceptDashboardRefreshResult,
            clearDashboardRefreshState,
            dashboardItemsFingerprint,
            dashboardRefreshDelay,
            dashboardRefreshMode,
            nextDashboardRefreshLevel,
            normalizeDashboardRefreshLevel,
            readDashboardRefreshState,
          } from "../site/dashboard-refresh-policy.js";

          const first = { id: "item-1", version: 1, status: "ready", updatedAt: "2026-07-29T12:00:00.000Z" };
          const second = { id: "item-2", version: 3, status: "active", updatedAt: "2026-07-29T12:05:00.000Z" };

          describe("hosted dashboard refresh policy", () => {
            test("uses a bounded 15/45/90/180 second delay ladder", () => {
              expect(DASHBOARD_REFRESH_DELAYS_MS).toEqual([15000, 45000, 90000, 180000]);
              expect(DASHBOARD_VISIBILITY_WAKE_MS).toBe(1000);
              expect([-4, 0, 1, 2, 3, 99, "NaN"].map(dashboardRefreshDelay)).toEqual([
                15000, 15000, 45000, 90000, 180000, 180000, 15000,
              ]);
            });

            test("normalizes malformed persisted levels before delay lookup", () => {
              expect(normalizeDashboardRefreshLevel(undefined)).toBe(0);
              expect(normalizeDashboardRefreshLevel("NaN")).toBe(0);
              expect(normalizeDashboardRefreshLevel("2junk")).toBe(0);
              expect(normalizeDashboardRefreshLevel("1.5")).toBe(0);
              expect(normalizeDashboardRefreshLevel("-1")).toBe(0);
              expect(normalizeDashboardRefreshLevel("2")).toBe(2);
              expect(normalizeDashboardRefreshLevel("999999")).toBe(3);
            });

            test("uses a fixed-size order-independent content-minimised digest", () => {
              expect(dashboardItemsFingerprint([second, first])).toBe(dashboardItemsFingerprint([first, second]));
              expect(dashboardItemsFingerprint([{ ...first, title: "ignored" }, second])).toBe(dashboardItemsFingerprint([first, second]));
              expect(dashboardItemsFingerprint([{ ...first, version: 2 }, second])).not.toBe(dashboardItemsFingerprint([first, second]));
              expect(dashboardItemsFingerprint([{ ...first, status: "blocked" }, second])).not.toBe(dashboardItemsFingerprint([first, second]));
              const large = Array.from({ length: 20_000 }, (_, index) => ({
                id: `item-${index}-${"x".repeat(500)}`,
                version: index,
                status: index % 2 ? "active" : "ready",
                updatedAt: "2026-07-29T12:00:00.000Z",
              }));
              const digest = dashboardItemsFingerprint(large);
              expect(digest).toMatch(/^v1:20000:[0-9a-f]{32}$/);
              expect(digest.length).toBeLessThan(64);
            });

            test("backs off unchanged reads and resets after change or interaction", () => {
              const fingerprint = dashboardItemsFingerprint([first, second]);
              expect(nextDashboardRefreshLevel({ previousFingerprint: fingerprint, nextFingerprint: fingerprint, currentLevel: 0 })).toBe(1);
              expect(nextDashboardRefreshLevel({ previousFingerprint: fingerprint, nextFingerprint: fingerprint, currentLevel: 3 })).toBe(3);
              expect(nextDashboardRefreshLevel({ previousFingerprint: fingerprint, nextFingerprint: dashboardItemsFingerprint([{ ...first, version: 2 }, second]), currentLevel: 3 })).toBe(0);
              expect(nextDashboardRefreshLevel({ previousFingerprint: fingerprint, nextFingerprint: fingerprint, currentLevel: 3, interactive: true })).toBe(0);
            });

            test("publishes one complete in-memory state when storage rejects the write", () => {
              const throwingStorage = {
                getItem() { throw new Error("blocked"); },
                setItem() { throw new Error("quota"); },
                removeItem() { throw new Error("blocked"); },
              };
              expect(readDashboardRefreshState(throwingStorage)).toEqual({ level: 0, fingerprint: "" });
              const result = acceptDashboardRefreshResult({
                storage: throwingStorage,
                previousFingerprint: dashboardItemsFingerprint([first]),
                currentLevel: 3,
                nextItems: [first, second],
              });
              expect(result).toMatchObject({
                items: [first, second],
                level: 0,
                fingerprint: dashboardItemsFingerprint([first, second]),
                persisted: false,
              });
              expect(clearDashboardRefreshState(throwingStorage)).toBe(false);
            });

            test("persists one bounded atomic refresh record", () => {
              const values = new Map<string, string>();
              const storage = {
                getItem(key: string) { return values.get(key) ?? null; },
                setItem(key: string, value: string) { values.set(key, value); },
                removeItem(key: string) { values.delete(key); },
              };
              const result = acceptDashboardRefreshResult({ storage, previousFingerprint: "", currentLevel: 3, nextItems: [first, second], initial: true });
              expect(result.persisted).toBe(true);
              expect([...values.keys()]).toEqual(["stensiblyRefreshState"]);
              expect(values.get("stensiblyRefreshState")?.length).toBeLessThan(128);
              expect(readDashboardRefreshState(storage)).toEqual({ level: 0, fingerprint: result.fingerprint });
            });

            test("exposes hidden, waking, and active refresh modes", () => {
              expect(dashboardRefreshMode({ hidden: true, level: 3 })).toBe("auto paused · hidden");
              expect(dashboardRefreshMode({ hidden: false, level: 2, waking: true })).toBe("auto · waking");
              expect(dashboardRefreshMode({ hidden: false, level: 2 })).toBe("auto · 90s");
            });
          });
          EOF

          cat > test/dashboard-hosted-refresh-contract.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, test } from "bun:test";

          const app = readFileSync(new URL("../site/app.js", import.meta.url), "utf8");
          const policy = readFileSync(new URL("../site/dashboard-refresh-policy.js", import.meta.url), "utf8");

          describe("hosted dashboard refresh integration", () => {
            test("uses the bounded policy instead of a fixed interval", () => {
              expect(app).toContain("from './dashboard-refresh-policy.js'");
              expect(app).toContain("acceptDashboardRefreshResult({");
              expect(app).toContain("dashboardRefreshDelay(refreshLevel)");
              expect(app).not.toContain("const REFRESH_INTERVAL_MS");
              expect(app).not.toContain("setInterval(");
            });

            test("stops hidden polling and wakes after visibility returns", () => {
              expect(app).toContain("document.addEventListener('visibilitychange', handleVisibilityChange)");
              expect(app).toContain("if (!interactive && !initial && document.hidden)");
              expect(app).toContain("DASHBOARD_VISIBILITY_WAKE_MS");
              expect(policy).toContain("auto paused · hidden");
              expect(policy).toContain("auto · waking");
            });

            test("keeps manual and post-mutation refreshes interactive", () => {
              expect(app).toContain("refreshCurrent({ interactive: true })");
              expect(app).toContain("await refreshCurrent({ interactive: true });");
            });

            test("publishes accepted results independently of optional session persistence", () => {
              expect(app).toContain("const browserSessionStorage = optionalSessionStorage()");
              expect(app).toContain("items = nextState.items;");
              expect(app).toContain("refreshLevel = nextState.level;");
              expect(app).toContain("refreshFingerprint = nextState.fingerprint;");
              expect(app).toContain("clearDashboardRefreshState(browserSessionStorage)");
              expect(app).not.toContain("sessionStorage.");
              expect(policy).toContain("stensiblyRefreshState");
              expect(policy).not.toContain("item.title");
              expect(policy).not.toContain("item.summary");
              expect(policy).not.toContain("item.nextAction");
            });
          });
          EOF

      - name: Run focused and repository gates
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/dashboard-refresh-policy.test.ts test/dashboard-hosted-refresh-contract.test.ts
          bun test
          bun run test:convex
          bun run worker:check

      - name: Publish source-only repair
        run: |
          rm .github/workflows/juniper-569-bounded-refresh-v2.yml
          git diff --check
          git config user.name juniper-stensibly
          git config user.email juniper-stensibly@users.noreply.github.com
          git add site test .github
          git commit -m 'fix: bound hosted refresh persistence'
          git push origin HEAD:juniper/541-hosted-dashboard-refresh
