name: juniper-569-rich-item-followup

on:
  push:
    branches:
      - juniper/541-hosted-dashboard-refresh
    paths:
      - site/dashboard-refresh-policy.js
      - site/dashboard-refresh-policy.d.ts
      - test/dashboard-refresh-policy.test.ts

permissions:
  contents: write

concurrency:
  group: juniper-569-bounded-refresh-repair
  cancel-in-progress: false

jobs:
  patch-test-publish:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out published refresh repair
        uses: actions/checkout@v4
        with:
          ref: juniper/541-hosted-dashboard-refresh
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve rich item projection typing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/dashboard-refresh-policy.d.ts')
          text = path.read_text(encoding='utf-8')
          old = 'export function dashboardItemsFingerprint(items: DashboardRefreshItem[]): string;'
          new = 'export function dashboardItemsFingerprint<T extends DashboardRefreshItem>(items: T[]): string;'
          if text.count(old) != 1:
              raise SystemExit(f'fingerprint declaration anchor matched {text.count(old)} times')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused and repository gates
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/dashboard-refresh-policy.test.ts test/dashboard-hosted-refresh-contract.test.ts
          bun run test
          bun run test:convex
          bun run worker:check
          bun run test:runtime-parity

      - name: Publish final source-only repair
        run: |
          rm .github/workflows/juniper-569-rich-item-followup.yml
          git diff --check
          git config user.name juniper-stensibly
          git config user.email juniper-stensibly@users.noreply.github.com
          git add site test .github
          git commit -m 'fix: preserve rich dashboard item typing'
          git push origin HEAD:juniper/541-hosted-dashboard-refresh
