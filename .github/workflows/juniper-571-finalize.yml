name: juniper-571-delivery-desk-finalize

on:
  push:
    branches:
      - juniper/571-delivery-desk
    paths:
      - .github/workflows/juniper-571-finalize.yml

permissions:
  contents: write

concurrency:
  group: juniper-571-delivery-desk-finalize
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: juniper/571-delivery-desk
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase exact candidate onto current main
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git config user.name juniper-stensibly
          git config user.email juniper-stensibly@users.noreply.github.com
          git rebase origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26"

      - name: Tighten semantic ordering and review evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).strip('\n')

          def with_indent(value: str, width: int) -> str:
              prefix = ' ' * width
              return '\n'.join(prefix + line if line else line for line in value.splitlines())

          def replace_indented(document: str, old: str, new: str, label: str) -> str:
              old = block(old)
              new = block(new)
              matches = []
              for width in range(0, 25):
                  candidate = with_indent(old, width)
                  count = document.count(candidate)
                  matches.extend([(candidate, width)] * count)
              if len(matches) != 1:
                  raise SystemExit(f'{label} matched {len(matches)} times')
              candidate, width = matches[0]
              return document.replace(candidate, with_indent(new, width), 1)

          source = Path('src/delivery-desk.ts')
          text = source.read_text(encoding='utf-8')
          text = replace_indented(text, '''
          const suppliedEntries = record.entries as unknown[];
          if (JSON.stringify(projection.entries) !== JSON.stringify(suppliedEntries)) {
            throw new Error("Delivery Desk entries must be in canonical finish-line order");
          }
          ''', '''
          const suppliedEntries = (record.entries as unknown[]).map(parseDeliveryDeskEntry);
          const suppliedOrder = suppliedEntries.map((entry) => deliveryDeskIssueKey(entry.issue));
          const canonicalOrder = projection.entries.map((entry) => deliveryDeskIssueKey(entry.issue));
          if (JSON.stringify(suppliedOrder) !== JSON.stringify(canonicalOrder)) {
            throw new Error("Delivery Desk entries must be in canonical finish-line order");
          }
          ''', 'projection order boundary')

          text = replace_indented(text, '''
          const evidence = input.map((item) => {
            const record = requireRecord(item, "Delivery Desk evidence");
            rejectUnknownKeys(
              record,
              ["kind", "reference", "observedAt", "fingerprint"],
              "Delivery Desk evidence",
            );
            return {
              kind: closedValue(record.kind, DELIVERY_EVIDENCE_KINDS, "Delivery Desk evidence kind"),
              reference: boundedText(record.reference, "Delivery Desk evidence reference", 240),
              observedAt: canonicalTimestamp(record.observedAt, "Delivery Desk evidence time"),
              fingerprint: sha256(record.fingerprint, "Delivery Desk evidence fingerprint"),
            };
          }).sort(compareEvidence);
          const fingerprints = evidence.map((item) => item.fingerprint);
          if (new Set(fingerprints).size !== fingerprints.length) {
            throw new Error("Delivery Desk evidence fingerprints must be unique");
          }
          if (JSON.stringify(evidence) !== JSON.stringify(input)) {
            throw new Error("Delivery Desk evidence must be in canonical order");
          }
          return evidence;
          ''', '''
          const suppliedEvidence = input.map((item) => {
            const record = requireRecord(item, "Delivery Desk evidence");
            rejectUnknownKeys(
              record,
              ["kind", "reference", "observedAt", "fingerprint"],
              "Delivery Desk evidence",
            );
            return {
              kind: closedValue(record.kind, DELIVERY_EVIDENCE_KINDS, "Delivery Desk evidence kind"),
              reference: boundedText(record.reference, "Delivery Desk evidence reference", 240),
              observedAt: canonicalTimestamp(record.observedAt, "Delivery Desk evidence time"),
              fingerprint: sha256(record.fingerprint, "Delivery Desk evidence fingerprint"),
            };
          });
          const fingerprints = suppliedEvidence.map((item) => item.fingerprint);
          if (new Set(fingerprints).size !== fingerprints.length) {
            throw new Error("Delivery Desk evidence fingerprints must be unique");
          }
          const evidence = [...suppliedEvidence].sort(compareEvidence);
          if (
            JSON.stringify(suppliedEvidence.map((item) => item.fingerprint))
            !== JSON.stringify(evidence.map((item) => item.fingerprint))
          ) {
            throw new Error("Delivery Desk evidence must be in canonical order");
          }
          return evidence;
          ''', 'evidence semantic order boundary')

          text = replace_indented(text, '''
          function validateStateInvariants(entry: DeliveryDeskEntry): void {
            if (entry.selectedState === "land-now") {
          ''', '''
          function validateStateInvariants(entry: DeliveryDeskEntry): void {
            if (
              entry.reviewFingerprint !== null
              && !entry.evidence.some((evidence) =>
                evidence.kind === "review"
                && evidence.fingerprint === entry.reviewFingerprint
              )
            ) {
              throw new Error("Delivery Desk review fingerprint must match retained review evidence");
            }
            if (entry.selectedState === "land-now") {
          ''', 'review evidence invariant')
          source.write_text(text, encoding='utf-8')

          tests = Path('test/delivery-desk.test.ts')
          test_text = tests.read_text(encoding='utf-8')
          test_text = replace_indented(test_text, '''
              fingerprint: hash(issueNumber),
            }],
            disposition: "accept",
          ''', '''
              fingerprint: hash(issueNumber + 2),
            }],
            disposition: "accept",
          ''', 'test helper review evidence')

          old = '      evidenceFingerprints: [hash(13)],'
          new = '      evidenceFingerprints: [hash(1)],'
          if test_text.count(old) != 1:
              raise SystemExit('stale evidence anchor mismatch')
          test_text = test_text.replace(old, new, 1)

          test_text = replace_indented(test_text, '''
          expect(() => parseDeliveryDeskEntry(entry(571, {
            selectedState: "final-gate",
          ''', '''
          expect(() => parseDeliveryDeskEntry(entry(571, {
            reviewFingerprint: hash(15),
          }))).toThrow("review fingerprint must match retained review evidence");

          expect(() => parseDeliveryDeskEntry(entry(571, {
            selectedState: "final-gate",
          ''', 'review evidence test')

          test_text = replace_indented(test_text, '''
          const projection = createDeliveryDeskProjection({
            observedAt,
            entries: [entry(571), entry(572)],
          });
          expect(() => parseDeliveryDeskProjection({
          ''', '''
          const projection = createDeliveryDeskProjection({
            observedAt,
            entries: [entry(571), entry(572)],
          });
          const reordered = JSON.parse(JSON.stringify(projection));
          reordered.entries[0] = Object.fromEntries(
            Object.entries(reordered.entries[0]).reverse(),
          );
          reordered.entries[0].evidence[0] = Object.fromEntries(
            Object.entries(reordered.entries[0].evidence[0]).reverse(),
          );
          expect(parseDeliveryDeskProjection(reordered)).toEqual(projection);
          expect(() => parseDeliveryDeskProjection({
          ''', 'reordered object-key control')
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Run focused and repository gates
        run: |
          set -euxo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/delivery-desk.test.ts test/delivery-desk-current.test.ts
          bun run test
          bun run test:convex
          bun run worker:check
          bun run test:runtime-parity

      - name: Publish source-only current-main candidate
        run: |
          set -euxo pipefail
          rm .github/workflows/juniper-571-finalize.yml
          git diff --check
          git add src test docs .github
          git commit -m 'feat: add finish-line Delivery Desk projection'
          git push --force-with-lease=refs/heads/juniper/571-delivery-desk:$GITHUB_SHA \
            origin HEAD:refs/heads/juniper/571-delivery-desk
