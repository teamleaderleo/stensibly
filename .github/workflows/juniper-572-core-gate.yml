name: juniper-572-execution-certainty-core

on:
  push:
    branches:
      - juniper/572-execution-certainty-core
    paths:
      - .github/workflows/juniper-572-core-gate.yml

permissions:
  contents: write

concurrency:
  group: juniper-572-execution-certainty-core
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: juniper/572-execution-certainty-core
          fetch-depth: 0
          persist-credentials: true

      - name: Tighten creation and receipt parsing boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/execution-certainty.ts')
          text = path.read_text(encoding='utf-8')

          def block(value: str) -> str:
              return dedent(value).strip('\n')

          old = '  const expected = createExecutionCertaintyReceipt(record);'
          new = block('''
          const expected = createExecutionCertaintyReceipt({
            workspace: record.workspace,
            project: record.project,
            executionPath: record.executionPath,
            operation: record.operation,
            operationKind: record.operationKind,
            operationRef: record.operationRef,
            requestFingerprint: record.requestFingerprint,
            authorityFingerprint: record.authorityFingerprint,
            runGeneration: record.runGeneration,
            observedAt: record.observedAt,
            evidence: record.evidence,
          });
          ''')
          if text.count(old) != 1:
              raise SystemExit('receipt reconstruction anchor mismatch')
          text = text.replace(old, new, 1)

          old = block('''
          const allowed = [
            "schemaVersion",
            "workspace",
            "project",
            "executionPath",
            "operation",
            "operationKind",
            "operationRef",
            "requestFingerprint",
            "authorityFingerprint",
            "runGeneration",
            "observedAt",
            "evidence",
            "certainty",
            "receiptFingerprint",
          ];
          ''')
          new = block('''
          const allowed = [
            "workspace",
            "project",
            "executionPath",
            "operation",
            "operationKind",
            "operationRef",
            "requestFingerprint",
            "authorityFingerprint",
            "runGeneration",
            "observedAt",
            "evidence",
          ];
          ''')
          if text.count(old) != 1:
              raise SystemExit('creation allowed-key anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('test/execution-certainty.test.ts')
          test_text = tests.read_text(encoding='utf-8')
          anchor = block('''
              expect(() => createExecutionCertaintyReceipt({ ...input(), arguments: { secret: true } }))
                .toThrow("unknown field arguments");
          ''')
          replacement = anchor + '\n' + block('''
              expect(() => createExecutionCertaintyReceipt({
                ...input(),
                certainty: { state: "not_dispatched" },
              })).toThrow("unknown field certainty");
          ''')
          if test_text.count(anchor) != 1:
              raise SystemExit('receipt-only field test anchor mismatch')
          tests.write_text(test_text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Run focused and repository gates
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/execution-certainty.test.ts
          bun test
          bun run test:convex
          bun run worker:check

      - name: Publish source-only candidate
        run: |
          rm .github/workflows/juniper-572-core-gate.yml
          git diff --check
          git config user.name juniper-stensibly
          git config user.email juniper-stensibly@users.noreply.github.com
          git add src test docs .github
          git commit -m 'feat: add execution certainty receipt core'
          git push origin HEAD:juniper/572-execution-certainty-core
