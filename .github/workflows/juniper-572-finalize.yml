name: juniper-572-execution-certainty-finalize

on:
  push:
    branches:
      - juniper/572-execution-certainty-core
    paths:
      - .github/workflows/juniper-572-finalize.yml

permissions:
  contents: write

concurrency:
  group: juniper-572-execution-certainty-finalize
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: juniper/572-execution-certainty-core
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase exact candidate onto current main
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git config user.name juniper-stensibly
          git config user.email juniper-stensibly@users.noreply.github.com
          git rebase origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26"

      - name: Apply exact parser and typing repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('src/execution-certainty.ts')
          text = source.read_text(encoding='utf-8')

          def block(value: str) -> str:
              return dedent(value).strip('\n')

          replacements = [
              (
                  '  const expected = createExecutionCertaintyReceipt(record);',
                  block('''
                  const expected = createExecutionCertaintyReceipt({
                    workspace: record.workspace,
                    project: record.project,
                    executionPath: record.executionPath,
                    operation: record.operation,
                    operationKind: record.operationKind,
                    operationRef: record.operationRef,
                    requestFingerprint: record.requestFingerprint,
                    authorityFingerprint: record.authorityFingerprint,
                    runGeneration: record.runGeneration,
                    observedAt: record.observedAt,
                    evidence: record.evidence,
                  });
                  '''),
              ),
              (
                  block('''
                  const allowed = [
                    "schemaVersion",
                    "workspace",
                    "project",
                    "executionPath",
                    "operation",
                    "operationKind",
                    "operationRef",
                    "requestFingerprint",
                    "authorityFingerprint",
                    "runGeneration",
                    "observedAt",
                    "evidence",
                    "certainty",
                    "receiptFingerprint",
                  ];
                  '''),
                  block('''
                  const allowed = [
                    "workspace",
                    "project",
                    "executionPath",
                    "operation",
                    "operationKind",
                    "operationRef",
                    "requestFingerprint",
                    "authorityFingerprint",
                    "runGeneration",
                    "observedAt",
                    "evidence",
                  ];
                  '''),
              ),
              (
                  '  const status = resolution.outcome === "still_unknown" ? "required" : "resolved";',
                  block('''
                  const status: "required" | "resolved" = resolution.outcome === "still_unknown"
                    ? "required"
                    : "resolved";
                  '''),
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'execution certainty source anchor matched {count} times: {old[:100]!r}')
              text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('test/execution-certainty.test.ts')
          test_text = tests.read_text(encoding='utf-8')
          unknown_anchor = block('''
            expect(() => createExecutionCertaintyReceipt({ ...input(), arguments: { secret: true } }))
              .toThrow("unknown field arguments");
          ''')
          unknown_replacement = unknown_anchor + '\n' + block('''
            expect(() => createExecutionCertaintyReceipt({
              ...input(),
              certainty: { state: "not_dispatched" },
            })).toThrow("unknown field certainty");
          ''')
          if test_text.count(unknown_anchor) != 1:
              raise SystemExit('receipt-only field test anchor mismatch')
          test_text = test_text.replace(unknown_anchor, unknown_replacement, 1)

          parity_old = '    expect(certainties).toEqual([certainties[0], certainties[0], certainties[0], certainties[0]]);'
          parity_new = block('''
            const expected = certainties[0]!;
            expect(certainties).toEqual([expected, expected, expected, expected]);
          ''')
          if test_text.count(parity_old) != 1:
              raise SystemExit('certainty parity assertion anchor mismatch')
          tests.write_text(test_text.replace(parity_old, parity_new, 1), encoding='utf-8')
          PY

      - name: Run focused and repository gates
        run: |
          set -euxo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/execution-certainty.test.ts
          bun run test
          bun run test:convex
          bun run worker:check
          bun run test:runtime-parity

      - name: Publish source-only current-main candidate
        run: |
          set -euxo pipefail
          rm .github/workflows/juniper-572-finalize.yml
          git diff --check
          git add src test docs .github
          git commit -m 'feat: add execution certainty receipt core'
          git push --force-with-lease=refs/heads/juniper/572-execution-certainty-core:$GITHUB_SHA \
            origin HEAD:refs/heads/juniper/572-execution-certainty-core
