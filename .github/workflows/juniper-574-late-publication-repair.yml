name: juniper-574-resource-settlement-finalize

on:
  push:
    branches:
      - juniper/574-resource-settlement-core
    paths:
      - .github/workflows/juniper-574-late-publication-repair.yml

permissions:
  contents: write

concurrency:
  group: juniper-574-resource-settlement-finalize
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: juniper/574-resource-settlement-core
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase exact candidate onto current main
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git config user.name juniper-stensibly
          git config user.email juniper-stensibly@users.noreply.github.com
          git rebase origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26"

      - name: Reject unfenced terminal late publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).strip('\n')

          def with_indent(value: str, width: int) -> str:
              prefix = ' ' * width
              return '\n'.join(prefix + line if line else line for line in value.splitlines())

          def replace_indented(document: str, old: str, new: str, label: str) -> str:
              old = block(old)
              new = block(new)
              matches = []
              for width in range(0, 25):
                  candidate = with_indent(old, width)
                  count = document.count(candidate)
                  matches.extend([(candidate, width)] * count)
              if len(matches) != 1:
                  raise SystemExit(f'{label} matched {len(matches)} times')
              candidate, width = matches[0]
              return document.replace(candidate, with_indent(new, width), 1)

          source = Path('src/resource-settlement.ts')
          text = source.read_text(encoding='utf-8')
          text = replace_indented(text, '''
          if (owner.failureClass || owner.reconciliationRequired || owner.publicationFenceFingerprint) {
            throw new Error("Successful settlement owner contains failure or fence evidence");
          }
          ''', '''
          if (
            owner.failureClass
            || owner.reconciliationRequired
            || owner.canPublishLate
            || owner.publicationFenceFingerprint
          ) {
            throw new Error("Successful settlement owner contains failure or late-publication evidence");
          }
          ''', 'success late-publication invariant')

          text = replace_indented(text, '''
          if (!owner.failureClass || owner.reconciliationRequired || owner.publicationFenceFingerprint) {
            throw new Error("Failed settlement owner evidence is inconsistent");
          }
          ''', '''
          if (
            !owner.failureClass
            || owner.reconciliationRequired
            || owner.canPublishLate
            || owner.publicationFenceFingerprint
          ) {
            throw new Error("Failed settlement owner evidence is inconsistent or permits unfenced late publication");
          }
          ''', 'failure late-publication invariant')
          source.write_text(text, encoding='utf-8')

          tests = Path('test/resource-settlement.test.ts')
          test_text = tests.read_text(encoding='utf-8')
          test_text = replace_indented(test_text, '''
          test("requires exact publication-fence evidence", () => {
          ''', '''
          test("rejects terminal owners that can still publish without reconciliation or a fence", () => {
            expect(() => createResourceSettlementReceipt(input([
              owner("worker-a", "settled_failure", { canPublishLate: true }),
            ], {
              terminalAt: at(5),
              disposition: "retired",
            }))).toThrow("unfenced late publication");

            expect(() => createResourceSettlementReceipt(input([
              owner("worker-a", "settled_success", { canPublishLate: true }),
            ], {
              terminalAt: at(5),
              disposition: "reusable",
            }))).toThrow("late-publication evidence");
          });

          test("requires exact publication-fence evidence", () => {
          ''', 'late-publication controls')
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Run focused and repository gates
        run: |
          set -euxo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/resource-settlement.test.ts
          bun run test
          bun run test:convex
          bun run worker:check
          bun run test:runtime-parity

      - name: Publish source-only current-main candidate
        run: |
          set -euxo pipefail
          rm .github/workflows/juniper-574-late-publication-repair.yml
          git diff --check
          git add src test docs .github
          git commit -m 'fix: require a fence for late publication'
          git push --force-with-lease=refs/heads/juniper/574-resource-settlement-core:$GITHUB_SHA \
            origin HEAD:refs/heads/juniper/574-resource-settlement-core

# retriggered by Sable after carrier/source evidence separation
