name: Materialize provider receipt schema

on:
  push:
    branches:
      - "juniper/928-convex-provider-receipts"

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'teamleaderleo/stensibly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juniper/928-convex-provider-receipts
          fetch-depth: 0
      - name: Insert exact schema table and remove carrier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path("convex/schema.ts")
          text = schema_path.read_text()
          table = '''
  githubProviderReceipts: defineTable({
    workspaceId: v.id("workspaces"),
    projectId: v.id("projects"),
    externalId: v.string(),
    idempotencyKey: v.string(),
    repositoryFullName: v.string(),
    operation: v.string(),
    actorId: v.string(),
    clientId: v.string(),
    parametersSha256: v.string(),
    state: v.union(
      v.literal("reserved"),
      v.literal("succeeded"),
      v.literal("rejected"),
      v.literal("stale"),
      v.literal("pending_reconciliation"),
      v.literal("reconciled"),
    ),
    receiptJson: v.string(),
    receiptSha256: v.string(),
    createdAt: v.number(),
    updatedAt: v.number(),
  })
    .index("by_project_idempotency", ["projectId", "idempotencyKey"])
    .index("by_project_external", ["projectId", "externalId"]),
'''
          needle = '''    .index("by_project_issue_accepted", ["projectId", "issueExternalId", "acceptedAt", "externalId"]),

  actors: defineTable({'''
          replacement = '''    .index("by_project_issue_accepted", ["projectId", "issueExternalId", "acceptedAt", "externalId"]),
''' + table + '''
  actors: defineTable({'''
          if "githubProviderReceipts: defineTable" not in text:
              if needle not in text:
                  raise SystemExit("exact schema insertion point missing")
              text = text.replace(needle, replacement, 1)
              schema_path.write_text(text)
          Path(".github/workflows/juniper-928-materialize.yml").unlink()
          PY
          git diff --check
          git config user.name "Juniper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/schema.ts .github/workflows/juniper-928-materialize.yml
          git commit -m "Add hosted GitHub provider receipt schema"
          git push origin HEAD:juniper/928-convex-provider-receipts
