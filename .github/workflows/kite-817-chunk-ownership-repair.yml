name: Kite 817 chunk ownership repair

on:
  push:
    branches:
      - kite/817-actions-chunk-ownership-repair

permissions:
  contents: write

concurrency:
  group: kite-817-actions-chunk-ownership-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: kite/817-actions-chunk-ownership-repair

      - name: Verify carrier boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "92b02c5650bd9c303af9628bd466a392483daff7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/kite-817-chunk-ownership-repair.yml"

      - uses: oven-sh/setup-bun@v2

      - name: Install committed dependencies
        run: bun install --frozen-lockfile

      - name: Apply buffer ownership repair
        shell: bash
        run: |
          set -euo pipefail
          git show a050a6828a1c86178484383bae89666bc665899f:test/github-rest-actions-run-adapter-buffer-ownership.test.ts > test/github-rest-actions-run-adapter-buffer-ownership.test.ts
          python - <<'PY'
          from pathlib import Path

          path = Path("src/github-rest-actions-run-adapter.ts")
          source = path.read_text()
          before = "    chunks.push(item.value);"
          after = "    chunks.push(item.value.slice());"
          if source.count(before) != 1:
              raise SystemExit("Actions response chunk append site drifted")
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bun test test/github-rest-actions-run-adapter*.test.ts

      - name: Publish clean repair head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kite-817-chunk-ownership-repair.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/kite-817-chunk-ownership-repair.yml' 'src/github-rest-actions-run-adapter.ts' 'test/github-rest-actions-run-adapter-buffer-ownership.test.ts' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retain adapter-owned Actions response chunks"
          git push origin HEAD:kite/817-actions-chunk-ownership-repair
