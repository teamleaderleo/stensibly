name: kite-repository-cleanup-audit

on:
  push:
    branches:
      - kite/repository-cleanup-audit-20260731
    paths:
      - .github/workflows/kite-repository-cleanup-audit.yml

permissions:
  contents: write

concurrency:
  group: kite-repository-cleanup-audit-20260731
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: kite/repository-cleanup-audit-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Build repository cleanup audit
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import collections
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')
          report_path = root / 'docs' / 'repository-cleanup-audit-2026-07-31.md'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tracked = [path for path in tracked if path]

          text_suffixes = {
              '.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.md', '.css', '.html',
              '.yml', '.yaml', '.toml', '.sql', '.py', '.sh', '.d.ts'
          }
          code_suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs'}
          generated_prefixes = ('convex/_generated/',)
          dependency_prefixes = ('.agents/skills/', '.claude/skills/')

          def read_text(path: str) -> str | None:
              try:
                  return (root / path).read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  return None

          records = []
          for path in tracked:
              file_path = root / path
              if not file_path.is_file():
                  continue
              text = read_text(path)
              records.append({
                  'path': path,
                  'bytes': file_path.stat().st_size,
                  'lines': 0 if text is None else text.count('\n') + (1 if text else 0),
                  'text': text,
                  'suffix': ''.join(file_path.suffixes[-2:]) if path.endswith('.d.ts') else file_path.suffix,
              })

          by_top = collections.Counter()
          by_suffix = collections.Counter()
          for record in records:
              top = record['path'].split('/', 1)[0]
              by_top[top] += 1
              by_suffix[record['suffix'] or '<none>'] += 1

          code = [r for r in records if Path(r['path']).suffix in code_suffixes and not r['path'].startswith(generated_prefixes)]
          tests = [r for r in code if r['path'].startswith('test/') or r['path'].endswith('.test.ts')]
          production = [r for r in code if r not in tests and not r['path'].startswith(dependency_prefixes)]

          function_files: dict[str, set[str]] = collections.defaultdict(set)
          function_samples: dict[str, list[str]] = collections.defaultdict(list)
          for record in tests:
              text = record['text'] or ''
              for match in re.finditer(r'(?m)^(?:export\s+)?(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', text):
                  name = match.group(1)
                  function_files[name].add(record['path'])
                  if len(function_samples[name]) < 5:
                      function_samples[name].append(record['path'])
          repeated_helpers = sorted(
              ((name, sorted(paths)) for name, paths in function_files.items() if len(paths) >= 3),
              key=lambda item: (-len(item[1]), item[0]),
          )

          source_contract_tests = []
          for record in tests:
              text = record['text'] or ''
              loads_source = ('Bun.file(new URL("../' in text or "Bun.file(new URL('../" in text
                              or 'readFileSync(new URL("../' in text or "readFileSync(new URL('../" in text)
              assertion_count = text.count('.toContain(') + text.count('.not.toContain(')
              if loads_source and assertion_count:
                  source_contract_tests.append((record['path'], assertion_count, record['lines']))
          source_contract_tests.sort(key=lambda item: (-item[1], item[0]))

          exact_hashes: dict[str, list[str]] = collections.defaultdict(list)
          for record in records:
              text = record['text']
              if text is None or record['bytes'] < 80:
                  continue
              digest = hashlib.sha256(text.encode()).hexdigest()
              exact_hashes[digest].append(record['path'])
          duplicate_files = [sorted(paths) for paths in exact_hashes.values() if len(paths) > 1]
          duplicate_files.sort(key=lambda paths: (-len(paths), paths))

          mirror_pairs = []
          agents = {path.removeprefix('.agents/'): path for path in tracked if path.startswith('.agents/')}
          claude = {path.removeprefix('.claude/'): path for path in tracked if path.startswith('.claude/')}
          for relative in sorted(set(agents) & set(claude)):
              left = read_text(agents[relative])
              right = read_text(claude[relative])
              mirror_pairs.append((relative, left == right, agents[relative], claude[relative]))

          compatibility_mentions = []
          compatibility_pattern = re.compile(r'\b(legacy|compatibility|deprecated|deprecation|fallback)\b', re.I)
          for record in records:
              if record['text'] is None:
                  continue
              count = len(compatibility_pattern.findall(record['text']))
              if count:
                  compatibility_mentions.append((record['path'], count))
          compatibility_mentions.sort(key=lambda item: (-item[1], item[0]))

          package = json.loads((root / 'package.json').read_text())
          script_rows = []
          for name, command in sorted(package.get('scripts', {}).items()):
              candidates = re.findall(r'(?:^|\s)((?:src|scripts)/[^\s]+\.(?:ts|mjs|js))', command)
              entry = candidates[0] if candidates else ''
              refs = 0
              if entry:
                  needle = Path(entry).name
                  refs = sum((record['text'] or '').count(needle) for record in records if record['path'] != 'package.json')
              script_rows.append((name, command, entry, refs))

          largest_code = sorted(code, key=lambda r: (-r['lines'], r['path']))[:30]
          largest_tests = sorted(tests, key=lambda r: (-r['lines'], r['path']))[:25]

          workflows = sorted(path for path in tracked if path.startswith('.github/workflows/'))
          tests_by_prefix = collections.Counter()
          for record in tests:
              name = Path(record['path']).name
              prefix = name.split('-', 1)[0]
              tests_by_prefix[prefix] += 1

          total_code_lines = sum(r['lines'] for r in code)
          production_lines = sum(r['lines'] for r in production)
          test_lines = sum(r['lines'] for r in tests)

          lines = []
          add = lines.append
          add('# Repository cleanup audit — 2026-07-31')
          add('')
          add('**Branch base:** `226e5b7ff7dc2e656193411921a3431f28d018f9`  ')
          add('**Callsign:** Kite  ')
          add('**Scope:** tracked repository content only; generated Convex output is excluded from code-size rankings.')
          add('')
          add('## Executive findings')
          add('')
          add('1. **Keep the domain split.** Pure authority, idempotency, receipt, and reconciliation cores are a strong design choice. SQLite and Convex parity tests are purposeful when they prove the same invariant through different adapters.')
          add('2. **Extract the remote MCP test harness.** Protocol headers, JSON-RPC envelopes, request dispatch, initialization, tool calls, and text-result parsing are copied across many suites. This is the clearest low-risk duplication removal.')
          add('3. **Reduce source-string contract tests.** Dashboard tests heavily assert implementation text. Keep a small wiring smoke layer, move behavior into importable pure modules, and test those modules directly. String assertions have already drifted after behavior-preserving edits.')
          add('4. **Make compatibility intentional.** Local unversioned API routes, legacy execution envelopes, fallback endpoints, and migration readers need explicit owners and removal triggers. Compatibility can stay, but every path should have evidence that it still earns its cost.')
          add('5. **Treat mirrored agent assets as generated artifacts.** The `.agents` and `.claude` trees contain overlapping files. Preserve tool-required locations, choose one source of truth, and enforce synchronization instead of hand-editing both copies.')
          add('6. **Split only the largest orchestration files.** Prefer extraction around stable concepts—request parsing, response mapping, authorization, reconciliation—rather than creating thin one-function files.')
          add('7. **Delete temporary workflow carriers promptly.** Source-only pull-request heads are easier to review and reduce queue noise. Permanent reusable workflows should replace repeated embedded repair recipes where the same operation recurs.')
          add('')
          add('## Repository inventory')
          add('')
          add(f'- Tracked files: **{len(records)}**')
          add(f'- Production code lines: **{production_lines:,}**')
          add(f'- Test code lines: **{test_lines:,}**')
          add(f'- Total TypeScript/JavaScript lines: **{total_code_lines:,}**')
          ratio = (test_lines / production_lines) if production_lines else 0
          add(f'- Test-to-production line ratio: **{ratio:.2f}**')
          add(f'- Workflow files on the audited branch before self-removal: **{len(workflows)}**')
          add('')
          add('### Files by top-level area')
          add('')
          add('| Area | Files |')
          add('| --- | ---: |')
          for area, count in by_top.most_common():
              add(f'| `{area}` | {count} |')
          add('')
          add('### Largest code files')
          add('')
          add('| File | Lines | Bytes |')
          add('| --- | ---: | ---: |')
          for record in largest_code:
              add(f"| `{record['path']}` | {record['lines']:,} | {record['bytes']:,} |")
          add('')
          add('### Largest test files')
          add('')
          add('| File | Lines |')
          add('| --- | ---: |')
          for record in largest_tests:
              add(f"| `{record['path']}` | {record['lines']:,} |")
          add('')
          add('## Repeated test helpers')
          add('')
          add('Named local functions appearing in at least three test files:')
          add('')
          add('| Helper | Files | Sample locations |')
          add('| --- | ---: | --- |')
          for name, paths in repeated_helpers[:40]:
              sample = '<br>'.join(f'`{path}`' for path in paths[:6])
              add(f'| `{name}` | {len(paths)} | {sample} |')
          if not repeated_helpers:
              add('| _None detected_ | 0 | |')
          add('')
          add('### Recommended first extraction')
          add('')
          add('Create `test/support/mcp-http.ts` with one protocol version, header builder, JSON-RPC message builders, app request helper, typed result reader, and explicit error reader. Migrate foundational HTTP suites first; let feature branches adopt the helper when they rebase.')
          add('')
          add('## Source-string contract tests')
          add('')
          add(f'Files loading implementation source and asserting `.toContain(...)`: **{len(source_contract_tests)}**')
          add('')
          add('| Test | String assertions | Lines |')
          add('| --- | ---: | ---: |')
          for path, assertions, line_count in source_contract_tests[:40]:
              add(f'| `{path}` | {assertions} | {line_count} |')
          add('')
          add('**Refactor rule:** preserve one integration assertion for wiring, then export the decision logic from browser modules and test inputs/outputs. Source-text checks should guard only constraints that cannot be observed through a public function or DOM behavior.')
          add('')
          add('## Exact duplicate and mirrored files')
          add('')
          add(f'- Exact duplicate text groups: **{len(duplicate_files)}**')
          add(f'- `.agents`/`.claude` relative-path pairs: **{len(mirror_pairs)}**')
          add(f'- Identical mirrored pairs: **{sum(1 for _, identical, _, _ in mirror_pairs if identical)}**')
          add('')
          for paths in duplicate_files[:30]:
              add('- ' + ', '.join(f'`{path}`' for path in paths))
          if not duplicate_files:
              add('- No exact duplicate text files detected.')
          add('')
          add('## Compatibility and fallback concentration')
          add('')
          add('| File | Mentions |')
          add('| --- | ---: |')
          for path, count in compatibility_mentions[:40]:
              add(f'| `{path}` | {count} |')
          add('')
          add('**Decision template for each compatibility path:** supported users, current caller, failure consequence, replacement, evidence required before removal, and target review date.')
          add('')
          add('## Package scripts and entrypoints')
          add('')
          add('| Script | Command | Direct entry | Other filename references |')
          add('| --- | --- | --- | ---: |')
          for name, command, entry, refs in script_rows:
              escaped = command.replace('|', '\\|')
              add(f'| `{name}` | `{escaped}` | `{entry or "—"}` | {refs} |')
          add('')
          add('Low-reference CLI entrypoints deserve a product decision, not automatic deletion. Keep operator tools that provide unique recovery value; combine commands that differ only by endpoint or verification profile.')
          add('')
          add('## Strong areas worth preserving')
          add('')
          add('- Server-owned authority and responsibility semantics stay separate from client/runtime identity.')
          add('- Idempotency receipts are treated as evidence and fenced from authority decisions.')
          add('- Privacy-sensitive projections use explicit bounded fields and digest identities.')
          add('- Hosted and local adapters share domain contracts while keeping provider effects outside pure cores.')
          add('- Exact-head CI, recovery notes, and source-only final candidates make risky internal changes recoverable.')
          add('- The no-gradient visual rule is explicit and easy to enforce.')
          add('')
          add('## Prioritized cleanup queue')
          add('')
          add('### P0 — merge-safe maintenance')
          add('1. Extract and adopt the remote MCP HTTP test harness.')
          add('2. Add a repository check that rejects committed one-off workflow carriers on merge-ready pull requests, while allowing named permanent workflows.')
          add('3. Add one sync check for mirrored agent skill assets or document the generator that owns both trees.')
          add('')
          add('### P1 — reduce brittleness')
          add('4. Convert dashboard source-string contracts to behavioral tests, starting with item mutation refresh and connection/session helpers.')
          add('5. Introduce shared test builders for actors, tokens, item creation, and JSON-RPC receipts; keep scenario assertions local.')
          add('6. Split the largest HTTP/MCP orchestration files at stable policy boundaries after current W01 feature branches land.')
          add('')
          add('### P2 — product simplification decisions')
          add('7. Review unversioned `/api` compatibility routes and local SQLite mode using actual dogfood usage and recovery value.')
          add('8. Consolidate hosted verifier CLIs behind profiles where their transport and redaction logic overlaps.')
          add('9. Review each legacy execution-envelope reader and migration fixture for a retained caller and sunset condition.')
          add('10. Remove or archive features that expose no current user journey, have no active caller, and add ongoing authority or migration burden.')
          add('')
          add('## Next executable action')
          add('')
          add('Implement P0.1 on this branch: add the canonical MCP HTTP test harness, migrate a non-overlapping foundational set of suites, run the full repository gate, then expand only while active pull-request overlap remains low.')

          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publish audit and remove carrier
        run: |
          set -euxo pipefail
          rm .github/workflows/kite-repository-cleanup-audit.yml
          git diff --check
          git config user.name kite-stensibly
          git config user.email kite-stensibly@users.noreply.github.com
          git add docs/repository-cleanup-audit-2026-07-31.md .github/workflows
          git commit -m 'docs: audit repository cleanup opportunities'
          git push origin HEAD:kite/repository-cleanup-audit-20260731