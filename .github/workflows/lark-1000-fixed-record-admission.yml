name: Lark 1000 fixed-record admission repair

on:
  push:
    branches:
      - cicada/962-current-main-merkle-replay
    paths:
      - .github/workflows/lark-1000-fixed-record-admission.yml

permissions:
  contents: write

concurrency:
  group: lark-1000-fixed-record-admission
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cicada/962-current-main-merkle-replay
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact replay head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "6e01c25ab7fb2036f347b2de6ce8ba34e1a8db3c"
          test "$(git rev-parse HEAD:src/github-observation-merkle-checkpoint.ts)" = "d903fe6a50cbfa9097ddb4fb54405ac002d5272b"

      - uses: oven-sh/setup-bun@v2

      - name: Project fixed records through direct descriptors
        shell: bash
        run: |
          set -euo pipefail
          git show 029346edcfad01bfbe310d24533f7549118cf0d5:test/github-observation-merkle-checkpoint-record-key-budget.test.ts \
            > test/github-observation-merkle-checkpoint-record-key-budget.test.ts
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-observation-merkle-checkpoint.ts")
          source = path.read_text()
          old = '''function snapshotRecord<const K extends readonly string[]>(
            value: unknown,
            keys: K,
            label: string,
          ): DataRecord {
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              throw new TypeError(`${label} must be an object`);
            }
            const prototype = Object.getPrototypeOf(value);
            if (prototype !== Object.prototype && prototype !== null) {
              throw new TypeError(`${label} must use a plain prototype`);
            }
            const descriptors = Object.getOwnPropertyDescriptors(value);
            const ownKeys = Reflect.ownKeys(descriptors);
            if (
              ownKeys.some((key) =>
                typeof key !== "string"
                || !(keys as readonly string[]).includes(key)
              )
            ) {
              throw new TypeError(`${label} contains unknown fields`);
            }
            if (ownKeys.length !== keys.length) {
              throw new TypeError(`${label} is missing required fields`);
            }
            const result = Object.create(null) as DataRecord;
            for (const key of keys) {
              const descriptor = descriptors[key];
              if (!descriptor || !("value" in descriptor) || descriptor.enumerable !== true) {
                throw new TypeError(`${label} fields must be enumerable data properties`);
              }
              result[key] = descriptor.value;
            }
            return result;
          }
          '''
          new = '''function snapshotRecord<const K extends readonly string[]>(
            value: unknown,
            keys: K,
            label: string,
          ): DataRecord {
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              throw new TypeError(`${label} must be an object`);
            }
            let prototype: object | null;
            try {
              prototype = Object.getPrototypeOf(value);
            } catch {
              throw new TypeError(`${label} could not be inspected`);
            }
            if (prototype !== Object.prototype && prototype !== null) {
              throw new TypeError(`${label} must use a plain prototype`);
            }
            const result = Object.create(null) as DataRecord;
            for (const key of keys) {
              let descriptor: PropertyDescriptor | undefined;
              try {
                descriptor = Object.getOwnPropertyDescriptor(value, key);
              } catch {
                throw new TypeError(`${label} could not be inspected`);
              }
              if (!descriptor) {
                throw new TypeError(`${label} is missing required fields`);
              }
              if (!("value" in descriptor) || descriptor.enumerable !== true) {
                throw new TypeError(`${label} fields must be enumerable data properties`);
              }
              result[key] = descriptor.value;
            }
            return result;
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("snapshotRecord anchor moved")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Validate bounded Merkle admission
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-observation-merkle-checkpoint*.test.ts
          node scripts/verify-runtime-parity.mjs

      - name: Publish workflow-free repaired head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lark-1000-fixed-record-admission.yml
          git add src/github-observation-merkle-checkpoint.ts \
            test/github-observation-merkle-checkpoint-record-key-budget.test.ts
          git diff --cached --check
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bound fixed-record Merkle admission"
          git fetch origin refs/heads/cicada/962-current-main-merkle-replay:refs/remotes/origin/cicada/962-current-main-merkle-replay
          test "$(git rev-parse refs/remotes/origin/cicada/962-current-main-merkle-replay)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/cicada/962-current-main-merkle-replay:$EXPECTED_HEAD origin HEAD:refs/heads/cicada/962-current-main-merkle-replay
