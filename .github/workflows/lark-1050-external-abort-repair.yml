name: Lark 1050 external abort settlement repair

on:
  pull_request:
    paths:
      - .github/workflows/lark-1050-external-abort-repair.yml

permissions:
  contents: write

concurrency:
  group: lark-1050-external-abort-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cedar/1012-bounded-readback-facade
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Settle caller abort through the authoritative deadline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/github-provider-bounded-response.ts")
          text = source.read_text()
          before = '''  context.timer = setTimeout(() => {
            context.expired = true;
            try {
              controller.abort();
            } catch {
              // Direct Promise settlement remains authoritative.
            }
            rejectDeadline(new GitHubProviderResponseReadError());
          }, deadlineMs);

          if (externalSignal) {
            const forwardAbort = () => {
              try {
                controller.abort();
              } catch {
                // The provider call owns final error classification.
              }
            };
            if (externalSignal.aborted) {
              forwardAbort();
            } else {
              externalSignal.addEventListener("abort", forwardAbort, { once: true });
              context.removeExternalAbort = () =>
                externalSignal.removeEventListener("abort", forwardAbort);
            }
          }
          '''
          after = '''  const terminate = () => {
            if (context.finished) return;
            context.expired = true;
            try {
              controller.abort();
            } catch {
              // Direct Promise settlement remains authoritative.
            }
            finishDeadline(context);
            rejectDeadline(new GitHubProviderResponseReadError());
          };
          context.timer = setTimeout(terminate, deadlineMs);

          if (externalSignal) {
            if (externalSignal.aborted) {
              terminate();
            } else {
              externalSignal.addEventListener("abort", terminate, { once: true });
              context.removeExternalAbort = () =>
                externalSignal.removeEventListener("abort", terminate);
            }
          }
          '''
          if text.count(before) != 1:
            raise SystemExit("external abort settlement anchor changed")
          source.write_text(text.replace(before, after, 1))
          PY
          git diff --check

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-provider-bounded-response-external-abort.test.ts \
            test/github-provider-response-deadline.test.ts \
            test/github-provider-bounded-readback-facade.test.ts \
            test/github-provider-bounded-response-read-result-ownkeys.test.ts \
            test/github-provider-bounded-response-incremental-decode.test.ts

      - name: Publish source and control only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/cedar/1012-bounded-readback-facade:refs/remotes/origin/cedar/1012-bounded-readback-facade
          test "$(git rev-parse refs/remotes/origin/cedar/1012-bounded-readback-facade)" = "$EXPECTED_HEAD"
          rm .github/workflows/lark-1050-external-abort-repair.yml
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-provider-bounded-response.ts \
            .github/workflows/lark-1050-external-abort-repair.yml
          git diff --cached --check
          git commit -m "Settle provider waits on caller abort"
          git push --force-with-lease=refs/heads/cedar/1012-bounded-readback-facade:$EXPECTED_HEAD \
            origin HEAD:refs/heads/cedar/1012-bounded-readback-facade
