name: Lark 1083 coherent tree controls

on:
  push:
    branches:
      - juniper/1020-atomic-publication-controls
    paths:
      - .github/workflows/lark-1083-coherent-tree-controls.yml

permissions:
  contents: write

concurrency:
  group: lark-1083-coherent-tree-controls
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1020-atomic-publication-controls
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact carrier head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "057565703a7c28ad0b52561fb14e4f7eb1c6ce55"

      - name: Align both controls on recursive immutable trees
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          publication = Path("test/github-rest-repository-write-atomic-publication.test.ts")
          text = publication.read_text()
          replacements = [
            (
              '''        url: `${contentUrl()}?ref=${parentSha}`,
''',
              '''        url: recursiveTreeUrl(parentTreeSha),
''',
            ),
            (
              '''    const preflight = recorded.find((request) =>
      request.method === "GET" && request.url.startsWith(contentUrl())
    );
    expect(preflight?.url).toBe(`${contentUrl()}?ref=${parentSha}`);
''',
              '''    const preflight = recorded.find((request) =>
      request.method === "GET" && request.url === recursiveTreeUrl(parentTreeSha)
    );
    expect(preflight?.url).toBe(recursiveTreeUrl(parentTreeSha));
''',
            ),
            (
              '''    if (method === "GET" && url === `${contentUrl()}?ref=${parentSha}`) {
      if (input.operation === "create_file") {
        return Response.json({ message: "Not Found" }, { status: 404 });
      }
      return Response.json({
        type: "file",
        name: "atomic-publication.md",
        path,
        sha: input.observedBlobSha ?? previousBlobSha,
        size: 12,
        url: `${contentUrl()}?ref=${parentSha}`,
        git_url:
          `${apiBaseUrl}/repos/${repositoryFullName}/git/blobs/${input.observedBlobSha ?? previousBlobSha}`,
      });
    }
''',
              '''    if (method === "GET" && url === recursiveTreeUrl(parentTreeSha)) {
      const observedBlobSha = input.observedBlobSha ?? previousBlobSha;
      return Response.json({
        sha: parentTreeSha,
        url: treeUrl(parentTreeSha),
        tree: input.operation === "create_file"
          ? []
          : [{
              path,
              mode: "100644",
              type: "blob",
              sha: observedBlobSha,
              url: blobUrl(observedBlobSha),
              size: 12,
            }],
        truncated: false,
      });
    }
''',
            ),
            (
              '''function treeCollectionUrl(): string {
  return `${repositoryUrl()}/git/trees`;
}

function contentUrl(): string {
  return `${repositoryUrl()}/contents/${path}`;
}
''',
              '''function treeCollectionUrl(): string {
  return `${repositoryUrl()}/git/trees`;
}

function treeUrl(sha: string): string {
  return `${treeCollectionUrl()}/${sha}`;
}

function recursiveTreeUrl(sha: string): string {
  return `${treeUrl(sha)}?recursive=1`;
}

function blobUrl(sha: string): string {
  return `${blobCollectionUrl()}/${sha}`;
}
''',
            ),
          ]
          for before, after in replacements:
            if text.count(before) != 1:
              raise SystemExit("atomic publication control anchor changed")
            text = text.replace(before, after)
          publication.write_text(text)

          mode = Path("test/github-rest-repository-write-atomic-mode-preservation.test.ts")
          text = mode.read_text()
          replacements = [
            (
              '''      url: treeUrl(parentTreeSha),
''',
              '''      url: recursiveTreeUrl(parentTreeSha),
''',
            ),
            (
              '''    if (method === "GET" && url === treeUrl(parentTreeSha)) {
''',
              '''    if (method === "GET" && url === recursiveTreeUrl(parentTreeSha)) {
''',
            ),
            (
              '''function treeUrl(sha: string): string {
  return `${repositoryUrl()}/git/trees/${sha}`;
}

function treeCollectionUrl(): string {
''',
              '''function treeUrl(sha: string): string {
  return `${repositoryUrl()}/git/trees/${sha}`;
}

function recursiveTreeUrl(sha: string): string {
  return `${treeUrl(sha)}?recursive=1`;
}

function treeCollectionUrl(): string {
''',
            ),
          ]
          for before, after in replacements:
            if text.count(before) != 1:
              raise SystemExit("atomic mode control anchor changed")
            text = text.replace(before, after)
          mode.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts | LC_ALL=C sort)"

      - uses: oven-sh/setup-bun@v2

      - name: Bundle red controls without executing them
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun build \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            --target=bun \
            --outdir=/tmp/atomic-red-controls

      - name: Publish workflow-free red controls
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/lark-1083-coherent-tree-controls.yml
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git add \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            .github/workflows/lark-1083-coherent-tree-controls.yml
          git diff --cached --check
          git commit -m "Align atomic controls on recursive immutable trees"
          git fetch origin refs/heads/juniper/1020-atomic-publication-controls:refs/remotes/origin/juniper/1020-atomic-publication-controls
          test "$(git rev-parse refs/remotes/origin/juniper/1020-atomic-publication-controls)" = "${EXPECTED_HEAD}"
          git push --force-with-lease=refs/heads/juniper/1020-atomic-publication-controls:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/juniper/1020-atomic-publication-controls
