name: Lark 1170 foreign cancellation thenable repair

on:
  push:
    branches:
      - juniper/1163-total-response-lifetime
    paths:
      - .github/workflows/lark-1170-foreign-cancel-thenable.yml

permissions:
  contents: write

concurrency:
  group: lark-1170-foreign-cancel-thenable
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-total-response-lifetime
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact response packet
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/github-provider-bounded-response.ts)" = "541409cd7de3b370b083d1b2df76dc8610a11d0e"
          test "$(git rev-parse HEAD:test/github-rest-repository-write-response-lifetime.test.ts)" = "d39b14159dd13b319e9bdf7475788dc28592f632"

      - uses: oven-sh/setup-bun@v2

      - name: Remove foreign thenable assimilation from cancellation cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/github-provider-bounded-response.ts")
          text = source.read_text()
          old = '''function suppressCancellation(value: unknown): void {
            if (
              value !== null
              && (typeof value === "object" || typeof value === "function")
              && "then" in value
            ) {
              void Promise.resolve(value).catch(() => undefined);
            }
          }
          '''
          new = '''function suppressCancellation(value: unknown): void {
            if (value === null || typeof value !== "object") return;
            let prototype: object | null;
            try {
              prototype = Object.getPrototypeOf(value) as object | null;
            } catch {
              return;
            }
            if (prototype !== Promise.prototype) return;
            try {
              void Reflect.apply(Promise.prototype.then, value, [
                undefined,
                () => undefined,
              ]);
            } catch {
              // Foreign or malformed cancellation results are never assimilated.
            }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("suppressCancellation anchor moved")
          source.write_text(text.replace(old, new, 1))

          test_path = Path("test/github-rest-repository-write-response-lifetime.test.ts")
          test_text = test_path.read_text()
          import_old = '''import {
            GitHubRestRepositoryWriteAdapter,
            type GitHubRepositoryWriteTokenProvider,
          } from "../src/github-rest-repository-write-adapter.ts";
          '''
          import_new = import_old + '''import {
            discardGitHubProviderResponse,
          } from "../src/github-provider-bounded-response.ts";
          '''
          if test_text.count(import_old) != 1:
              raise SystemExit("response-lifetime import anchor moved")
          test_text = test_text.replace(import_old, import_new, 1)

          marker = '''  test.each([0, -1, 120_001, 1.5, Number.NaN])(
          '''
          addition = '''  test("does not assimilate a foreign cancellation thenable after timeout", () => {
            let cancelCalls = 0;
            let thenReads = 0;
            let thenCalls = 0;
            const cancellation = Object.create(null) as Record<string, unknown>;
            Object.defineProperty(cancellation, "then", {
              enumerable: true,
              get() {
                thenReads += 1;
                return () => {
                  thenCalls += 1;
                };
              },
            });
            const response = {
              body: {
                cancel() {
                  cancelCalls += 1;
                  return cancellation;
                },
              },
            } as unknown as Response;

            discardGitHubProviderResponse(response);

            expect(cancelCalls).toBe(1);
            expect(thenReads).toBe(0);
            expect(thenCalls).toBe(0);
          });

          '''
          if marker not in test_text or "does not assimilate a foreign cancellation thenable" in test_text:
              raise SystemExit("foreign cancellation control anchor moved")
          test_path.write_text(test_text.replace(marker, addition + marker, 1))
          PY
          git diff --check

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-rest-repository-write-response-lifetime.test.ts

      - name: Publish workflow-free repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lark-1170-foreign-cancel-thenable.yml
          git add src/github-provider-bounded-response.ts test/github-rest-repository-write-response-lifetime.test.ts
          git diff --cached --check
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Avoid foreign cancellation thenable assimilation"
          git push origin HEAD:juniper/1163-total-response-lifetime
