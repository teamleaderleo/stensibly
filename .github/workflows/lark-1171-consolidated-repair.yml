name: Lark 1171 complete causal attention repair

on:
  push:
    branches:
      - cinder/1153-causal-attention
    paths:
      - .github/workflows/lark-1171-consolidated-repair.yml

permissions:
  contents: write

concurrency:
  group: lark-1171-consolidated-attention-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cinder/1153-causal-attention
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact complete-repair lease
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_PARENT: e69fa4f43b66261804ffa9d1a7e0f849c17be42b
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-parse HEAD^:src/orchestrator-attention-thread.ts)" = "36be2446c29852ecd8011fd0fecb6c829fa921df"
          test "$(git rev-parse HEAD^:test/orchestrator-attention-thread.test.ts)" = "9cafd57066dc1ef096864661926064bc83366cb7"
          test "$(git rev-parse HEAD^:test/orchestrator-attention-thread-evidence-fingerprint.test.ts)" = "ad58bf78d60ed3ed5b290740d0e0116f590328e6"

      - uses: oven-sh/setup-bun@v2

      - name: Apply all accepted attention repairs
        env:
          SEMANTIC_CONTROL_SHA: f7e48c5bb286414b148ce32dc9c940627bda0dd2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SEMANTIC_CONTROL_SHA"
          git show "$SEMANTIC_CONTROL_SHA":test/orchestrator-attention-thread-semantic-red-control.test.ts \
            > test/orchestrator-attention-thread-semantic-red-control.test.ts

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/orchestrator-attention-thread.ts")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          # Complete evidence identity before public ID compaction.
          replace_once(
              "  evidenceCount: number;\n  supportingObservationIds: readonly string[];\n  contradictionCount: number;\n  contradictingObservationIds: readonly string[];",
              "  evidenceCount: number;\n  supportingEvidenceFingerprint: string;\n  supportingObservationIds: readonly string[];\n  contradictionCount: number;\n  contradictingEvidenceFingerprint: string;\n  contradictingObservationIds: readonly string[];",
              "thread evidence interface",
          )
          replace_once(
              '''  const attentionClass = strongestAttentionClass(supports);
  const payload = {
''',
              '''  const attentionClass = strongestAttentionClass(supports);
  const supportingEvidenceIds = supports.map((entry) => entry.observationId);
  const contradictingEvidenceIds = contradictions.map(
    (entry) => entry.observationId,
  );
  const payload = {
''',
              "thread evidence arrays",
          )
          replace_once(
              '''    evidenceCount: supports.length,
    supportingObservationIds: compactEvidenceIds(supports),
    contradictionCount: contradictions.length,
    contradictingObservationIds: compactEvidenceIds(contradictions),''',
              '''    evidenceCount: supports.length,
    supportingEvidenceFingerprint: evidenceFingerprint(supportingEvidenceIds),
    supportingObservationIds: compactEvidenceIds(supportingEvidenceIds),
    contradictionCount: contradictions.length,
    contradictingEvidenceFingerprint: evidenceFingerprint(contradictingEvidenceIds),
    contradictingObservationIds: compactEvidenceIds(contradictingEvidenceIds),''',
              "thread evidence payload",
          )

          # Direct descriptor admission: bounded length before entry reads, no caller ownKeys.
          old_top = '''  let descriptors: Record<PropertyKey, PropertyDescriptor>;
  try {
    descriptors = Object.getOwnPropertyDescriptors(input);
  } catch {
    throw new Error("Orchestrator attention observations could not be inspected");
  }
  const keys = Reflect.ownKeys(descriptors);
  if (keys.length !== length + 1 || !keys.includes("length")) {
    throw new Error("Orchestrator attention observations must be dense and undecorated");
  }

  const byId = new Map<string, OrchestratorActivityObservation>();
  for (let index = 0; index < length; index += 1) {
    const descriptor = descriptors[String(index)];
    if (!descriptor || !descriptor.enumerable || !("value" in descriptor)) {
      throw new Error(
        "Orchestrator attention observations must contain enumerable data entries",
      );
    }
    const observation = admitObservation(descriptor.value);
'''
          new_top = '''  const byId = new Map<string, OrchestratorActivityObservation>();
  for (let index = 0; index < length; index += 1) {
    const observation = admitObservation(
      callerDataValue(
        input as object,
        String(index),
        "Orchestrator attention observations",
      ),
    );
'''
          replace_once(old_top, new_top, "top-level direct descriptor admission")

          record_start = source.index("function snapshotExactRecord(")
          record_end = source.index("function snapshotDenseArray(", record_start)
          source = source[:record_start] + '''function snapshotExactRecord(
  value: unknown,
  keys: readonly string[],
  label: string,
): Record<string, unknown> {
  if (!value || typeof value !== "object" || Array.isArray(value)) {
    throw new Error(`${label} must be an object`);
  }
  let prototype: object | null;
  try {
    prototype = Object.getPrototypeOf(value);
  } catch {
    throw new Error(`${label} could not be inspected`);
  }
  if (prototype !== Object.prototype && prototype !== null) {
    throw new Error(`${label} must use a plain or null prototype`);
  }
  const result = Object.create(null) as Record<string, unknown>;
  for (const key of keys) {
    result[key] = callerDataValue(value, key, label);
  }
  return result;
}

''' + source[record_end:]

          array_start = source.index("function snapshotDenseArray(")
          array_end = source.index("function observationLineageKey(", array_start)
          source = source[:array_start] + '''function snapshotDenseArray(
  value: unknown,
  maximumLength: number,
  label: string,
): unknown[] {
  let isArray: boolean;
  let prototype: object | null;
  let lengthDescriptor: PropertyDescriptor | undefined;
  try {
    isArray = Array.isArray(value);
    prototype = isArray && value !== null ? Object.getPrototypeOf(value) : null;
    lengthDescriptor = isArray && value !== null
      ? Object.getOwnPropertyDescriptor(value, "length")
      : undefined;
  } catch {
    throw new Error(`${label} could not be inspected`);
  }
  if (!isArray || prototype !== Array.prototype) {
    throw new Error(`${label} must be an ordinary array`);
  }
  const length = lengthDescriptor && "value" in lengthDescriptor
    ? lengthDescriptor.value
    : undefined;
  if (
    typeof length !== "number"
    || !Number.isSafeInteger(length)
    || length < 0
    || length > maximumLength
  ) {
    throw new RangeError(`${label} exceeds its entry limit`);
  }
  const result: unknown[] = [];
  for (let index = 0; index < length; index += 1) {
    result.push(callerDataValue(value, String(index), label));
  }
  return result;
}

function callerDataValue(
  value: object,
  key: PropertyKey,
  label: string,
): unknown {
  try {
    const descriptor = Object.getOwnPropertyDescriptor(value, key);
    if (!descriptor || !descriptor.enumerable || !("value" in descriptor)) {
      throw new Error(`${label} fields must be enumerable data properties`);
    }
    return descriptor.value;
  } catch (error) {
    if (
      error instanceof Error
      && error.message === `${label} fields must be enumerable data properties`
    ) {
      throw error;
    }
    throw new Error(`${label} could not be inspected`);
  }
}

''' + source[array_end:]

          # Exact resolver provenance and chronology-aware contradiction settlement.
          replace_once(
              '''  const resolver = resolvers.at(-1) ?? null;
  const state: OrchestratorAttentionThreadState = contradictions.length > 0
    ? "contradictory"
    : missingSourceClasses.length > 0
      ? "incomplete"
      : resolver
        ? "resolved"
        : "open";
''',
              '''  const resolver = resolvers.at(-1) ?? null;
  const unresolvedContradictions = resolver === null
    ? contradictions
    : contradictions.filter((entry) => entry.observedAt >= resolver.observedAt);
  const state: OrchestratorAttentionThreadState = missingSourceClasses.length > 0
    ? "incomplete"
    : unresolvedContradictions.length > 0
      ? "contradictory"
      : resolver
        ? "resolved"
        : "open";
''',
              "chronology-aware state",
          )
          replace_once(
              '''  return observation.activityState === "succeeded"
    && observation.providerLifecycle === "verified"
''',
              '''  return observation.sourceClass === "provider_observation"
    && observation.activityState === "succeeded"
    && observation.providerLifecycle === "verified"
''',
              "resolver provenance",
          )

          old_compact = '''function compactEvidenceIds(
  observations: readonly OrchestratorActivityObservation[],
): readonly string[] {
  const ids = observations.map((entry) => entry.observationId);
  if (ids.length <= maximumRetainedEvidenceIds) return Object.freeze(ids);
  const half = maximumRetainedEvidenceIds / 2;
  return Object.freeze([
    ...ids.slice(0, half),
    ...ids.slice(ids.length - half),
  ]);
}'''
          new_compact = '''function evidenceFingerprint(ids: readonly string[]): string {
  return sha256(stableJson(ids));
}

function compactEvidenceIds(ids: readonly string[]): readonly string[] {
  if (ids.length <= maximumRetainedEvidenceIds) return Object.freeze([...ids]);
  const half = maximumRetainedEvidenceIds / 2;
  return Object.freeze([
    ...ids.slice(0, half),
    ...ids.slice(ids.length - half),
  ]);
}'''
          replace_once(old_compact, new_compact, "evidence compaction")

          path.write_text(source)

          # Update the focused decoration control to prove no caller ownKeys.
          test_path = Path("test/orchestrator-attention-thread.test.ts")
          tests = test_path.read_text()
          old_test = '''  test("rejects decorated arrays and custom observation prototypes", () => {
    const decorated = [ambiguousReceipt()] as OrchestratorActivityObservation[] & {
      note?: string;
    };
    decorated.note = "must not survive";
    expect(() => compileOrchestratorAttentionProjection(decorated))
      .toThrow("dense and undecorated");

    const custom = Object.assign(
      Object.create({ inherited: true }),
      ambiguousReceipt(),
    );
    expect(() => compileOrchestratorAttentionProjection([custom]))
      .toThrow("plain or null prototype");
  });'''
          new_test = '''  test("ignores caller decorations without key enumeration and rejects custom prototypes", () => {
    const decorated = [ambiguousReceipt()] as OrchestratorActivityObservation[] & {
      note?: string;
    };
    decorated.note = "must not survive";
    let ownKeysCalls = 0;
    const hostile = new Proxy(decorated, {
      ownKeys() {
        ownKeysCalls += 1;
        throw new Error("caller keys must remain unreachable");
      },
    });
    const projection = compileOrchestratorAttentionProjection(hostile);
    expect(projection.observationCount).toBe(1);
    expect(ownKeysCalls).toBe(0);

    const observation = { ...ambiguousReceipt(), decoration: "discard" };
    let observationOwnKeysCalls = 0;
    const hostileObservation = new Proxy(observation, {
      ownKeys() {
        observationOwnKeysCalls += 1;
        throw new Error("observation keys must remain unreachable");
      },
    });
    expect(compileOrchestratorAttentionProjection([hostileObservation]).observationCount)
      .toBe(1);
    expect(observationOwnKeysCalls).toBe(0);

    const custom = Object.assign(
      Object.create({ inherited: true }),
      ambiguousReceipt(),
    );
    expect(() => compileOrchestratorAttentionProjection([custom]))
      .toThrow("plain or null prototype");
  });'''
          if tests.count(old_test) != 1:
              raise SystemExit("decorated-array control anchor moved")
          test_path.write_text(tests.replace(old_test, new_test, 1))
          PY

          git rm .github/workflows/lark-1171-consolidated-repair.yml
          git add src/orchestrator-attention-thread.ts \
            test/orchestrator-attention-thread.test.ts \
            test/orchestrator-attention-thread-evidence-fingerprint.test.ts \
            test/orchestrator-attention-thread-semantic-red-control.test.ts
          git diff --cached --check

      - name: Validate complete attention packet
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/orchestrator-attention-thread.test.ts \
            test/orchestrator-attention-thread-evidence-fingerprint.test.ts \
            test/orchestrator-attention-thread-semantic-red-control.test.ts

      - name: Publish one workflow-free repaired head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete causal attention admission and reconciliation"
          git fetch origin refs/heads/cinder/1153-causal-attention:refs/remotes/origin/cinder/1153-causal-attention
          test "$(git rev-parse refs/remotes/origin/cinder/1153-causal-attention)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/cinder/1153-causal-attention:$EXPECTED_HEAD \
            origin HEAD:refs/heads/cinder/1153-causal-attention
