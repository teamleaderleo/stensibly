name: Lark 975 final proposal admission repair

on:
  pull_request:
    paths:
      - .github/workflows/lark-975-final-proposal-admission.yml

permissions:
  contents: write

concurrency:
  group: lark-975-final-proposal-admission
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lynx/973-context-acceptance-composer
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply final proposal re-admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/github-provider-context-acceptance-composer.ts")
          text = source.read_text()

          import_before = '''import type {
            GitHubProviderContextReconciliationProposalV1,
          } from "./github-provider-context-reconciliation.js";
          import {
            admitAcceptedRepositoryInstructionSet,
          '''
          import_after = '''import type {
            GitHubProviderContextReconciliationProposalV1,
          } from "./github-provider-context-reconciliation.js";
          import {
            containsRealisticRetainedCredential,
          } from "./github-retained-credential-policy.js";
          import {
            admitAcceptedRepositoryInstructionSet,
          '''
          if text.count(import_before) != 1:
            raise SystemExit("composer retained-policy import anchor changed")
          text = text.replace(import_before, import_after, 1)

          const_before = '''const bindingOutcomes = new Set<GitHubIssueContextAcceptanceOutcome>([
            "initial",
            "updated",
            "instruction_rebound",
            "synchronization_updated",
          ]);
          const hashPattern = /^sha256:[a-f0-9]{64}$/u;
          '''
          const_after = '''const bindingOutcomes = new Set<GitHubIssueContextAcceptanceOutcome>([
            "initial",
            "updated",
            "instruction_rebound",
            "synchronization_updated",
          ]);
          const maximumGitHubProviderItemNumber = 2_147_483_647;
          const hashPattern = /^sha256:[a-f0-9]{64}$/u;
          '''
          if text.count(const_before) != 1:
            raise SystemExit("composer item-ceiling constant anchor changed")
          text = text.replace(const_before, const_after, 1)

          pattern_before = '''const credentialPattern =
            /(?:github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|stn\\.tok_[A-Za-z0-9._-]{20,}|xox[baprs]-[A-Za-z0-9-]{16,}|(?:env|secret):\\/\\/[A-Za-z0-9][A-Za-z0-9._\\/-]{0,231}|eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,})/iu;
          '''
          if text.count(pattern_before) != 1:
            raise SystemExit("composer local credential pattern anchor changed")
          text = text.replace(pattern_before, "", 1)
          text = text.replace(
            "credentialPattern.test(value)",
            "containsRealisticRetainedCredential(value)",
          )
          text = text.replace(
            "credentialPattern.test(repository)",
            "containsRealisticRetainedCredential(repository)",
          )
          text = text.replace(
            "credentialPattern.test(externalId)",
            "containsRealisticRetainedCredential(externalId)",
          )
          if "credentialPattern" in text:
            raise SystemExit("stale composer credential policy remains")

          chronology_before = '''  const outcome = proposal.outcome as GitHubProviderContextReconciliationProposalV1["outcome"];
            const nextAction = proposal.nextAction as GitHubProviderContextReconciliationProposalV1["nextAction"];
            const providerSnapshot = proposal.providerSnapshot === null
          '''
          chronology_after = '''  const outcome = proposal.outcome as GitHubProviderContextReconciliationProposalV1["outcome"];
            const nextAction = proposal.nextAction as GitHubProviderContextReconciliationProposalV1["nextAction"];
            if (
              (operation === "github_create_issue" && currentSourceRevision !== null)
              || (
                outcome === "propose_context_acceptance"
                && currentSourceRevision !== null
                && currentSourceRevision === providerSourceRevision
              )
            ) {
              throw new RangeError("GitHub reconciliation proposal semantics are invalid");
            }
            const providerSnapshot = proposal.providerSnapshot === null
          '''
          if text.count(chronology_before) != 1:
            raise SystemExit("composer early chronology anchor changed")
          text = text.replace(chronology_before, chronology_after, 1)

          item_before = '''  if (externalId !== value) {
            throw new RangeError("GitHub issue external ID must be canonical");
          }
            if (containsRealisticRetainedCredential(externalId)) {
          '''
          item_after = '''  if (externalId !== value) {
            throw new RangeError("GitHub issue external ID must be canonical");
          }
            if (parsed.number > maximumGitHubProviderItemNumber) {
              throw new RangeError("GitHub issue external ID is invalid");
            }
            if (containsRealisticRetainedCredential(externalId)) {
          '''
          if text.count(item_before) != 1:
            raise SystemExit("composer external-ID ceiling anchor changed")
          text = text.replace(item_before, item_after, 1)

          source.write_text(text)
          PY
          git diff --check

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-provider-context-acceptance-composer.test.ts \
            test/github-provider-context-acceptance-composer-privacy.test.ts \
            test/github-provider-context-acceptance-composer-proposal-chronology.test.ts \
            test/github-provider-context-acceptance-composer-enum-coercion.test.ts \
            test/github-provider-context-acceptance-composer-final-proposal-admission.test.ts

      - name: Publish source and control only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/lynx/973-context-acceptance-composer:refs/remotes/origin/lynx/973-context-acceptance-composer
          test "$(git rev-parse refs/remotes/origin/lynx/973-context-acceptance-composer)" = "$EXPECTED_HEAD"
          rm .github/workflows/lark-975-final-proposal-admission.yml
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-provider-context-acceptance-composer.ts \
            .github/workflows/lark-975-final-proposal-admission.yml
          git diff --cached --check
          git commit -m "Use final proposal admission in context composer"
          git push --force-with-lease=refs/heads/lynx/973-context-acceptance-composer:$EXPECTED_HEAD \
            origin HEAD:refs/heads/lynx/973-context-acceptance-composer
