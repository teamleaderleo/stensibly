name: Publish streaming provider response bounds

on:
  push:
    branches:
      - lark/972-streaming-provider-response-bound

permissions:
  contents: write

concurrency:
  group: lark-976-streaming-bound
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      TARGET_BRANCH: lark/972-streaming-provider-response-bound
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Apply exact source edits
        run: python3 .github/scripts/lark-976-streaming-bound.py
      - name: Publish source-only child
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/lark-976-streaming-bound.yml
          rm .github/scripts/lark-976-streaming-bound.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            .github/workflows/lark-976-streaming-bound.yml \
            .github/scripts/lark-976-streaming-bound.py \
            src/github-rest-issue-write-adapter.ts \
            src/github-rest-issue-set-write-adapter.ts
          git commit -m "Bound GitHub write response streams"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}"
