name: Apply Merkle retained-identity privacy repair

on:
  push:
    branches:
      - lark/955-observation-merkle-checkpoints

permissions:
  contents: write

concurrency:
  group: lark-merkle-identity-fix
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      TARGET_BRANCH: lark/955-observation-merkle-checkpoints
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Apply exact source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-observation-merkle-checkpoint.ts")
          source = path.read_text()
          old_constants = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const maximumLeaves = 4_096;'''
          new_constants = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const realisticCredentialPattern =
            /(?:^|[\\s:./=,;'"()[\\]{}@#_-])(?:Bearer\\s+[A-Za-z0-9._~+/-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|stn\\.tok_[A-Za-z0-9._-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|(?:env|secret):\\/\\/[A-Za-z0-9][A-Za-z0-9._/-]{0,231}|eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,})(?=$|[\\s:./=,;'"()[\\]{}@#_-])/imu;
          const maximumLeaves = 4_096;'''
          old_guard = '''    || Buffer.byteLength(value, "utf8") > maximumBytes
              || unsafeIdentityPattern.test(value)
            ) {'''
          new_guard = '''    || Buffer.byteLength(value, "utf8") > maximumBytes
              || unsafeIdentityPattern.test(value)
              || realisticCredentialPattern.test(value)
            ) {'''
          if source.count(old_constants) != 1:
              raise SystemExit("credential constant insertion point drifted")
          if source.count(old_guard) != 1:
              raise SystemExit("bounded identity guard insertion point drifted")
          source = source.replace(old_constants, new_constants)
          source = source.replace(old_guard, new_guard)
          path.write_text(source)
          PY
      - name: Publish source-only repair and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
          rm .github/workflows/lark-merkle-identity-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/github-observation-merkle-checkpoint.ts .github/workflows/lark-merkle-identity-fix.yml
          git commit -m "Reject credential-shaped Merkle identities"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}"
