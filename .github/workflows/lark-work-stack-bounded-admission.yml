name: Lark work-stack bounded admission repair

on:
  push:
    branches:
      - lark/work-stack-bounded-admission
    paths:
      - .github/workflows/lark-work-stack-bounded-admission.yml

permissions:
  contents: write

concurrency:
  group: lark-work-stack-bounded-admission
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lark/work-stack-bounded-admission
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-main parent
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "b6aca3197591ead0e1251e4835c17b871aa7a8eb"
          test "$(git rev-parse HEAD^:src/work-stack-projection-validation.ts)" = "2e4c7aa3667aee1b2af87a2fab2936d6cce516a1"
          test "$(git rev-parse HEAD^:src/work-stack-projection-admission.ts)" = "4c516f5aa34d7a480a79af497d1fca290add2e00"
          test "$(git rev-parse HEAD^:test/work-stack-projection.test.ts)" = "f69f9d98fa4d87052e2919d7389c5a2eb7022012"

      - uses: oven-sh/setup-bun@v2

      - name: Detach declared work-stack fields without caller key enumeration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validation_path = Path("src/work-stack-projection-validation.ts")
          validation = validation_path.read_text()
          start = validation.index('export function requirePlainObject(')
          end = validation.index('export function lowercaseSlug(', start)
          replacement = '''export function snapshotPlainObject(\n  value: unknown,\n  keys: readonly string[],\n  label: string,\n): Record<string, unknown> {\n  if (value === null || typeof value !== "object" || Array.isArray(value)) {\n    throw new TypeError(`${label} must be a plain object`);\n  }\n  let prototype: object | null;\n  try {\n    prototype = Object.getPrototypeOf(value);\n  } catch {\n    throw new TypeError(`${label} could not be inspected`);\n  }\n  if (prototype !== Object.prototype) {\n    throw new TypeError(`${label} must be a plain object`);\n  }\n  const result = Object.create(null) as Record<string, unknown>;\n  for (const key of keys) {\n    let descriptor: PropertyDescriptor | undefined;\n    try {\n      descriptor = Object.getOwnPropertyDescriptor(value, key);\n    } catch {\n      throw new TypeError(`${label} could not be inspected`);\n    }\n    if (!descriptor) {\n      throw new TypeError(`${label} has an invalid field set`);\n    }\n    if (!("value" in descriptor) || !descriptor.enumerable) {\n      throw new TypeError(`${label} fields must be enumerable data properties`);\n    }\n    result[key] = descriptor.value;\n  }\n  return result;\n}\n\nexport function denseDataArray<T>(value: unknown, max: number, label: string): T[] {\n  if (!Array.isArray(value)) {\n    throw new TypeError(`${label} must be a bounded ordinary array`);\n  }\n  let prototype: object | null;\n  let lengthDescriptor: PropertyDescriptor | undefined;\n  try {\n    prototype = Object.getPrototypeOf(value);\n    lengthDescriptor = Object.getOwnPropertyDescriptor(value, "length");\n  } catch {\n    throw new TypeError(`${label} could not be inspected`);\n  }\n  const length = lengthDescriptor && "value" in lengthDescriptor\n    ? lengthDescriptor.value\n    : undefined;\n  if (\n    prototype !== Array.prototype\n    || typeof length !== "number"\n    || !Number.isSafeInteger(length)\n    || length < 0\n    || length > max\n  ) {\n    throw new TypeError(`${label} must be a bounded ordinary array`);\n  }\n  const result: T[] = [];\n  for (let index = 0; index < length; index += 1) {\n    let descriptor: PropertyDescriptor | undefined;\n    try {\n      descriptor = Object.getOwnPropertyDescriptor(value, String(index));\n    } catch {\n      throw new TypeError(`${label} could not be inspected`);\n    }\n    if (!descriptor || !("value" in descriptor) || !descriptor.enumerable) {\n      throw new TypeError(`${label} entries must be enumerable data properties`);\n    }\n    result.push(descriptor.value as T);\n  }\n  return result;\n}\n\n'''
          validation_path.write_text(validation[:start] + replacement + validation[end:])

          admission_path = Path("src/work-stack-projection-admission.ts")
          admission = admission_path.read_text()
          admission = admission.replace('  requirePlainObject,\n', '  snapshotPlainObject,\n', 1)

          old = '''export function admitProjectionInput(value: WorkStackProjectionInput): AdmittedProjectionInput {\n  requirePlainObject(\n    value,\n    ["version", "project", "observedAt", "selectedId", "limits", "records"],\n    "work-stack input",\n  );\n  if (value.version !== WORK_STACK_PROJECTION_VERSION) {\n    throw new TypeError("Unsupported work-stack projection version");\n  }\n  const project = lowercaseSlug(value.project, "project");\n  const observedAt = canonicalTimestamp(value.observedAt, "observedAt");\n  const selectedId = value.selectedId === null\n    ? null\n    : boundedIdentity(value.selectedId, "selectedId");\n  requirePlainObject(value.limits, ["hot", "review", "warm", "index"], "work-stack limits");\n  const limits = {\n    hot: boundedInteger(value.limits.hot, 1, WORK_STACK_LIMITS.maxHot, "hot limit"),\n    review: boundedInteger(\n      value.limits.review,\n      1,\n      WORK_STACK_LIMITS.maxReview,\n      "review limit",\n    ),\n    warm: boundedInteger(value.limits.warm, 1, WORK_STACK_LIMITS.maxWarm, "warm limit"),\n    index: boundedInteger(value.limits.index, 1, WORK_STACK_LIMITS.maxIndex, "index limit"),\n  };\n  const records = denseDataArray(\n    value.records,\n    WORK_STACK_LIMITS.maxInputRecords,\n    "records",\n  );'''
          new = '''export function admitProjectionInput(value: WorkStackProjectionInput): AdmittedProjectionInput {\n  const input = snapshotPlainObject(\n    value,\n    ["version", "project", "observedAt", "selectedId", "limits", "records"],\n    "work-stack input",\n  );\n  if (input.version !== WORK_STACK_PROJECTION_VERSION) {\n    throw new TypeError("Unsupported work-stack projection version");\n  }\n  const project = lowercaseSlug(input.project, "project");\n  const observedAt = canonicalTimestamp(input.observedAt, "observedAt");\n  const selectedId = input.selectedId === null\n    ? null\n    : boundedIdentity(input.selectedId, "selectedId");\n  const rawLimits = snapshotPlainObject(\n    input.limits,\n    ["hot", "review", "warm", "index"],\n    "work-stack limits",\n  );\n  const limits = {\n    hot: boundedInteger(rawLimits.hot, 1, WORK_STACK_LIMITS.maxHot, "hot limit"),\n    review: boundedInteger(\n      rawLimits.review,\n      1,\n      WORK_STACK_LIMITS.maxReview,\n      "review limit",\n    ),\n    warm: boundedInteger(rawLimits.warm, 1, WORK_STACK_LIMITS.maxWarm, "warm limit"),\n    index: boundedInteger(rawLimits.index, 1, WORK_STACK_LIMITS.maxIndex, "index limit"),\n  };\n  const records = denseDataArray<WorkStackRecordInput>(\n    input.records,\n    WORK_STACK_LIMITS.maxInputRecords,\n    "records",\n  );'''
          if admission.count(old) != 1:
              raise SystemExit("projection input anchor moved")
          admission = admission.replace(old, new, 1)

          record_start = admission.index('function admitRecord(')
          record_end = admission.index('function admitLink(', record_start)
          record_block = admission[record_start:record_end]
          record_block = record_block.replace('  requirePlainObject(value, [\n', '  const input = snapshotPlainObject(value, [\n', 1)
          record_block = record_block.replace('  ], "work-stack record");\n  const record:', '  ], "work-stack record");\n  const record:', 1)
          for field in [
            'id', 'project', 'kind', 'title', 'state', 'priority', 'summary', 'nextAction',
            'owner', 'createdAt', 'updatedAt', 'actionableAt', 'latestEvidenceAt',
            'attentionReason', 'reviewState', 'blockedFanOut', 'links'
          ]:
              record_block = record_block.replace(f'value.{field}', f'input.{field}')
          record_block = record_block.replace('    links: denseDataArray(\n      input.links,', '    links: denseDataArray<WorkStackLinkInput>(\n      input.links,', 1)
          admission = admission[:record_start] + record_block + admission[record_end:]

          link_start = admission.index('function admitLink(')
          link_end = admission.index('function compareLinks(', link_start)
          link_block = admission[link_start:link_end]
          old_link = '''function admitLink(value: WorkStackLinkInput): WorkStackLinkInput {\n  requirePlainObject(value, ["kind", "identity", "href", "label"], "work-stack link");\n  return {\n    kind: enumValue(value.kind, linkKinds, "link kind"),\n    identity: boundedIdentity(value.identity, "link identity"),\n    href: admitHref(value.href),\n    label: boundedText(value.label, 1, 160, "link label"),\n  };\n}\n\n'''
          new_link = '''function admitLink(value: WorkStackLinkInput): WorkStackLinkInput {\n  const input = snapshotPlainObject(\n    value,\n    ["kind", "identity", "href", "label"],\n    "work-stack link",\n  );\n  return {\n    kind: enumValue(input.kind, linkKinds, "link kind"),\n    identity: boundedIdentity(input.identity, "link identity"),\n    href: admitHref(input.href),\n    label: boundedText(input.label, 1, 160, "link label"),\n  };\n}\n\n'''
          if link_block != old_link:
              raise SystemExit("link admission anchor moved")
          admission = admission[:link_start] + new_link + admission[link_end:]
          admission_path.write_text(admission)

          test_path = Path("test/work-stack-projection.test.ts")
          tests = test_path.read_text()
          old_decorated = '''    const decorated = [record(1)] as WorkStackRecordInput[] & { note?: string };\n    decorated.note = "decoration";\n    expect(() => compileWorkStackProjection(input(decorated)))\n      .toThrow("records must contain only dense array entries");\n'''
          new_decorated = '''    const decorated = [record(1)] as WorkStackRecordInput[] & { note?: string };\n    decorated.note = "decoration";\n    let arrayOwnKeysCalls = 0;\n    const hostileArray = new Proxy(decorated, {\n      ownKeys() {\n        arrayOwnKeysCalls += 1;\n        throw new Error("caller array keys must remain unreachable");\n      },\n    });\n    expect(compileWorkStackProjection(input(hostileArray)).counts.available).toBe(1);\n    expect(arrayOwnKeysCalls).toBe(0);\n\n    const stableRecord = record(2);\n    let recordGets = 0;\n    let recordOwnKeysCalls = 0;\n    const hostileRecord = new Proxy(stableRecord, {\n      get(target, key, receiver) {\n        recordGets += 1;\n        if (key === "title") return "Substituted title";\n        return Reflect.get(target, key, receiver);\n      },\n      ownKeys() {\n        recordOwnKeysCalls += 1;\n        throw new Error("caller record keys must remain unreachable");\n      },\n    });\n    const detachedProjection = compileWorkStackProjection(input([hostileRecord]));\n    expect(detachedProjection.warmSummaries[0]?.title).toBe("Item 2");\n    expect(recordGets).toBe(0);\n    expect(recordOwnKeysCalls).toBe(0);\n'''
          if tests.count(old_decorated) != 1:
              raise SystemExit("decorated work-stack control anchor moved")
          test_path.write_text(tests.replace(old_decorated, new_decorated, 1))
          PY
          git diff --check

      - name: Validate bounded work-stack admission
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/work-stack-projection*.test.ts

      - name: Publish workflow-free repair
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lark-work-stack-bounded-admission.yml
          git add src/work-stack-projection-validation.ts \
            src/work-stack-projection-admission.ts \
            test/work-stack-projection.test.ts
          git diff --cached --check
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bound work-stack caller admission"
          git fetch origin refs/heads/lark/work-stack-bounded-admission:refs/remotes/origin/lark/work-stack-bounded-admission
          test "$(git rev-parse refs/remotes/origin/lark/work-stack-bounded-admission)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/lark/work-stack-bounded-admission:$EXPECTED_HEAD origin HEAD:refs/heads/lark/work-stack-bounded-admission
