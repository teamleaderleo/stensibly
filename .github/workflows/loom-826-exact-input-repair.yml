name: Loom 826 exact input repair

on:
  push:
    branches:
      - lumen/786-current-main-replay

permissions:
  contents: write

concurrency:
  group: loom-826-exact-input-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/lumen/786-current-main-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/786-current-main-replay
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply exact-byte evaluator repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const input = fs.readFileSync(path, 'utf8');
            const first = input.indexOf(before);
            if (first < 0 || input.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one repair marker in ${path}`);
            }
            fs.writeFileSync(path, input.slice(0, first) + after + input.slice(first + before.length));
          }

          replaceOnce(
            'src/coordination-graph.ts',
            ': parseReference(record.selectedProducer, "Coordination selected producer"),',
            ': parseExactReference(record.selectedProducer, "Coordination selected producer"),',
          );

          replaceOnce(
            'src/coordination-graph.ts',
            '      ).map(boundedNodeKey),\n',
            '      ).map(boundedExactNodeKey),\n',
          );

          replaceOnce(
            'src/coordination-graph.ts',
            `function parseFingerprintDependency(input: unknown): CoordinationFingerprintDependency {`,
            `function parseExactReference(input: unknown, label: string): CoordinationNodeReference {\n  const record = exactRecord(input, referenceKeys, referenceKeys, label);\n  return {\n    id: boundedExactIdentifier(record.id, \`${'${label}'} ID\`, 160),\n    generation: positiveInteger(record.generation, \`${'${label}'} generation\`),\n  };\n}\n\nfunction parseFingerprintDependency(input: unknown): CoordinationFingerprintDependency {`,
          );

          replaceOnce(
            'src/coordination-graph.ts',
            `function boundedNodeKey(value: unknown): string {`,
            `function boundedExactNodeKey(value: unknown): string {\n  if (typeof value !== "string" || value !== value.trim()) {\n    throw new Error("Coordination node key must use exact bytes");\n  }\n  return boundedNodeKey(value);\n}\n\nfunction boundedNodeKey(value: unknown): string {`,
          );

          replaceOnce(
            'src/coordination-graph.ts',
            `function boundedIdentifier(value: unknown, label: string, maximum: number): string {`,
            `function boundedExactIdentifier(value: unknown, label: string, maximum: number): string {\n  if (typeof value !== "string" || value !== value.trim()) {\n    throw new Error(\`${'${label}'} must use exact bytes\`);\n  }\n  return boundedIdentifier(value, label, maximum);\n}\n\nfunction boundedIdentifier(value: unknown, label: string, maximum: number): string {`,
          );

          replaceOnce(
            'test/coordination-graph-integrity.test.ts',
            `  test("requires explicit evaluation time", () => {`,
            `  test("rejects padded aliases for selected producers and changed-node identities", () => {\n    const input = fixture();\n    const paddedDecision = {\n      ...input.nodes.find(({ id }) => id === "decision")!,\n      selectedProducer: { id: " candidate-a ", generation: 1 },\n    };\n    expect(() => canonicalizeCoordinationGraph(selectedGraph(\n      input.nodes.find(({ id }) => id === "candidate-a")!,\n      input.nodes.find(({ id }) => id === "candidate-b")!,\n      paddedDecision,\n      input.nodes.find(({ id }) => id === "projection")!,\n    ))).toThrow("Coordination selected producer ID must use exact bytes");\n\n    expect(() => evaluateCoordinationGraph(input, {\n      evaluatedAt,\n      changedNodeKeys: [" decision@1 "],\n    })).toThrow("Coordination node key must use exact bytes");\n\n    expect(canonicalizeCoordinationGraph(input).nodes.find(\n      ({ id }) => id === "decision",\n    )?.selectedProducer).toEqual({ id: "candidate-a", generation: 1 });\n    expect(evaluateCoordinationGraph(input, {\n      evaluatedAt,\n      changedNodeKeys: ["decision@1"],\n    }).changedNodeKeys).toEqual(["decision@1"]);\n  });\n\n  test("requires explicit evaluation time", () => {`,
          );

          replaceOnce(
            'docs/coordination-graph-core.md',
            `A cloned, reconstructed, reordered, or caller-authored evaluation object is treated as an invalid options object and fails before any supplied state, reason, timestamp, ordering, or fingerprint can be rendered. Serialized callers should retain graph inputs plus explicit evaluation inputs and recompute the disposable view.`,
            `A cloned, reconstructed, reordered, or caller-authored evaluation object is treated as an invalid options object and fails before any supplied state, reason, timestamp, ordering, or fingerprint can be rendered. Selected-producer references and changed-node keys reject surrounding-whitespace aliases so distinct caller bytes cannot collapse into one receipt or evaluation identity. Serialized callers should retain graph inputs plus explicit evaluation inputs and recompute the disposable view.`,
          );
          NODE
          git diff --check
      - run: bun run typecheck
      - run: bun test test/coordination-graph.test.ts test/coordination-graph-validation.test.ts test/coordination-graph-integrity.test.ts
      - name: Publish source-only repaired head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/loom-826-exact-input-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/coordination-graph.ts test/coordination-graph-integrity.test.ts docs/coordination-graph-core.md .github/workflows/loom-826-exact-input-repair.yml
          git commit -m "Reject padded evaluator identities"
          git push origin HEAD:lumen/786-current-main-replay
