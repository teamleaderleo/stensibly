name: Lumen 1000 Junco trigger

on:
  push:
    branches:
      - cicada/962-current-main-merkle-replay
    paths:
      - .github/workflows/lumen-1000-junco-trigger.yml

permissions:
  contents: write

concurrency:
  group: lumen-1000-junco-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cicada/962-current-main-merkle-replay
          fetch-depth: 0
          persist-credentials: true

      - name: Trigger exact Junco Merkle publisher
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: cicada/962-current-main-merkle-replay
          JUNCO_BLOB: c94c070c7a568f640185d74527fc13df48a28e4e
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:.github/workflows/lumen-1000-record-snapshot-repair.yml)" = "$JUNCO_BLOB"
          printf '\n# Lumen exact trigger %s\n' "$EXPECTED_HEAD" \
            >> .github/workflows/lumen-1000-record-snapshot-repair.yml
          git rm .github/workflows/lumen-1000-junco-trigger.yml
          git add .github/workflows/lumen-1000-record-snapshot-repair.yml
          git diff --cached --check
          git config user.name "Lumen"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Trigger Merkle current-main publisher"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${HEAD_REF}"
