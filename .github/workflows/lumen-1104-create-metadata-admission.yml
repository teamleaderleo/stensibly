name: Lumen 1104 create metadata admission finalizer

on:
  push:
    branches:
      - cedar/github-create-issue-initial-metadata

permissions:
  contents: write

concurrency:
  group: lumen-1104-create-metadata-admission
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/github-create-issue-initial-metadata
          fetch-depth: 2

      - name: Verify exact carrier parent
        run: test "$(git rev-parse HEAD^)" = "09d70fe9e4858b1f2128bff1cdc3bf01427317f8"

      - uses: oven-sh/setup-bun@v2

      - name: Tighten public metadata admission
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/github-issue-provider-mcp.ts")
          source = source_path.read_text()
          old_schema = '''        labels: z.array(z.string().trim().min(1).max(100)).max(100).optional(),
                  assignees: z.array(z.string().trim().min(1).max(39)).max(10).optional(),'''
          new_schema = '''        labels: uniqueLabelsSchema().optional(),
                  assignees: uniqueAssigneesSchema().optional(),'''
          if source.count(old_schema) != 1:
              raise SystemExit("create metadata schema anchor moved")
          source = source.replace(old_schema, new_schema)

          helper_anchor = '''function idempotencyKeySchema() {
            return z.string().trim().min(1).max(240);
          }
          '''
          helpers = '''function labelSchema() {
            return z.string().trim().min(1).max(100);
          }

          function loginSchema() {
            return z
              .string()
              .trim()
              .min(1)
              .max(39)
              .regex(
                /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/,
                "Use a GitHub login",
              )
              .refine((value) => !value.includes("--"), "Use a GitHub login");
          }

          function uniqueLabelsSchema() {
            return z
              .array(labelSchema())
              .max(100)
              .refine(
                (values) => new Set(values).size === values.length,
                "GitHub labels must be unique",
              );
          }

          function uniqueAssigneesSchema() {
            return z
              .array(loginSchema())
              .max(10)
              .refine(
                (values) => new Set(values.map((value) => value.toLowerCase())).size === values.length,
                "GitHub assignees must be unique",
              );
          }

          '''
          if source.count(helper_anchor) != 1:
              raise SystemExit("schema helper anchor moved")
          source = source.replace(helper_anchor, helpers + helper_anchor)
          source_path.write_text(source)

          test_path = Path("test/mcp-github-issue-provider-write-composition.test.ts")
          test = test_path.read_text()
          test_anchor = '''      expect(tooManyLabels.isError).toBe(true);
                expect(calls).toHaveLength(3);
              } finally {'''
          tests = '''      expect(tooManyLabels.isError).toBe(true);
                expect(calls).toHaveLength(3);

                const invalidAssignee = await client.callTool({
                  name: "github_create_issue",
                  arguments: {
                    project,
                    repository,
                    title: "must not dispatch",
                    assignees: ["invalid_login"],
                    idempotencyKey: "invalid-assignee",
                  },
                });
                expect(invalidAssignee.isError).toBe(true);
                expect(calls).toHaveLength(3);

                const duplicateLabels = await client.callTool({
                  name: "github_create_issue",
                  arguments: {
                    project,
                    repository,
                    title: "must not dispatch",
                    labels: ["area:github", "area:github"],
                    idempotencyKey: "duplicate-labels",
                  },
                });
                expect(duplicateLabels.isError).toBe(true);
                expect(calls).toHaveLength(3);

                const duplicateAssignees = await client.callTool({
                  name: "github_create_issue",
                  arguments: {
                    project,
                    repository,
                    title: "must not dispatch",
                    assignees: ["TeamLeaderLeo", "teamleaderleo"],
                    idempotencyKey: "duplicate-assignees",
                  },
                });
                expect(duplicateAssignees.isError).toBe(true);
                expect(calls).toHaveLength(3);
              } finally {'''
          if test.count(test_anchor) != 1:
              raise SystemExit("metadata test anchor moved")
          test = test.replace(test_anchor, tests)
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify repaired candidate
        run: |
          bun run typecheck
          bun test ./test/mcp-github-issue-provider-write-composition.test.ts

      - name: Publish workflow-free source head
        run: |
          git rm .github/workflows/lumen-1104-create-metadata-admission.yml
          git add src/github-issue-provider-mcp.ts test/mcp-github-issue-provider-write-composition.test.ts
          git config user.name "Lumen"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Tighten initial GitHub issue metadata admission"
          git push origin HEAD:cedar/github-create-issue-initial-metadata
