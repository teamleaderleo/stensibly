name: Lumen 1160 bounded recipe repair

on:
  push:
    branches:
      - lumen/1146-execution-recipes
    paths:
      - .github/workflows/lumen-1160-bounded-repair.yml

permissions:
  contents: write

concurrency:
  group: lumen-1160-bounded-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/1146-execution-recipes
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact blocked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/execution-recipe.ts)" = "aee287e6a6c83327312e0ea2f9c0fe9a216a9b64"
          test "$(git rev-parse HEAD:test/execution-recipe.test.ts)" = "c62525d8345dee56d9f178b4621d70116d9f58f8"
          test "$(git rev-parse HEAD:test/execution-recipe-boundary.test.ts)" = "cf641ac8cd2102e828238eef2015c7511adbc1d6"
          test -f test/execution-recipe-input-inspection.test.ts
          test -f .github/workflows/oriole-1160-checkpoint-coherence.yml

      - uses: oven-sh/setup-bun@v2

      - name: Apply descriptor-only caller snapshot and checkpoint repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/execution-recipe.ts")
          text = source.read_text()

          compile_old = '''  const detached = detachInputGraph(value);\n  const recipe = admitRecipe(detached);\n'''
          compile_new = '''  const detached = snapshotRecipeInput(value);\n  const recipe = admitRecipe(detached);\n'''
          if text.count(compile_old) != 1:
              raise SystemExit("compile snapshot anchor moved")
          text = text.replace(compile_old, compile_new, 1)

          instantiate_old = '''  const detached = detachInputGraph(value);\n  requirePlainObject(\n'''
          instantiate_new = '''  const detached = snapshotInstantiationInput(value);\n  requirePlainObject(\n'''
          if text.count(instantiate_old) != 1:
              raise SystemExit("instantiation snapshot anchor moved")
          text = text.replace(instantiate_old, instantiate_new, 1)

          start = text.index('function detachInputGraph(value: unknown): unknown {')
          end = text.index('function arrayLength(value: unknown[]): number {', start)
          replacement = r'''interface InputSnapshotContext {
  active: Set<object>;
  inspected: number;
}

function snapshotRecipeInput(
  value: unknown,
  context: InputSnapshotContext = { active: new Set(), inspected: 0 },
): ExecutionRecipe {
  return snapshotFixedObject(
    value,
    [
      "recipeId",
      "version",
      "outcomeClass",
      "description",
      "parameterSchema",
      "acceptedProjectProfiles",
      "requiredCapabilities",
      "requiredInputs",
      "orderedPhases",
      "checks",
      "checkpointPolicy",
      "stopConditions",
      "approvalPredicates",
      "budgetEnvelope",
      "allowedArtifacts",
      "continuationPolicy",
      "recoveryPolicy",
    ],
    context,
    (key, raw) => {
      if (key === "parameterSchema") {
        return snapshotArray(raw, context, (entry) => snapshotParameterInput(entry, context));
      }
      if (key === "orderedPhases") {
        return snapshotArray(raw, context, (entry) => snapshotPhaseInput(entry, context));
      }
      if (key === "budgetEnvelope") return snapshotBudgetInput(raw, context);
      if (
        key === "acceptedProjectProfiles"
        || key === "requiredCapabilities"
        || key === "requiredInputs"
        || key === "checks"
        || key === "stopConditions"
        || key === "approvalPredicates"
        || key === "allowedArtifacts"
      ) {
        return snapshotArray(raw, context, (entry) => entry);
      }
      return raw;
    },
  ) as ExecutionRecipe;
}

function snapshotParameterInput(
  value: unknown,
  context: InputSnapshotContext,
): ExecutionRecipeParameter {
  return snapshotFixedObject(
    value,
    ["name", "kind", "required", "minimum", "maximum", "allowedValues"],
    context,
    (key, raw) => key === "allowedValues"
      ? snapshotArray(raw, context, (entry) => entry)
      : raw,
  ) as ExecutionRecipeParameter;
}

function snapshotPhaseInput(
  value: unknown,
  context: InputSnapshotContext,
): ExecutionRecipePhase {
  return snapshotFixedObject(
    value,
    ["id", "title", "kind", "requiredCapabilities", "requiredChecks", "checkpoint"],
    context,
    (key, raw) => key === "requiredCapabilities" || key === "requiredChecks"
      ? snapshotArray(raw, context, (entry) => entry)
      : raw,
  ) as ExecutionRecipePhase;
}

function snapshotBudgetInput(
  value: unknown,
  context: InputSnapshotContext,
): ExecutionRecipeBudgetEnvelope {
  return snapshotFixedObject(
    value,
    ["maxWallMinutes", "maxSteps", "maxCostMicros"],
    context,
    (_key, raw) => raw,
  ) as ExecutionRecipeBudgetEnvelope;
}

function snapshotInstantiationInput(
  value: unknown,
): InstantiateExecutionRecipeInput {
  const context: InputSnapshotContext = { active: new Set(), inspected: 0 };
  beginInputObject(value, Object.prototype, context);
  try {
    const record = value as object;
    const recipe = snapshotRecipeInput(descriptorValue(record, "recipe"), context);
    const admittedRecipe = admitRecipe(recipe);
    const parameters = snapshotDeclaredParameters(
      descriptorValue(record, "parameters"),
      admittedRecipe.parameterSchema,
      context,
    );
    return {
      recipe,
      project: descriptorValue(record, "project") as string,
      projectProfile: descriptorValue(record, "projectProfile") as string,
      repository: descriptorValue(record, "repository") as string,
      baseRevision: descriptorValue(record, "baseRevision") as string,
      workGeneration: descriptorValue(record, "workGeneration") as number,
      policyRevision: descriptorValue(record, "policyRevision") as string,
      runnerProfile: descriptorValue(record, "runnerProfile") as string,
      authorityGeneration: descriptorValue(record, "authorityGeneration") as number,
      parameters,
    };
  } finally {
    context.active.delete(value as object);
  }
}

function snapshotDeclaredParameters(
  value: unknown,
  schema: readonly ExecutionRecipeParameter[],
  context: InputSnapshotContext,
): Record<string, unknown> {
  beginInputObject(value, Object.prototype, context);
  try {
    const result: Record<string, unknown> = {};
    for (const parameter of schema) {
      Object.defineProperty(result, parameter.name, {
        value: descriptorValue(value as object, parameter.name),
        enumerable: true,
        configurable: true,
        writable: true,
      });
    }
    return result;
  } finally {
    context.active.delete(value as object);
  }
}

function snapshotFixedObject(
  value: unknown,
  keys: readonly string[],
  context: InputSnapshotContext,
  mapValue: (key: string, raw: unknown) => unknown,
): Record<string, unknown> {
  beginInputObject(value, Object.prototype, context);
  try {
    const result: Record<string, unknown> = {};
    for (const key of keys) {
      Object.defineProperty(result, key, {
        value: mapValue(key, descriptorValue(value as object, key)),
        enumerable: true,
        configurable: true,
        writable: true,
      });
    }
    return result;
  } finally {
    context.active.delete(value as object);
  }
}

function snapshotArray(
  value: unknown,
  context: InputSnapshotContext,
  mapEntry: (entry: unknown, index: number) => unknown,
): unknown[] {
  let isArray: boolean;
  try {
    isArray = Array.isArray(value);
  } catch {
    throw inspectionError();
  }
  if (!isArray) throw inspectionError();
  beginInputObject(value, Array.prototype, context);
  try {
    const length = arrayLength(value as unknown[]);
    if (length > maximumArrayLength) {
      throw new TypeError("Execution recipe input inspection exceeded its limit");
    }
    const result = new Array<unknown>(length);
    for (let index = 0; index < length; index += 1) {
      result[index] = mapEntry(
        descriptorValue(value as object, String(index)),
        index,
      );
    }
    return result;
  } finally {
    context.active.delete(value as object);
  }
}

function beginInputObject(
  value: unknown,
  expectedPrototype: object,
  context: InputSnapshotContext,
): void {
  if (value === null || typeof value !== "object") throw inspectionError();
  context.inspected += 1;
  if (context.inspected > maximumInputObjects) {
    throw new TypeError("Execution recipe input inspection exceeded its limit");
  }
  const object = value as object;
  if (context.active.has(object)) throw inspectionError();
  try {
    if (Object.getPrototypeOf(object) !== expectedPrototype) throw inspectionError();
  } catch (error) {
    if (isInspectionError(error)) throw error;
    throw inspectionError();
  }
  context.active.add(object);
}

'''
          text = text[:start] + replacement + text[end:]

          checks_anchor = '''  const checks = identityArray(\n    dataValue(value, "checks"),\n    64,\n    "Execution recipe checks",\n    false,\n  );\n  return {\n'''
          checks_replacement = '''  const checks = identityArray(\n    dataValue(value, "checks"),\n    64,\n    "Execution recipe checks",\n    false,\n  );\n  const phases = admitPhases(\n    dataValue(value, "orderedPhases"),\n    capabilities,\n    checks,\n  );\n  const checkpointPolicy = enumValue(\n    dataValue(value, "checkpointPolicy"),\n    checkpointPolicySet,\n    "Execution recipe checkpoint policy",\n  );\n  const recoveryPolicy = enumValue(\n    dataValue(value, "recoveryPolicy"),\n    recoveryPolicySet,\n    "Execution recipe recovery policy",\n  );\n  assertCheckpointRecoveryCoherence(phases, checkpointPolicy, recoveryPolicy);\n  return {\n'''
          if text.count(checks_anchor) != 1:
              raise SystemExit("recipe coherence anchor moved")
          text = text.replace(checks_anchor, checks_replacement, 1)

          old_phases = '''    orderedPhases: admitPhases(\n      dataValue(value, "orderedPhases"),\n      capabilities,\n      checks,\n    ),\n'''
          if text.count(old_phases) != 1:
              raise SystemExit("phase field anchor moved")
          text = text.replace(old_phases, '''    orderedPhases: phases,\n''', 1)

          old_checkpoint = '''    checkpointPolicy: enumValue(\n      dataValue(value, "checkpointPolicy"),\n      checkpointPolicySet,\n      "Execution recipe checkpoint policy",\n    ),\n'''
          if text.count(old_checkpoint) != 1:
              raise SystemExit("checkpoint field anchor moved")
          text = text.replace(old_checkpoint, '''    checkpointPolicy,\n''', 1)

          old_recovery = '''    recoveryPolicy: enumValue(\n      dataValue(value, "recoveryPolicy"),\n      recoveryPolicySet,\n      "Execution recipe recovery policy",\n    ),\n'''
          if text.count(old_recovery) != 1:
              raise SystemExit("recovery field anchor moved")
          text = text.replace(old_recovery, '''    recoveryPolicy,\n''', 1)

          helper_anchor = '''function admitBudget(value: unknown): ExecutionRecipeBudgetEnvelope {\n'''
          helper = '''function assertCheckpointRecoveryCoherence(\n  phases: readonly ExecutionRecipePhase[],\n  checkpointPolicy: ExecutionRecipeCheckpointPolicy,\n  recoveryPolicy: ExecutionRecipeRecoveryPolicy,\n): void {\n  const checkpointCount = phases.filter((phase) => phase.checkpoint).length;\n  if (checkpointPolicy === "none" && checkpointCount !== 0) {\n    throw new RangeError(\n      "Execution recipe none checkpoint policy cannot mark checkpoint phases",\n    );\n  }\n  if (checkpointPolicy === "phase" && checkpointCount === 0) {\n    throw new RangeError(\n      "Execution recipe phase checkpoint policy requires a checkpoint phase",\n    );\n  }\n  if (\n    recoveryPolicy === "resume_checkpoint"\n    && (checkpointPolicy === "none" || checkpointCount === 0)\n  ) {\n    throw new RangeError(\n      "Execution recipe checkpoint recovery requires an admitted checkpoint phase",\n    );\n  }\n}\n\nfunction admitBudget(value: unknown): ExecutionRecipeBudgetEnvelope {\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit("coherence helper anchor moved")
          text = text.replace(helper_anchor, helper, 1)
          source.write_text(text)

          test_path = Path("test/execution-recipe.test.ts")
          test_text = test_path.read_text()
          marker = '''  test("rejects credential retention, undeclared phase references, and unbounded versions", () => {\n'''
          if "enforces checkpoint and recovery coherence" not in test_text:
              addition = '''  test("enforces checkpoint and recovery coherence", () => {\n    const noneWithPhase = recipe();\n    noneWithPhase.checkpointPolicy = "none";\n    noneWithPhase.recoveryPolicy = "restart_phase";\n    expect(() => compileExecutionRecipe(noneWithPhase)).toThrow(\n      "none checkpoint policy cannot mark checkpoint phases",\n    );\n\n    const phaseWithoutCheckpoint = recipe();\n    phaseWithoutCheckpoint.orderedPhases = phaseWithoutCheckpoint.orderedPhases.map(\n      (phase) => ({ ...phase, checkpoint: false }),\n    );\n    phaseWithoutCheckpoint.recoveryPolicy = "restart_phase";\n    expect(() => compileExecutionRecipe(phaseWithoutCheckpoint)).toThrow(\n      "phase checkpoint policy requires a checkpoint phase",\n    );\n\n    const resumeWithoutCheckpoint = recipe();\n    resumeWithoutCheckpoint.checkpointPolicy = "manual";\n    resumeWithoutCheckpoint.orderedPhases = resumeWithoutCheckpoint.orderedPhases.map(\n      (phase) => ({ ...phase, checkpoint: false }),\n    );\n    expect(() => compileExecutionRecipe(resumeWithoutCheckpoint)).toThrow(\n      "checkpoint recovery requires an admitted checkpoint phase",\n    );\n\n    const validNone = recipe();\n    validNone.checkpointPolicy = "none";\n    validNone.recoveryPolicy = "restart_phase";\n    validNone.orderedPhases = validNone.orderedPhases.map(\n      (phase) => ({ ...phase, checkpoint: false }),\n    );\n    expect(() => compileExecutionRecipe(validNone)).not.toThrow();\n\n    const validManual = recipe();\n    validManual.checkpointPolicy = "manual";\n    expect(() => compileExecutionRecipe(validManual)).not.toThrow();\n  });\n\n'''
              if marker not in test_text:
                  raise SystemExit("checkpoint test anchor moved")
              test_text = test_text.replace(marker, addition + marker, 1)
          test_path.write_text(test_text)
          PY
          git diff --check

      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/execution-recipe.test.ts \
            test/execution-recipe-boundary.test.ts \
            test/execution-recipe-input-inspection.test.ts

      - name: Publish source-only branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/oriole-1160-checkpoint-coherence.yml
          git rm .github/workflows/lumen-1160-bounded-repair.yml
          git add src/execution-recipe.ts test/execution-recipe.test.ts
          git diff --cached --check
          git config user.name "Lumen"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bound execution recipe caller inspection"
          git push origin HEAD:lumen/1146-execution-recipes
