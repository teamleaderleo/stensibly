name: Lumen 1186 classify stale-ref conflicts

on:
  push:
    branches:
      - lumen/1163-updaterefs-cas-repair
    paths:
      - .github/workflows/lumen-1186-fix-carrier-anchors.yml

permissions:
  contents: write

concurrency:
  group: lumen-1186-fix-carrier-anchors
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/1163-updaterefs-cas-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact live carrier
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "1d398b152dde5a2ca81d152a5fd5e050b36c3c8c"
          test "$(git rev-parse HEAD:.github/workflows/lumen-1163-updaterefs-cas-repair.yml)" = "da5a36937752762b3707c18319f3d5c80f5d6d94"

      - name: Classify standards-compliant stale-ref GraphQL conflicts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/lumen-1163-updaterefs-cas-repair.yml")
          text = path.read_text()
          old = '''  if (envelope.errors !== undefined) {
    throw new Error("GitHub could not publish repository ref");
  }
'''
          new = '''  if (envelope.errors !== undefined) {
    let staleRef = false;
    try {
      const errors = exactArray(
        envelope.errors,
        "GitHub updateRefs GraphQL errors",
        1,
      );
      if (errors.length === 1) {
        const error = exactRecord(errors[0]);
        const data = exactRecord(envelope.data);
        staleRef =
          typeof error.message === "string"
          && error.type === "STALE_REF"
          && Object.keys(data).length === 1
          && data.updateRefs === null;
      }
    } catch {
      staleRef = false;
    }
    if (staleRef) {
      throw new Error(
        "GitHub repository write exact old ref changed before publication",
      );
    }
    throw new Error("GitHub could not publish repository ref");
  }
'''
          if text.count(old) != 1:
            raise SystemExit("GraphQL errors admission anchor moved")
          text = text.replace(old, new, 1)

          stale_fixture = 'errors: [{ type: "STALE_REF" }],'
          compliant_fixture = 'errors: [{ message: "provider stale ref detail", type: "STALE_REF" }],'
          if text.count(stale_fixture) != 1:
            raise SystemExit("stale-ref GraphQL fixture anchor moved")
          text = text.replace(stale_fixture, compliant_fixture, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/lumen-1186-fix-carrier-anchors.yml
          git add .github/workflows/lumen-1163-updaterefs-cas-repair.yml
          git diff --cached --check
          git config user.name "Junco"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Admit standards-compliant stale-ref GraphQL errors"
          git fetch origin refs/heads/lumen/1163-updaterefs-cas-repair:refs/remotes/origin/lumen/1163-updaterefs-cas-repair
          test "$(git rev-parse refs/remotes/origin/lumen/1163-updaterefs-cas-repair)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/lumen/1163-updaterefs-cas-repair:$EXPECTED_HEAD origin HEAD:refs/heads/lumen/1163-updaterefs-cas-repair
