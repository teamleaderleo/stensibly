name: Lumen 1208 final exact-CAS convergence

on:
  push:
    branches:
      - juniper/1163-updaterefs-cas-integration
    paths:
      - .github/workflows/lumen-1208-final-convergence.yml

permissions:
  contents: write

concurrency:
  group: lumen-1208-final-exact-cas-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-updaterefs-cas-integration
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current carrier
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          CARRIER_PARENT: 737f2c894069e1fea86c52d21dfaea57b77c4bc4
          CAS_REPAIR: 795b45666ba7c7e4f2cdeeb2706ef068c06b8f64
          REQUIRED_FIELDS_CONTROL: 68d620992a2359a482e2c7f3c627ab2bb0fd49c4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git rev-parse HEAD^:src/github-rest-repository-write-atomic-publication.ts)" = "0cfe937f238e7018d3fbb30d99c9cab78c35c820"
          test "$(git rev-parse HEAD^:src/github-update-refs-cas.ts)" = "f47484d6bfd56dae99cce6d2a0b0e3f1a0ef8144"
          test "$(git rev-parse HEAD^:test/github-update-refs-cas-repository-identity.test.ts)" = "bf04ce83f03150fbba500ab48a13feb4942410dc"
          test "$(git rev-parse HEAD^:.github/workflows/lumen-1208-retarget-bootstrap.yml)" = "19a8a80edeaac6691ba4c253cbbb2de4fc24b968"
          test ! -f .github/workflows/lark-1208-final-cas-convergence.yml
          test ! -f .github/workflows/oriole-1208-required-provider-fields.yml
          test ! -f .github/workflows/vireo-1208-cas-provenance-required-fields.yml
          git fetch --no-tags origin "$CAS_REPAIR" "$REQUIRED_FIELDS_CONTROL"
          test "$(git rev-parse ${CAS_REPAIR}:src/github-update-refs-cas.ts)" = "d3e3b9fd6e35c2fa57480da2ec587a6074a9e61d"
          test "$(git rev-parse ${REQUIRED_FIELDS_CONTROL}:test/github-rest-repository-write-atomic-required-fields.test.ts)" = "9b0f0a23ec2b9296a66b46506bdb7b16724967e6"

      - name: Import final CAS core and required-field control
        env:
          CAS_REPAIR: 795b45666ba7c7e4f2cdeeb2706ef068c06b8f64
          REQUIRED_FIELDS_CONTROL: 68d620992a2359a482e2c7f3c627ab2bb0fd49c4
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            src/github-update-refs-cas.ts \
            test/github-update-refs-cas.test.ts \
            test/github-update-refs-cas-api-base-security.test.ts \
            test/github-update-refs-cas-input-inspection.test.ts \
            test/github-update-refs-cas-lookup-endpoint-provenance.test.ts \
            test/github-update-refs-cas-mutation-identity.test.ts \
            test/github-update-refs-cas-node-id.test.ts \
            test/github-update-refs-cas-provider-endpoint-binding.test.ts
          do
            git show "${CAS_REPAIR}:${path}" > "${path}"
          done
          git show "${REQUIRED_FIELDS_CONTROL}:test/github-rest-repository-write-atomic-required-fields.test.ts" \
            > test/github-rest-repository-write-atomic-required-fields.test.ts

      - name: Adapt final CAS core to atomic publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-rest-repository-write-atomic-publication.ts")
          text = path.read_text()

          old = '''    url: request.url,
              body: request.body as Record<string, unknown>,
              operation,
            });
            requireStatus(input, response, 200, operation);
            return admitGitHubRepositoryNodeIdResponse(
              await input.readJson(response, operation),
              input.repositoryFullName,
              request.url.href,
            );'''
          new = '''    url: new URL(request.url),
              body: request.body as Record<string, unknown>,
              operation,
            });
            requireStatus(input, response, 200, operation);
            return admitGitHubRepositoryNodeIdResponse(
              await input.readJson(response, operation),
              request,
            );'''
          if text.count(old) != 1:
              raise SystemExit(f"repository lookup integration anchor moved: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    url: request.url,
              body: request.body as Record<string, unknown>,
              operation,
            });'''
          new = '''    url: new URL(request.url),
              body: request.body as Record<string, unknown>,
              operation,
            });'''
          if text.count(old) != 1:
              raise SystemExit(f"CAS publish integration anchor moved: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    if (!descriptor) continue;
                if (!descriptor.enumerable || !("value" in descriptor)) {
                  throw invalidResponse(`${label} was malformed`);
                }'''
          new = '''    if (!descriptor || !descriptor.enumerable || !("value" in descriptor)) {
                  throw invalidResponse(`${label} was malformed`);
                }'''
          if text.count(old) != 1:
              raise SystemExit(f"required-field admission anchor moved: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)

          hostile = Path("test/github-update-refs-cas-hostile-response.test.ts")
          source = hostile.read_text()
          old = '''  expect(() => admitGitHubRepositoryNodeIdResponse(
    revocable.proxy,
    repositoryFullName,
    repositoryRequest.url.href,
  )).toThrow("GitHub updateRefs GraphQL response is invalid");'''
          new = '''  expect(() => admitGitHubRepositoryNodeIdResponse(
    revocable.proxy,
    repositoryRequest,
  )).toThrow("GitHub updateRefs GraphQL response is invalid");'''
          if source.count(old) != 1:
              raise SystemExit(f"hostile-response lookup anchor moved: {source.count(old)}")
          hostile.write_text(source.replace(old, new, 1))

          provider_url = Path("test/github-rest-repository-write-provider-url-spelling.test.ts")
          source = provider_url.read_text()
          old = 'if (isQuery(body)) return Response.json({ data: { repository: { id: repositoryId } } });'
          new = '''if (isQuery(body)) {
        return Response.json({
          data: {
            repository: { id: repositoryId, nameWithOwner: repositoryFullName },
          },
        });
      }'''
          if source.count(old) != 1:
              raise SystemExit(f"provider-url repository fixture anchor moved: {source.count(old)}")
          provider_url.write_text(source.replace(old, new, 1))

          repository_identity = Path("test/github-update-refs-cas-repository-identity.test.ts")
          repository_identity.write_text('''import { expect, test } from "bun:test";
import {
  admitGitHubRepositoryNodeIdResponse,
  buildGitHubRepositoryNodeIdRequest,
} from "../src/github-update-refs-cas.ts";

const repositoryFullName = "teamleaderleo/stensibly";
const apiBaseUrl = "https://api.github.com";

function lookup() {
  return buildGitHubRepositoryNodeIdRequest(apiBaseUrl, repositoryFullName);
}

test("rejects substituted provider repository identity without retaining it", () => {
  let caught: unknown;
  try {
    admitGitHubRepositoryNodeIdResponse({
      data: {
        repository: {
          id: "R_kgDOSubstitutedRepository",
          nameWithOwner: "teamleaderleo/other-repository",
        },
      },
    }, lookup());
  } catch (error) {
    caught = error;
  }

  expect(caught).toBeInstanceOf(Error);
  expect((caught as Error).message)
    .toBe("GitHub updateRefs GraphQL response is invalid");
  expect(JSON.stringify(caught)).not.toContain("other-repository");
});

test("admits provider case spelling only after canonical repository normalization", () => {
  expect(admitGitHubRepositoryNodeIdResponse({
    data: {
      repository: {
        id: "R_kgDOCanonicalRepository",
        nameWithOwner: "TeamLeaderLeo/Stensibly",
      },
    },
  }, lookup())).toEqual({
    graphqlUrl: "https://api.github.com/graphql",
    repositoryFullName,
    repositoryId: "R_kgDOCanonicalRepository",
  });
});
''')
          PY
          git diff --check

      - name: Validate final exact-CAS integration
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-update-refs-cas.test.ts \
            test/github-update-refs-cas-api-base-security.test.ts \
            test/github-update-refs-cas-hostile-response.test.ts \
            test/github-update-refs-cas-input-inspection.test.ts \
            test/github-update-refs-cas-lookup-endpoint-provenance.test.ts \
            test/github-update-refs-cas-mutation-identity.test.ts \
            test/github-update-refs-cas-node-id.test.ts \
            test/github-update-refs-cas-provider-endpoint-binding.test.ts \
            test/github-update-refs-cas-repository-identity.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            test/github-rest-repository-write-atomic-required-fields.test.ts \
            test/github-rest-repository-write-atomic-record-ownkeys.test.ts \
            test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts \
            test/github-rest-repository-write-atomic-tree-prelimit.test.ts \
            test/github-rest-repository-write-atomic-ancestor-regression.test.ts \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-adapter-fence-parity.test.ts \
            test/github-rest-repository-write-provider-url-spelling.test.ts

      - name: Publish one workflow-free exact-CAS head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: juniper/1163-updaterefs-cas-integration
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/lumen-1208-final-convergence.yml \
            .github/workflows/lumen-1208-retarget-bootstrap.yml
          git add \
            src/github-rest-repository-write-atomic-publication.ts \
            src/github-update-refs-cas.ts \
            test/github-rest-repository-write-atomic-required-fields.test.ts \
            test/github-rest-repository-write-provider-url-spelling.test.ts \
            test/github-update-refs-cas.test.ts \
            test/github-update-refs-cas-api-base-security.test.ts \
            test/github-update-refs-cas-hostile-response.test.ts \
            test/github-update-refs-cas-input-inspection.test.ts \
            test/github-update-refs-cas-lookup-endpoint-provenance.test.ts \
            test/github-update-refs-cas-mutation-identity.test.ts \
            test/github-update-refs-cas-node-id.test.ts \
            test/github-update-refs-cas-provider-endpoint-binding.test.ts \
            test/github-update-refs-cas-repository-identity.test.ts
          git diff --cached --check
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Converge exact updateRefs CAS publication"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_REF}"