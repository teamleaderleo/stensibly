name: Lumen 1208 retarget bootstrap

on:
  push:
    branches:
      - juniper/1163-updaterefs-cas-integration
    paths:
      - .github/workflows/lumen-1208-retarget-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: lumen-1208-retarget-bootstrap
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-updaterefs-cas-integration
          fetch-depth: 0
          persist-credentials: true

      - name: Retarget sole finalizer to exact bootstrap head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: juniper/1163-updaterefs-cas-integration
          EXPECTED_LUMEN_BLOB: 53e4409d2545a4f8bbf2d698eed962d735b510cf
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:.github/workflows/lumen-1208-final-convergence.yml)" = "$EXPECTED_LUMEN_BLOB"
          test ! -f .github/workflows/lark-1208-final-cas-convergence.yml
          test ! -f .github/workflows/oriole-1208-required-provider-fields.yml
          test ! -f .github/workflows/vireo-1208-cas-provenance-required-fields.yml
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('.github/workflows/lumen-1208-final-convergence.yml')
          text = path.read_text()
          old = '          CARRIER_PARENT: f904b5eca9ed7c17b7e87e4cbc5fd7218aeb9729\n'
          new = f'          CARRIER_PARENT: {os.environ["EXPECTED_HEAD"]}\n'
          if text.count(old) != 1:
              raise SystemExit(f'Lumen carrier parent anchor moved: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/lumen-1208-retarget-bootstrap.yml
          git add .github/workflows/lumen-1208-final-convergence.yml
          git diff --cached --check
          git config user.name "Lumen"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind sole exact-CAS publisher to bootstrap head"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${HEAD_REF}"
