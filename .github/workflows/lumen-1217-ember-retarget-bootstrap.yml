name: Lumen 1217 Ember retarget bootstrap

on:
  push:
    branches:
      - cedar/1149-durable-activity-ingestion
    paths:
      - .github/workflows/lumen-1217-ember-retarget-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: lumen-1217-ember-retarget-bootstrap
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/1149-durable-activity-ingestion
          fetch-depth: 0
          persist-credentials: true

      - name: Retarget complete Ember convergence carrier
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_REF: cedar/1149-durable-activity-ingestion
          EMBER_BLOB: 642a601779dea8c4a6825fccb087b487afea24b7
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:.github/workflows/ember-1217-durable-parity-repair.yml)" = "$EMBER_BLOB"
          test -f .github/workflows/cedar-1149-durable-activity-store.yml
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('.github/workflows/ember-1217-durable-parity-repair.yml')
          text = path.read_text()
          old = '          SOURCE_HEAD: a3baa13a9e02160567834ba9a8f554e48ace2e72\n'
          new = f'          SOURCE_HEAD: {os.environ["EXPECTED_HEAD"]}\n'
          if text.count(old) != 1:
              raise SystemExit(f'Ember source-head anchor moved: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/lumen-1217-ember-retarget-bootstrap.yml
          git add .github/workflows/ember-1217-durable-parity-repair.yml
          git diff --cached --check
          git config user.name "Lumen"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind durable parity carrier to bootstrap head"
          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${HEAD_REF}"
