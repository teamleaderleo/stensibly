name: Repair final signed CI receipt controls

on:
  pull_request:
    branches:
      - lumen/783-final-test-repair
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: lumen-783-final-test-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/783-final-test-repair
      - uses: oven-sh/setup-bun@v2
      - name: Apply final receipt controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path("src/github-actions-ci-receipt.ts")
          text = wrapper.read_text()
          export_old = 'export * from "./github-actions-ci-receipt-core.js";'
          export_new = '''export {
            GITHUB_ACTIONS_CI_JOB_NAMES,
            GITHUB_ACTIONS_CI_RECEIPT_BUNDLE_V1,
            GITHUB_ACTIONS_CI_VALIDATION_PROFILES,
            GITHUB_ACTIONS_CI_WORKFLOW_NAME,
            GITHUB_ACTIONS_CI_WORKFLOW_PATH,
          } from "./github-actions-ci-receipt-core.js";
          export type {
            GitHubActionsCiReceiptBundleV1,
            GitHubActionsCiValidationProfile,
            GitHubActionsCompletedJobV1,
            GitHubActionsCompletedRunV1,
            GitHubActionsCompletedStepV1,
            GitHubActionsDiagnosticsArtifactV1,
            GitHubActionsRunPullRequestV1,
          } from "./github-actions-ci-receipt-core.js";'''
          if export_old not in text:
              raise SystemExit("wrapper export insertion point moved")
          text = text.replace(export_old, export_new, 1)
          old = '''  return receipt;
          }
          '''
          new = '''  return deepFreeze(structuredClone(receipt));
          }

          function deepFreeze<T>(value: T, seen = new WeakSet<object>()): T {
            if (!value || typeof value !== "object" || seen.has(value)) return value;
            seen.add(value);
            Object.freeze(value);
            for (const nested of Object.values(value as Record<string, unknown>)) {
              deepFreeze(nested, seen);
            }
            return value;
          }
          '''
          if old not in text:
              raise SystemExit("wrapper return insertion point moved")
          wrapper.write_text(text.replace(old, new, 1))

          core = Path("src/github-actions-ci-receipt-core.ts")
          text = core.read_text()
          old = '''function normalizedJobs(
            run: PublicRun,
            profile: GitHubActionsCiValidationProfile,
            jobs: readonly PublicJob[],
          ): PublicJob[] {
            const selected = jobs.filter((job) => job.name !== browserJobName);
            if (profile === "full_parallel" && run.event === "pull_request") {
              return selected.map((job) => job.name === "serial-full"
                ? syntheticSkippedJob(job)
                : job);
            }
            return selected;
          }
          '''
          new = '''function normalizedJobs(
            run: PublicRun,
            profile: GitHubActionsCiValidationProfile,
            jobs: readonly PublicJob[],
          ): PublicJob[] {
            let selected = jobs.filter((job) => job.name !== browserJobName);
            if (profile === "full_parallel" && run.event === "pull_request") {
              selected = selected.map((job) => job.name === "serial-full"
                ? syntheticSkippedJob(job)
                : job);
            }
            const browser = jobs.find((job) => job.name === browserJobName);
            if (
              browser
              && failureEvidenceConclusions.has(run.conclusion)
              && browser.conclusion === run.conclusion
              && !selected.some((job) => job.conclusion === run.conclusion)
            ) {
              const target = selected.find((job) => job.name === "test");
              if (!target) {
                throw new RangeError("GitHub Actions normalized CI jobs require the test job");
              }
              selected = selected.map((job) => job === target
                ? syntheticEvidenceJob(job, browser, run.conclusion)
                : job);
            }
            return selected;
          }

          function syntheticEvidenceJob(
            target: PublicJob,
            evidence: PublicJob,
            conclusion: CiRunConclusion,
          ): PublicJob {
            const record = {
              ...target.record,
              conclusion,
              createdAt: evidence.createdAt,
              startedAt: evidence.startedAt,
              completedAt: evidence.completedAt,
              steps: evidence.steps.map((step) => ({ ...step.record })),
            };
            return {
              ...target,
              record,
              conclusion,
              createdAt: evidence.createdAt,
              startedAt: evidence.startedAt,
              completedAt: evidence.completedAt,
              steps: evidence.steps,
            };
          }
          '''
          if old not in text:
              raise SystemExit("normalized job insertion point moved")
          core.write_text(text.replace(old, new, 1))

          test = Path("test/github-actions-ci-receipt.test.ts")
          text = test.read_text()
          old = '''    const receipt = compile();
            expect(receipt).toMatchObject({
          '''
          new = '''    const receipt = compile();
            expect(Object.isFrozen(receipt)).toBe(true);
            expect(Object.isFrozen(receipt.jobs)).toBe(true);
            expect(receipt).toMatchObject({
          '''
          if old not in text:
              raise SystemExit("freeze assertion insertion point moved")
          text = text.replace(old, new, 1)
          old = '''    expect(Object.isFrozen(receipt)).toBe(true);
            expect(Object.isFrozen(receipt.jobs)).toBe(true);
          '''
          if text.count(old) != 2:
              raise SystemExit("freeze assertion count changed")
          first = text.find(old)
          second = text.find(old, first + 1)
          text = text[:second] + text[second + len(old):]
          test.write_text(text)
          PY

          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-actions-ci-receipt.test.ts \
            test/github-actions-ci-receipt-compatibility.test.ts \
            test/ci-queue-receipt-cancelled-before-start.test.ts

          git rm .github/workflows/lumen-783-final-test-repair.yml \
            .github/workflows/lumen-783-freeze-debug.yml
          git add src/github-actions-ci-receipt.ts \
            src/github-actions-ci-receipt-core.ts \
            test/github-actions-ci-receipt.test.ts
          git diff --cached --check
          git config user.name "Lumen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve browser failure evidence through receipt normalization"
          git push origin HEAD:lumen/783-final-test-repair
