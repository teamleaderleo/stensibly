name: Lumen 786 exact identity repair

on:
  push:
    branches:
      - lumen/786-current-main-replay
    paths:
      - .github/workflows/lumen-786-exact-identity-repair.yml

permissions:
  contents: write

concurrency:
  group: lumen-786-exact-identity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/786-current-main-replay
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - name: Apply exact identity admission repair
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("src/coordination-graph.ts")
          source = source_path.read_text()

          replacements = [
              (
                  ').map(boundedNodeKey),',
                  ').map(exactNodeKey),',
              ),
              (
                  ': parseReference(record.selectedProducer, "Coordination selected producer"),',
                  ': parseExactReference(record.selectedProducer, "Coordination selected producer"),',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected one source occurrence: {old!r}")
              source = source.replace(old, new, 1)

          reference_anchor = '''function parseReference(input: unknown, label: string): CoordinationNodeReference {
            const record = exactRecord(input, referenceKeys, referenceKeys, label);
            return {
              id: boundedIdentifier(record.id, `${label} ID`, 160),
              generation: positiveInteger(record.generation, `${label} generation`),
            };
          }
          '''
          exact_reference = '''function parseReference(input: unknown, label: string): CoordinationNodeReference {
            const record = exactRecord(input, referenceKeys, referenceKeys, label);
            return {
              id: boundedIdentifier(record.id, `${label} ID`, 160),
              generation: positiveInteger(record.generation, `${label} generation`),
            };
          }

          function parseExactReference(input: unknown, label: string): CoordinationNodeReference {
            const record = exactRecord(input, referenceKeys, referenceKeys, label);
            return {
              id: exactBoundedIdentifier(record.id, `${label} ID`, 160),
              generation: positiveInteger(record.generation, `${label} generation`),
            };
          }
          '''
          if source.count(reference_anchor) != 1:
              raise SystemExit("parseReference anchor drifted")
          source = source.replace(reference_anchor, exact_reference, 1)

          node_key_anchor = '''function boundedNodeKey(value: unknown): string {
            if (typeof value !== "string") throw new Error("Coordination node key must be a string");
            const match = /^(.+)@([1-9][0-9]*)$/.exec(value.trim());
            if (!match) throw new Error("Coordination node key is invalid");
            return coordinationNodeKey({
              id: boundedIdentifier(match[1], "Coordination node key ID", 160),
              generation: positiveInteger(Number(match[2]), "Coordination node key generation"),
            });
          }
          '''
          exact_node_key = '''function boundedNodeKey(value: unknown): string {
            if (typeof value !== "string") throw new Error("Coordination node key must be a string");
            const match = /^(.+)@([1-9][0-9]*)$/.exec(value.trim());
            if (!match) throw new Error("Coordination node key is invalid");
            return coordinationNodeKey({
              id: boundedIdentifier(match[1], "Coordination node key ID", 160),
              generation: positiveInteger(Number(match[2]), "Coordination node key generation"),
            });
          }

          function exactNodeKey(value: unknown): string {
            if (typeof value !== "string") {
              throw new Error("Coordination evaluation node key must be a string");
            }
            const match = /^(.+)@([1-9][0-9]*)$/.exec(value);
            if (!match) throw new Error("Coordination evaluation node key is invalid");
            const canonical = coordinationNodeKey({
              id: exactBoundedIdentifier(match[1], "Coordination evaluation node key ID", 160),
              generation: positiveInteger(Number(match[2]), "Coordination evaluation node key generation"),
            });
            if (canonical !== value) throw new Error("Coordination evaluation node key is invalid");
            return canonical;
          }
          '''
          if source.count(node_key_anchor) != 1:
              raise SystemExit("boundedNodeKey anchor drifted")
          source = source.replace(node_key_anchor, exact_node_key, 1)

          identifier_anchor = '''function boundedIdentifier(value: unknown, label: string, maximum: number): string {
            if (typeof value !== "string") throw new Error(`${label} must be a string`);
            const normalized = value.trim();
            if (
              normalized.length < 1
              || normalized.length > maximum
              || !/^[A-Za-z0-9][A-Za-z0-9._:/@#-]*$/.test(normalized)
            ) {
              throw new Error(`${label} is invalid`);
            }
            return normalized;
          }
          '''
          exact_identifier = '''function boundedIdentifier(value: unknown, label: string, maximum: number): string {
            if (typeof value !== "string") throw new Error(`${label} must be a string`);
            const normalized = value.trim();
            if (
              normalized.length < 1
              || normalized.length > maximum
              || !/^[A-Za-z0-9][A-Za-z0-9._:/@#-]*$/.test(normalized)
            ) {
              throw new Error(`${label} is invalid`);
            }
            return normalized;
          }

          function exactBoundedIdentifier(value: unknown, label: string, maximum: number): string {
            const normalized = boundedIdentifier(value, label, maximum);
            if (value !== normalized) throw new Error(`${label} is invalid`);
            return normalized;
          }
          '''
          if source.count(identifier_anchor) != 1:
              raise SystemExit("boundedIdentifier anchor drifted")
          source = source.replace(identifier_anchor, exact_identifier, 1)
          source_path.write_text(source)

          test_path = Path("test/coordination-graph-integrity.test.ts")
          tests = test_path.read_text()
          close = "\n});\n"
          if not tests.endswith(close):
              raise SystemExit("integrity test close drifted")
          addition = r'''

            test("rejects padded aliases for new exact identity inputs", () => {
              const input = fixture();
              const paddedSelection: CoordinationGraph = {
                ...input,
                nodes: input.nodes.map((node) => node.id === "decision"
                  ? {
                    ...node,
                    selectedProducer: { id: " candidate-a ", generation: 1 },
                  }
                  : node),
              };

              expect(() => canonicalizeCoordinationGraph(paddedSelection))
                .toThrow("Coordination selected producer ID is invalid");
              expect(canonicalizeCoordinationGraph(input).nodes.find(
                ({ id }) => id === "decision",
              )?.selectedProducer).toEqual({ id: "candidate-a", generation: 1 });

              expect(() => evaluateCoordinationGraph(input, {
                evaluatedAt,
                changedNodeKeys: [" decision@1 "],
              })).toThrow("Coordination evaluation node key is invalid");
              expect(evaluateCoordinationGraph(input, {
                evaluatedAt,
                changedNodeKeys: ["decision@1"],
              }).changedNodeKeys).toEqual(["decision@1"]);
            });
          '''
          tests = tests[:-len(close)] + addition + close
          test_path.write_text(tests)

          Path(".github/workflows/lumen-786-exact-identity-repair.yml").unlink()
          PY

      - name: Install committed dependencies
        run: bun install --frozen-lockfile

      - name: Run focused evaluator validation
        run: |
          bun test test/coordination-graph.test.ts test/coordination-graph-validation.test.ts test/coordination-graph-integrity.test.ts
          bun run typecheck

      - name: Publish repaired source-only head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/coordination-graph.ts test/coordination-graph-integrity.test.ts .github/workflows/lumen-786-exact-identity-repair.yml
          git commit -m "Reject padded evaluator identity aliases"
          git push origin HEAD:lumen/786-current-main-replay
