name: Lumen 870 descriptor typing repair

on:
  push:
    branches:
      - lark/862-reconciliation-snapshot-final
    paths:
      - .github/workflows/lumen-870-descriptor-typing.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/lumen-870-descriptor-typing.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lark/862-reconciliation-snapshot-final
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Repair descriptor-map typing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/runner-cancellation-reconciliation.ts')
          source = path.read_text()
          old = '''    const descriptors = Object.getOwnPropertyDescriptors(value);
    const lengthDescriptor = descriptors.length;
'''
          new = '''    const descriptors = Object.getOwnPropertyDescriptors(value) as Record<
      string,
      PropertyDescriptor
    >;
    const lengthDescriptor = descriptors.length;
'''
          if source.count(old) != 1:
              raise SystemExit('array descriptor typing marker changed')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          bun run typecheck
          bun test test/runner-cancellation-reconciliation.test.ts
      - name: Publish clean head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lumen-870-descriptor-typing.yml
          git config user.name 'Lumen'
          git config user.email 'actions@users.noreply.github.com'
          git add src/runner-cancellation-reconciliation.ts .github/workflows/lumen-870-descriptor-typing.yml
          git diff --cached --check
          git commit -m 'Type captured array descriptor maps explicitly'
          git push origin HEAD:lark/862-reconciliation-snapshot-final
