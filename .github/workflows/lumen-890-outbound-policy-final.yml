name: Lumen 890 outbound policy finalizer

on:
  push:
    branches:
      - lumen/890-outbound-policy-final
    paths:
      - .github/workflows/lumen-890-outbound-policy-final.yml

permissions:
  contents: write

concurrency:
  group: lumen-890-outbound-policy-final
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/890-outbound-policy-final
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Bind authority and destination admission
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          printf 'SOURCE_HEAD=%s\n' "$source_head" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("src/github-outbound-text-policy.ts")
          source = source_path.read_text()

          old_receipt_call = '''  const destination = parseDestination(
    record.destination,
    "GitHub outbound receipt destination",
  );
'''
          new_receipt_call = '''  const destination = parseReceiptDestination(
    record.destination,
    "GitHub outbound receipt destination",
  );
'''
          if source.count(old_receipt_call) != 1:
              raise SystemExit("receipt destination call changed")
          source = source.replace(old_receipt_call, new_receipt_call, 1)

          old_input_call = '''    destination: parseDestination(
      record.destination,
      "GitHub outbound destination",
    ),
'''
          new_input_call = '''    destination: parseInputDestination(
      record.destination,
      "GitHub outbound destination",
    ),
'''
          if source.count(old_input_call) != 1:
              raise SystemExit("input destination call changed")
          source = source.replace(old_input_call, new_input_call, 1)

          start = source.index("function parseDestination(\n")
          end = source.index("function parseReceiptFields(\n", start)
          destination_functions = '''function parseInputDestination(
  input: unknown,
  label: string,
): GitHubOutboundRepository & { repositoryFullName: string } {
  const record = requireRecord(input, label);
  rejectUnknownKeys(record, ["owner", "repository"], label);
  if (Object.keys(record).length !== 2) {
    throw new Error(`${label} fields are invalid`);
  }
  const owner = parseOwner(record.owner);
  const repository = parseRepository(record.repository);
  if (record.owner !== owner || record.repository !== repository) {
    throw new Error(`${label} identity is not canonical`);
  }
  return { owner, repository, repositoryFullName: `${owner}/${repository}` };
}

function parseReceiptDestination(
  input: unknown,
  label: string,
): GitHubOutboundRepository & { repositoryFullName: string } {
  const record = requireRecord(input, label);
  rejectUnknownKeys(
    record,
    ["owner", "repository", "repositoryFullName"],
    label,
  );
  if (Object.keys(record).length !== 3) {
    throw new Error(`${label} fields are invalid`);
  }
  const owner = parseOwner(record.owner);
  const repository = parseRepository(record.repository);
  const repositoryFullName = `${owner}/${repository}`;
  if (record.owner !== owner || record.repository !== repository) {
    throw new Error(`${label} identity is not canonical`);
  }
  if (record.repositoryFullName !== repositoryFullName) {
    throw new Error(`${label} full name is not canonical`);
  }
  return { owner, repository, repositoryFullName };
}

'''
          source = source[:start] + destination_functions + source[end:]

          start = source.index("function parseExternalAuthority(\n")
          end = source.index("function scanField(\n", start)
          authority_function = '''function parseExternalAuthority(input: unknown): GitHubExternalContactAuthority {
  const record = requireRecord(input, "GitHub external contact authority");
  rejectUnknownKeys(
    record,
    ["fingerprint", "generation", "repositories"],
    "GitHub external contact authority",
  );
  const generation = positiveInteger(
    record.generation,
    "GitHub external contact authority generation",
  );
  const repositories = canonicalStringArray(
    record.repositories,
    "Authorized external repositories",
    parseRepositoryFullName,
  );
  const fingerprint = sha256(
    record.fingerprint,
    "GitHub external contact authority fingerprint",
  );
  const expectedFingerprint = fingerprintCanonicalRequest({
    policy: "github-external-contact-authority/v1",
    generation,
    repositories,
  });
  if (fingerprint !== expectedFingerprint) {
    throw new Error(
      "GitHub external contact authority fingerprint does not match its contents",
    );
  }
  return { fingerprint, generation, repositories };
}

'''
          source = source[:start] + authority_function + source[end:]
          source_path.write_text(source)

          test_path = Path("test/github-outbound-text-policy.test.ts")
          test = test_path.read_text()
          old_import = 'import { describe, expect, test } from "bun:test";\n'
          new_import = old_import + 'import { fingerprintCanonicalRequest } from "../src/idempotency-request-fingerprint.ts";\n'
          if test.count(old_import) != 1:
              raise SystemExit("main test import changed")
          test = test.replace(old_import, new_import, 1)
          marker = '''function hash(seed: number): string {
  return `sha256:${(seed % 16).toString(16).repeat(64)}`;
}

'''
          helper = marker + '''function authorityFingerprint(
  generation: number,
  repositories: readonly string[],
): string {
  return fingerprintCanonicalRequest({
    policy: "github-external-contact-authority/v1",
    generation,
    repositories,
  });
}

'''
          if test.count(marker) != 1:
              raise SystemExit("main test hash helper changed")
          test = test.replace(marker, helper, 1)
          replacements = {
            'fingerprint: hash(4),\n        generation: 3,\n        repositories: ["external/project"],': 'fingerprint: authorityFingerprint(3, ["external/project"]),\n        generation: 3,\n        repositories: ["external/project"],',
            'fingerprint: hash(4),\n        generation: 2,\n        repositories: ["external/project"],': 'fingerprint: authorityFingerprint(2, ["external/project"]),\n        generation: 2,\n        repositories: ["external/project"],',
            'fingerprint: hash(4),\n        generation: 3,\n        repositories: ["other/project"],': 'fingerprint: authorityFingerprint(3, ["other/project"]),\n        generation: 3,\n        repositories: ["other/project"],',
          }
          for old, new in replacements.items():
              if test.count(old) != 1:
                  raise SystemExit(f"main authority fixture changed: {old}")
              test = test.replace(old, new, 1)
          test_path.write_text(test)

          admission_path = Path("test/github-outbound-text-policy-admission.test.ts")
          admission = admission_path.read_text()
          old_import = 'import { describe, expect, test } from "bun:test";\n'
          new_import = old_import + 'import { fingerprintCanonicalRequest } from "../src/idempotency-request-fingerprint.ts";\n'
          if admission.count(old_import) != 1:
              raise SystemExit("admission test import changed")
          admission = admission.replace(old_import, new_import, 1)
          marker = '''function hash(seed: string): string {
  return `sha256:${seed.repeat(64).slice(0, 64)}`;
}

'''
          helper = marker + '''function authorityFingerprint(
  generation: number,
  repositories: readonly string[],
): string {
  return fingerprintCanonicalRequest({
    policy: "github-external-contact-authority/v1",
    generation,
    repositories,
  });
}

'''
          if admission.count(marker) != 1:
              raise SystemExit("admission hash helper changed")
          admission = admission.replace(marker, helper, 1)
          old = 'fingerprint: hash("a"),\n            generation: 2,\n            repositories: ["external/project"],'
          new = 'fingerprint: authorityFingerprint(2, ["external/project"]),\n            generation: 2,\n            repositories: ["external/project"],'
          if admission.count(old) != 1:
              raise SystemExit("admission authority fixture changed")
          admission = admission.replace(old, new, 1)
          admission_path.write_text(admission)

          docs_path = Path("docs/github-outbound-text-policy.md")
          docs = docs_path.read_text()
          old = '''- a SHA-256 authority receipt;
- the same authority generation as the provider operation;
- a canonical, unique, sorted repository set.
'''
          new = '''- a SHA-256 authority receipt recomputed over policy
  `github-external-contact-authority/v1`, generation, and repositories;
- the same authority generation as the provider operation;
- a canonical, unique, sorted repository set.
'''
          if docs.count(old) != 1:
              raise SystemExit("authority documentation changed")
          docs_path.write_text(docs.replace(old, new, 1))
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          bun run typecheck
          bun test \
            test/github-outbound-text-policy.test.ts \
            test/github-outbound-text-policy-admission.test.ts \
            test/github-outbound-text-policy-authority-fingerprint-review.test.ts
      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lumen'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/lumen-890-outbound-policy-final.yml
          git add \
            src/github-outbound-text-policy.ts \
            test/github-outbound-text-policy.test.ts \
            test/github-outbound-text-policy-admission.test.ts \
            test/github-outbound-text-policy-authority-fingerprint-review.test.ts \
            docs/github-outbound-text-policy.md
          git diff --cached --check
          git commit -m 'Bind outbound authority and destination admission'
          git push \
            --force-with-lease=refs/heads/lumen/890-outbound-policy-final:${SOURCE_HEAD} \
            origin HEAD:lumen/890-outbound-policy-final
