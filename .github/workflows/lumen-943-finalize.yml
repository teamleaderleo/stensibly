name: Lumen 943 finalize

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/lumen-943-finalize.yml
      - test/github-rest-pull-request-review-thread-comment-truncation.test.ts

permissions:
  contents: write

concurrency:
  group: lumen-943-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'teamleaderleo/stensibly' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lumen/943-review-comment-truncation-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/943-review-comment-truncation-control
          fetch-depth: 2
      - name: Verify exact carrier lease
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c494ad4a5485fc40b290a11cf7c81dea39d69717"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/lumen-943-finalize.yml"
      - uses: oven-sh/setup-bun@v2
      - name: Apply bounded comment truncation repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-rest-pull-request-review-thread-adapter.ts")
          source = path.read_text()

          old_cap = "const maximumComments = 400;"
          new_cap = "const maximumComments = maximumThreads * commentPageSize;"
          if source.count(old_cap) != 1:
              raise SystemExit("maximum comment cap marker was not unique")
          source = source.replace(old_cap, new_cap)

          start_marker = "  const commentsTotal = nonNegativeProviderInteger(\n"
          end_marker = "  const comments = commentNodes.map((comment) =>\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("comment pagination block markers were absent")
          new_block = '''  const commentsTotalCount = nonNegativeProviderInteger(
            commentsConnection.totalCount,
            "GitHub review-thread comment count",
          );
          const commentsPageInfo = providerRecord(
            commentsConnection.pageInfo,
            ["hasNextPage", "endCursor"],
            ["hasNextPage", "endCursor"],
            "GitHub review-thread comment page info",
          );
          const commentsHasNextPage = booleanValue(
            commentsPageInfo.hasNextPage,
            "GitHub review-thread comment next-page flag",
          );
          const commentsEndCursor = nullableCursor(commentsPageInfo.endCursor);
          const commentNodes = denseArray(
            commentsConnection.nodes,
            "GitHub review-thread comment nodes",
            commentPageSize,
          );
          const commentsTruncated = commentsTotalCount > commentNodes.length;
          if (
            commentsTruncated !== commentsHasNextPage
            || (commentsHasNextPage && commentsEndCursor === null)
            || (commentsHasNextPage && commentNodes.length !== commentPageSize)
            || (!commentsHasNextPage && commentNodes.length !== commentsTotalCount)
          ) {
            throw rejected(
              "github_delegated_provider_invalid_response",
              "GitHub review-thread comment pagination was inconsistent",
            );
          }
          '''
          source = source[:start] + new_block + source[end:]

          old_result = "    resolvedByLogin,\n    comments: Object.freeze(comments),\n"
          new_result = (
              "    resolvedByLogin,\n"
              "    commentsTotalCount,\n"
              "    commentsTruncated,\n"
              "    comments: Object.freeze(comments),\n"
          )
          if source.count(old_result) != 1:
              raise SystemExit("review-thread result marker was not unique")
          source = source.replace(old_result, new_result)

          path.write_text(source)
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          set -euo pipefail
          bun run typecheck
          bun test ./test/github-rest-pull-request-review-thread-comment-truncation.test.ts
      - name: Publish clean source and test head
        run: |
          set -euo pipefail
          rm .github/workflows/lumen-943-finalize.yml
          git config user.name "Lumen"
          git config user.email "actions@users.noreply.github.com"
          git add src/github-rest-pull-request-review-thread-adapter.ts \
            test/github-rest-pull-request-review-thread-comment-truncation.test.ts \
            .github/workflows/lumen-943-finalize.yml
          git commit -m "Return bounded truncated review comments"
          git push origin HEAD:lumen/943-review-comment-truncation-control
