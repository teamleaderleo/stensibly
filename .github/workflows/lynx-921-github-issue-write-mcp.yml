name: Apply governed GitHub issue write MCP packet

on:
  push:
    branches:
      - lynx/921-github-issue-write-mcp
    paths:
      - .github/workflows/lynx-921-github-issue-write-mcp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: lynx/921-github-issue-write-mcp
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply provider-neutral MCP write packet
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          def insert_before_once(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, addition + marker)

          mcp_path = Path("src/github-issue-provider-mcp.ts")
          text = mcp_path.read_text()
          old_import = 'import type { GitHubProviderRequestContext } from "./github-provider-contracts.js";'
          new_import = '''import type {
            GitHubProviderReceipt,
            GitHubProviderRequestContext,
          } from "./github-provider-contracts.js";'''
          if text.count(old_import) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: provider import drifted")
          text = text.replace(old_import, new_import, 1)

          write_interface = '''
          export interface GitHubIssueProviderWriteService {
            createIssue(input: GitHubProviderRequestContext & {
              title: string;
              body?: string;
              labels?: string[];
              assignees?: string[];
              idempotencyKey: string;
            }): Promise<GitHubProviderReceipt>;
            updateIssue(input: GitHubProviderRequestContext & {
              issueNumber: number;
              expectedSourceRevision: string;
              title?: string;
              body?: string;
              state?: "open" | "closed";
              stateReason?: "completed" | "not_planned" | "reopened" | null;
              idempotencyKey: string;
            }): Promise<GitHubProviderReceipt>;
            addIssueComment(input: GitHubProviderRequestContext & {
              issueNumber: number;
              body: string;
              idempotencyKey: string;
            }): Promise<GitHubProviderReceipt>;
          }
          '''.replace("          ", "")
          marker = "\nexport function withGitHubIssueProviderReadService"
          if text.count(marker) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: read wrapper marker drifted")
          text = text.replace(marker, "\n" + write_interface + marker, 1)

          write_wrapper = '''
          export function withGitHubIssueProviderWriteService<T extends object>(
            target: T,
            service: GitHubIssueProviderWriteService,
          ): T & GitHubIssueProviderWriteService {
            return Object.assign(target, {
              createIssue: service.createIssue.bind(service),
              updateIssue: service.updateIssue.bind(service),
              addIssueComment: service.addIssueComment.bind(service),
            });
          }

          '''.replace("          ", "")
          marker = "export function registerGitHubIssueProviderTools("
          if text.count(marker) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: registration marker drifted")
          text = text.replace(marker, write_wrapper + marker, 1)
          text = text.replace("service(ledger)", "readService(ledger)")
          if "function service(ledger: WorkLedger): GitHubIssueProviderReadService" not in text:
              raise SystemExit("github-issue-provider-mcp.ts: read service helper drifted")
          text = text.replace(
              "function service(ledger: WorkLedger): GitHubIssueProviderReadService",
              "function readService(ledger: WorkLedger): GitHubIssueProviderReadService",
              1,
          )

          tool_registrations = '''

            server.registerTool(
              "github_create_issue",
              {
                description: "Create one GitHub issue in a repository bound to a Stensibly project. The operation is idempotent and returns a durable provider receipt with exact readback evidence.",
                inputSchema: {
                  project: projectSchema(),
                  repository: repositorySchema(),
                  title: z.string().trim().min(1).max(256),
                  body: z.string().max(128 * 1024).optional(),
                  labels: z.array(z.string().trim().min(1).max(100)).max(100).optional(),
                  assignees: z.array(z.string().trim().min(1).max(39)).max(100).optional(),
                  idempotencyKey: idempotencyKeySchema(),
                  capabilityGrantId: authorityIdSchema().optional(),
                  approvalId: authorityIdSchema().optional(),
                },
                annotations: {
                  readOnlyHint: false,
                  destructiveHint: false,
                  idempotentHint: true,
                },
              },
              async (input) => asToolResult(() => writeService(ledger).createIssue({
                ...providerContext(context, input.project, input.repository, input),
                title: input.title,
                ...(input.body === undefined ? {} : { body: input.body }),
                ...(input.labels ? { labels: input.labels } : {}),
                ...(input.assignees ? { assignees: input.assignees } : {}),
                idempotencyKey: input.idempotencyKey,
              })),
            );

            server.registerTool(
              "github_update_issue",
              {
                description: "Update one exact GitHub issue through a Stensibly project binding. The expected source revision fences stale writes and the result includes exact provider readback.",
                inputSchema: {
                  project: projectSchema(),
                  repository: repositorySchema(),
                  issueNumber: z.number().int().min(1),
                  expectedSourceRevision: z.string().trim().min(1).max(512),
                  title: z.string().trim().min(1).max(256).optional(),
                  body: z.string().max(128 * 1024).optional(),
                  state: z.enum(["open", "closed"]).optional(),
                  stateReason: z
                    .enum(["completed", "not_planned", "reopened"])
                    .nullable()
                    .optional(),
                  idempotencyKey: idempotencyKeySchema(),
                  capabilityGrantId: authorityIdSchema().optional(),
                  approvalId: authorityIdSchema().optional(),
                },
                annotations: {
                  readOnlyHint: false,
                  destructiveHint: false,
                  idempotentHint: true,
                },
              },
              async (input) => asToolResult(() => writeService(ledger).updateIssue({
                ...providerContext(context, input.project, input.repository, input),
                issueNumber: input.issueNumber,
                expectedSourceRevision: input.expectedSourceRevision,
                ...(input.title === undefined ? {} : { title: input.title }),
                ...(input.body === undefined ? {} : { body: input.body }),
                ...(input.state === undefined ? {} : { state: input.state }),
                ...(input.stateReason === undefined
                  ? {}
                  : { stateReason: input.stateReason }),
                idempotencyKey: input.idempotencyKey,
              })),
            );

            server.registerTool(
              "github_add_issue_comment",
              {
                description: "Add one idempotent comment to an exact GitHub issue through a Stensibly project binding and return a durable receipt with exact comment readback evidence.",
                inputSchema: {
                  project: projectSchema(),
                  repository: repositorySchema(),
                  issueNumber: z.number().int().min(1),
                  body: z.string().min(1).max(64 * 1024),
                  idempotencyKey: idempotencyKeySchema(),
                  capabilityGrantId: authorityIdSchema().optional(),
                  approvalId: authorityIdSchema().optional(),
                },
                annotations: {
                  readOnlyHint: false,
                  destructiveHint: false,
                  idempotentHint: true,
                },
              },
              async (input) => asToolResult(() => writeService(ledger).addIssueComment({
                ...providerContext(context, input.project, input.repository, input),
                issueNumber: input.issueNumber,
                body: input.body,
                idempotencyKey: input.idempotencyKey,
              })),
            );
          '''.replace("          ", "")
          marker = "\n}\n\nfunction readService("
          if text.count(marker) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: registration close marker drifted")
          text = text.replace(marker, tool_registrations + marker, 1)

          write_helpers = '''
          function writeService(ledger: WorkLedger): GitHubIssueProviderWriteService {
            if (!hasWriteService(ledger)) {
              throw new Error(
                "GitHub issue provider writes are unavailable because this backend has no mounted provider write service",
              );
            }
            return ledger;
          }

          function hasWriteService(
            value: unknown,
          ): value is WorkLedger & GitHubIssueProviderWriteService {
            if (!value || typeof value !== "object") return false;
            const candidate = value as Partial<GitHubIssueProviderWriteService>;
            return typeof candidate.createIssue === "function"
              && typeof candidate.updateIssue === "function"
              && typeof candidate.addIssueComment === "function";
          }

          '''.replace("          ", "")
          marker = "function providerContext("
          if text.count(marker) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: provider context marker drifted")
          text = text.replace(marker, write_helpers + marker, 1)

          old_context = '''function providerContext(
            context: McpRequestContext,
            project: string,
            repository: string,
          ): GitHubProviderRequestContext {
            const principal = context.principal;
            if (!principal) {
              throw new Error(
                "GitHub issue provider reads require an authenticated remote MCP principal",
              );
            }
            const tokenIdentity = `api-token:${principal.tokenId}`;
            return {
              project,
              repository,
              actorId: tokenIdentity,
              clientId: `mcp:${tokenIdentity}`,
            };
          }'''
          new_context = '''function providerContext(
            context: McpRequestContext,
            project: string,
            repository: string,
            authority: {
              capabilityGrantId?: string;
              approvalId?: string;
            } = {},
          ): GitHubProviderRequestContext {
            const principal = context.principal;
            if (!principal) {
              throw new Error(
                "GitHub issue provider operations require an authenticated remote MCP principal",
              );
            }
            const tokenIdentity = `api-token:${principal.tokenId}`;
            return {
              project,
              repository,
              actorId: tokenIdentity,
              clientId: `mcp:${tokenIdentity}`,
              ...(authority.capabilityGrantId
                ? { capabilityGrantId: authority.capabilityGrantId }
                : {}),
              ...(authority.approvalId ? { approvalId: authority.approvalId } : {}),
            };
          }'''
          if text.count(old_context) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: provider context body drifted")
          text = text.replace(old_context, new_context, 1)

          schema_helpers = '''
          function idempotencyKeySchema() {
            return z.string().trim().min(1).max(240);
          }

          function authorityIdSchema() {
            return z.string().trim().min(1).max(240);
          }

          '''.replace("          ", "")
          marker = "function projectSchema()"
          if text.count(marker) != 1:
              raise SystemExit("github-issue-provider-mcp.ts: schema marker drifted")
          text = text.replace(marker, schema_helpers + marker, 1)
          mcp_path.write_text(text)

          replace_once(
              "src/mcp-capability-policy.ts",
              '  readPolicy("github_search_tools", noProject),\n',
              '  readPolicy("github_search_tools", noProject),\n'
              '  writePolicy("github_add_issue_comment", directProject),\n'
              '  writePolicy("github_create_issue", directProject),\n'
              '  writePolicy("github_update_issue", directProject),\n',
          )

          diagnostics = Path("src/mcp-diagnostics.ts")
          text = diagnostics.read_text()
          text = text.replace(
              '  "get_runner_context",\n  "github_get_issue",',
              '  "get_runner_context",\n  "github_add_issue_comment",\n  "github_create_issue",\n  "github_get_issue",',
              1,
          )
          text = text.replace(
              '  "github_search_tools",\n  "handoff_work",',
              '  "github_search_tools",\n  "github_update_issue",\n  "handoff_work",',
              1,
          )
          text = text.replace(
              '    "create_item",\n    "claim_work",',
              '    "create_item",\n    "github_add_issue_comment",\n    "github_create_issue",\n    "github_update_issue",\n    "claim_work",',
              1,
          )
          diagnostics.write_text(text)

          replace_once(
              "src/mcp.ts",
              '        "Use github_list_issues, github_search_issues, and github_get_issue only for repositories explicitly bound to the project through a server-side GitHub provider connection.",\n',
              '        "Use github_list_issues, github_search_issues, and github_get_issue only for repositories explicitly bound to the project through a server-side GitHub provider connection.",\n'
              '        "Use github_create_issue, github_update_issue, and github_add_issue_comment with one exact idempotency key; reconcile the returned provider receipt before retrying any ambiguous write.",\n',
          )

          tools = [
              "attach_artifact",
              "block_work",
              "claim_work",
              "complete_work",
              "create_item",
              "edit_continuation",
              "get_brief",
              "get_continuation",
              "get_item",
              "get_operation_receipt",
              "get_project_attachment",
              "get_runner_context",
              "github_add_issue_comment",
              "github_create_issue",
              "github_get_issue",
              "github_get_tool",
              "github_list_issues",
              "github_list_toolsets",
              "github_search_issues",
              "github_search_tools",
              "github_update_issue",
              "handoff_work",
              "list_artifacts",
              "list_continuation_inbox",
              "list_continuations",
              "list_work",
              "propose_continuation",
              "queue_continuation_for_supervisor",
              "record_event",
              "release_work",
              "renew_claim",
              "resolve_continuation",
              "run_continuation_supervisor_policy",
              "survey_workspace",
              "unblock_work",
          ]
          canonical = json.dumps(
              {"version": 1, "tools": tools},
              separators=(",", ":"),
          ).encode()
          fingerprint = "sha256:" + hashlib.sha256(canonical).hexdigest()
          expected = "sha256:0356ccd4f47c88e63833bb4abdeb0890aae74b7dd06348cac9769271cc7f7c6e"
          if fingerprint != expected:
              raise SystemExit(f"unexpected manifest fingerprint: {fingerprint}")
          snapshot_path = Path("docs/chatgpt-app-actions.json")
          snapshot = json.loads(snapshot_path.read_text())
          snapshot.update({
              "snapshotVersion": 5,
              "manifestVersion": 1,
              "toolCount": len(tools),
              "toolManifestFingerprint": fingerprint,
              "tools": tools,
              "reviewedOn": "2026-08-02",
          })
          snapshot_path.write_text(json.dumps(snapshot, indent=2) + "\n")

          replace_once(
              "docs/chatgpt-app-recovery.md",
              "Current `main` defines **32** public MCP tools with manifest fingerprint:\n\n```text\nsha256:f651fa13f910529c5bd0a4eb9d05069f572277a6a633623864e936f4c7874c6b\n```",
              "Current `main` defines **35** public MCP tools with manifest fingerprint:\n\n```text\nsha256:0356ccd4f47c88e63833bb4abdeb0890aae74b7dd06348cac9769271cc7f7c6e\n```",
          )
          replace_once(
              "test/chatgpt-app-actions-snapshot.test.ts",
              "expect(snapshot.snapshotVersion).toBe(4);",
              "expect(snapshot.snapshotVersion).toBe(5);",
          )

          test_path = Path("test/mcp-github-issue-provider-writes.test.ts")
          test_path.write_text(r'''import { describe, expect, test } from "bun:test";
          import { createApiToken } from "../src/auth.ts";
          import {
            type GitHubIssueProviderWriteService,
            withGitHubIssueProviderWriteService,
          } from "../src/github-issue-provider-mcp.ts";
          import type {
            GitHubIssueProviderOperation,
            GitHubProviderReceipt,
          } from "../src/github-provider-contracts.ts";
          import { createServerApp } from "../src/server-app.ts";
          import { SqliteWorkLedger } from "../src/sqlite-ledger.ts";
          import { StensiblyStore } from "../src/store.ts";
          import {
            callToolEnvelope,
            callToolJson,
            initializeMessage,
            mcpRequest,
            toolCall,
          } from "./support/mcp-http.ts";

          const client = { clientName: "github-provider-write-test" };

          describe("remote GitHub issue provider MCP writes", () => {
            test("derives actor identity and dispatches create, update, and comment writes", async () => {
              const store = new StensiblyStore(":memory:");
              const calls: unknown[] = [];
              const service: GitHubIssueProviderWriteService = {
                async createIssue(input) {
                  calls.push(input);
                  return receipt("github_create_issue", input.idempotencyKey);
                },
                async updateIssue(input) {
                  calls.push(input);
                  return receipt("github_update_issue", input.idempotencyKey);
                },
                async addIssueComment(input) {
                  calls.push(input);
                  return receipt("github_add_issue_comment", input.idempotencyKey);
                },
              };
              const ledger = withGitHubIssueProviderWriteService(
                new SqliteWorkLedger(store),
                service,
              );

              try {
                const writer = createApiToken(store, {
                  name: "Stensibly GitHub writer",
                  scopes: ["read", "write"],
                  projects: ["stensibly"],
                });
                const app = createServerApp(store, { ledger });
                await initialize(app, writer.token, 1);

                const created = await callToolJson<GitHubProviderReceipt>(
                  app,
                  writer.token,
                  2,
                  "github_create_issue",
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    title: "Provider write MCP test",
                    body: "Bounded body",
                    labels: ["area:github"],
                    assignees: ["teamleaderleo"],
                    idempotencyKey: "gh-write-create-1",
                    capabilityGrantId: "grant_issue_write_1",
                  },
                );
                expect(created).toMatchObject({
                  operation: "github_create_issue",
                  idempotencyKey: "gh-write-create-1",
                  state: "succeeded",
                });

                const updated = await callToolJson<GitHubProviderReceipt>(
                  app,
                  writer.token,
                  3,
                  "github_update_issue",
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    issueNumber: 921,
                    expectedSourceRevision: "github-rest:I_issue_921:rev-1",
                    title: "Mounted provider write MCP test",
                    state: "open",
                    idempotencyKey: "gh-write-update-1",
                    approvalId: "approval_issue_write_1",
                  },
                );
                expect(updated.operation).toBe("github_update_issue");

                const commented = await callToolJson<GitHubProviderReceipt>(
                  app,
                  writer.token,
                  4,
                  "github_add_issue_comment",
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    issueNumber: 921,
                    body: "Exact bounded comment",
                    idempotencyKey: "gh-write-comment-1",
                  },
                );
                expect(commented.operation).toBe("github_add_issue_comment");

                const tokenIdentity = `api-token:${writer.id}`;
                expect(calls).toEqual([
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    actorId: tokenIdentity,
                    clientId: `mcp:${tokenIdentity}`,
                    capabilityGrantId: "grant_issue_write_1",
                    title: "Provider write MCP test",
                    body: "Bounded body",
                    labels: ["area:github"],
                    assignees: ["teamleaderleo"],
                    idempotencyKey: "gh-write-create-1",
                  },
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    actorId: tokenIdentity,
                    clientId: `mcp:${tokenIdentity}`,
                    approvalId: "approval_issue_write_1",
                    issueNumber: 921,
                    expectedSourceRevision: "github-rest:I_issue_921:rev-1",
                    title: "Mounted provider write MCP test",
                    state: "open",
                    idempotencyKey: "gh-write-update-1",
                  },
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    actorId: tokenIdentity,
                    clientId: `mcp:${tokenIdentity}`,
                    issueNumber: 921,
                    body: "Exact bounded comment",
                    idempotencyKey: "gh-write-comment-1",
                  },
                ]);
              } finally {
                store.close();
              }
            });

            test("requires write scope before dispatch", async () => {
              const store = new StensiblyStore(":memory:");
              let calls = 0;
              const ledger = withGitHubIssueProviderWriteService(
                new SqliteWorkLedger(store),
                {
                  async createIssue(input) {
                    calls += 1;
                    return receipt("github_create_issue", input.idempotencyKey);
                  },
                  async updateIssue(input) {
                    calls += 1;
                    return receipt("github_update_issue", input.idempotencyKey);
                  },
                  async addIssueComment(input) {
                    calls += 1;
                    return receipt("github_add_issue_comment", input.idempotencyKey);
                  },
                },
              );

              try {
                const reader = createApiToken(store, {
                  name: "Read-only GitHub token",
                  scopes: ["read"],
                  projects: ["stensibly"],
                });
                const app = createServerApp(store, { ledger });
                await initialize(app, reader.token, 10);
                const response = await mcpRequest(app, reader.token, toolCall(
                  11,
                  "github_create_issue",
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    title: "Denied write",
                    idempotencyKey: "gh-write-denied-1",
                  },
                ));
                expect(response.status).toBe(403);
                expect(await response.json()).toMatchObject({
                  error: { message: "Token requires write scope" },
                  id: 11,
                });
                expect(calls).toBe(0);
              } finally {
                store.close();
              }
            });

            test("keeps stable write tools registered before hosted write composition is mounted", async () => {
              const store = new StensiblyStore(":memory:");
              try {
                const writer = createApiToken(store, {
                  name: "Unconfigured GitHub writer",
                  scopes: ["write"],
                  projects: ["stensibly"],
                });
                const app = createServerApp(store);
                await initialize(app, writer.token, 20);
                const result = await callToolEnvelope(
                  app,
                  writer.token,
                  21,
                  "github_add_issue_comment",
                  {
                    project: "stensibly",
                    repository: "teamleaderleo/stensibly",
                    issueNumber: 921,
                    body: "Unavailable provider write",
                    idempotencyKey: "gh-write-unavailable-1",
                  },
                );
                expect(result.isError).toBe(true);
                expect(result.text).toContain("no mounted provider write service");
              } finally {
                store.close();
              }
            });
          });

          function receipt(
            operation: GitHubIssueProviderOperation,
            idempotencyKey: string,
          ): GitHubProviderReceipt {
            return {
              version: 1,
              id: `ghop_${idempotencyKey}`,
              project: "stensibly",
              provider: "github",
              repositoryFullName: "teamleaderleo/stensibly",
              operation,
              target: "teamleaderleo/stensibly#921",
              actorId: "actor",
              clientId: "client",
              connectionId: "ghconn_1",
              installationId: "installation_1",
              bindingId: "ghbind_1",
              attachmentId: "attachment_1",
              attachmentSnapshotSha256: `sha256:${"a".repeat(64)}`,
              capabilityGrantId: null,
              approvalId: null,
              idempotencyKey,
              parametersSha256: `sha256:${"b".repeat(64)}`,
              state: "succeeded",
              attemptCount: 1,
              createdAt: "2026-08-02T00:00:00.000Z",
              updatedAt: "2026-08-02T00:00:01.000Z",
              providerRequestId: "github-request-1",
              result: null,
              verification: {
                state: "passed",
                checkedAt: "2026-08-02T00:00:01.000Z",
                sourceRevision: null,
              },
              error: null,
              recovery: { nextAction: "none" },
            };
          }

          async function initialize(
            app: ReturnType<typeof createServerApp>,
            token: string,
            id: number,
          ): Promise<void> {
            const response = await mcpRequest(
              app,
              token,
              initializeMessage(id, client),
            );
            expect(response.status).toBe(200);
          }
          '''.replace("          ", ""))

          workflow = Path(".github/workflows/lynx-921-github-issue-write-mcp.yml")
          workflow.unlink()
          PY

      - name: Install and run focused proof
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/mcp-github-issue-provider-writes.test.ts
          bun test test/mcp-github-project-slug-boundary.test.ts
          bun test test/chatgpt-app-actions-snapshot.test.ts
          bun test test/mcp-diagnostics.test.ts

      - name: Commit source-only candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_head="${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${expected_head}"

          mapfile -t changed_paths < <(
            git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //'
          )
          expected_paths=(
            ".github/workflows/lynx-921-github-issue-write-mcp.yml"
            "docs/chatgpt-app-actions.json"
            "docs/chatgpt-app-recovery.md"
            "src/github-issue-provider-mcp.ts"
            "src/mcp-capability-policy.ts"
            "src/mcp-diagnostics.ts"
            "src/mcp.ts"
            "test/chatgpt-app-actions-snapshot.test.ts"
