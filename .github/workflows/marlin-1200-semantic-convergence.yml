name: Marlin 1200 policy simulation semantic convergence

on:
  push:
    branches:
      - lumen/1147-mcp-policy-simulation
    paths:
      - .github/workflows/marlin-1200-semantic-convergence.yml

permissions:
  contents: write

concurrency:
  group: marlin-1200-policy-simulation-semantic-convergence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/1147-mcp-policy-simulation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact repair lease
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_PARENT: fc7aeeac615e9088583e349117083976dde7074a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD^)" = "${SOURCE_PARENT}"
          test "$(git rev-parse HEAD^:src/mcp-capability-policy-simulation-base.ts)" = "d55dfc6277cfa9ebf966dce4aad443b2f996379d"

      - uses: oven-sh/setup-bun@v2

      - name: Apply complete simulation semantics
        shell: bash
        env:
          SEMANTIC_CONTROL_SHA: 2ad3e0b1cf96aa2436e4e8d90871ea1d5ce2ebab
          APPROVAL_CONTROL_SHA: 956df092887e1eb2fbcbf4a374cf396ad6dbb177
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${SEMANTIC_CONTROL_SHA}" "${APPROVAL_CONTROL_SHA}"
          git show "${SEMANTIC_CONTROL_SHA}":test/mcp-capability-policy-simulation-semantic-red-control.test.ts \
            > test/mcp-capability-policy-simulation-semantic-red-control.test.ts
          git show "${APPROVAL_CONTROL_SHA}":test/mcp-capability-policy-simulation-approval-widening.test.ts \
            > test/mcp-capability-policy-simulation-approval-widening.test.ts

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/mcp-capability-policy-simulation-base.ts")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''  currentApprovalPolicy: string | null;
          candidateApprovalPolicy: string | null;
          currentProjectResolution: Readonly<McpCapabilityProjectResolution> | null;''',
              '''  currentApprovalPolicy: string | null;
          candidateApprovalPolicy: string | null;
          currentReceiptPolicy: string | null;
          candidateReceiptPolicy: string | null;
          currentReconciliationPolicy: string | null;
          candidateReconciliationPolicy: string | null;
          currentProjectResolution: Readonly<McpCapabilityProjectResolution> | null;''',
              "difference effect fields",
          )

          replace_once(
              '''  | "riskChanged"
          | "projectResolutionChanged"''',
              '''  | "riskChanged"
          | "effectPolicyChanged"
          | "projectResolutionChanged"''',
              "category union",
          )
          replace_once(
              '''  riskChanged: readonly McpPolicySimulationDifference[];
          projectResolutionChanged: readonly McpPolicySimulationDifference[];''',
              '''  riskChanged: readonly McpPolicySimulationDifference[];
          effectPolicyChanged: readonly McpPolicySimulationDifference[];
          projectResolutionChanged: readonly McpPolicySimulationDifference[];''',
              "simulation effect bucket",
          )
          replace_once(
              '''  "riskChanged",
          "projectResolutionChanged",''',
              '''  "riskChanged",
          "effectPolicyChanged",
          "projectResolutionChanged",''',
              "category registry",
          )

          old_counts = '''  const omittedCounts = Object.fromEntries(
            categories.map((category) => [
              category,
              Math.max(0, buckets[category].length - limit),
            ]),
          ) as Record<McpPolicySimulationCategory | "sourceReferences", number>;
          const visible = Object.fromEntries(
            categories.map((category) => [
              category,
              buckets[category].sort(compareDifferences).slice(0, limit),
            ]),
          ) as Record<McpPolicySimulationCategory, McpPolicySimulationDifference[]>;

          const references = new Set<string>();
          for (const category of categories) {
            for (const difference of visible[category]) {
              for (const reference of difference.sourceReferences) references.add(reference);
            }
          }
          const orderedReferences = [...references].sort(compareCodeUnits);
          omittedCounts.sourceReferences = Math.max(
            0,
            orderedReferences.length - maximumReferences,
          );'''
          new_counts = '''  const references = new Set<string>();
          for (const category of categories) {
            for (const difference of buckets[category]) {
              for (const reference of difference.sourceReferences) references.add(reference);
            }
          }
          const orderedReferences = [...references].sort(compareCodeUnits);
          const omittedCounts = Object.fromEntries(
            categories.map((category) => [
              category,
              Math.max(0, buckets[category].length - limit),
            ]),
          ) as Record<McpPolicySimulationCategory | "sourceReferences", number>;
          omittedCounts.sourceReferences = Math.max(
            0,
            orderedReferences.length - maximumReferences,
          );
          const visible = Object.fromEntries(
            categories.map((category) => [
              category,
              buckets[category].sort(compareDifferences).slice(0, limit),
            ]),
          ) as Record<McpPolicySimulationCategory, McpPolicySimulationDifference[]>;'''
          replace_once(old_counts, new_counts, "complete source-reference accounting")

          replace_once(
              '''    riskChanged: visible.riskChanged,
            projectResolutionChanged: visible.projectResolutionChanged,''',
              '''    riskChanged: visible.riskChanged,
            effectPolicyChanged: visible.effectPolicyChanged,
            projectResolutionChanged: visible.projectResolutionChanged,''',
              "unsigned effect bucket",
          )
          replace_once(
              '''    ["riskChanged", "Risk changed"],
            ["projectResolutionChanged", "Project resolution changed"],''',
              '''    ["riskChanged", "Risk changed"],
            ["effectPolicyChanged", "Receipt or reconciliation policy changed"],
            ["projectResolutionChanged", "Project resolution changed"],''',
              "markdown effect heading",
          )

          replace_once(
              '''    currentApprovalPolicy: current?.approvalPolicy ?? null,
            candidateApprovalPolicy: candidate?.approvalPolicy ?? null,
            currentProjectResolution: current ? { ...current.projectResolution } : null,''',
              '''    currentApprovalPolicy: current?.approvalPolicy ?? null,
            candidateApprovalPolicy: candidate?.approvalPolicy ?? null,
            currentReceiptPolicy: current?.receiptPolicy ?? null,
            candidateReceiptPolicy: candidate?.receiptPolicy ?? null,
            currentReconciliationPolicy: current?.reconciliationPolicy ?? null,
            candidateReconciliationPolicy: candidate?.reconciliationPolicy ?? null,
            currentProjectResolution: current ? { ...current.projectResolution } : null,''',
              "difference effect values",
          )
          replace_once(
              '''  if (current!.riskClass !== candidate!.riskClass) {
            return "The candidate changes the policy consequence class.";
          }
          if (current!.defaultExposure !== candidate!.defaultExposure) {''',
              '''  if (current!.riskClass !== candidate!.riskClass) {
            return "The candidate changes the policy consequence class.";
          }
          if (
            current!.receiptPolicy !== candidate!.receiptPolicy
            || current!.reconciliationPolicy !== candidate!.reconciliationPolicy
          ) {
            return "The candidate changes receipt or reconciliation policy.";
          }
          if (current!.defaultExposure !== candidate!.defaultExposure) {''',
              "decisive effect reason",
          )

          replace_once(
              '''      difference.currentDecision === "denied_by_policy"
              && difference.candidateDecision === "allowed_by_policy"''',
              '''      difference.currentDecision !== "allowed_by_policy"
              && difference.candidateDecision === "allowed_by_policy"''',
              "approval-removal widening",
          )
          replace_once(
              '''  if (difference.currentRiskClass !== difference.candidateRiskClass) {
            buckets.riskChanged.push(difference);
            changed = true;
          }
          if (
            stableJson(difference.currentProjectResolution)''',
              '''  if (difference.currentRiskClass !== difference.candidateRiskClass) {
            buckets.riskChanged.push(difference);
            changed = true;
          }
          if (
            difference.currentReceiptPolicy !== difference.candidateReceiptPolicy
            || difference.currentReconciliationPolicy
              !== difference.candidateReconciliationPolicy
          ) {
            buckets.effectPolicyChanged.push(difference);
            changed = true;
          }
          if (
            stableJson(difference.currentProjectResolution)''',
              "effect-policy classification",
          )

          path.write_text(source)
          PY

          git diff --check

      - name: Validate focused simulator repairs
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/mcp-capability-policy-simulation.test.ts \
            test/mcp-capability-policy-simulation-revoked-input.test.ts \
            test/mcp-capability-policy-simulation-semantic-red-control.test.ts \
            test/mcp-capability-policy-simulation-approval-widening.test.ts

      - name: Publish workflow-free repaired head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/marlin-1200-semantic-convergence.yml
          git add \
            src/mcp-capability-policy-simulation-base.ts \
            test/mcp-capability-policy-simulation-semantic-red-control.test.ts \
            test/mcp-capability-policy-simulation-approval-widening.test.ts
          git diff --cached --check
          git config user.name "Marlin"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Preserve complete policy simulation semantics"
          git fetch origin refs/heads/lumen/1147-mcp-policy-simulation:refs/remotes/origin/lumen/1147-mcp-policy-simulation
          test "$(git rev-parse refs/remotes/origin/lumen/1147-mcp-policy-simulation)" = "${EXPECTED_HEAD}"
          git push --force-with-lease=refs/heads/lumen/1147-mcp-policy-simulation:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/lumen/1147-mcp-policy-simulation
