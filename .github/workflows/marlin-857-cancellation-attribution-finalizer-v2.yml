name: Marlin 857 cancellation attribution repair v2

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'marlin/852-cancellation-attribution-repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: marlin/852-cancellation-attribution-repair
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply syntax-matched attribution repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          carrier = Path('.github/workflows/marlin-857-cancellation-attribution-finalizer.yml').read_text()
          marker = "python3 - <<'PY'\n"
          block = textwrap.dedent(carrier.split(marker, 1)[1].split('\n          PY', 1)[0])
          reference_section = re.compile(
              r"reference_anchor = '''.*?source = source\.replace\(reference_anchor, reference_replacement, 1\)\n",
              re.S,
          )
          replacement = '''reference_pattern = re.compile(
              r'  if \\(reference !== null\\) \\{\\s*if \\(reference\\.adapterId !== descriptor\\.adapterId\\) \\{'
          )
          reference_replacement = ''' + "'''" + '''  if (reference !== null) {
            if (reference.createdAt > observation.observedAt) {
              throw new RangeError(
                "Runner cancellation reference cannot follow its observation",
              );
            }
            if (reference.adapterId !== descriptor.adapterId) {
          ''' + "'''" + '''
          source, count = reference_pattern.subn(
              lambda _: reference_replacement,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('reference chronology syntax changed')
          '''
          block, count = reference_section.subn(lambda _: replacement, block, count=1)
          if count != 1:
              raise SystemExit('carrier reference patch section changed')
          exec(compile(block, 'marlin-857-attribution-repair', 'exec'))
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          bun run typecheck
          bun test test/runner-cancellation-settlement.test.ts test/runner-cancellation-settlement-attribution-boundaries.test.ts
      - name: Publish clean source head
        shell: bash
        run: |
          rm .github/workflows/marlin-857-cancellation-attribution-finalizer.yml
          rm .github/workflows/marlin-857-cancellation-attribution-finalizer-v2.yml
          git config user.name 'Marlin'
          git config user.email 'actions@users.noreply.github.com'
          git add src/runner-cancellation-settlement.ts test/runner-cancellation-settlement-attribution-boundaries.test.ts docs/runner-cancellation-settlement.md .github/workflows/marlin-857-cancellation-attribution-finalizer.yml .github/workflows/marlin-857-cancellation-attribution-finalizer-v2.yml
          git diff --cached --check
          git commit -m 'Bind cancellation authority and evidence exactly'
          git push origin HEAD:marlin/852-cancellation-attribution-repair
