name: Marlin 857 cancellation attribution repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'marlin/852-cancellation-attribution-repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: marlin/852-cancellation-attribution-repair
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact attribution repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/runner-cancellation-settlement.ts')
          source = source_path.read_text()

          execute_pattern = re.compile(
              r'  async #execute\(\): Promise<RunnerCancellationSettlementResultV1> \{.*?'
              r'\n  \}\n\}\n\nfunction adapterPort',
              re.S,
          )
          execute_replacement = '''  async #execute(): Promise<RunnerCancellationSettlementResultV1> {
            const commandFingerprint = fingerprintCanonicalRequest(this.#command);
            const timing = resolveExecutionTime(
              this.#clock,
              this.#command.requestedAt,
            );
            let observedAt = timing.observedAt;
            let outcome: RunnerCancellationSettlementOutcomeV1 = "adapter_failure";
            let cancellation: RunnerCancellationObservationV1 | null = null;

            if (
              !timing.failed
              && observedAt < this.#command.authority.expiresAt
            ) {
              try {
                const returned = await this.#adapter.requestCancellation(this.#command);
                cancellation = parseCancellationObservation(
                  returned,
                  this.#command,
                  this.#descriptor,
                );
                outcome = "cancellation_observed";
              } catch {
                cancellation = null;
                outcome = "adapter_failure";
              }
            }

            if (
              cancellation !== null
              && cancellation.observedAt > observedAt
            ) {
              cancellation = null;
              outcome = "adapter_failure";
              observedAt = this.#command.requestedAt;
            }

            const settlement = createResourceSettlementReceipt({
              workspace: this.#scope.workspace,
              project: this.#scope.project,
              resourceId: `run:${this.#command.runId}`,
              resourceKind: "runner_adapter",
              generation: this.#command.runGeneration,
              operationRef: commandFingerprint,
              policyVersion: resultPolicyVersion,
              failureMode: "continue_through_error",
              admissionState: "closed",
              disposition: "reconciliation_hold",
              openedAt: this.#command.requestedAt,
              closingStartedAt: this.#command.requestedAt,
              terminalAt: observedAt,
              observedAt,
              owners: [{
                id: `${this.#command.adapterId}:${this.#command.profileId}`,
                kind: "worker",
                generation: this.#command.runGeneration,
                attempted: true,
                state: "reconciliation_required",
                attemptedAt: this.#command.requestedAt,
                settledAt: observedAt,
                failureClass: "unknown_outcome",
                reconciliationRequired: true,
                canPublishLate: true,
                outputFingerprint: cancellation?.reference?.digest ?? null,
                publicationFenceFingerprint: null,
              }],
            });
            const generationAdvance = evaluateResourceGenerationAdvance(
              settlement,
              this.#command.runGeneration + 1,
            );
            if (generationAdvance.allowed) {
              throw new Error(
                "Runner cancellation settlement unexpectedly allowed generation advance",
              );
            }

            const withoutFingerprint = {
              version: RUNNER_CANCELLATION_SETTLEMENT_V1,
              workspace: this.#scope.workspace,
              project: this.#scope.project,
              commandId: this.#command.commandId,
              adapterId: this.#command.adapterId,
              adapterVersion: this.#command.adapterVersion,
              profileId: this.#command.profileId,
              runId: this.#command.runId,
              runGeneration: this.#command.runGeneration,
              leaseGeneration: this.#command.leaseGeneration,
              requestedAt: this.#command.requestedAt,
              observedAt,
              outcome,
              cancellation,
              settlement,
              generationAdvance,
              containsPrivateContent: false as const,
              containsCredentials: false as const,
            };
            return deepFreeze({
              ...withoutFingerprint,
              resultFingerprint: fingerprintCanonicalRequest(withoutFingerprint),
            });
          }
          }

          function adapterPort'''
          source, count = execute_pattern.subn(lambda _: execute_replacement, source, count=1)
          if count != 1:
              raise SystemExit('execute method anchor changed')

          timing_pattern = re.compile(
              r'function resolveSettlementTime\(.*?\n\}\n\nfunction exactRecord',
              re.S,
          )
          timing_replacement = '''function resolveExecutionTime(
            clock: RunnerCancellationSettlementClock,
            requestedAt: string,
          ): { observedAt: string; failed: boolean } {
            let value: unknown;
            try {
              value = clock();
            } catch {
              return { observedAt: requestedAt, failed: true };
            }
            let observedAt: string;
            try {
              observedAt = canonicalTimestamp(
                value,
                "Runner cancellation settlement observation time",
              );
            } catch {
              return { observedAt: requestedAt, failed: true };
            }
            if (observedAt < requestedAt) {
              return { observedAt: requestedAt, failed: true };
            }
            return { observedAt, failed: false };
          }

          function exactRecord'''
          source, count = timing_pattern.subn(lambda _: timing_replacement, source, count=1)
          if count != 1:
              raise SystemExit('timing helper anchor changed')

          reference_anchor = '''  if (reference !== null) {
            if (reference.adapterId !== descriptor.adapterId) {
          '''
          reference_replacement = '''  if (reference !== null) {
            if (reference.createdAt > observation.observedAt) {
              throw new RangeError(
                "Runner cancellation reference cannot follow its observation",
              );
            }
            if (reference.adapterId !== descriptor.adapterId) {
          '''
          if reference_anchor not in source:
              raise SystemExit('reference chronology anchor changed')
          source = source.replace(reference_anchor, reference_replacement, 1)
          source_path.write_text(source)

          docs_path = Path('docs/runner-cancellation-settlement.md')
          docs = docs_path.read_text()
          admission_anchor = '- authority generation and expiry;\n'
          admission_replacement = '''- authority generation and expiry at both request admission and the one trusted execution instant;
          - one complete command fingerprint binding command, authority holder/expiry, and cancellation reason;
          '''
          if admission_anchor not in docs:
              raise SystemExit('documentation admission anchor changed')
          docs = docs.replace(admission_anchor, admission_replacement, 1)

          evidence_anchor = 'It may not claim remote settlement. Delivery cannot be known when the request was not accepted.\n'
          evidence_replacement = evidence_anchor + '\nAn external reference must be created no later than the cancellation observation that publishes it. Future-dated references fail as adapter evidence and contribute no successful output.\n'
          if evidence_anchor not in docs:
              raise SystemExit('documentation evidence anchor changed')
          docs = docs.replace(evidence_anchor, evidence_replacement, 1)

          result_anchor = 'Every completed coordinator operation publishes one immutable `ResourceSettlementReceipt` for the exact run generation.\n'
          result_replacement = result_anchor + '\nThe settlement operation identity is the SHA-256 fingerprint of the complete admitted cancellation command. Reusing a command ID with different authority, expiry, or reason therefore produces a different receipt and result identity.\n'
          if result_anchor not in docs:
              raise SystemExit('documentation result anchor changed')
          docs_path.write_text(docs.replace(result_anchor, result_replacement, 1))
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify focused repair
        run: |
          bun run typecheck
          bun test test/runner-cancellation-settlement.test.ts test/runner-cancellation-settlement-attribution-boundaries.test.ts
      - name: Publish clean source head
        shell: bash
        run: |
          rm .github/workflows/marlin-857-cancellation-attribution-finalizer.yml
          git config user.name 'Marlin'
          git config user.email 'actions@users.noreply.github.com'
          git add src/runner-cancellation-settlement.ts test/runner-cancellation-settlement-attribution-boundaries.test.ts docs/runner-cancellation-settlement.md .github/workflows/marlin-857-cancellation-attribution-finalizer.yml
          git diff --cached --check
          git commit -m 'Bind cancellation authority and evidence exactly'
          git push origin HEAD:marlin/852-cancellation-attribution-repair
