name: MCP stateful replay v1.30 probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'probes/mcp-stateful-replay-v130/probe-fixed.mjs'
      - 'src/store.ts'
      - '.github/workflows/mcp-stateful-replay-v130-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-v130:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen repository dependencies
        run: bun install --frozen-lockfile
      - name: Run SDK 1.30 replay probe
        run: bun run probes/mcp-stateful-replay-v130/probe-fixed.mjs
