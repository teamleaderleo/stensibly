name: mica-591-observation-contract

on:
  push:
    branches:
      - mica/591-github-repository-observations
    paths:
      - .github/workflows/mica-591-observation-contract.yml

permissions:
  contents: write

concurrency:
  group: mica-591-observation-contract
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: mica/591-github-repository-observations
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Apply strict TypeScript repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/github-repository-observation.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''const number = positiveInteger(
                    payload.number ?? pullRequest.number,
                    "GitHub pull request number",
                  );''',
                  '''const number = positiveWebhookInteger(
                    payload.number ?? pullRequest.number,
                    "GitHub pull request number",
                  );''',
                  'pull request number',
              ),
              (
                  '''const number = positiveInteger(issue.number, "GitHub issue number");''',
                  '''const number = positiveWebhookInteger(issue.number, "GitHub issue number");''',
                  'issue number',
              ),
              (
                  '''const issueNumber = positiveInteger(issue.number, "GitHub issue comment issue number");''',
                  '''const issueNumber = positiveWebhookInteger(
                    issue.number,
                    "GitHub issue comment issue number",
                  );''',
                  'issue comment number',
              ),
              (
                  '''function canonicalRevision(
                    value: string,
                    label: string,
                    allowZero = false,
                  ): string | null {''',
                  '''function canonicalRevision(value: string, label: string): string;
                  function canonicalRevision(
                    value: string,
                    label: string,
                    allowZero: true,
                  ): string | null;
                  function canonicalRevision(
                    value: string,
                    label: string,
                    allowZero = false,
                  ): string | null {''',
                  'revision overloads',
              ),
              (
                  '''function providerId(value: unknown, label: string): string {''',
                  '''function positiveWebhookInteger(value: unknown, label: string): number {
                    if (typeof value !== "number") {
                      throw new RangeError(`${label} must be a number`);
                    }
                    return positiveInteger(value, label);
                  }

                  function providerId(value: unknown, label: string): string {''',
                  'positive integer helper',
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused and repository checks
        run: |
          set -euxo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/strict-json.test.ts test/github-repository-observation.test.ts
          bun test
          bun run worker:check

      - name: Publish source-only draft
        run: |
          set -euxo pipefail
          rm .github/workflows/mica-591-observation-contract.yml
          git diff --check
          git config user.name mica-stensibly
          git config user.email mica-stensibly@users.noreply.github.com
          git add src/strict-json.ts src/github-repository-observation.ts test/strict-json.test.ts test/github-repository-observation.test.ts .github/workflows/mica-591-observation-contract.yml
          git commit -m 'feat: define GitHub repository observations'
          git push origin HEAD:refs/heads/mica/591-github-repository-observations
