name: Morrow 1050 pre-aborted signal repair

on:
  pull_request:
    paths:
      - .github/workflows/morrow-1050-preaborted-signal.yml

permissions:
  contents: write

concurrency:
  group: morrow-1050-preaborted-signal
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: morrow/1050-preaborted-signal-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Complete native Request signal precedence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/github-provider-bounded-response.ts")
          text = source.read_text()

          signal_before = '''    const externalSignal = init?.signal !== undefined
              ? init.signal
              : requestSignal;'''
          signal_after = '''    const hasInitSignal = init !== undefined
              && Object.prototype.hasOwnProperty.call(init, "signal");
            const externalSignal = hasInitSignal
              ? init?.signal ?? null
              : requestSignal;'''
          if text.count(signal_before) != 1:
            raise SystemExit("effective signal anchor changed")
          text = text.replace(signal_before, signal_after, 1)

          dispatch_before = '''    try {
              const providerCall = Promise.resolve(fetchImplementation(input, {'''
          dispatch_after = '''    try {
              if (context.expired) await context.deadline;
              const providerCall = Promise.resolve(fetchImplementation(input, {'''
          if text.count(dispatch_before) != 1:
            raise SystemExit("provider dispatch anchor changed")
          source.write_text(text.replace(dispatch_before, dispatch_after, 1))
          PY
          git diff --check

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-provider-bounded-response-preaborted-signal.test.ts \
            test/github-provider-bounded-response-native-request-signal.test.ts \
            test/github-provider-bounded-response-external-abort.test.ts \
            test/github-provider-bounded-response-external-abort-cleanup.test.ts \
            test/github-provider-response-deadline.test.ts \
            test/github-provider-bounded-readback-facade.test.ts

      - name: Publish source and controls only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/morrow/1050-preaborted-signal-repair:refs/remotes/origin/morrow/1050-preaborted-signal-repair
          test "$(git rev-parse refs/remotes/origin/morrow/1050-preaborted-signal-repair)" = "$EXPECTED_HEAD"
          rm .github/workflows/morrow-1050-preaborted-signal.yml
          git config user.name "Morrow"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-provider-bounded-response.ts \
            test/github-provider-bounded-response-preaborted-signal.test.ts \
            .github/workflows/morrow-1050-preaborted-signal.yml
          git diff --cached --check
          git commit -m "Avoid provider dispatch after caller cancellation"
          git push --force-with-lease=refs/heads/morrow/1050-preaborted-signal-repair:$EXPECTED_HEAD \
            origin HEAD:refs/heads/morrow/1050-preaborted-signal-repair
