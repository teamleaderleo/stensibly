name: Lark 1096 current-parent post-effect replay

on:
  push:
    branches:
      - morrow/1087-post-effect-current-admission
    paths:
      - .github/workflows/morrow-1087-post-effect-service.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lark-1096-current-parent-post-effect-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: morrow/1087-post-effect-current-admission
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact carrier and reviewed packet
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "cb3a31b83c579ae58d263915fee29851a30ac7d9"
          test "$(git diff --name-only 6704c2c519777fa0f1e499b2cff78e09067de759 cb3a31b83c579ae58d263915fee29851a30ac7d9 | sort)" = "$(printf '%s\n' \
            .github/workflows/morrow-1087-post-effect-service.yml \
            src/github-repository-write-admission.ts \
            src/github-repository-write-post-effect-error.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts | sort)"

      - uses: oven-sh/setup-bun@v2

      - name: Replay bounded evidence and apply service handling
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            c428f18b9f208c9fb081c4ce7643bc2b20ddea19 \
            cb3a31b83c579ae58d263915fee29851a30ac7d9
          git reset --hard c428f18b9f208c9fb081c4ce7643bc2b20ddea19
          git cherry-pick --no-commit cb3a31b83c579ae58d263915fee29851a30ac7d9
          rm .github/workflows/morrow-1087-post-effect-service.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-repository-write-provider-service.ts")
          text = path.read_text()

          import_anchor = '''import { sha256, stableJson } from "./canonical-json.js";
          import {
            prepareRepositoryWrite,'''
          import_replacement = '''import { sha256, stableJson } from "./canonical-json.js";
          import {
            GitHubRepositoryWritePostEffectError,
          } from "./github-repository-write-post-effect-error.js";
          import {
            prepareRepositoryWrite,'''
          if text.count(import_anchor) != 1:
            raise SystemExit("post-effect import anchor changed")
          text = text.replace(import_anchor, import_replacement, 1)

          catch_anchor = '''    } catch {
            const pending = await this.#hold(
              receiptWithDispatch(receipt),
              "repository_write_provider_outcome_ambiguous",
            );
            throw new GitHubRepositoryWritePendingReconciliationError(pending);
          }

          let verified: VerifiedRepositoryWrite;'''
          catch_replacement = '''    } catch (error) {
            if (error instanceof GitHubRepositoryWritePostEffectError) {
              let postEffectVerified: VerifiedRepositoryWrite | null = null;
              try {
                postEffectVerified = await verifyRepositoryWriteResult({
                  prepared: secondPrepared,
                  providerResult: error.result,
                  refs: this.#adapter,
                  now: this.#now,
                });
              } catch {
                // Invalid or substituted carried evidence remains unverified ambiguity.
              }
              if (postEffectVerified) {
                const dispatched = receiptWithDispatch(receipt);
                let pending = receiptWithVerified(
                  dispatched,
                  postEffectVerified,
                  error.code,
                );
                try {
                  pending = await this.#store
                    .holdVerifiedRepositoryWriteForReconciliation({
                      receipt: dispatched,
                      verified: postEffectVerified,
                      code: error.code,
                      heldAt: exactTimestamp(
                        this.#now(),
                        "Repository write post-effect reconciliation time",
                      ),
                    });
                } catch {
                  // The thrown pending error retains the exact admitted evidence.
                }
                throw new GitHubRepositoryWritePendingReconciliationError(pending);
              }
            }
            const pending = await this.#hold(
              receiptWithDispatch(receipt),
              "repository_write_provider_outcome_ambiguous",
            );
            throw new GitHubRepositoryWritePendingReconciliationError(pending);
          }

          let verified: VerifiedRepositoryWrite;'''
          if text.count(catch_anchor) != 1:
            raise SystemExit("post-effect catch anchor changed")
          path.write_text(text.replace(catch_anchor, catch_replacement, 1))
          PY
          git add \
            src/github-repository-write-admission.ts \
            src/github-repository-write-post-effect-error.ts \
            src/github-repository-write-provider-service.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts
          test -z "$(git diff --name-only)"
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            src/github-repository-write-admission.ts \
            src/github-repository-write-post-effect-error.ts \
            src/github-repository-write-provider-service.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts | sort)"
          git diff --cached --check

      - name: Validate parent, evidence, and service lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-repository-write-provider-service.test.ts \
            test/github-repository-write-post-effect-error-admission.test.ts \
            test/github-repository-write-post-effect-error-identity.test.ts \
            test/github-repository-write-post-effect-attribution.test.ts \
            test/github-repository-write-full-ref-admission.test.ts \
            test/github-rest-repository-write-adapter-fence-parity.test.ts \
            test/github-rest-repository-write-provider-url-spelling.test.ts \
            test/repository-write-fence.test.ts

      - name: Publish exact one-commit workflow-free replay
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lark"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Replay verified post-effect evidence on current admission"
          test "$(git rev-list --count c428f18b9f208c9fb081c4ce7643bc2b20ddea19..HEAD)" = "1"
          git fetch origin refs/heads/morrow/1087-post-effect-current-admission:refs/remotes/origin/morrow/1087-post-effect-current-admission
          test "$(git rev-parse refs/remotes/origin/morrow/1087-post-effect-current-admission)" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/morrow/1087-post-effect-current-admission:$EXPECTED_HEAD \
            origin HEAD:refs/heads/morrow/1087-post-effect-current-admission
