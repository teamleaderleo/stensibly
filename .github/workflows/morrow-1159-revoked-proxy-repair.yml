name: Morrow 1159 revoked Proxy inspection repair

on:
  push:
    branches:
      - lumen/1145-project-delta-brief
    paths:
      - .github/workflows/morrow-1159-revoked-proxy-repair.yml

permissions:
  contents: write

concurrency:
  group: morrow-1159-revoked-proxy-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/1145-project-delta-brief
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ffbfd4e78b38ad8789f1a243ab9bbbc47f77203e"
          test "$(git rev-parse HEAD^:src/project-delta-brief.ts)" = "2848f07ffe0c40e14e617a694d82c3da5ad930bb"
          test "$(git rev-parse HEAD^:test/project-delta-brief-input-inspection.test.ts)" = "04798c46a7a722e1d5550c91a7214f30f79b898b"

      - uses: oven-sh/setup-bun@v2

      - name: Normalize revoked object inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/project-delta-brief.ts")
          source = source_path.read_text()

          old_input = '''function requireInputObject(value: unknown, budget: SnapshotBudget): void {
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              throw new TypeError("Project delta input inspection failed");
            }
            noteObject(budget, "Project delta input inspection exceeded its limit");
            try {
              if (Object.getPrototypeOf(value) !== Object.prototype) {
                throw new TypeError("Project delta input inspection failed");
              }
            } catch (error) {
              if (isFixedInspectionError(error, "Project delta input inspection failed")) throw error;
              throw new TypeError("Project delta input inspection failed");
            }
          }'''
          new_input = '''function requireInputObject(value: unknown, budget: SnapshotBudget): void {
            if (value === null || typeof value !== "object") {
              throw new TypeError("Project delta input inspection failed");
            }
            noteObject(budget, "Project delta input inspection exceeded its limit");
            try {
              if (Array.isArray(value) || Object.getPrototypeOf(value) !== Object.prototype) {
                throw new TypeError("Project delta input inspection failed");
              }
            } catch (error) {
              if (isFixedInspectionError(error, "Project delta input inspection failed")) throw error;
              throw new TypeError("Project delta input inspection failed");
            }
          }'''

          old_brief = '''function requireBriefObject(value: unknown, budget: SnapshotBudget): void {
            if (value === null || typeof value !== "object" || Array.isArray(value)) {
              throw new TypeError("Project delta brief inspection failed");
            }
            noteObject(budget, "Project delta brief inspection exceeded its limit");
            try {
              if (Object.getPrototypeOf(value) !== Object.prototype) {
                throw new TypeError("Project delta brief inspection failed");
              }
            } catch (error) {
              if (isFixedInspectionError(error, "Project delta brief inspection failed")) throw error;
              throw new TypeError("Project delta brief inspection failed");
            }
          }'''
          new_brief = '''function requireBriefObject(value: unknown, budget: SnapshotBudget): void {
            if (value === null || typeof value !== "object") {
              throw new TypeError("Project delta brief inspection failed");
            }
            noteObject(budget, "Project delta brief inspection exceeded its limit");
            try {
              if (Array.isArray(value) || Object.getPrototypeOf(value) !== Object.prototype) {
                throw new TypeError("Project delta brief inspection failed");
              }
            } catch (error) {
              if (isFixedInspectionError(error, "Project delta brief inspection failed")) throw error;
              throw new TypeError("Project delta brief inspection failed");
            }
          }'''

          for old, new, label in [
            (old_input, new_input, "input object"),
            (old_brief, new_brief, "brief object"),
          ]:
            if source.count(old) != 1:
              raise SystemExit(f"expected one {label} anchor, found {source.count(old)}")
            source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path("test/project-delta-brief-input-inspection.test.ts")
          tests = test_path.read_text()
          if "normalizes revoked compile and Markdown envelopes" in tests:
            raise SystemExit("revoked Proxy control already exists")
          tests += r'''

test("normalizes revoked compile and Markdown envelopes", () => {
  const compile = Proxy.revocable({}, {});
  compile.revoke();
  expect(() => compileProjectDeltaBrief(
    compile.proxy as unknown as Parameters<typeof compileProjectDeltaBrief>[0],
  )).toThrow("Project delta input inspection failed");

  const brief = Proxy.revocable({}, {});
  brief.revoke();
  expect(() => renderProjectDeltaBriefMarkdown(
    brief.proxy as unknown as Parameters<typeof renderProjectDeltaBriefMarkdown>[0],
  )).toThrow("Project delta brief inspection failed");
});
'''
          test_path.write_text(tests)
          PY
          git diff --check

      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/project-delta-brief-input-inspection.test.ts \
            test/project-delta-brief-public-boundary.test.ts \
            test/project-delta-brief.test.ts

      - name: Publish workflow-free repaired head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/morrow-1159-revoked-proxy-repair.yml
          git add src/project-delta-brief.ts test/project-delta-brief-input-inspection.test.ts
          git diff --cached --check
          git config user.name "Morrow"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Normalize revoked project delta inputs"
          git push origin HEAD:lumen/1145-project-delta-brief
