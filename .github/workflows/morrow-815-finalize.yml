name: morrow-815-finalize

on:
  push:
    branches:
      - morrow/815-official-pr-result
    paths:
      - .github/workflows/morrow-815-finalize.yml

permissions:
  contents: write

concurrency:
  group: morrow-815-finalize
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@v6
        with:
          ref: morrow/815-official-pr-result
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact carrier head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Publish reviewed source and tests
        run: |
          set -euo pipefail
          cat > /tmp/adapter.ts.gz.b64 <<'B64'

B64
          cat > /tmp/adapter.test.ts.gz.b64 <<'B64'

B64
          base64 -d /tmp/adapter.ts.gz.b64 | gzip -d > src/github-official-mcp-pull-request-adapter.ts
          base64 -d /tmp/adapter.test.ts.gz.b64 | gzip -d > test/github-official-mcp-pull-request-adapter.test.ts

      - uses: oven-sh/setup-bun@v2
      - name: Validate focused candidate
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-official-mcp-pull-request-adapter.test.ts
          git diff --check

      - name: Publish carrier-free exact candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm .github/workflows/morrow-815-finalize.yml
          git config user.name morrow-stensibly
          git config user.email morrow-stensibly@users.noreply.github.com
          git add src/github-official-mcp-pull-request-adapter.ts test/github-official-mcp-pull-request-adapter.test.ts .github/workflows/morrow-815-finalize.yml
          git commit -m 'Verify official GitHub MCP pull request results'
          git push --force-with-lease=refs/heads/morrow/815-official-pr-result:$EXPECTED_SHA origin HEAD:refs/heads/morrow/815-official-pr-result
