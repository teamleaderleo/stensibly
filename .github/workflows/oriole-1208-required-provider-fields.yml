name: Oriole 1208 required provider fields

on:
  push:
    branches:
      - juniper/1163-updaterefs-cas-integration
    paths:
      - .github/workflows/oriole-1208-required-provider-fields.yml

permissions:
  contents: write

concurrency:
  group: oriole-1208-required-provider-fields
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juniper/1163-updaterefs-cas-integration
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact blocked source
        shell: bash
        env:
          SOURCE_BLOB: 0cfe937f238e7018d3fbb30d99c9cab78c35c820
          RED_CONTROL_SHA: 68d620992a2359a482e2c7f3c627ab2bb0fd49c4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/github-rest-repository-write-atomic-publication.ts)" = "$SOURCE_BLOB"
          git fetch --no-tags origin "$RED_CONTROL_SHA"
          git show "$RED_CONTROL_SHA":test/github-rest-repository-write-atomic-required-fields.test.ts \
            > /tmp/github-rest-repository-write-atomic-required-fields.test.ts

      - name: Require every declared provider field
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-rest-repository-write-atomic-publication.ts")
          text = path.read_text()
          old = '''    if (!descriptor) continue;
    if (!descriptor.enumerable || !("value" in descriptor)) {
      throw invalidResponse(`${label} was malformed`);
    }
    result[key] = descriptor.value;'''
          new = '''    if (!descriptor || !descriptor.enumerable || !("value" in descriptor)) {
      throw invalidResponse(`${label} was malformed`);
    }
    result[key] = descriptor.value;'''
          if text.count(old) != 1:
              raise SystemExit(f"exactRecord required-field anchor moved: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          cp /tmp/github-rest-repository-write-atomic-required-fields.test.ts \
            test/github-rest-repository-write-atomic-required-fields.test.ts
          git diff --check

      - uses: oven-sh/setup-bun@v2

      - name: Validate exact-CAS response completeness
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-rest-repository-write-atomic-required-fields.test.ts \
            test/github-rest-repository-write-atomic-small-tree-ownkeys.test.ts \
            test/github-rest-repository-write-atomic-record-ownkeys.test.ts \
            test/github-rest-repository-write-atomic-publication.test.ts \
            test/github-rest-repository-write-atomic-mode-preservation.test.ts \
            test/github-rest-repository-write-ancestor-regression.test.ts \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-update-refs-cas.test.ts \
            test/github-update-refs-cas-provider-endpoint-binding.test.ts

      - name: Publish workflow-free repair
        shell: bash
        env:
          CARRIER_SHA: ${{ github.sha }}
          HEAD_REF: juniper/1163-updaterefs-cas-integration
        run: |
          set -euo pipefail
          git add \
            src/github-rest-repository-write-atomic-publication.ts \
            test/github-rest-repository-write-atomic-required-fields.test.ts
          git rm .github/workflows/oriole-1208-required-provider-fields.yml
          git diff --cached --check
          git config user.name "Oriole"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Require complete atomic provider records"

          git fetch origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$CARRIER_SHA"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${CARRIER_SHA}" \
            origin "HEAD:refs/heads/${HEAD_REF}"
