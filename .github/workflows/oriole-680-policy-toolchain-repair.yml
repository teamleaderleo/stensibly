name: Oriole 680 policy and toolchain repair

on:
  push:
    branches:
      - oriole/680-policy-toolchain-repair

permissions:
  contents: write

concurrency:
  group: oriole-680-policy-toolchain-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: oriole/680-policy-toolchain-repair
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply exact policy and toolchain repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          expression_open = "$" + "{{"

          ci_path = Path(".github/workflows/ci.yml")
          ci = r'''name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA that this run must validate
        required: true
        type: string

concurrency:
  group: >-
    ci-__EXPR__ github.repository }}-__EXPR__ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) ||
    github.event_name == 'workflow_dispatch' &&
    format('dispatch-{0}', inputs.expected_sha) ||
    format('push-{0}', github.sha) }}
  cancel-in-progress: __EXPR__ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  BUN_REVISION: "1.3.14+0d9b296af"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: __EXPR__ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify manually dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: __EXPR__ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ -z "${EXPECTED_SHA}" || ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ || "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Dispatched CI expected ${EXPECTED_SHA:-missing} but checked out ${actual_sha}." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: __EXPR__ env.BUN_VERSION }}
      - name: Attest pinned Bun runtime
        id: bun-runtime
        run: |
          set -euo pipefail
          actual_version="$(bun --version)"
          actual_revision="$(bun --revision)"
          binary_path="$(command -v bun)"
          binary_sha256="$(sha256sum "${binary_path}" | awk '{print $1}')"
          if [[ "${actual_version}" != "${BUN_VERSION}" || "${actual_revision}" != "${BUN_REVISION}" || ! "${binary_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Pinned Bun runtime admission failed." >&2
            exit 1
          fi
          echo "version=${actual_version}" >>"${GITHUB_OUTPUT}"
          echo "revision=${actual_revision}" >>"${GITHUB_OUTPUT}"
          echo "binary_sha256=${binary_sha256}" >>"${GITHUB_OUTPUT}"
      - name: Prepare committed Bun lockfile candidate
        id: bun-lock
        run: bun run lockfile:check
      - name: Upload refreshed Bun lockfile candidate
        if: steps.bun-lock.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock-candidate-__EXPR__ github.sha }}-bun-__EXPR__ steps.bun-runtime.outputs.version }}-__EXPR__ steps.bun-runtime.outputs.binary_sha256 }}
          path: artifacts/bun-lock-candidate
          if-no-files-found: error
          retention-days: 7
      - name: Reject stale committed Bun lockfile
        if: steps.bun-lock.outputs.changed == 'true'
        run: |
          echo "package declarations regenerate bun.lock. Inspect the run-owned Bun lock candidate artifact and commit its bun.lock."
          echo "committed: __EXPR__ steps.bun-lock.outputs.committed_sha256 }}"
          echo "candidate: __EXPR__ steps.bun-lock.outputs.candidate_sha256 }}"
          echo "bun-version: __EXPR__ steps.bun-runtime.outputs.version }}"
          echo "bun-revision: __EXPR__ steps.bun-runtime.outputs.revision }}"
          echo "bun-binary-sha256: __EXPR__ steps.bun-runtime.outputs.binary_sha256 }}"
          exit 1
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.txt
      - name: Run Bun tests
        run: |
          set -o pipefail
          bun run test 2>&1 | tee test-output.txt
      - name: Run Convex tests
        run: |
          set -o pipefail
          bun run test:convex 2>&1 | tee convex-test-output.txt
      - name: Bundle Cloudflare Worker
        run: |
          set -o pipefail
          bun run worker:check 2>&1 | tee worker-check-output.txt
      - name: Upload failing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            typecheck-output.txt
            test-output.txt
            convex-test-output.txt
            worker-check-output.txt
          if-no-files-found: ignore

  runtime-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: __EXPR__ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify manually dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: __EXPR__ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ -z "${EXPECTED_SHA}" || ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ || "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Dispatched CI expected ${EXPECTED_SHA:-missing} but checked out ${actual_sha}." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: __EXPR__ env.BUN_VERSION }}
      - name: Verify pinned Bun runtime
        run: |
          set -euo pipefail
          actual_version="$(bun --version)"
          actual_revision="$(bun --revision)"
          if [[ "${actual_version}" != "${BUN_VERSION}" || "${actual_revision}" != "${BUN_REVISION}" ]]; then
            echo "Pinned Bun runtime admission failed." >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Run Bun, Node, and native workerd receiver checks
        run: |
          set -o pipefail
          bun run test:runtime-parity 2>&1 | tee runtime-parity-output.txt
      - name: Upload runtime parity diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-diagnostics
          path: runtime-parity-output.txt
          if-no-files-found: ignore
'''.replace("__EXPR__", expression_open)
          ci_path.write_text(ci)

          writer_path = Path(".github/workflows/apply-bun-lock-candidate.yml")
          writer = writer_path.read_text()
          writer = replace_once(
              writer,
              '''      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}\n''',
              '''      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}\n      BUN_VERSION: "1.3.14"\n      BUN_REVISION: "1.3.14+0d9b296af"\n''',
              "writer Bun environment",
          )

          old_artifact_block = '''          run_artifacts="$(
            gh api \\
              --method GET \\
              "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100"
          )"
          candidate_artifacts="$(
            jq '[
              .artifacts[]
              | select(.expired == false)
              | select(.name | test("^bun-lock-candidate-[0-9a-f]{40}$"))
            ]' <<<"${run_artifacts}"
          )"
          artifact_count="$(jq 'length' <<<"${candidate_artifacts}")"
          if [[ "${artifact_count}" != "1" ]]; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "Expected one live Bun lock candidate artifact for workflow run ${TRIGGERING_RUN_ID}; found ${artifact_count}." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          validation_sha="$(
            jq -r '.[0].name | sub("^bun-lock-candidate-"; "")' \\
              <<<"${candidate_artifacts}"
          )"
'''
          new_artifact_block = '''          triggering_run="$(
            gh api \\
              --method GET \\
              "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGERING_RUN_ID}"
          )"
          canonical_workflow="$(
            gh api \\
              --method GET \\
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"
          )"
          run_id="$(jq -r '.id // 0' <<<"${triggering_run}")"
          run_workflow_id="$(jq -r '.workflow_id // 0' <<<"${triggering_run}")"
          run_path="$(jq -r '.path // ""' <<<"${triggering_run}")"
          run_path="${run_path%%@*}"
          run_event="$(jq -r '.event // ""' <<<"${triggering_run}")"
          run_status="$(jq -r '.status // ""' <<<"${triggering_run}")"
          run_conclusion="$(jq -r '.conclusion // ""' <<<"${triggering_run}")"
          run_attempt="$(jq -r '.run_attempt // 0' <<<"${triggering_run}")"
          run_head_sha="$(jq -r '.head_sha // ""' <<<"${triggering_run}")"
          run_head_branch="$(jq -r '.head_branch // ""' <<<"${triggering_run}")"
          run_repository="$(jq -r '.repository.full_name // ""' <<<"${triggering_run}")"
          canonical_workflow_id="$(jq -r '.id // 0' <<<"${canonical_workflow}")"
          canonical_workflow_path="$(jq -r '.path // ""' <<<"${canonical_workflow}")"

          if [[
            "${run_id}" != "${TRIGGERING_RUN_ID}" ||
            "${run_workflow_id}" != "${canonical_workflow_id}" ||
            "${run_path}" != ".github/workflows/ci.yml" ||
            "${canonical_workflow_path}" != ".github/workflows/ci.yml" ||
            "${run_event}" != "pull_request" ||
            "${run_status}" != "completed" ||
            "${run_conclusion}" != "failure" ||
            ! "${run_attempt}" =~ ^[1-9][0-9]*$ ||
            "${run_head_sha}" != "${EXPECTED_HEAD}" ||
            "${run_head_branch}" != "${HEAD_BRANCH}" ||
            "${run_repository}" != "${GITHUB_REPOSITORY}"
          ]]; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "Workflow run ${TRIGGERING_RUN_ID} is not one failed canonical CI pull-request attempt for this exact feature head." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          run_artifacts="$(
            gh api \\
              --method GET \\
              "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100"
          )"
          candidate_artifacts="$(
            jq '[
              .artifacts[]
              | select(.expired == false)
              | select(.name | test("^bun-lock-candidate-[0-9a-f]{40}-bun-[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{64}$"))
            ]' <<<"${run_artifacts}"
          )"
          artifact_count="$(jq 'length' <<<"${candidate_artifacts}")"
          if [[ "${artifact_count}" != "1" ]]; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "Expected one live versioned Bun lock candidate artifact for workflow run ${TRIGGERING_RUN_ID}; found ${artifact_count}." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          artifact_name="$(jq -r '.[0].name' <<<"${candidate_artifacts}")"
          if [[ ! "${artifact_name}" =~ ^bun-lock-candidate-([0-9a-f]{40})-bun-([0-9]+[.][0-9]+[.][0-9]+)-([0-9a-f]{64})$ ]]; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "The Bun lock candidate artifact identity is malformed." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          validation_sha="${BASH_REMATCH[1]}"
          artifact_bun_version="${BASH_REMATCH[2]}"
          artifact_bun_binary_sha256="${BASH_REMATCH[3]}"
          if [[ "${artifact_bun_version}" != "${BUN_VERSION}" ]]; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "The Bun lock candidate used Bun ${artifact_bun_version}; expected ${BUN_VERSION}." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
'''
          writer = replace_once(writer, old_artifact_block, new_artifact_block, "writer run and artifact admission")

          policy_anchor = '''          embedded_head="$(jq -r '.parents[1].sha // ""' <<<"${validation_commit}")"

          if [[ "${current_state}" != "open" ]]; then
'''
          policy_block = '''          embedded_head="$(jq -r '.parents[1].sha // ""' <<<"${validation_commit}")"

          content_blob_sha() {
            local path="$1"
            local ref="$2"
            gh api \\
              --method GET \\
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" \\
              --jq '.sha // empty'
          }
          package_script() {
            local ref="$1"
            gh api \\
              --method GET \\
              "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${ref}" \\
              --jq '.content // empty' \\
              | tr -d '\\n' \\
              | base64 --decode \\
              | jq -r '.scripts["lockfile:check"] // empty'
          }

          candidate_ci_blob="$(content_blob_sha .github/workflows/ci.yml "${validation_sha}")"
          base_ci_blob="$(content_blob_sha .github/workflows/ci.yml "${validated_base}")"
          candidate_lock_script_blob="$(content_blob_sha scripts/prepare-bun-lock-candidate.ts "${validation_sha}")"
          base_lock_script_blob="$(content_blob_sha scripts/prepare-bun-lock-candidate.ts "${validated_base}")"
          candidate_lock_command="$(package_script "${validation_sha}")"
          base_lock_command="$(package_script "${validated_base}")"

          if [[
            -z "${candidate_ci_blob}" ||
            "${candidate_ci_blob}" != "${base_ci_blob}" ||
            -z "${candidate_lock_script_blob}" ||
            "${candidate_lock_script_blob}" != "${base_lock_script_blob}" ||
            "${candidate_lock_command}" != "bun scripts/prepare-bun-lock-candidate.ts" ||
            "${base_lock_command}" != "bun scripts/prepare-bun-lock-candidate.ts"
          ]]; then
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "The failed candidate did not use the validated-base CI and lock-candidate policy." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${current_state}" != "open" ]]; then
'''
          writer = replace_once(writer, policy_anchor, policy_block, "writer policy binding")

          output_anchor = '''          echo "validated_base=${validated_base}" >>"${GITHUB_OUTPUT}"
          {
'''
          output_block = '''          echo "validated_base=${validated_base}" >>"${GITHUB_OUTPUT}"
          echo "workflow_id=${run_workflow_id}" >>"${GITHUB_OUTPUT}"
          echo "run_attempt=${run_attempt}" >>"${GITHUB_OUTPUT}"
          echo "ci_policy_blob=${candidate_ci_blob}" >>"${GITHUB_OUTPUT}"
          echo "lock_policy_blob=${candidate_lock_script_blob}" >>"${GITHUB_OUTPUT}"
          echo "bun_binary_sha256=${artifact_bun_binary_sha256}" >>"${GITHUB_OUTPUT}"
          {
'''
          writer = replace_once(writer, output_anchor, output_block, "writer evidence outputs")

          writer = replace_once(
              writer,
              '''      - name: Set up Bun
        if: steps.eligibility.outputs.eligible == 'true'
        uses: oven-sh/setup-bun@v2
''',
              '''      - name: Set up Bun
        if: steps.eligibility.outputs.eligible == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
''',
              "writer pinned Bun setup",
          )

          generate_env_anchor = '''        env:
          VALIDATION_SHA: ${{ steps.eligibility.outputs.validation_sha }}
        run: |
          set -euo pipefail

          checked_out_validation="$(git rev-parse HEAD)"
'''
          generate_env_block = '''        env:
          VALIDATION_SHA: ${{ steps.eligibility.outputs.validation_sha }}
          EXPECTED_BUN_BINARY_SHA256: ${{ steps.eligibility.outputs.bun_binary_sha256 }}
        run: |
          set -euo pipefail

          actual_bun_version="$(bun --version)"
          actual_bun_revision="$(bun --revision)"
          actual_bun_binary_sha256="$(sha256sum "$(command -v bun)" | awk '{print $1}')"
          if [[
            "${actual_bun_version}" != "${BUN_VERSION}" ||
            "${actual_bun_revision}" != "${BUN_REVISION}" ||
            "${actual_bun_binary_sha256}" != "${EXPECTED_BUN_BINARY_SHA256}"
          ]]; then
            echo "Writer Bun runtime does not match the exact failed-run artifact identity." >&2
            exit 1
          fi

          checked_out_validation="$(git rev-parse HEAD)"
'''
          writer = replace_once(writer, generate_env_anchor, generate_env_block, "writer Bun verification")

          writer = replace_once(
              writer,
              '''          gh workflow run ci.yml \\
            --ref "${HEAD_BRANCH}" \\
            -f expected_sha="${generated_head}"
''',
              '''          gh workflow run ci.yml \\
            --ref "${DEFAULT_BRANCH}" \\
            -f expected_sha="${generated_head}"
''',
              "trusted default-branch dispatch",
          )

          summary_anchor = '''            echo "- triggering workflow run: \\`${TRIGGERING_RUN_ID}\\`"
            echo "- failed pull-request candidate: \\`${VALIDATION_SHA}\\`"
'''
          summary_block = '''            echo "- triggering workflow run: \\`${TRIGGERING_RUN_ID}\\`"
            echo "- canonical workflow ID: \\`${{ steps.eligibility.outputs.workflow_id }}\\`"
            echo "- workflow attempt: \\`${{ steps.eligibility.outputs.run_attempt }}\\`"
            echo "- CI policy blob: \\`${{ steps.eligibility.outputs.ci_policy_blob }}\\`"
            echo "- lock policy blob: \\`${{ steps.eligibility.outputs.lock_policy_blob }}\\`"
            echo "- Bun version: \\`${BUN_VERSION}\\`"
            echo "- Bun revision: \\`${BUN_REVISION}\\`"
            echo "- Bun binary SHA-256: \\`${{ steps.eligibility.outputs.bun_binary_sha256 }}\\`"
            echo "- failed pull-request candidate: \\`${VALIDATION_SHA}\\`"
'''
          writer = replace_once(writer, summary_anchor, summary_block, "writer evidence summary")
          writer_path.write_text(writer)

          workflow_test_path = Path("test/apply-bun-lock-candidate-workflow.test.ts")
          workflow_test = workflow_test_path.read_text()
          workflow_test = workflow_test.replace(
              '''      'test("^bun-lock-candidate-[0-9a-f]{40}$")',
''',
              '''      'test("^bun-lock-candidate-[0-9a-f]{40}-bun-[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{64}$")',
''',
          )
          workflow_test = workflow_test.replace(
              '''      'sub("^bun-lock-candidate-"; "")',
''',
              '''      'validation_sha="${BASH_REMATCH[1]}"',
''',
          )
          workflow_test = workflow_test.replace(
              '''    expect(ciWorkflow).toContain('"${GITHUB_SHA}" != "${EXPECTED_SHA}"');
''',
              '''    expect(ciWorkflow).toContain('"${actual_sha}" != "${EXPECTED_SHA}"');
''',
          )
          workflow_test = workflow_test.replace(
              '''    expect(workflow).toContain('--ref "${HEAD_BRANCH}"');
''',
              '''    expect(workflow).toContain('--ref "${DEFAULT_BRANCH}"');
    expect(workflow).not.toContain('--ref "${HEAD_BRANCH}"');
''',
          )
          extra_workflow_tests = r'''

  test("binds the failed run to canonical workflow and policy identity", () => {
    expect(workflow).toContain(
      '"repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGERING_RUN_ID}"',
    );
    expect(workflow).toContain(
      '"repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"',
    );
    expect(workflow).toContain('"${run_workflow_id}" != "${canonical_workflow_id}"');
    expect(workflow).toContain('"${run_path}" != ".github/workflows/ci.yml"');
    expect(workflow).toContain('"${run_status}" != "completed"');
    expect(workflow).toContain('"${run_conclusion}" != "failure"');
    expect(workflow).toContain("candidate_ci_blob=");
    expect(workflow).toContain("base_ci_blob=");
    expect(workflow).toContain("candidate_lock_script_blob=");
    expect(workflow).toContain('"${candidate_ci_blob}" != "${base_ci_blob}"');
    expect(workflow).toContain(
      '"${candidate_lock_script_blob}" != "${base_lock_script_blob}"',
    );
    expect(workflow).toContain(
      '"${candidate_lock_command}" != "bun scripts/prepare-bun-lock-candidate.ts"',
    );
  });

  test("pins and cross-checks one Bun runtime identity", () => {
    expect(ciWorkflow).toContain('BUN_VERSION: "1.3.14"');
    expect(ciWorkflow).toContain('BUN_REVISION: "1.3.14+0d9b296af"');
    expect(ciWorkflow.match(/bun-version: \$\{\{ env\.BUN_VERSION \}\}/g)).toHaveLength(2);
    expect(ciWorkflow).toContain('actual_revision="$(bun --revision)"');
    expect(ciWorkflow).toContain("steps.bun-runtime.outputs.binary_sha256");
    expect(workflow).toContain('EXPECTED_BUN_BINARY_SHA256: ${{ steps.eligibility.outputs.bun_binary_sha256 }}');
    expect(workflow).toContain('actual_bun_revision="$(bun --revision)"');
    expect(workflow).toContain(
      '"${actual_bun_binary_sha256}" != "${EXPECTED_BUN_BINARY_SHA256}"',
    );
  });
'''
          marker = "\n});\n"
          if not workflow_test.endswith(marker):
              raise SystemExit("workflow test closing marker drifted")
          workflow_test = workflow_test[:-len(marker)] + extra_workflow_tests + marker
          workflow_test_path.write_text(workflow_test)

          binding_test_path = Path("test/apply-bun-lock-pr-head-binding.test.ts")
          binding_test = binding_test_path.read_text()
          binding_test = binding_test.replace(
              '''      'test("^bun-lock-candidate-[0-9a-f]{40}$")',
''',
              '''      'test("^bun-lock-candidate-[0-9a-f]{40}-bun-[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{64}$")',
''',
          )
          extra_binding_tests = r'''

  test("requires canonical workflow, policy blobs, and exact Bun evidence", () => {
    expect(workflow).toContain("run_workflow_id=");
    expect(workflow).toContain("canonical_workflow_id=");
    expect(workflow).toContain("candidate_ci_blob=");
    expect(workflow).toContain("base_ci_blob=");
    expect(workflow).toContain("candidate_lock_script_blob=");
    expect(workflow).toContain("base_lock_script_blob=");
    expect(workflow).toContain("artifact_bun_binary_sha256=");
    expect(workflow).toContain("EXPECTED_BUN_BINARY_SHA256:");
    expect(workflow).toContain('--ref "${DEFAULT_BRANCH}"');
    expect(workflow).not.toContain('--ref "${HEAD_BRANCH}"');
  });
'''
          if not binding_test.endswith(marker):
              raise SystemExit("binding test closing marker drifted")
          binding_test = binding_test[:-len(marker)] + extra_binding_tests + marker
          binding_test_path.write_text(binding_test)

          docs_path = Path("docs/dependency-lockfile-workflow.md")
          docs = docs_path.read_text()
          heading = "## Validator policy and toolchain identity"
          if heading not in docs:
              docs += r'''

## Validator policy and toolchain identity

The writer accepts only one completed failed `pull_request` run from the repository's canonical `.github/workflows/ci.yml` workflow ID and path. It re-fetches the run, binds the run attempt, feature head, repository, event, status, and conclusion, and rejects same-named or unrelated workflows.

The failed pull-request candidate must retain the validated base generation's exact `ci.yml` blob, exact `scripts/prepare-bun-lock-candidate.ts` blob, and literal `lockfile:check` command. Candidate changes to the validation policy therefore cannot authorize the default-branch writer.

Canonical CI and the writer both pin Bun `1.3.14` / revision `1.3.14+0d9b296af`. CI records the verified binary SHA-256 in the run-owned artifact identity; the writer independently hashes its installed Bun binary and requires exact equality before regenerating. Version, revision, digest, workflow ID, run attempt, policy blobs, failed candidate, base, feature lease, generated commit, and lock digests remain separate receipt fields.

Post-publication validation dispatches the trusted default-branch `ci.yml`. That workflow checks out `expected_sha` explicitly and verifies the resulting checkout, so the feature branch cannot supply the validator definition.
'''
          docs_path.write_text(docs)

          carrier = Path(".github/workflows/oriole-680-policy-toolchain-repair.yml")
          carrier.unlink()
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify repaired candidate
        run: |
          set -euo pipefail
          bun run typecheck
          bun test ./test/apply-bun-lock-candidate-workflow.test.ts ./test/apply-bun-lock-pr-head-binding.test.ts
      - name: Publish clean repair head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/apply-bun-lock-candidate.yml \
            .github/workflows/ci.yml \
            docs/dependency-lockfile-workflow.md \
            test/apply-bun-lock-candidate-workflow.test.ts \
            test/apply-bun-lock-pr-head-binding.test.ts \
            .github/workflows/oriole-680-policy-toolchain-repair.yml
          git commit -m "Bind lock writer policy and Bun runtime"
          git push origin HEAD:oriole/680-policy-toolchain-repair
