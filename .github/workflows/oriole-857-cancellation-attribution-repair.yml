name: Oriole 857 cancellation attribution repair

on:
  push:
    branches:
      - oriole/857-cancellation-attribution-repair

permissions:
  contents: write

concurrency:
  group: oriole-857-cancellation-attribution-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: oriole/857-cancellation-attribution-repair
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact cancellation attribution repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/runner-cancellation-settlement.ts")
          source = path.read_text()
          source = replace_once(
              source,
              'const resultPolicyVersion = "runner-cancellation-settlement-v1";',
              'const resultPolicyVersion = "runner-cancellation-settlement-v2";',
              "policy revision",
          )
          source = replace_once(
              source,
              '''  commandId: string;\n  adapterId: string;\n''',
              '''  commandId: string;\n  commandFingerprint: string;\n  adapterId: string;\n''',
              "result command fingerprint",
          )
          source = replace_once(
              source,
              '''  readonly #command: RunnerCancellationCommandV1;\n  readonly #clock: RunnerCancellationSettlementClock;\n''',
              '''  readonly #command: RunnerCancellationCommandV1;\n  readonly #commandFingerprint: string;\n  readonly #clock: RunnerCancellationSettlementClock;\n''',
              "coordinator command fingerprint field",
          )
          source = replace_once(
              source,
              '''    this.#command = parseCancellationCommand(commandValue, this.#descriptor);\n    if (typeof clock !== "function") {\n''',
              '''    this.#command = parseCancellationCommand(commandValue, this.#descriptor);\n    this.#commandFingerprint = fingerprintCancellationCommand(this.#command);\n    if (typeof clock !== "function") {\n''',
              "command fingerprint initialization",
          )

          execution_pattern = re.compile(
              r'''  async #execute\(\): Promise<RunnerCancellationSettlementResultV1> \{.*?\n  \}\n\}\n\nfunction adapterPort''',
              re.S,
          )
          replacement = '''  async #execute(): Promise<RunnerCancellationSettlementResultV1> {
    const execution = resolveExecutionAuthority(
      this.#clock,
      this.#command.requestedAt,
      this.#command.authority.expiresAt,
    );
    if (!execution.allowed) {
      return this.#buildResult("adapter_failure", null, execution.observedAt);
    }

    let outcome: RunnerCancellationSettlementOutcomeV1 = "adapter_failure";
    let cancellation: RunnerCancellationObservationV1 | null = null;
    try {
      const returned = await this.#adapter.requestCancellation(this.#command);
      cancellation = parseCancellationObservation(
        returned,
        this.#command,
        this.#descriptor,
      );
      if (cancellation.observedAt < execution.observedAt) {
        throw new RangeError(
          "Runner cancellation observation predates adapter execution",
        );
      }
      outcome = "cancellation_observed";
    } catch {
      cancellation = null;
      outcome = "adapter_failure";
    }

    const timing = resolveSettlementTime(
      this.#clock,
      this.#command.requestedAt,
      execution.observedAt,
      cancellation?.observedAt ?? null,
    );
    if (timing.failed) {
      cancellation = null;
      outcome = "adapter_failure";
    }
    return this.#buildResult(outcome, cancellation, timing.observedAt);
  }

  #buildResult(
    outcome: RunnerCancellationSettlementOutcomeV1,
    cancellation: RunnerCancellationObservationV1 | null,
    observedAt: string,
  ): RunnerCancellationSettlementResultV1 {
    const settlement = createResourceSettlementReceipt({
      workspace: this.#scope.workspace,
      project: this.#scope.project,
      resourceId: `run:${this.#command.runId}`,
      resourceKind: "runner_adapter",
      generation: this.#command.runGeneration,
      operationRef: this.#commandFingerprint,
      policyVersion: resultPolicyVersion,
      failureMode: "continue_through_error",
      admissionState: "closed",
      disposition: "reconciliation_hold",
      openedAt: this.#command.requestedAt,
      closingStartedAt: this.#command.requestedAt,
      terminalAt: observedAt,
      observedAt,
      owners: [{
        id: `${this.#command.adapterId}:${this.#command.profileId}`,
        kind: "worker",
        generation: this.#command.runGeneration,
        attempted: true,
        state: "reconciliation_required",
        attemptedAt: this.#command.requestedAt,
        settledAt: observedAt,
        failureClass: "unknown_outcome",
        reconciliationRequired: true,
        canPublishLate: true,
        outputFingerprint: cancellation?.reference?.digest ?? null,
        publicationFenceFingerprint: null,
      }],
    });
    const generationAdvance = evaluateResourceGenerationAdvance(
      settlement,
      this.#command.runGeneration + 1,
    );
    if (generationAdvance.allowed) {
      throw new Error(
        "Runner cancellation settlement unexpectedly allowed generation advance",
      );
    }

    const withoutFingerprint = {
      version: RUNNER_CANCELLATION_SETTLEMENT_V1,
      workspace: this.#scope.workspace,
      project: this.#scope.project,
      commandId: this.#command.commandId,
      commandFingerprint: this.#commandFingerprint,
      adapterId: this.#command.adapterId,
      adapterVersion: this.#command.adapterVersion,
      profileId: this.#command.profileId,
      runId: this.#command.runId,
      runGeneration: this.#command.runGeneration,
      leaseGeneration: this.#command.leaseGeneration,
      requestedAt: this.#command.requestedAt,
      observedAt,
      outcome,
      cancellation,
      settlement,
      generationAdvance,
      containsPrivateContent: false as const,
      containsCredentials: false as const,
    };
    return deepFreeze({
      ...withoutFingerprint,
      resultFingerprint: fingerprintCanonicalRequest(withoutFingerprint),
    });
  }
}

function adapterPort'''
          source, count = execution_pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f"execute replacement: expected one match, found {count}")

          source = replace_once(
              source,
              '''    if (\n      reference.generation !== null\n      && reference.generation !== command.runGeneration\n    ) {\n      throw new RangeError("Runner cancellation reference generation does not match run");\n    }\n''',
              '''    if (\n      reference.generation !== null\n      && reference.generation !== command.runGeneration\n    ) {\n      throw new RangeError("Runner cancellation reference generation does not match run");\n    }\n    if (reference.createdAt > observation.observedAt) {\n      throw new RangeError(\n        "Runner cancellation reference was created after its observation",\n      );\n    }\n''',
              "reference chronology",
          )

          source = replace_once(
              source,
              '''function resolveSettlementTime(\n  clock: RunnerCancellationSettlementClock,\n  requestedAt: string,\n  cancellationObservedAt: string | null,\n): { observedAt: string; failed: boolean } {\n''',
              '''function resolveExecutionAuthority(\n  clock: RunnerCancellationSettlementClock,\n  requestedAt: string,\n  expiresAt: string,\n): { observedAt: string; allowed: boolean } {\n  let value: unknown;\n  try {\n    value = clock();\n  } catch {\n    return { observedAt: requestedAt, allowed: false };\n  }\n  let observedAt: string;\n  try {\n    observedAt = canonicalTimestamp(\n      value,\n      "Runner cancellation execution time",\n    );\n  } catch {\n    return { observedAt: requestedAt, allowed: false };\n  }\n  if (observedAt < requestedAt || observedAt >= expiresAt) {\n    return { observedAt: requestedAt, allowed: false };\n  }\n  return { observedAt, allowed: true };\n}\n\nfunction resolveSettlementTime(\n  clock: RunnerCancellationSettlementClock,\n  requestedAt: string,\n  executionObservedAt: string,\n  cancellationObservedAt: string | null,\n): { observedAt: string; failed: boolean } {\n''',
              "execution authority admission",
          )
          source = replace_once(
              source,
              '''  const minimum = cancellationObservedAt ?? requestedAt;\n''',
              '''  const minimum = [\n    requestedAt,\n    executionObservedAt,\n    cancellationObservedAt,\n  ].filter((entry): entry is string => entry !== null).sort().at(-1)!;\n''',
              "settlement minimum time",
          )
          source = replace_once(
              source,
              '''function exactRecord(\n''',
              '''function fingerprintCancellationCommand(\n  command: RunnerCancellationCommandV1,\n): string {\n  return fingerprintCanonicalRequest({\n    version: command.version,\n    commandId: command.commandId,\n    adapterId: command.adapterId,\n    adapterVersion: command.adapterVersion,\n    profileId: command.profileId,\n    runId: command.runId,\n    runGeneration: command.runGeneration,\n    leaseGeneration: command.leaseGeneration,\n    authority: {\n      resource: command.authority.resource,\n      holderId: command.authority.holderId,\n      generation: command.authority.generation,\n      expiresAt: command.authority.expiresAt,\n    },\n    requestedAt: command.requestedAt,\n    reason: command.reason,\n  });\n}\n\nfunction exactRecord(\n''',
              "command fingerprint helper",
          )

          path.write_text(source)
          Path(".github/workflows/oriole-857-cancellation-attribution-repair.yml").unlink()
          Path(".github/oriole-857-cancellation-attribution-repair-trigger").unlink()
          PY
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify repaired candidate
        run: |
          set -euo pipefail
          bun run typecheck
          bun test \
            ./test/runner-cancellation-settlement.test.ts \
            ./test/runner-cancellation-settlement-attribution-boundaries.test.ts
      - name: Publish clean repair head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/runner-cancellation-settlement.ts \
            test/runner-cancellation-settlement-attribution-boundaries.test.ts \
            .github/workflows/oriole-857-cancellation-attribution-repair.yml \
            .github/oriole-857-cancellation-attribution-repair-trigger
          git commit -m "Bind cancellation authority and evidence"
          git push origin HEAD:oriole/857-cancellation-attribution-repair
