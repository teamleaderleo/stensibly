name: Apply #492 repository alias patch

on:
  push:
    branches:
      - lumen/492-github-repository-aliases
    paths:
      - .github/workflows/patch-492-repository-aliases.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: lumen/492-github-repository-aliases
      - name: Patch canonical GitHub repository matching
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path("src/github-issue-context-sqlite.ts")
          text = source.read_text()
          old = '''  if (!attachment.snapshot.contract.repositories.includes(
              input.snapshot.reference.repositoryFullName,
            )) {'''
          new = '''  if (!attachmentDeclaresGitHubRepository(
              attachment.snapshot.contract.repositories,
              input.snapshot.reference.repositoryFullName,
            )) {'''
          if text.count(old) != 1:
              raise SystemExit("expected repository membership check exactly once")
          text = text.replace(old, new)

          marker = "function boundedSourcePath(value: string): string {"
          helper = r'''function attachmentDeclaresGitHubRepository(
            repositories: readonly string[],
            repositoryFullName: string,
          ): boolean {
            const target = canonicalGitHubRepository(repositoryFullName);
            return target !== null && repositories.some((repository) =>
              canonicalGitHubRepository(repository) === target
            );
          }

          function canonicalGitHubRepository(value: string): string | null {
            if (typeof value !== "string") return null;
            const normalized = value.normalize("NFKC").trim();
            let owner: string | undefined;
            let repository: string | undefined;

            const plain = /^([^/:]+)\/([^/]+)$/.exec(normalized);
            const scp = /^(?:git@)?github\.com:([^/]+)\/([^/]+)$/i.exec(normalized);
            if (scp) {
              owner = scp[1];
              repository = scp[2];
            } else if (plain) {
              owner = plain[1];
              repository = plain[2];
            } else {
              let url: URL;
              try {
                url = new URL(normalized);
              } catch {
                return null;
              }
              if (
                url.hostname.toLowerCase() !== "github.com"
                || !["http:", "https:", "ssh:"].includes(url.protocol)
                || url.password
                || url.search
                || url.hash
              ) return null;
              if (
                (url.protocol === "http:" || url.protocol === "https:") && url.username
              ) return null;
              if (url.protocol === "ssh:" && url.username && url.username !== "git") return null;
              if (url.port && url.port !== "22") return null;
              const parts = url.pathname.split("/").filter(Boolean);
              if (parts.length !== 2) return null;
              [owner, repository] = parts;
            }

            repository = repository?.replace(/\.git$/i, "");
            if (
              !owner
              || !repository
              || !/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(owner)
              || !/^[A-Za-z0-9_.-]{1,100}$/.test(repository)
              || repository === "."
              || repository === ".."
              || repository.includes("..")
            ) return null;
            return `${owner.toLowerCase()}/${repository.toLowerCase()}`;
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("expected helper insertion point exactly once")
          source.write_text(text.replace(marker, helper + marker))
          Path(".github/workflows/patch-492-repository-aliases.yml").unlink()
          PY
      - name: Commit focused patch
        run: |
          git config user.name "Lumen"
          git config user.email "cheerleaderleo@outlook.com"
          git add src/github-issue-context-sqlite.ts .github/workflows/patch-492-repository-aliases.yml
          git commit -m "Accept canonical GitHub repository aliases"
          git push origin HEAD:lumen/492-github-repository-aliases
