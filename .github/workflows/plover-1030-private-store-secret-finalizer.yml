name: Plover private repository write store secret finalizer

on:
  push:
    branches:
      - plover/1030-private-store-secret

permissions:
  contents: write

concurrency:
  group: plover-1030-private-store-secret
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: plover/1030-private-store-secret
      - uses: oven-sh/setup-bun@v2
      - name: Verify exact transition head
        env:
          EXPECTED_PARENT: e8ea9084ed0399f28623681de427a4ade2bff567
          EXPECTED_CARRIER: .github/workflows/plover-1030-private-store-secret-finalizer.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_CARRIER"
      - name: Apply private credential and sink repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/github-repository-write-convex-store.ts')
          text = source.read_text()
          replacements = [
              (
                  '''  readonly client: ConvexCaller;\n  readonly serviceSecret: string;\n  readonly workspace: string;''',
                  '''  readonly workspace: string;\n  readonly #client: ConvexCaller;\n  readonly #serviceSecret: string;''',
              ),
              (
                  '''    this.client = options.client;\n    this.serviceSecret = required(options.serviceSecret, "Convex service secret");\n    this.workspace = exactSlug(options.workspace ?? "default", "Workspace");''',
                  '''    this.#client = options.client;\n    this.#serviceSecret = required(\n      options.serviceSecret,\n      "Convex service secret",\n    );\n    this.workspace = exactSlug(options.workspace ?? "default", "Workspace");''',
              ),
              (
                  '''this.client.mutation''',
                  '''this.#client.mutation''',
              ),
              (
                  '''this.client.query''',
                  '''this.#client.query''',
              ),
              (
                  '''      serviceSecret: this.serviceSecret,''',
                  '''      serviceSecret: this.#serviceSecret,''',
              ),
          ]
          expected_counts = [1, 1, 2, 1, 1]
          for (old, new), expected in zip(replacements, expected_counts):
              if text.count(old) != expected:
                  raise SystemExit(
                      f'expected source marker {old!r} {expected} times, got {text.count(old)}'
                  )
              text = text.replace(old, new)
          source.write_text(text)

          Path('test/github-repository-write-convex-store-secret.test.ts').write_text(r'''import { describe, expect, test } from "bun:test";
import type { ConvexCaller } from "../src/convex-ledger.ts";
import {
  ConvexGitHubRepositoryWriteStore,
} from "../src/github-repository-write-convex-store.ts";
import {
  admitGitHubRepositoryWriteReceipt,
  canonicalGitHubRepositoryWriteReceiptJson,
} from "../src/github-repository-write-receipt-admission.ts";

describe("Convex repository write store credential privacy", () => {
  test("keeps the credential and its client sink outside the public instance", async () => {
    const secret = "repository-write-store-service-secret";
    let observedSecret: unknown;
    let originalCalls = 0;
    let substitutedCalls = 0;
    const requested = receipt();
    const client = {
      async mutation(_reference: unknown, args: Record<string, unknown>) {
        originalCalls += 1;
        observedSecret = args.serviceSecret;
        return {
          outcome: "reserved",
          receiptJson: canonicalGitHubRepositoryWriteReceiptJson(requested),
        };
      },
      async query() {
        return null;
      },
    } as unknown as ConvexCaller;

    const store = new ConvexGitHubRepositoryWriteStore({
      client,
      serviceSecret: secret,
      workspace: "default",
    });
    const publicView = store as unknown as Record<string, unknown>;

    expect("serviceSecret" in store).toBe(false);
    expect("client" in store).toBe(false);
    expect(publicView.serviceSecret).toBeUndefined();
    expect(publicView.client).toBeUndefined();
    expect(Reflect.ownKeys(store)).not.toContain("serviceSecret");
    expect(Reflect.ownKeys(store)).not.toContain("client");
    expect(JSON.stringify(store)).not.toContain(secret);
    expect({ ...publicView }).not.toHaveProperty("serviceSecret");
    expect({ ...publicView }).not.toHaveProperty("client");

    publicView.client = {
      async mutation() {
        substitutedCalls += 1;
        throw new Error("substituted client must not receive credentials");
      },
      async query() {
        substitutedCalls += 1;
        return null;
      },
    };

    const result = await store.reserveRepositoryWrite(requested);
    expect(result.outcome).toBe("reserved");
    expect(originalCalls).toBe(1);
    expect(substitutedCalls).toBe(0);
    expect(observedSecret).toBe(secret);
    expect(JSON.stringify(store)).not.toContain(secret);
  });
});

function receipt() {
  return admitGitHubRepositoryWriteReceipt({
    version: 1,
    id: "ghrw_private_store_secret",
    project: "stensibly",
    repositoryFullName: "teamleaderleo/stensibly",
    targetRef: "feature/private-store-secret",
    path: "docs/private-store-secret.md",
    operation: "create_file",
    expectedParentSha: "a".repeat(40),
    requestSha256: hash("b"),
    payloadSha256: hash("c"),
    actorId: "actor_plover",
    clientId: "client_github_only",
    idempotencyKey: "private-store-secret",
    state: "reserved",
    dispatchCount: 0,
    createdAt: "2026-08-03T18:20:00.000Z",
    updatedAt: "2026-08-03T18:20:00.000Z",
    verified: null,
    error: null,
  });
}

function hash(character: string): string {
  return `sha256:${character.repeat(64)}`;
}
''')
          PY
      - name: Verify focused repair
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test test/github-repository-write-convex-store.test.ts test/github-repository-write-convex-store-secret.test.ts
          bun run typecheck
      - name: Publish source-only head
        env:
          BRANCH: plover/1030-private-store-secret
        run: |
          set -euo pipefail
          rm .github/workflows/plover-1030-private-store-secret-finalizer.yml
          test "$(git diff --name-only | sort)" = $'src/github-repository-write-convex-store.ts\ntest/github-repository-write-convex-store-secret.test.ts'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/github-repository-write-convex-store.ts test/github-repository-write-convex-store-secret.test.ts .github/workflows/plover-1030-private-store-secret-finalizer.yml
          git commit -m "Keep repository write store credentials private"
          git push origin "HEAD:${BRANCH}" --force-with-lease
