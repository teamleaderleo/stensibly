name: Plover 747 hosted context finalize

on:
  push:
    branches:
      - plover/747-hosted-github-context

permissions:
  contents: write

concurrency:
  group: plover-747-hosted-context
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: plover/747-hosted-github-context
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact source patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/plover-747-patch.py
          python /tmp/plover-747-patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Focused Bun tests
        run: bun test test/github-project-context-admission.test.ts test/github-project-context-convex-ledger.test.ts
      - name: Focused Convex tests
        run: bun run test:convex -- convex/githubProjectContexts.test.ts
      - name: Worker bundle
        run: bun run worker:check
      - name: Publish clean candidate
        shell: bash
        run: |
          rm .github/workflows/plover-747-hosted-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add convex/schema.ts convex/githubProjectContexts.ts convex/githubProjectContexts.test.ts src/github-project-context.ts src/github-project-context-convex-ledger.ts src/convex-ledger.ts test/github-project-context-convex-ledger.test.ts docs/github-project-context-convex-ledger.md .github/workflows/plover-747-hosted-context.yml
          git diff --cached --check
          git commit -m 'Finalize hosted accepted GitHub context'
          git push origin HEAD:plover/747-hosted-github-context
