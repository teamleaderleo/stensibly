name: Publish Dashboard On Main

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/publish-dashboard-on-main.yml"
      - "src/dashboard-assets.ts"
      - "src/verify-dashboard.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stensibly-dashboard-production
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 56.5.0
  EXPECTED_VERCEL_PROJECT: stensibly
  DASHBOARD_HOST: www.stensibly.com

jobs:
  validate:
    name: Validate dashboard candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run canonical checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
          bun run verify:dashboard -- --html-file site/index.html --github-annotation

  publish:
    name: Attach domain, verify, and publish dashboard
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.stensibly.com
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Vercel project and credentials
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing production secret::${name} is absent from the production environment."
              exit 1
            fi
          done

          project_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${project_url}" > /tmp/vercel-project.json

          jq --exit-status \
            --arg name "${EXPECTED_VERCEL_PROJECT}" \
            '.name == $name and .rootDirectory == "site"' \
            /tmp/vercel-project.json > /dev/null

      - name: Keep production public and previews protected
        run: |
          set -euo pipefail
          project_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}"
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"ssoProtection":{"deploymentType":"preview"}}' \
            "${project_url}" > /tmp/vercel-project-protection.json

      - name: Link the canonical domain to this project
        run: |
          set -euo pipefail
          if jq --exit-status --arg domain "${DASHBOARD_HOST}" '
            ((.alias // []) + ((.domains // []) | map(if type == "object" then .name else . end)))
            | index($domain) != null
          ' /tmp/vercel-project.json > /dev/null; then
            echo "${DASHBOARD_HOST} is already attached to ${EXPECTED_VERCEL_PROJECT}."
          else
            npx --yes vercel@${VERCEL_CLI_VERSION} domains add \
              "${DASHBOARD_HOST}" \
              "${EXPECTED_VERCEL_PROJECT}" \
              --force \
              --token="${VERCEL_TOKEN}"
          fi

      - name: Pull and build the complete dashboard project
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} pull \
            --yes \
            --environment=production \
            --token="${VERCEL_TOKEN}"
          jq --exit-status \
            --arg project "${VERCEL_PROJECT_ID}" \
            --arg org "${VERCEL_ORG_ID}" \
            '.projectId == $project and .orgId == $org' \
            .vercel/project.json > /dev/null
          npx --yes vercel@${VERCEL_CLI_VERSION} build \
            --prod \
            --token="${VERCEL_TOKEN}"
          test -f .vercel/output/config.json
          test -d .vercel/output/static

      - name: Create and verify an immutable production deployment
        id: deploy
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --token="${VERCEL_TOKEN}")"
          case "${deployment_url}" in
            https://*.vercel.app) ;;
            *) echo "::error title=Invalid deployment URL::Vercel returned an unexpected deployment URL."; exit 1 ;;
          esac
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

          for route in / /labs/ /labs/quiet-control/ /labs/soft-companion/ /labs/field-console/; do
            output="/tmp/dashboard-$(printf '%s' "${route}" | tr '/.' '__').html"
            npx --yes vercel@${VERCEL_CLI_VERSION} curl "${route}" \
              --deployment "${deployment_url}" \
              --fail --silent --show-error \
              --token="${VERCEL_TOKEN}" \
              > "${output}"
            test -s "${output}"
          done
          bun run verify:dashboard -- --html-file /tmp/dashboard-_.html --github-annotation
          grep --fixed-strings --quiet "Stensibly Labs" /tmp/dashboard-_labs_.html
          grep --fixed-strings --quiet "Quiet Control" /tmp/dashboard-_labs_quiet-control_.html
          grep --fixed-strings --quiet "Soft Companion" /tmp/dashboard-_labs_soft-companion_.html
          grep --fixed-strings --quiet "Field Console" /tmp/dashboard-_labs_field-console_.html

      - name: Assign the canonical domain to the verified deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} alias set \
            "${DEPLOYMENT_URL}" \
            "${DASHBOARD_HOST}" \
            --token="${VERCEL_TOKEN}"

      - name: Verify the public dashboard and Labs routes
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun run verify:dashboard -- --url "https://${DASHBOARD_HOST}" --github-annotation \
              && curl --fail --silent --show-error "https://${DASHBOARD_HOST}/labs/" | grep --fixed-strings --quiet "Stensibly Labs" \
              && curl --fail --silent --show-error "https://${DASHBOARD_HOST}/labs/quiet-control/" | grep --fixed-strings --quiet "Quiet Control" \
              && curl --fail --silent --show-error "https://${DASHBOARD_HOST}/labs/soft-companion/" | grep --fixed-strings --quiet "Soft Companion" \
              && curl --fail --silent --show-error "https://${DASHBOARD_HOST}/labs/field-console/" | grep --fixed-strings --quiet "Field Console"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error title=Public dashboard verification failed::The canonical domain did not serve the verified deployment."
          exit 1

      - name: Record publication receipt
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## Dashboard publication receipt"
            echo
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- project: \`${EXPECTED_VERCEL_PROJECT}\` (\`${VERCEL_PROJECT_ID}\`)"
            echo "- immutable deployment: ${DEPLOYMENT_URL}"
            echo "- canonical domain: https://${DASHBOARD_HOST}"
            echo "- verified routes: \`/\`, \`/labs/\`, \`/labs/quiet-control/\`, \`/labs/soft-companion/\`, \`/labs/field-console/\`"
          } >> "${GITHUB_STEP_SUMMARY}"
