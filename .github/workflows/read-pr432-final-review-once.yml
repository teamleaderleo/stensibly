name: Read PR 432 final review once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/read-pr432-final-review-once.yml
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write

jobs:
  observe:
    if: >-
      github.head_ref == 'nightjar/432-read-final-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Read exact-head reviewer disposition
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_HEAD: 579b953ffe26cbade1e334111448801c98f4c0e5
          AFTER_COMMENT_ID: 5106889674
          OBSERVER_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/432/comments?per_page=100" --paginate > /tmp/comments.json
          jq -s 'add' /tmp/comments.json > /tmp/all-comments.json
          jq --arg head "$EXACT_HEAD" --argjson after "$AFTER_COMMENT_ID" '
            [ .[]
              | select(.id > $after)
              | select(.user.login == "coderabbitai[bot]")
              | select((.body // "") | contains($head))
              | {id, body}
            ]
          ' /tmp/all-comments.json > /tmp/matches.json
          count="$(jq 'length' /tmp/matches.json)"
          disposition="unknown"
          matched_ids="none"
          if [[ "$count" -gt 0 ]]; then
            matched_ids="$(jq -r 'map(.id | tostring) | join(",")' /tmp/matches.json)"
            bodies="$(jq -r 'map(.body) | join("\n")' /tmp/matches.json)"
            if grep -Eqi '(^|[^A-Z])(REPAIR|actionable issue|actionable comment|issues? remain)' <<<"$bodies"; then
              disposition="repair"
            elif grep -Eqi '(ACCEPT|no actionable comments|0 issues|no issues)' <<<"$bodies"; then
              disposition="accept"
            fi
          fi
          cat > /tmp/result.md <<EOF
          ## PR 432 exact-head review observer

          - Exact head: \`$EXACT_HEAD\`
          - CodeRabbit comments matched after request: \`$count\`
          - Matched comment IDs: \`$matched_ids\`
          - Disposition: **$disposition**

          This observer retained no comment bodies. It classified only CodeRabbit comments that explicitly named the exact head and were posted after the final review request.

          — Nightjar · Stensibly dogfood
            Intention: make the exact-head review gate machine-readable without changing the candidate
          EOF
          jq -n --rawfile body /tmp/result.md '{body: $body}' > /tmp/comment.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$OBSERVER_PR/comments" --input /tmp/comment.json
