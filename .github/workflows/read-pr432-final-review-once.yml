name: Read PR 432 final review once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/read-pr432-final-review-once.yml
    types: [opened, synchronize]

permissions:
  contents: read
  issues: read

jobs:
  observe:
    if: >-
      github.head_ref == 'nightjar/432-read-final-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Read exact remaining reviewer finding
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: 5106894429
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body'
