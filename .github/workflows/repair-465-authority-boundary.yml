name: Repair PR 465 authority boundary

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: repair-pr-465-authority-boundary
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nightjar/453-tool-capability-grants
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply bounded Tier 2 repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/tool-capability-grant.ts')
          source = source_path.read_text()

          old_projection_interface = '''export interface ToolCapabilityGrantProjection {
            version: 1;
            grantId: string;
            workspace: string;
            project: string;
            actorId: string;
            workerSessionId: string;
            runId: string;
            generation: number;
            issuedAt: string;
            expiresAt: string;
            state: ToolCapabilityGrantState;
            issuer: {
              actorId: string;
              authorityRef: string;
            };
            evidenceRefs: string[];
            permissions: Array<{
              permissionId: string;
              action: ToolCapabilityAction;
              resourceKind: ToolCapabilityResourceKind;
              resourceKey: string;
              approvalState: ToolCapabilityApproval["state"];
              approvalId: string | null;
              maxUses: number;
              usedUses: number;
              remainingUses: number;
            }>;
            includesArguments: false;
            includesSecrets: false;
          }'''
          new_projection_interface = '''export interface ToolCapabilityGrantProjection {
            version: 1;
            grantId: string | null;
            workspace: string | null;
            project: string | null;
            actorId: string | null;
            workerSessionId: string | null;
            runId: string | null;
            generation: number | null;
            issuedAt: string | null;
            expiresAt: string | null;
            state: ToolCapabilityGrantState;
            issuer: {
              actorId: string;
              authorityRef: string;
            } | null;
            evidenceRefs: string[];
            permissions: Array<{
              permissionId: string;
              action: ToolCapabilityAction;
              resourceKind: ToolCapabilityResourceKind;
              resourceKey: string;
              approvalState: ToolCapabilityApproval["state"];
              approvalId: string | null;
              maxUses: number;
              usedUses: number;
              remainingUses: number;
            }>;
            includesArguments: false;
            includesSecrets: false;
          }'''
          if source.count(old_projection_interface) != 1:
              raise SystemExit('projection interface marker missing or duplicated')
          source = source.replace(old_projection_interface, new_projection_interface)

          old_unsafe = r'''const unsafeTextPattern = /[\u0000-\u001f\u007f-\u009f\u2028\u2029\u202a-\u202e\u2066-\u2069]/u;'''
          new_unsafe = r'''const unsafeTextPattern = /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028\u2029\u202a-\u202e\u2066-\u2069\ufeff]/u;'''
          if source.count(old_unsafe) != 1:
              raise SystemExit('unsafe text pattern marker missing or duplicated')
          source = source.replace(old_unsafe, new_unsafe)

          max_uses_anchor = ''': boundedInteger(permissionInput.maxUses, "Permission maximum uses", 1, limits.maxUses);
            const approval = canonicalApproval('''
          max_uses_replacement = ''': boundedInteger(permissionInput.maxUses, "Permission maximum uses", 1, limits.maxUses);
            if (highImpactActions.has(request.action) && maxUses !== 1) {
              throw new RangeError(`High-impact action ${request.action} must be limited to one use`);
            }
            const approval = canonicalApproval('''
          if source.count(max_uses_anchor) != 1:
              raise SystemExit('maxUses anchor missing or duplicated')
          source = source.replace(max_uses_anchor, max_uses_replacement)

          old_projection = '''/** Projects grant state without exposing exact arguments or secret material. */
          export function projectToolCapabilityGrant(
            grant: ToolCapabilityGrant,
            input: {
              now: string;
              trustedGrantFingerprint: string;
              usageByPermission?: Readonly<Record<string, number>>;
            },
          ): ToolCapabilityGrantProjection {
            const now = canonicalTimestamp(input.now, "Projection time");
            let trusted = false;
            try {
              trusted = boundedFingerprint(input.trustedGrantFingerprint, "Trusted grant fingerprint")
                === grant.fingerprint;
            } catch {
              trusted = false;
            }
            const valid = validGrantFingerprint(grant) && trusted;
            const state = valid ? currentGrantState(grant, now) : "invalid";
            return {
              version: 1,
              grantId: grant.grantId,
              workspace: grant.workspace,
              project: grant.project,
              actorId: grant.actorId,
              workerSessionId: grant.workerSessionId,
              runId: grant.runId,
              generation: grant.generation,
              issuedAt: grant.issuedAt,
              expiresAt: grant.expiresAt,
              state,
              issuer: { ...grant.issuer },
              evidenceRefs: [...grant.evidenceRefs],
              permissions: valid ? grant.permissions.map((permission) => {
                const usedUses = permissionUsage(input.usageByPermission, permission.permissionId);
                return {
                  permissionId: permission.permissionId,
                  action: permission.request.action,
                  resourceKind: permission.request.resource.kind,
                  resourceKey: permission.request.resource.key,
                  approvalState: permission.approval.state,
                  approvalId: permission.approval.approvalId,
                  maxUses: permission.maxUses,
                  usedUses,
                  remainingUses: Math.max(0, permission.maxUses - usedUses),
                };
              }) : [],
              includesArguments: false,
              includesSecrets: false,
            };
          }
          '''
          new_projection = '''/** Projects grant state without exposing exact arguments or secret material. */
          export function projectToolCapabilityGrant(
            grant: ToolCapabilityGrant,
            input: {
              now: string;
              trustedGrantFingerprint: string;
              usageByPermission?: Readonly<Record<string, number>>;
            },
          ): ToolCapabilityGrantProjection {
            if (!validGrantFingerprint(grant)) return invalidToolCapabilityGrantProjection();

            let now: string;
            try {
              now = canonicalTimestamp(input.now, "Projection time");
              const trusted = boundedFingerprint(
                input.trustedGrantFingerprint,
                "Trusted grant fingerprint",
              ) === grant.fingerprint;
              if (!trusted) return invalidToolCapabilityGrantProjection();
            } catch {
              return invalidToolCapabilityGrantProjection();
            }

            let permissions: ToolCapabilityGrantProjection["permissions"];
            try {
              permissions = grant.permissions.map((permission) => {
                const usedUses = permissionUsage(input.usageByPermission, permission.permissionId);
                return {
                  permissionId: permission.permissionId,
                  action: permission.request.action,
                  resourceKind: permission.request.resource.kind,
                  resourceKey: permission.request.resource.key,
                  approvalState: permission.approval.state,
                  approvalId: permission.approval.approvalId,
                  maxUses: permission.maxUses,
                  usedUses,
                  remainingUses: Math.max(0, permission.maxUses - usedUses),
                };
              });
            } catch {
              return invalidToolCapabilityGrantProjection();
            }

            return {
              version: 1,
              grantId: grant.grantId,
              workspace: grant.workspace,
              project: grant.project,
              actorId: grant.actorId,
              workerSessionId: grant.workerSessionId,
              runId: grant.runId,
              generation: grant.generation,
              issuedAt: grant.issuedAt,
              expiresAt: grant.expiresAt,
              state: currentGrantState(grant, now),
              issuer: { ...grant.issuer },
              evidenceRefs: [...grant.evidenceRefs],
              permissions,
              includesArguments: false,
              includesSecrets: false,
            };
          }

          function invalidToolCapabilityGrantProjection(): ToolCapabilityGrantProjection {
            return {
              version: 1,
              grantId: null,
              workspace: null,
              project: null,
              actorId: null,
              workerSessionId: null,
              runId: null,
              generation: null,
              issuedAt: null,
              expiresAt: null,
              state: "invalid",
              issuer: null,
              evidenceRefs: [],
              permissions: [],
              includesArguments: false,
              includesSecrets: false,
            };
          }
          '''
          if source.count(old_projection) != 1:
              raise SystemExit('projection function marker missing or duplicated')
          source = source.replace(old_projection, new_projection)
          source_path.write_text(source)

          test_path = Path('test/tool-capability-grant.test.ts')
          tests = test_path.read_text()
          marker = 'describe("tool capability authority boundaries"'
          if marker not in tests:
              tests += r'''

          describe("tool capability authority boundaries", () => {
            test("keeps high-impact approvals one-shot", () => {
              const mergeRequest: ToolCapabilityRequestInput = {
                ...requestInput,
                action: "merge.execute",
                resource: {
                  kind: "github_pull_request",
                  owner: "teamleaderleo",
                  repository: "stensibly",
                  number: 453,
                  headSha: HEAD_SHA,
                },
                arguments: { mergeMethod: "squash", expectedHeadSha: HEAD_SHA },
              };
              const approvedMerge = approvalFor(mergeRequest, "approved");

              expect(() => buildToolCapabilityGrant(grantInput({
                permissionId: "permission_merge",
                action: mergeRequest.action,
                resource: mergeRequest.resource,
                arguments: mergeRequest.arguments,
                maxUses: 2,
                approval: approvedMerge,
              }))).toThrow("must be limited to one use");

              const mergeGrant = buildToolCapabilityGrant(grantInput({
                permissionId: "permission_merge",
                action: mergeRequest.action,
                resource: mergeRequest.resource,
                arguments: mergeRequest.arguments,
                approval: approvedMerge,
              }));
              expect(authorize(mergeGrant, { request: mergeRequest })).toMatchObject({
                authorized: true,
                remainingUsesAfterAuthorization: 0,
              });
              expect(authorize(mergeGrant, {
                request: mergeRequest,
                usageByPermission: { permission_merge: 1 },
              })).toMatchObject({ authorized: false, reason: "budget_exhausted" });

              const spendRequest: ToolCapabilityRequestInput = {
                ...requestInput,
                action: "spend.commit",
                resource: { kind: "spend_budget", currency: "GBP", maximumMinorUnits: 5000 },
                arguments: { currency: "GBP", amountMinorUnits: 5000 },
              };
              const spendGrant = buildToolCapabilityGrant(grantInput({
                permissionId: "permission_spend",
                action: spendRequest.action,
                resource: spendRequest.resource,
                arguments: spendRequest.arguments,
                approval: approvalFor(spendRequest, "approved", { permissionId: "permission_spend" }),
              }));
              expect(authorize(spendGrant, { request: spendRequest })).toMatchObject({
                authorized: true,
                remainingUsesAfterAuthorization: 0,
              });
              expect(authorize(spendGrant, {
                request: spendRequest,
                usageByPermission: { permission_spend: 1 },
              })).toMatchObject({ authorized: false, reason: "budget_exhausted" });
            });

            test("classifies subject mismatches and malformed authorization inputs", () => {
              const grant = buildToolCapabilityGrant(grantInput());
              const mismatches: Array<[Partial<ToolCapabilityRequestInput>, string]> = [
                [{ workspace: "other" }, "workspace_mismatch"],
                [{ project: "other" }, "project_mismatch"],
                [{ actorId: "actor:other" }, "actor_mismatch"],
                [{ workerSessionId: "worker:other" }, "worker_session_mismatch"],
                [{ runId: "run_capability_2" }, "run_mismatch"],
              ];
              for (const [requestOverride, reason] of mismatches) {
                expect(authorize(grant, {
                  request: { ...requestInput, ...requestOverride },
                })).toMatchObject({ authorized: false, reason });
              }
              expect(authorize(grant, { now: "invalid" })).toMatchObject({
                authorized: false,
                reason: "request_invalid",
              });
              for (const used of [-1, 1.5]) {
                expect(authorize(grant, {
                  usageByPermission: { permission_branch_create: used },
                })).toMatchObject({ authorized: false, reason: "request_invalid" });
              }
            });

            test("fails closed for expired approvals and invalid projections", () => {
              const mergeRequest: ToolCapabilityRequestInput = {
                ...requestInput,
                action: "merge.execute",
                resource: {
                  kind: "github_pull_request",
                  owner: "teamleaderleo",
                  repository: "stensibly",
                  number: 453,
                  headSha: HEAD_SHA,
                },
                arguments: { mergeMethod: "squash", expectedHeadSha: HEAD_SHA },
              };
              for (const state of ["pending", "approved"] as const) {
                const approval = approvalFor(mergeRequest, state);
                const grant = buildToolCapabilityGrant(grantInput({
                  permissionId: "permission_merge",
                  action: mergeRequest.action,
                  resource: mergeRequest.resource,
                  arguments: mergeRequest.arguments,
                  approval: { ...approval, expiresAt: "2026-07-29T00:15:00.000Z" },
                }));
                expect(authorize(grant, { request: mergeRequest })).toMatchObject({
                  authorized: false,
                  reason: "approval_expired",
                });
              }

              const grant = buildToolCapabilityGrant(grantInput());
              const invalidProjections = [
                projectToolCapabilityGrant(grant, {
                  now: "invalid",
                  trustedGrantFingerprint: grant.fingerprint,
                }),
                projectToolCapabilityGrant(grant, {
                  now: NOW,
                  trustedGrantFingerprint: `sha256:${"0".repeat(64)}`,
                }),
                projectToolCapabilityGrant(grant, {
                  now: NOW,
                  trustedGrantFingerprint: grant.fingerprint,
                  usageByPermission: { permission_branch_create: -1 },
                }),
              ];
              for (const projection of invalidProjections) {
                expect(projection).toMatchObject({
                  state: "invalid",
                  grantId: null,
                  workspace: null,
                  project: null,
                  actorId: null,
                  workerSessionId: null,
                  runId: null,
                  generation: null,
                  issuedAt: null,
                  expiresAt: null,
                  issuer: null,
                  evidenceRefs: [],
                  permissions: [],
                  includesArguments: false,
                  includesSecrets: false,
                });
              }
            });

            test("rejects invisible unsafe text characters", () => {
              for (const character of ["\u200b", "\u200c", "\u200d", "\u200e", "\u200f", "\ufeff"]) {
                expect(() => buildToolCapabilityRequest({
                  ...requestInput,
                  arguments: {
                    branchName: `nightjar/unsafe${character}branch`,
                    baseSha: HEAD_SHA,
                  },
                })).toThrow("unsafe characters");
              }
            });
          });
          '''
          test_path.write_text(tests)

          docs_path = Path('docs/tool-capability-grants.md')
          docs = docs_path.read_text()
          approval_marker = '''High-impact actions currently include merge, deployment execution, credential use, external messages, destructive deletion, and spend commitment.
          '''
          approval_replacement = '''High-impact actions currently include merge, deployment execution, credential use, external messages, destructive deletion, and spend commitment.

          Every high-impact permission is one-shot. `maxUses` must equal one, so one approval can authorize one merge, deployment, credential use, external message, destructive deletion, or spend commitment. Repeated effects require a newly issued permission and approval. Spend budgets are therefore bounded per approved effect and cannot multiply through one grant.
          '''
          if docs.count(approval_marker) != 1:
              raise SystemExit('approval documentation marker missing or duplicated')
          docs = docs.replace(approval_marker, approval_replacement)

          projection_marker = '''It deliberately omits exact arguments, argument fingerprints, request fingerprints, and secret values.
          '''
          projection_replacement = '''It deliberately omits exact arguments, argument fingerprints, request fingerprints, and secret values. Invalid grant fingerprints, trust anchors, projection times, or usage counters return a content-minimised `state: invalid` projection with nullable subject and lifetime fields plus empty evidence and permissions.
          '''
          if docs.count(projection_marker) != 1:
              raise SystemExit('projection documentation marker missing or duplicated')
          docs = docs.replace(projection_marker, projection_replacement)
          docs_path.write_text(docs)
          PY
      - name: Validate repair
        run: |
          bun install --frozen-lockfile
          bun test test/tool-capability-grant.test.ts
          bun run typecheck
      - name: Commit repaired candidate and remove applicator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill capability repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-465-authority-boundary.yml
          git add src/tool-capability-grant.ts test/tool-capability-grant.test.ts docs/tool-capability-grants.md
          git commit -m "fix: bind high-impact grants to one approved effect"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:nightjar/453-tool-capability-grants
