name: Repair MCP gateway diagnostic stages

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: repair-490-gateway-diagnostic-stages
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: quill/490-gateway-diagnostic-stages
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Apply bounded repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/mcp-http.ts')
          source = source_path.read_text()
          old_origin = '''    {},
              "cors_rejection",
            );
          }'''
          new_origin = '''    { [MCP_FAILURE_STAGE_HEADER]: "origin_validation" },
              "cors_rejection",
            );
          }'''
          if source.count(old_origin) != 1:
              raise SystemExit('origin diagnostic anchor missing or duplicated')
          source = source.replace(old_origin, new_origin)

          old_host = '''  return jsonRpcError(403, -32001, `Host is not allowed: ${host ?? "missing"}`, null);
          }'''
          new_host = '''  return jsonRpcError(
            403,
            -32001,
            `Host is not allowed: ${host ?? "missing"}`,
            null,
            { [MCP_FAILURE_STAGE_HEADER]: "host_validation" },
            "request_failure",
          );
          }'''
          if source.count(old_host) != 1:
              raise SystemExit('host diagnostic anchor missing or duplicated')
          source_path.write_text(source.replace(old_host, new_host))

          test_path = Path('test/mcp-diagnostics.test.ts')
          tests = test_path.read_text()
          marker = 'describe("MCP gateway validation diagnostics"'
          if marker not in tests:
              tests += r'''

          describe("MCP gateway validation diagnostics", () => {
            test("classifies origin and Host denials as exact gateway validation failures", async () => {
              const store = new StensiblyStore(":memory:");
              try {
                const token = createApiToken(store, {
                  name: "Gateway diagnostics reader",
                  scopes: ["read"],
                });
                const app = createServerApp(store, {
                  mcp: {
                    allowedOrigins: ["https://allowed.example"],
                    allowedHosts: ["allowed.example"],
                  },
                });
                const cases = [
                  {
                    requestId: "diag-origin-validation",
                    stage: "origin_validation",
                    origin: "https://blocked.example",
                    host: "allowed.example",
                  },
                  {
                    requestId: "diag-host-validation",
                    stage: "host_validation",
                    origin: "https://allowed.example",
                    host: "blocked.example",
                  },
                ] as const;

                for (const entry of cases) {
                  const response = await app.request("/mcp", {
                    method: "POST",
                    headers: {
                      accept: "application/json, text/event-stream",
                      authorization: `Bearer ${token.token}`,
                      "content-type": "application/json",
                      "mcp-protocol-version": protocolVersion,
                      "x-request-id": entry.requestId,
                      origin: entry.origin,
                      host: entry.host,
                    },
                    body: JSON.stringify(initializeMessage(31)),
                  });
                  expect(response.status).toBe(403);
                  expect(response.headers.get(MCP_FAILURE_STAGE_HEADER)).toBe(entry.stage);
                  const payload = await response.json() as {
                    error?: { data?: Record<string, unknown> };
                  };
                  expect(payload.error?.data).toEqual({
                    layer: "gateway",
                    stage: entry.stage,
                    requestId: entry.requestId,
                    retryable: false,
                    reconciliation: "not_required",
                    recommendedAction: "fix_request",
                    manifestFingerprint: MCP_TOOL_MANIFEST_FINGERPRINT,
                    manifestToolCount: MCP_TOOL_NAMES.length,
                    method: "initialize",
                  });
                }
              } finally {
                store.close();
              }
            });
          });
          '''
          test_path.write_text(tests)
          PY
      - name: Validate repair
        run: |
          bun install --frozen-lockfile
          bun test test/mcp-diagnostics.test.ts
          bun run typecheck
      - name: Commit product repair and remove applicator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill reliability worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-490-gateway-diagnostics.yml
          git add src/mcp-http.ts test/mcp-diagnostics.test.ts
          git commit -m "fix: classify MCP gateway validation failures"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:quill/490-gateway-diagnostic-stages
