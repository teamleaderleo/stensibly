name: Repair PR 519 admission grant reference

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: repair-pr-519-admission-grant-reference
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mercury/453-capability-grant-sqlite
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Cross-check admission authority references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/tool-capability-grants-sqlite.ts')
          source = source_path.read_text()
          replacements = {
            'const record = mapAdmissionRecord(existing);': 'const record = mapAdmissionRecord(store, existing);',
            'return { record: mapAdmissionRecord(inserted), replayed: false };': 'return { record: mapAdmissionRecord(store, inserted), replayed: false };',
            ').all(workspace, project, grantId).map(mapAdmissionRecord);': ').all(workspace, project, grantId).map((row) => mapAdmissionRecord(store, row));',
            'function mapAdmissionRecord(row: AdmissionRow): SqliteToolCapabilityAdmissionRecord {': 'function mapAdmissionRecord(\n  store: StensiblyStore,\n  row: AdmissionRow,\n): SqliteToolCapabilityAdmissionRecord {',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'admission mapping anchor missing or duplicated: {old}')
              source = source.replace(old, new, 1)

          authorization_anchor = '''  const authorization = validateStoredAuthorization(parsed, row);
            return {
          '''
          authorization_replacement = '''  const acceptedGrantGeneration = row.accepted_grant_generation === null
              ? null
              : positiveInteger(row.accepted_grant_generation, "Stored accepted grant generation");
            const acceptedGrantFingerprint = row.accepted_grant_fingerprint === null
              ? null
              : boundedFingerprint(
                row.accepted_grant_fingerprint,
                "Stored accepted grant fingerprint",
              );
            if ((acceptedGrantGeneration === null) !== (acceptedGrantFingerprint === null)) {
              throw new Error(`Stored tool admission ${row.id} accepted grant reference is incomplete`);
            }
            if (acceptedGrantGeneration !== null && acceptedGrantFingerprint !== null) {
              const acceptedRow = getGrantRowByGeneration(
                store,
                row.workspace_id,
                row.project_id,
                row.grant_id,
                acceptedGrantGeneration,
              );
              if (!acceptedRow || acceptedRow.fingerprint !== acceptedGrantFingerprint) {
                throw new Error(`Stored tool admission ${row.id} accepted grant reference is invalid`);
              }
              mapGrantRecord(acceptedRow);
            }
            const authorization = validateStoredAuthorization(parsed, row);
            if (authorization.authorized && acceptedGrantGeneration === null) {
              throw new Error(`Stored tool admission ${row.id} authorized without an accepted grant`);
            }
            return {
          '''
          if source.count(authorization_anchor) != 1:
              raise SystemExit('authorization return anchor missing or duplicated')
          source = source.replace(authorization_anchor, authorization_replacement, 1)

          reference_pattern = re.compile(
              r'    acceptedGrantGeneration: row\.accepted_grant_generation === null\n'
              r'      \? null\n'
              r'      : positiveInteger\(row\.accepted_grant_generation, "Stored accepted grant generation"\),\n'
              r'    acceptedGrantFingerprint: row\.accepted_grant_fingerprint === null\n'
              r'      \? null\n'
              r'      : boundedFingerprint\(\n'
              r'        row\.accepted_grant_fingerprint,\n'
              r'        "Stored accepted grant fingerprint",\n'
              r'      \),\n'
          )
          source, count = reference_pattern.subn(
              '    acceptedGrantGeneration,\n    acceptedGrantFingerprint,\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one inline accepted grant reference, found {count}')
          source_path.write_text(source)

          test_path = Path('test/tool-capability-grants-sqlite.test.ts')
          tests = test_path.read_text()
          marker = '''  test("keeps workspace and project admission histories isolated", () => {
          '''
          addition = r'''  test("detects tampered admission accepted-grant references", () => {
            const tamperCases: Array<{
              name: string;
              apply: (target: StensiblyStore, admissionId: string, grantRowId: string) => void;
            }> = [
              {
                name: "fingerprint",
                apply(target, admissionId) {
                  target.db.query(`
                    UPDATE tool_capability_admissions
                    SET accepted_grant_fingerprint = ?1
                    WHERE id = ?2
                  `).run(`sha256:${"0".repeat(64)}`, admissionId);
                },
              },
              {
                name: "generation",
                apply(target, admissionId) {
                  target.db.query(`
                    UPDATE tool_capability_admissions
                    SET accepted_grant_generation = 99
                    WHERE id = ?1
                  `).run(admissionId);
                },
              },
              {
                name: "missing-row",
                apply(target, _admissionId, grantRowId) {
                  target.db.query(`DELETE FROM tool_capability_grants WHERE id = ?1`).run(grantRowId);
                },
              },
            ];

            for (const tamper of tamperCases) {
              const isolated = new StensiblyStore(":memory:");
              try {
                const isolatedGrant = grant();
                const accepted = acceptSqliteToolCapabilityGrant(isolated, {
                  workspace: "default",
                  project: "scrapbook",
                  grant: isolatedGrant,
                  expectedCurrentGeneration: null,
                  acceptanceRef: `accept:reference-${tamper.name}`,
                  acceptedBy: "actor:mercury",
                }, clockAt(ACCEPTED_AT));
                const admission = reserveSqliteToolCapabilityUse(isolated, {
                  workspace: "default",
                  project: "scrapbook",
                  grantId: isolatedGrant.grantId,
                  expectedGeneration: 1,
                  request: requestInput,
                  idempotencyKey: `admission:reference-${tamper.name}`,
                }, clockAt(NOW));
                tamper.apply(isolated, admission.record.id, accepted.record.id);
                expect(() => listSqliteToolCapabilityAdmissions(isolated, {
                  workspace: "default",
                  project: "scrapbook",
                  grantId: isolatedGrant.grantId,
                })).toThrow("accepted grant reference");
              } finally {
                isolated.close();
              }
            }
          });

            test("keeps workspace and project admission histories isolated", () => {
          '''
          if tests.count(marker) != 1:
              raise SystemExit('stored integrity insertion marker missing or duplicated')
          test_path.write_text(tests.replace(marker, addition, 1))

          docs_path = Path('docs/tool-capability-grant-persistence.md')
          docs = docs_path.read_text()
          old = '- full canonical grant rehydration, fingerprints, duplicated row metadata, and the one-current-row SQLite invariant;'
          new = '- full canonical grant rehydration, fingerprints, duplicated row metadata, the one-current-row SQLite invariant, and every admission accepted-grant reference against the exact immutable generation row;'
          if docs.count(old) != 1:
              raise SystemExit('read integrity documentation anchor missing or duplicated')
          docs_path.write_text(docs.replace(old, new, 1))
          PY
      - name: Validate repair
        run: |
          bun install --frozen-lockfile
          bun test test/tool-capability-grants-sqlite.test.ts
          bun run typecheck
      - name: Commit repair and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill capability reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-519-admission-grant-reference.yml
          git add src/tool-capability-grants-sqlite.ts test/tool-capability-grants-sqlite.test.ts docs/tool-capability-grant-persistence.md
          git commit -m "fix: validate admission authority references"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:mercury/453-capability-grant-sqlite
