name: Repair PR 519 admission compile and replay

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: repair-pr-519-admission-compile-replay
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mercury/453-capability-grant-sqlite
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Preserve narrowing and server-time idempotency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tool-capability-grants-sqlite.ts')
          source = path.read_text()
          branch = '        if (authorization.authorized) {\n'
          if source.count(branch) != 1:
              raise SystemExit('authorized branch marker missing or duplicated')
          source = source.replace(branch, branch + '          const authorized = authorization;\n')
          if source.count('authorization.permissionId') != 2:
              raise SystemExit('authorization permission references changed')
          source = source.replace('authorization.permissionId', 'authorized.permissionId')
          if source.count('...authorization,') != 1:
              raise SystemExit('authorization spread reference changed')
          source = source.replace('...authorization,', '...authorized,')

          server_time_equality = '    && record.revokedAt === candidate.revokedAt\n'
          if source.count(server_time_equality) != 1:
              raise SystemExit('revocation server-time equality marker missing or duplicated')
          source = source.replace(server_time_equality, '')
          path.write_text(source)
          PY
      - name: Validate repair
        run: |
          bun install --frozen-lockfile
          bun test test/tool-capability-grants-sqlite.test.ts
          bun run typecheck
      - name: Commit repair and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill capability reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-519-authorization-narrowing.yml
          git add src/tool-capability-grants-sqlite.ts
          git commit -m "fix: preserve atomic admission replay semantics"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:mercury/453-capability-grant-sqlite
