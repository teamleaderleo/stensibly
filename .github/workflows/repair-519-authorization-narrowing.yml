name: Repair PR 519 authorization narrowing

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: repair-pr-519-authorization-narrowing
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mercury/453-capability-grant-sqlite
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Preserve the authorized branch narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tool-capability-grants-sqlite.ts')
          source = path.read_text()
          old = '''        if (authorization.authorized) {
            const permission = current.grant.permissions.find((candidate) =>
              candidate.permissionId === authorization.permissionId
            );
            if (!permission) {
              throw new Error("Authorized permission is absent from the accepted grant");
            }
            const consumedUses = tryConsumePermissionUse(
              store,
              current,
              authorization.permissionId,
              permission.maxUses,
              now,
            );
            authorization = consumedUses === null
              ? denied(grantId, request.fingerprint, "budget_exhausted")
              : {
                ...authorization,
                remainingUsesAfterAuthorization: permission.maxUses - consumedUses,
              };
          }'''
          new = '''        if (authorization.authorized) {
            const authorized = authorization;
            const permission = current.grant.permissions.find((candidate) =>
              candidate.permissionId === authorized.permissionId
            );
            if (!permission) {
              throw new Error("Authorized permission is absent from the accepted grant");
            }
            const consumedUses = tryConsumePermissionUse(
              store,
              current,
              authorized.permissionId,
              permission.maxUses,
              now,
            );
            authorization = consumedUses === null
              ? denied(grantId, request.fingerprint, "budget_exhausted")
              : {
                ...authorized,
                remainingUsesAfterAuthorization: permission.maxUses - consumedUses,
              };
          }'''
          if source.count(old) != 1:
              raise SystemExit('authorized branch anchor missing or duplicated')
          path.write_text(source.replace(old, new))
          PY
      - name: Validate repair
        run: |
          bun install --frozen-lockfile
          bun test test/tool-capability-grants-sqlite.test.ts
          bun run typecheck
      - name: Commit repair and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill capability reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-519-authorization-narrowing.yml
          git add src/tool-capability-grants-sqlite.ts
          git commit -m "fix: preserve authorized admission narrowing"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:mercury/453-capability-grant-sqlite
