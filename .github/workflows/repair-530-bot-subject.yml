name: Repair PR 530 bot subject validation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: repair-pr-530-bot-subject
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mica/426-hosted-capacity-current
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Align bounded GitHub login validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ['src/provider-capacity.ts', 'convex/providerCapacities.ts']:
              path = Path(filename)
              source = path.read_text()
              old = 'const loginPattern = /^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$/;'
              new = 'const loginPattern = /^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?(?:\\[bot\\])?$/;'
              if source.count(old) != 1:
                  raise SystemExit(f'login pattern missing or duplicated in {filename}')
              path.write_text(source.replace(old, new, 1))

          hosted_path = Path('test/hosted-provider-capacity-api.test.ts')
          hosted = hosted_path.read_text()
          hosted = hosted.replace(
              'const body = JSON.stringify(payload("Reviews are available now."));',
              'const body = JSON.stringify(payload(\n      "Reviews are available now.",\n      "coderabbitai[bot]",\n      "dependabot[bot]",\n    ));',
              1,
          )
          hosted = hosted.replace(
              'subjectLogin: "teamleaderleo",\n      sourceCommentId:',
              'subjectLogin: "dependabot[bot]",\n      sourceCommentId:',
              1,
          )
          hosted = hosted.replace(
              'function payload(body: string, actor = "coderabbitai[bot]") {',
              'function payload(\n  body: string,\n  actor = "coderabbitai[bot]",\n  subjectLogin = "teamleaderleo",\n) {',
              1,
          )
          hosted = hosted.replace(
              'user: { login: "teamleaderleo" },',
              'user: { login: subjectLogin },',
              1,
          )
          hosted = hosted.replace(
              '    + "?repository=teamleaderleo%2Fstensibly&subject=teamleaderleo";',
              '    + "?repository=teamleaderleo%2Fstensibly&subject=dependabot%5Bbot%5D";',
              1,
          )
          if hosted.count('dependabot[bot]') < 2:
              raise SystemExit('hosted bot subject coverage was not inserted')
          hosted_path.write_text(hosted)

          service_path = Path('test/provider-capacity-convex.test.ts')
          service = service_path.read_text()
          service = service.replace('subjectLogin: "teamleaderleo",', 'subjectLogin: "dependabot[bot]",', 1)
          service = service.replace(
              '      "teamleaderleo",\n      Date.parse',
              '      "dependabot[bot]",\n      Date.parse',
              1,
          )
          service = service.replace(
              '      subjectBasis: "pull_request_author_proxy",',
              '      subjectLogin: "dependabot[bot]",\n      subjectBasis: "pull_request_author_proxy",',
              1,
          )
          if service.count('dependabot[bot]') != 3:
              raise SystemExit('Convex service bot subject coverage was not inserted')
          service_path.write_text(service)

          convex_path = Path('convex/providerCapacities.test.ts')
          convex = convex_path.read_text()
          marker = '  test("requires the service boundary", async () => {'
          addition = '''  test("accepts a bounded bot pull-request author proxy", async () => {
            const t = convexTest(schema, modules);
            await seedWorkspace(t);
            const inserted = await t.mutation(ingestRef, input({
              deliveryId: "delivery-bot-subject",
              payloadDigest: "9".repeat(64),
              subjectLogin: "dependabot[bot]",
            })) as any;
            expect(inserted).toMatchObject({
              duplicate: false,
              observation: { subjectLogin: "dependabot[bot]" },
            });
            expect(await t.query(latestRef, {
              ...queryArgs(),
              subjectLogin: "dependabot[bot]",
            })).toMatchObject({
              subjectLogin: "dependabot[bot]",
              subjectBasis: "pull_request_author_proxy",
            });
          });

          ''' + marker
          if convex.count(marker) != 1:
              raise SystemExit('Convex test insertion marker missing or duplicated')
          convex_path.write_text(convex.replace(marker, addition, 1))
          PY
      - name: Validate repair
        run: |
          bun install --frozen-lockfile
          bun test test/hosted-provider-capacity-api.test.ts test/provider-capacity-convex.test.ts
          bun run test:convex -- convex/providerCapacities.test.ts
          bun run typecheck
      - name: Commit repair and remove helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Quill provider-capacity reviewer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-530-bot-subject.yml
          git add src/provider-capacity.ts convex/providerCapacities.ts test/hosted-provider-capacity-api.test.ts test/provider-capacity-convex.test.ts convex/providerCapacities.test.ts
          git commit -m "fix: accept bounded bot capacity subjects"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/teamleaderleo/stensibly.git" HEAD:mica/426-hosted-capacity-current
