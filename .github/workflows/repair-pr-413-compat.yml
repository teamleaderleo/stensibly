name: Repair PR 413 SQLite compatibility

on:
  pull_request:
    branches:
      - junco/413-compat-executor

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: plover/403-public-event-reader
      - uses: oven-sh/setup-bun@v2
      - name: Replay current candidate and apply compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Junco Stensibly Worker"
          git config user.email "teamleaderleo@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git checkout 1201f56a63f8990454d48ca37c5732a539f92f50 -- \
            site/item-detail.js \
            site/item-detail.d.ts \
            test/dashboard-item-detail.test.ts
          python3 <<'PY'
          from pathlib import Path

          reader = Path("site/item-detail.js")
          source = reader.read_text()
          strict = (
              "  if (payload.historyContractVersion !== itemHistoryContractVersion) {\n"
              "    throw new TypeError('The item detail response uses an incompatible history contract.');\n"
              "  }\n"
              "  if (typeof payload.eventsTruncated !== 'boolean') {\n"
              "    throw new TypeError('The item detail response is missing event-history completeness.');\n"
              "  }\n"
              "  return {\n"
              "    historyContractVersion: itemHistoryContractVersion,\n"
              "    eventsTruncated: payload.eventsTruncated,\n"
          )
          compatible = (
              "  const declaresHistoryContract = Object.hasOwn(payload, 'historyContractVersion');\n"
              "  const declaresEventCompleteness = Object.hasOwn(payload, 'eventsTruncated');\n"
              "  if (declaresHistoryContract || declaresEventCompleteness) {\n"
              "    if (payload.historyContractVersion !== itemHistoryContractVersion) {\n"
              "      throw new TypeError('The item detail response uses an incompatible history contract.');\n"
              "    }\n"
              "    if (typeof payload.eventsTruncated !== 'boolean') {\n"
              "      throw new TypeError('The item detail response is missing event-history completeness.');\n"
              "    }\n"
              "  }\n"
              "  return {\n"
              "    historyContractVersion: declaresHistoryContract ? itemHistoryContractVersion : null,\n"
              "    eventsTruncated: declaresEventCompleteness ? payload.eventsTruncated : null,\n"
          )
          if source.count(strict) != 1:
              raise SystemExit("expected one strict hosted-envelope block")
          source = source.replace(strict, compatible)

          nullable = (
              "function nullableBoundedText(value, maximum) {\n"
              "  if (value === null || value === undefined) return null;\n"
              "  const output = boundedTextValue(value, maximum);\n"
              "  return output || undefined;\n"
              "}\n"
          )
          required_nullable = (
              "function nullableBoundedText(value, maximum) {\n"
              "  if (value === null) return null;\n"
              "  if (value === undefined) return undefined;\n"
              "  const output = boundedTextValue(value, maximum);\n"
              "  return output || undefined;\n"
              "}\n"
          )
          if source.count(nullable) != 1:
              raise SystemExit("expected one nullable actor helper")
          source = source.replace(nullable, required_nullable)
          reader.write_text(source)

          declarations = Path("site/item-detail.d.ts")
          source = declarations.read_text()
          if source.count("  historyContractVersion: 1;\n  eventsTruncated: boolean;\n") != 1:
              raise SystemExit("expected one strict declaration pair")
          source = source.replace(
              "  historyContractVersion: 1;\n  eventsTruncated: boolean;\n",
              "  historyContractVersion: 1 | null;\n  eventsTruncated: boolean | null;\n",
          )
          declarations.write_text(source)

          tests = Path("test/dashboard-item-detail.test.ts")
          source = tests.read_text()
          import_anchor = 'import { describe, expect, test } from "bun:test";\n'
          import_replacement = import_anchor + (
              'import { createServerApp } from "../src/server-app.ts";\n'
              'import { StensiblyStore } from "../src/store.ts";\n'
          )
          if source.count(import_anchor) != 1:
              raise SystemExit("expected one Bun test import")
          source = source.replace(import_anchor, import_replacement)

          envelope_test = (
              '  test("requires the exact versioned history and completeness envelope", () => {\n'
              '    const base = {\n'
              '      item: { id: "item_1" },\n'
              '      events: [],\n'
              '      artifacts: [],\n'
              '      historyContractVersion: 1,\n'
              '      eventsTruncated: false,\n'
              '    };\n'
              '    expect(readItemDetail(base, "item_1")).toMatchObject({\n'
              '      historyContractVersion: 1,\n'
              '      eventsTruncated: false,\n'
              '      events: [],\n'
              '    });\n'
              '    expect(() => readItemDetail({ ...base, historyContractVersion: 2 }, "item_1"))\n'
              '      .toThrow("incompatible history contract");\n'
              '    expect(() => readItemDetail({ ...base, historyContractVersion: undefined }, "item_1"))\n'
              '      .toThrow("incompatible history contract");\n'
              '    expect(() => readItemDetail({ ...base, eventsTruncated: undefined }, "item_1"))\n'
              '      .toThrow("missing event-history completeness");\n'
              '  });\n'
          )
          replacement_test = (
              '  test("preserves legacy unknown completeness and requires an exact declared envelope", () => {\n'
              '    const legacy = {\n'
              '      item: { id: "item_1" },\n'
              '      events: [],\n'
              '      artifacts: [],\n'
              '    };\n'
              '    expect(readItemDetail(legacy, "item_1")).toMatchObject({\n'
              '      historyContractVersion: null,\n'
              '      eventsTruncated: null,\n'
              '      events: [],\n'
              '    });\n'
              '\n'
              '    const hosted = {\n'
              '      ...legacy,\n'
              '      historyContractVersion: 1,\n'
              '      eventsTruncated: false,\n'
              '    };\n'
              '    expect(readItemDetail(hosted, "item_1")).toMatchObject({\n'
              '      historyContractVersion: 1,\n'
              '      eventsTruncated: false,\n'
              '      events: [],\n'
              '    });\n'
              '    expect(() => readItemDetail({ ...hosted, historyContractVersion: 2 }, "item_1"))\n'
              '      .toThrow("incompatible history contract");\n'
              '    expect(() => readItemDetail({ ...hosted, historyContractVersion: undefined }, "item_1"))\n'
              '      .toThrow("incompatible history contract");\n'
              '    expect(() => readItemDetail({ ...hosted, eventsTruncated: undefined }, "item_1"))\n'
              '      .toThrow("missing event-history completeness");\n'
              '    expect(() => readItemDetail({ ...legacy, eventsTruncated: false }, "item_1"))\n'
              '      .toThrow("incompatible history contract");\n'
              '  });\n'
              '\n'
              '  test("reads the real SQLite API detail with unknown completeness", async () => {\n'
              '    const store = new StensiblyStore(":memory:");\n'
              '    try {\n'
              '      const item = store.createItem({\n'
              '        project: "scrapbook",\n'
              '        kind: "task",\n'
              '        title: "Read local history",\n'
              '        priority: 50,\n'
              '        actor: { id: "leo", name: "Leo", kind: "human" },\n'
              '      });\n'
              '      const app = createServerApp(store);\n'
              '      const response = await app.request(`/api/v1/items/${encodeURIComponent(item.id)}`);\n'
              '      expect(response.status).toBe(200);\n'
              '\n'
              '      const detail = readItemDetail(await response.json(), item.id);\n'
              '      expect(detail.historyContractVersion).toBeNull();\n'
              '      expect(detail.eventsTruncated).toBeNull();\n'
              '      expect(detail.item).toMatchObject({ id: item.id, project: "scrapbook" });\n'
              '      expect(detail.events.map((event) => event.type)).toContain("item.created");\n'
              '    } finally {\n'
              '      store.close();\n'
              '    }\n'
              '  });\n'
          )
          if source.count(envelope_test) != 1:
              raise SystemExit("expected one history-envelope test")
          source = source.replace(envelope_test, replacement_test)

          actor_anchor = '    expect(readPublicEvent(event("keystone"), "item_1")?.actorId).toBe("keystone");\n'
          actor_replacement = actor_anchor + (
              '    expect(readPublicEvent({ ...event("plover"), actorId: null }, "item_1")?.actorId).toBeNull();\n'
              '    const missingActor = { ...event("plover") } as Record<string, unknown>;\n'
              '    delete missingActor.actorId;\n'
              '    expect(readPublicEvent(missingActor, "item_1")).toBeNull();\n'
          )
          if source.count(actor_anchor) != 1:
              raise SystemExit("expected one actor attribution anchor")
          source = source.replace(actor_anchor, actor_replacement)
          tests.write_text(source)
          PY
          git diff --check
      - run: bun install
      - run: bun run typecheck
      - run: bun test test/dashboard-item-detail.test.ts
      - run: bun run test
      - run: bun run test:convex
      - run: bun run worker:check
      - name: Publish repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git add site/item-detail.js site/item-detail.d.ts test/dashboard-item-detail.test.ts
          git commit -m "Preserve SQLite item history compatibility"
          git push --force-with-lease origin HEAD:plover/403-public-event-reader
