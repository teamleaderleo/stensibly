name: Apply MCP manifest diagnostics

on:
  push:
    branches:
      - rivet/490-mcp-manifest-diagnostics
    paths:
      - ".github/workflows/rivet-apply-490-mcp-diagnostics.yml"
      - "scripts/rivet-apply-mcp-diagnostics.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rivet-apply-490-mcp-diagnostics.yml"
      - "scripts/rivet-apply-mcp-diagnostics.py"

permissions:
  contents: write

concurrency:
  group: rivet-490-mcp-manifest-diagnostics
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rivet/490-mcp-manifest-diagnostics
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Apply bounded diagnostics patch
        run: python3 scripts/rivet-apply-mcp-diagnostics.py

      - name: Run exact repository checks
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check

      - name: Commit implementation and remove applicator
        run: |
          set -euo pipefail
          rm .github/workflows/rivet-apply-490-mcp-diagnostics.yml
          rm scripts/rivet-apply-mcp-diagnostics.py
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add -A
          git commit -m "Expose MCP manifest and typed failure diagnostics"
          git push origin HEAD:rivet/490-mcp-manifest-diagnostics
