name: Rook 1028 exact effect URL repair

on:
  pull_request:
    paths:
      - .github/workflows/rook-1028-exact-effect-url-repair.yml

permissions:
  contents: write

concurrency:
  group: rook-1028-exact-effect-url-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lynx/1027-repository-file-effect-controls
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Require canonical provider URL bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/github-rest-repository-write-adapter.ts")
          text = path.read_text()
          before = '''function assertRequiredExactApiUrl(value: unknown, expected: URL): void {
            if (typeof value !== "string") throw fileEffectError();
            let actual: URL;'''
          after = '''function assertRequiredExactApiUrl(value: unknown, expected: URL): void {
            if (typeof value !== "string" || value !== expected.href) {
              throw fileEffectError();
            }
            let actual: URL;'''
          if text.count(before) != 1:
            raise SystemExit("exact effect URL admission anchor changed")
          path.write_text(text.replace(before, after, 1))
          PY
          git diff --check

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused exact-head gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-rest-repository-write-adapter.test.ts \
            test/github-rest-repository-write-effect-admission.test.ts \
            test/github-rest-repository-write-effect-sha256.test.ts \
            test/github-rest-repository-write-effect-url-spelling.test.ts

      - name: Publish source and test only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/lynx/1027-repository-file-effect-controls:refs/remotes/origin/lynx/1027-repository-file-effect-controls
          test "$(git rev-parse refs/remotes/origin/lynx/1027-repository-file-effect-controls)" = "$EXPECTED_HEAD"
          rm .github/workflows/rook-1028-exact-effect-url-repair.yml
          git config user.name "Rook"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-rest-repository-write-adapter.ts \
            test/github-rest-repository-write-effect-url-spelling.test.ts \
            .github/workflows/rook-1028-exact-effect-url-repair.yml
          git diff --cached --check
          git commit -m "Require canonical repository effect URLs"
          git push --force-with-lease=refs/heads/lynx/1027-repository-file-effect-controls:$EXPECTED_HEAD \
            origin HEAD:refs/heads/lynx/1027-repository-file-effect-controls
