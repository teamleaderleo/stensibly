name: Rook 1050 signal setup cleanup repair

on:
  push:
    branches:
      - cedar/1012-bounded-readback-facade
    paths:
      - .github/workflows/rook-1050-signal-setup-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rook-1050-signal-setup-cleanup
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/1012-bounded-readback-facade
          fetch-depth: 3

      - name: Verify unchanged cleanup inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/github-provider-bounded-response.ts)" = "90f3ed7285ea7b6bcf79ab18b1ccdb1140548a78"
          test "$(git rev-parse HEAD:test/github-provider-bounded-response-request-inspection-cleanup.test.ts)" = "a349a72adff9e839b469e1de8589fe6754787b66"
          test "$(git rev-parse HEAD:test/github-provider-bounded-response-signal-setup-cleanup.test.ts)" = "d990e04c6f17d60fb6f1118557dcdfa2c4266dd5"

      - uses: oven-sh/setup-bun@v2

      - name: Repair external signal setup cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/github-provider-bounded-response.ts")
          text = path.read_text()
          old = (
              "  if (externalSignal) {\n"
              "    const forwardAbort = () => terminate();\n"
              "    if (externalSignal.aborted) {\n"
              "      forwardAbort();\n"
              "    } else {\n"
              "      externalSignal.addEventListener(\"abort\", forwardAbort, { once: true });\n"
              "      context.removeExternalAbort = () =>\n"
              "        externalSignal.removeEventListener(\"abort\", forwardAbort);\n"
              "    }\n"
              "  }\n"
          )
          new = '''  if (externalSignal) {
            const forwardAbort = () => terminate();
            context.removeExternalAbort = () => {
              try {
                externalSignal.removeEventListener("abort", forwardAbort);
              } catch {
                // Fixed cleanup remains best-effort for hostile signal objects.
              }
            };
            try {
              if (externalSignal.aborted) {
                forwardAbort();
              } else {
                externalSignal.addEventListener("abort", forwardAbort, { once: true });
              }
            } catch {
              finishDeadline(context);
              throw new GitHubProviderResponseReadError();
            }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("external signal setup anchor moved")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Validate bounded response packet
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/github-provider-bounded-response*.test.ts test/github-provider-bounded-readback*.test.ts

      - name: Publish workflow-free repaired head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rook-1050-signal-setup-cleanup.yml
          git add src/github-provider-bounded-response.ts \
            test/github-provider-bounded-response-signal-setup-cleanup.test.ts
          git diff --cached --check
          git config user.name "Rook"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Clean up hostile provider signal setup"
          git push origin HEAD:cedar/1012-bounded-readback-facade
