name: Rook 1103 false-only kill-switch repair

on:
  push:
    branches:
      - cedar/hosted-github-writes-default-on
    paths:
      - .github/workflows/rook-1103-false-only-kill-switch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/hosted-github-writes-default-on
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
      - name: Repair write-flag configuration presence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/hosted-github-issue-provider.ts")
          text = path.read_text()
          old = '''  const configured = Boolean(writeFlag)
            || keys.some((key) => Boolean(trimmed(env[key])));
          '''
          new = '''  const flagRequestsConfiguration = writeFlag !== undefined
            && writeFlag !== ""
            && writeFlag !== "false";
          const configured = flagRequestsConfiguration
            || keys.some((key) => Boolean(trimmed(env[key])));
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"hosted write flag presence anchor changed: {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Validate hosted GitHub composition
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/hosted-github-issue*.test.ts test/mcp-github-issue-provider-write-composition.test.ts
      - name: Publish workflow-free repaired head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rook-1103-false-only-kill-switch.yml
          git add src/hosted-github-issue-provider.ts \
            test/hosted-github-issue-write-default-flag-presence.test.ts \
            .github/workflows/rook-1103-false-only-kill-switch.yml
          git diff --cached --check
          git config user.name "Rook"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Preserve the false-only GitHub write kill switch"
          git push origin HEAD:cedar/hosted-github-writes-default-on
