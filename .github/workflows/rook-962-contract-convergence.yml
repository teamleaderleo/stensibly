name: Rook 962 Merkle contract convergence

on:
  push:
    branches:
      - lark/955-observation-merkle-checkpoints
    paths:
      - .github/workflows/rook-962-contract-convergence.yml

permissions:
  contents: write

concurrency:
  group: rook-962-merkle-contract-convergence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lark/955-observation-merkle-checkpoints
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply identity, sequence, and documentation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/github-observation-merkle-checkpoint.ts")
          source = source_path.read_text()
          before_patterns = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const maximumLeaves = 4_096;'''
          after_patterns = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const stableIdentityPattern = /^[A-Za-z0-9][A-Za-z0-9._:/#@-]*$/u;
          // Keep realistic credential families aligned with retained control identity policy.
          const credentialShapedIdentityPattern =
            /(?:Bearer\\s+[A-Za-z0-9._~+\\/-]{12,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|stn\\.tok_[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{16,}|(?:env|secret):\\/\\/[^\\s]+|eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,})/iu;
          const maximumLeaves = 4_096;'''
          if source.count(before_patterns) != 1:
            raise SystemExit("identity pattern anchor changed")
          source = source.replace(before_patterns, after_patterns, 1)

          before_guard = '''    typeof value !== "string"
              || value.length === 0
              || Buffer.byteLength(value, "utf8") > maximumBytes
              || unsafeIdentityPattern.test(value)
            ) {'''
          after_guard = '''    typeof value !== "string"
              || value.length === 0
              || value !== value.trim()
              || Buffer.byteLength(value, "utf8") > maximumBytes
              || !stableIdentityPattern.test(value)
              || unsafeIdentityPattern.test(value)
              || credentialShapedIdentityPattern.test(value)
            ) {'''
          if source.count(before_guard) != 1:
            raise SystemExit("bounded identity guard anchor changed")
          source = source.replace(before_guard, after_guard, 1)

          before_verify = '''    || proof.treeSize !== checkpoint.treeSize
              || proof.leafIndex >= checkpoint.treeSize
            ) {'''
          after_verify = '''    || proof.treeSize !== checkpoint.treeSize
              || proof.leafIndex >= checkpoint.treeSize
              || checkpoint.firstSequence === null
              || proof.sequence !== checkpoint.firstSequence + proof.leafIndex
            ) {'''
          if source.count(before_verify) != 1:
            raise SystemExit("inclusion sequence binding anchor changed")
          source_path.write_text(source.replace(before_verify, after_verify, 1))

          test_path = Path("test/github-observation-merkle-checkpoint-admission.test.ts")
          tests = test_path.read_text()
          before_import = '''  compileGitHubObservationMerkleCheckpointV1,
            createGitHubObservationConsistencyProofV1,
            GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
            type GitHubObservationMerkleCheckpointV1,
          } from "../src/github-observation-merkle-checkpoint.ts";'''
          after_import = '''  compileGitHubObservationMerkleCheckpointV1,
            createGitHubObservationConsistencyProofV1,
            createGitHubObservationInclusionProofV1,
            GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
            type GitHubObservationMerkleCheckpointV1,
            verifyGitHubObservationInclusionProofV1,
          } from "../src/github-observation-merkle-checkpoint.ts";'''
          if tests.count(before_import) != 1:
            raise SystemExit("admission import anchor changed")
          tests = tests.replace(before_import, after_import, 1)

          closing = '''  });
          });
          '''
          if not tests.endswith(closing):
            raise SystemExit("admission suite closing marker changed")
          addition = r'''

            test("requires exact stable identities and rejects realistic credentials", () => {
              const invalidIdentities = [
                " padded-ledger",
                "ledger-with-padding ",
                "ledger identity prose",
                `github_pat_${"a".repeat(24)}`,
                `ghp_${"b".repeat(24)}`,
                `sk-proj-${"c".repeat(24)}`,
                `stn.tok_${"d".repeat(24)}`,
                `xoxb-${"e".repeat(20)}`,
                `Bearer ${"f".repeat(16)}`,
                "secret://OBSERVATION_TOKEN",
                `eyJ${"a".repeat(10)}.eyJ${"b".repeat(10)}.${"c".repeat(10)}`,
              ];
              for (const identity of invalidIdentities) {
                expect(() => compileGitHubObservationMerkleCheckpointV1({
                  version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                  ledgerId: identity,
                  compilerId,
                  createdAt: "2026-08-03T01:13:00Z",
                  leaves: [],
                })).toThrow("Observation ledger ID is invalid");
                expect(() => compileGitHubObservationMerkleCheckpointV1({
                  version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                  ledgerId,
                  compilerId: identity,
                  createdAt: "2026-08-03T01:13:00Z",
                  leaves: [],
                })).toThrow("Observation checkpoint compiler ID is invalid");
                expect(() => compileGitHubObservationMerkleCheckpointV1({
                  version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                  ledgerId,
                  compilerId,
                  createdAt: "2026-08-03T01:13:00Z",
                  leaves: [{
                    sequence: 1,
                    observationId: identity,
                    semanticFingerprint: sha256("observation-identity-control"),
                  }],
                })).toThrow("Observation Merkle leaf 0 ID is invalid");
              }

              const checkpoint = compileGitHubObservationMerkleCheckpointV1({
                version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                ledgerId: "ledger-sk-review",
                compilerId: "compiler-ghp_review",
                createdAt: "2026-08-03T01:14:00Z",
                leaves: [{
                  sequence: 1,
                  observationId: "observation-xoxb-review",
                  semanticFingerprint: sha256("benign-token-like-identity"),
                }],
              });
              expect(checkpoint.ledgerId).toBe("ledger-sk-review");
              expect(checkpoint.compilerId).toBe("compiler-ghp_review");
            });

            test("rejects refingerprinted credential-bearing checkpoint and proof objects", () => {
              const leaves = [{
                sequence: 1,
                observationId: "github:issues:delivery-proof",
                semanticFingerprint: sha256("observation-proof"),
              }];
              const checkpoint = compileGitHubObservationMerkleCheckpointV1({
                version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                ledgerId,
                compilerId,
                createdAt: "2026-08-03T01:15:00Z",
                leaves,
              });
              const proof = createGitHubObservationInclusionProofV1({
                checkpoint,
                leaves,
                leafIndex: 0,
              });

              const { checkpointFingerprint: _checkpointFingerprint, ...checkpointBody } = {
                ...checkpoint,
                compilerId: `sk-${"a".repeat(24)}`,
              };
              const forgedCheckpoint = {
                ...checkpointBody,
                checkpointFingerprint: sha256(stableJson(checkpointBody)),
              };
              expect(() => verifyGitHubObservationInclusionProofV1(
                forgedCheckpoint,
                proof,
              )).toThrow("Observation checkpoint compiler ID is invalid");

              const { proofFingerprint: _proofFingerprint, ...proofBody } = {
                ...proof,
                observationId: `github_pat_${"b".repeat(24)}`,
              };
              const forgedProof = {
                ...proofBody,
                proofFingerprint: sha256(stableJson(proofBody)),
              };
              expect(() => verifyGitHubObservationInclusionProofV1(
                checkpoint,
                forgedProof,
              )).toThrow("Observation ID is invalid");
            });

            test("binds inclusion sequence to checkpoint range and leaf index", () => {
              const leaves = [
                {
                  sequence: 10,
                  observationId: "github:issues:delivery-10",
                  semanticFingerprint: sha256("observation-10"),
                },
                {
                  sequence: 11,
                  observationId: "github:issues:delivery-11",
                  semanticFingerprint: sha256("observation-11"),
                },
              ];
              const checkpoint = compileGitHubObservationMerkleCheckpointV1({
                version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                ledgerId,
                compilerId,
                createdAt: "2026-08-03T01:16:00Z",
                leaves,
              });
              const proof = createGitHubObservationInclusionProofV1({
                checkpoint,
                leaves,
                leafIndex: 0,
              });

              const { checkpointFingerprint: _checkpointFingerprint, ...checkpointBody } = {
                ...checkpoint,
                firstSequence: 1,
                lastSequence: 2,
              };
              const forgedCheckpoint = {
                ...checkpointBody,
                checkpointFingerprint: sha256(stableJson(checkpointBody)),
              };
              const { proofFingerprint: _proofFingerprint, ...proofBody } = {
                ...proof,
                checkpointFingerprint: forgedCheckpoint.checkpointFingerprint,
              };
              const forgedProof = {
                ...proofBody,
                proofFingerprint: sha256(stableJson(proofBody)),
              };

              expect(verifyGitHubObservationInclusionProofV1(
                forgedCheckpoint,
                forgedProof,
              )).toBe(false);
            });
          '''
          test_path.write_text(tests[:-len(closing)] + addition + "\n" + closing)

          docs_path = Path("docs/github-observation-merkle-checkpoints.md")
          docs = docs_path.read_text()
          docs = docs.replace(
            "Observation IDs are stable content-minimised identities.",
            "Ledger, compiler, and observation IDs use an exact stable-identity grammar and reject padded, prose-shaped, control-bearing, and realistic credential-shaped text. Observation IDs remain content-minimised identities.",
          )
          docs = docs.replace(
            "- trusted creation time;",
            "- canonical producer-supplied checkpoint time;",
          )
          docs = docs.replace(
            "A valid proof means only that the named leaf was committed at that index in that checkpoint.",
            "Verification additionally requires `sequence = firstSequence + leafIndex`. A valid proof means only that the named leaf was committed at that exact sequence/index in that checkpoint.",
          )
          docs_path.write_text(docs)
          PY

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused and matrix gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-observation-merkle-checkpoint.test.ts \
            test/github-observation-merkle-checkpoint-admission.test.ts \
            test/github-observation-merkle-checkpoint-matrix.test.ts

      - name: Publish source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rook-962-contract-convergence.yml
          git config user.name "Rook"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-observation-merkle-checkpoint.ts \
            test/github-observation-merkle-checkpoint-admission.test.ts \
            docs/github-observation-merkle-checkpoints.md \
            .github/workflows/rook-962-contract-convergence.yml
          git diff --cached --check
          git commit -m "Bind and sanitize Merkle proof identities"
          git push --force-with-lease=refs/heads/lark/955-observation-merkle-checkpoints:$GITHUB_SHA \
            origin HEAD:refs/heads/lark/955-observation-merkle-checkpoints
