name: Rook 962 Merkle source convergence

on:
  push:
    branches:
      - lark/955-observation-merkle-checkpoints
    paths:
      - .github/workflows/rook-962-contract-convergence.yml

permissions:
  contents: write

concurrency:
  group: rook-962-merkle-source-convergence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lark/955-observation-merkle-checkpoints
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply complete Merkle contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/github-observation-merkle-checkpoint.ts")
          source = source_path.read_text()

          old_patterns = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const maximumLeaves = 4_096;'''
          new_patterns = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const stableIdentityPattern = /^[A-Za-z0-9][A-Za-z0-9._:/#@-]*$/u;
          // Keep realistic credential families aligned with retained control identity policy.
          const credentialShapedIdentityPattern =
            /(?:Bearer\\s+[A-Za-z0-9._~+\\/-]{12,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|stn\\.tok_[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{16,}|(?:env|secret):\\/\\/[^\\s]+|eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,})/iu;
          const maximumLeaves = 4_096;'''
          if source.count(old_patterns) != 1:
            raise SystemExit("identity pattern anchor changed")
          source = source.replace(old_patterns, new_patterns, 1)

          old_guard = '''    typeof value !== "string"
              || value.length === 0
              || Buffer.byteLength(value, "utf8") > maximumBytes
              || unsafeIdentityPattern.test(value)
            ) {'''
          new_guard = '''    typeof value !== "string"
              || value.length === 0
              || value !== value.trim()
              || Buffer.byteLength(value, "utf8") > maximumBytes
              || !stableIdentityPattern.test(value)
              || unsafeIdentityPattern.test(value)
              || credentialShapedIdentityPattern.test(value)
            ) {'''
          if source.count(old_guard) != 1:
            raise SystemExit("bounded identity guard anchor changed")
          source = source.replace(old_guard, new_guard, 1)

          old_verify = '''    || proof.treeSize !== checkpoint.treeSize
              || proof.leafIndex >= checkpoint.treeSize
            ) {'''
          new_verify = '''    || proof.treeSize !== checkpoint.treeSize
              || proof.leafIndex >= checkpoint.treeSize
              || checkpoint.firstSequence === null
              || proof.sequence !== checkpoint.firstSequence + proof.leafIndex
            ) {'''
          if source.count(old_verify) != 1:
            raise SystemExit("inclusion sequence binding anchor changed")
          source_path.write_text(source.replace(old_verify, new_verify, 1))

          docs_path = Path("docs/github-observation-merkle-checkpoints.md")
          docs = docs_path.read_text()
          replacements = [
            (
              "Observation IDs are stable content-minimised identities.",
              "Ledger, compiler, and observation IDs use an exact stable-identity grammar and reject padded, prose-shaped, control-bearing, and realistic credential-shaped text. Observation IDs remain content-minimised identities.",
            ),
            ("- trusted creation time;", "- canonical producer-supplied checkpoint time;"),
            (
              "A valid proof means only that the named leaf was committed at that index in that checkpoint.",
              "Verification additionally requires `sequence = firstSequence + leafIndex`. A valid proof means only that the named leaf was committed at that exact sequence/index in that checkpoint.",
            ),
          ]
          for before, after in replacements:
            if docs.count(before) != 1:
              raise SystemExit(f"documentation anchor changed: {before}")
            docs = docs.replace(before, after, 1)
          docs_path.write_text(docs)
          PY

          cat > test/github-observation-merkle-checkpoint-contract-boundaries.test.ts <<'EOF'
          import { describe, expect, test } from "bun:test";
          import { sha256, stableJson } from "../src/canonical-json.ts";
          import {
            compileGitHubObservationMerkleCheckpointV1,
            createGitHubObservationInclusionProofV1,
            GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
            verifyGitHubObservationInclusionProofV1,
          } from "../src/github-observation-merkle-checkpoint.ts";

          const ledgerId = "workspace/oauth-dogfood/github-observations";
          const compilerId = "github-observation-merkle/v1";

          describe("GitHub observation Merkle contract boundaries", () => {
            test("requires exact stable identities", () => {
              const invalid = [
                " padded-ledger",
                "ledger-with-padding ",
                "ledger identity prose",
                "ledger,prose",
              ];
              for (const identity of invalid) {
                expect(() => compile({ ledgerId: identity })).toThrow(
                  "Observation ledger ID is invalid",
                );
                expect(() => compile({ compilerId: identity })).toThrow(
                  "Observation checkpoint compiler ID is invalid",
                );
                expect(() => compile({ observationId: identity })).toThrow(
                  "Observation Merkle leaf 0 ID is invalid",
                );
              }
            });

            test("admits benign short token-like identities", () => {
              const checkpoint = compile({
                ledgerId: "ledger-sk-review",
                compilerId: "compiler-ghp_review",
                observationId: "observation-xoxb-review",
              });
              expect(checkpoint).toMatchObject({
                ledgerId: "ledger-sk-review",
                compilerId: "compiler-ghp_review",
                treeSize: 1,
              });
            });

            test("rejects refingerprinted credential-bearing checkpoint and proof objects", () => {
              const leaves = [{
                sequence: 1,
                observationId: "github:issues:delivery-proof",
                semanticFingerprint: sha256("observation-proof"),
              }];
              const checkpoint = compileGitHubObservationMerkleCheckpointV1({
                version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                ledgerId,
                compilerId,
                createdAt: "2026-08-03T01:15:00Z",
                leaves,
              });
              const proof = createGitHubObservationInclusionProofV1({
                checkpoint,
                leaves,
                leafIndex: 0,
              });

              const { checkpointFingerprint: _checkpointFingerprint, ...checkpointBody } = {
                ...checkpoint,
                compilerId: `sk-${"a".repeat(24)}`,
              };
              const forgedCheckpoint = {
                ...checkpointBody,
                checkpointFingerprint: sha256(stableJson(checkpointBody)),
              };
              expect(() => verifyGitHubObservationInclusionProofV1(
                forgedCheckpoint,
                proof,
              )).toThrow("Observation checkpoint compiler ID is invalid");

              const { proofFingerprint: _proofFingerprint, ...proofBody } = {
                ...proof,
                observationId: `github_pat_${"b".repeat(24)}`,
              };
              const forgedProof = {
                ...proofBody,
                proofFingerprint: sha256(stableJson(proofBody)),
              };
              expect(() => verifyGitHubObservationInclusionProofV1(
                checkpoint,
                forgedProof,
              )).toThrow("Observation ID is invalid");
            });

            test("binds inclusion sequence to checkpoint range and leaf index", () => {
              const leaves = [
                {
                  sequence: 10,
                  observationId: "github:issues:delivery-10",
                  semanticFingerprint: sha256("observation-10"),
                },
                {
                  sequence: 11,
                  observationId: "github:issues:delivery-11",
                  semanticFingerprint: sha256("observation-11"),
                },
              ];
              const checkpoint = compileGitHubObservationMerkleCheckpointV1({
                version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                ledgerId,
                compilerId,
                createdAt: "2026-08-03T01:16:00Z",
                leaves,
              });
              const proof = createGitHubObservationInclusionProofV1({
                checkpoint,
                leaves,
                leafIndex: 0,
              });

              const { checkpointFingerprint: _checkpointFingerprint, ...checkpointBody } = {
                ...checkpoint,
                firstSequence: 1,
                lastSequence: 2,
              };
              const forgedCheckpoint = {
                ...checkpointBody,
                checkpointFingerprint: sha256(stableJson(checkpointBody)),
              };
              const { proofFingerprint: _proofFingerprint, ...proofBody } = {
                ...proof,
                checkpointFingerprint: forgedCheckpoint.checkpointFingerprint,
              };
              const forgedProof = {
                ...proofBody,
                proofFingerprint: sha256(stableJson(proofBody)),
              };

              expect(verifyGitHubObservationInclusionProofV1(
                forgedCheckpoint,
                forgedProof,
              )).toBe(false);
            });
          });

          function compile(input: {
            ledgerId?: string;
            compilerId?: string;
            observationId?: string;
          }) {
            return compileGitHubObservationMerkleCheckpointV1({
              version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
              ledgerId: input.ledgerId ?? ledgerId,
              compilerId: input.compilerId ?? compilerId,
              createdAt: "2026-08-03T01:14:00Z",
              leaves: [{
                sequence: 1,
                observationId: input.observationId ?? "github:issues:delivery-1",
                semanticFingerprint: sha256("contract-boundary-observation"),
              }],
            });
          }
          EOF

      - name: Restore canonical CI before validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/lark-merkle-identity-fix.yml

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused and matrix gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-observation-merkle-checkpoint.test.ts \
            test/github-observation-merkle-checkpoint-admission.test.ts \
            test/github-observation-merkle-checkpoint-credentials.test.ts \
            test/github-observation-merkle-checkpoint-contract-boundaries.test.ts \
            test/github-observation-merkle-checkpoint-matrix.test.ts

      - name: Publish ordinary source candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/lark/955-observation-merkle-checkpoints:refs/remotes/origin/lark/955-observation-merkle-checkpoints"
          test "$(git rev-parse refs/remotes/origin/lark/955-observation-merkle-checkpoints)" = "$GITHUB_SHA"
          rm .github/workflows/rook-962-contract-convergence.yml
          git config user.name "Rook"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/lark-merkle-identity-fix.yml \
            .github/workflows/rook-962-contract-convergence.yml \
            src/github-observation-merkle-checkpoint.ts \
            test/github-observation-merkle-checkpoint-contract-boundaries.test.ts \
            docs/github-observation-merkle-checkpoints.md
          git diff --cached --check
          git commit -m "Converge Merkle proof contract boundaries"
          git push --force-with-lease=refs/heads/lark/955-observation-merkle-checkpoints:$GITHUB_SHA \
            origin HEAD:refs/heads/lark/955-observation-merkle-checkpoints
