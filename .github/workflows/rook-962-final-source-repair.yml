name: Rook 962 final Merkle source repair

on:
  push:
    branches:
      - lark/955-observation-merkle-checkpoints
    paths:
      - .github/workflows/rook-962-final-source-repair.yml

permissions:
  contents: write

concurrency:
  group: rook-962-final-merkle-source-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lark/955-observation-merkle-checkpoints
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact trigger head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply retained identity, sequence, and documentation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/github-observation-merkle-checkpoint.ts")
          source = source_path.read_text()

          before_patterns = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const maximumLeaves = 4_096;'''
          after_patterns = '''const unsafeIdentityPattern =
            /[\\u0000-\\u001f\\u007f-\\u009f\\u2028\\u2029\\u202a-\\u202e\\u2066-\\u2069]/u;
          const stableIdentityPattern = /^[A-Za-z0-9][A-Za-z0-9._:/#@-]*$/u;
          const realisticCredentialPattern =
            /(?:Bearer\\s+[A-Za-z0-9._~+\\/-]{12,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{20,}|stn\\.tok_[A-Za-z0-9._-]{20,}|xox[baprs]-[A-Za-z0-9-]{16,}|(?:env|secret):\\/\\/[^\\s]+|eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,})/iu;
          const maximumLeaves = 4_096;'''
          if source.count(before_patterns) != 1:
            raise SystemExit("identity pattern anchor changed")
          source = source.replace(before_patterns, after_patterns, 1)

          before_identity = '''function boundedIdentity(value: unknown, label: string, maximumBytes: number): string {
            if (
              typeof value !== "string"
              || value.length === 0
              || Buffer.byteLength(value, "utf8") > maximumBytes
              || unsafeIdentityPattern.test(value)
            ) {
              throw new RangeError(`${label} is invalid`);
            }
            return value;
          }'''
          after_identity = '''function boundedIdentity(value: unknown, label: string, maximumBytes: number): string {
            if (
              typeof value !== "string"
              || value.length === 0
              || value !== value.trim()
              || Buffer.byteLength(value, "utf8") > maximumBytes
              || !stableIdentityPattern.test(value)
              || unsafeIdentityPattern.test(value)
              || realisticCredentialPattern.test(value)
            ) {
              throw new RangeError(`${label} is invalid`);
            }
            return value;
          }'''
          if source.count(before_identity) != 1:
            raise SystemExit("bounded identity anchor changed")
          source = source.replace(before_identity, after_identity, 1)

          before_verify = '''    || proof.treeSize !== checkpoint.treeSize
              || proof.leafIndex >= checkpoint.treeSize
            ) {'''
          after_verify = '''    || proof.treeSize !== checkpoint.treeSize
              || proof.leafIndex >= checkpoint.treeSize
              || checkpoint.firstSequence === null
              || proof.sequence !== checkpoint.firstSequence + proof.leafIndex
            ) {'''
          if source.count(before_verify) != 1:
            raise SystemExit("inclusion sequence binding anchor changed")
          source_path.write_text(source.replace(before_verify, after_verify, 1))

          docs_path = Path("docs/github-observation-merkle-checkpoints.md")
          docs = docs_path.read_text()
          replacements = [
            (
              "Sequences must be positive, contiguous, and ordered inside one checkpoint. Observation IDs are stable content-minimised identities.",
              "Sequences must be positive, contiguous, and ordered inside one checkpoint. Ledger, compiler, and observation IDs use exact stable identity text and reject padded, prose-shaped, control-bearing, and realistic credential-shaped values. Observation IDs remain content-minimised identities.",
            ),
            ("- trusted creation time;", "- canonical producer-supplied checkpoint time;"),
            (
              "A valid proof means only that the named leaf was committed at that index in that checkpoint.",
              "Verification also requires `sequence = firstSequence + leafIndex`. A valid proof means only that the named leaf was committed at that exact sequence/index in that checkpoint.",
            ),
          ]
          for before, after in replacements:
            if docs.count(before) != 1:
              raise SystemExit(f"documentation anchor changed: {before}")
            docs = docs.replace(before, after, 1)
          docs_path.write_text(docs)
          PY

          cat > test/github-observation-merkle-checkpoint-sequence-binding.test.ts <<'EOF'
          import { describe, expect, test } from "bun:test";
          import { sha256, stableJson } from "../src/canonical-json.ts";
          import {
            compileGitHubObservationMerkleCheckpointV1,
            createGitHubObservationInclusionProofV1,
            GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
            verifyGitHubObservationInclusionProofV1,
          } from "../src/github-observation-merkle-checkpoint.ts";

          describe("GitHub observation inclusion sequence binding", () => {
            test("rejects a refingerprinted checkpoint range substituted under a valid proof", () => {
              const leaves = [
                {
                  sequence: 10,
                  observationId: "github:issues:delivery-10",
                  semanticFingerprint: sha256("observation-10"),
                },
                {
                  sequence: 11,
                  observationId: "github:issues:delivery-11",
                  semanticFingerprint: sha256("observation-11"),
                },
              ];
              const checkpoint = compileGitHubObservationMerkleCheckpointV1({
                version: GITHUB_OBSERVATION_MERKLE_CHECKPOINT_V1,
                ledgerId: "workspace/oauth-dogfood/github-observations",
                compilerId: "github-observation-merkle/v1",
                createdAt: "2026-08-03T02:40:00Z",
                leaves,
              });
              const proof = createGitHubObservationInclusionProofV1({
                checkpoint,
                leaves,
                leafIndex: 0,
              });

              const { checkpointFingerprint: _oldCheckpointFingerprint, ...checkpointBody } = {
                ...checkpoint,
                firstSequence: 1,
                lastSequence: 2,
              };
              const forgedCheckpoint = {
                ...checkpointBody,
                checkpointFingerprint: sha256(stableJson(checkpointBody)),
              };
              const { proofFingerprint: _oldProofFingerprint, ...proofBody } = {
                ...proof,
                checkpointFingerprint: forgedCheckpoint.checkpointFingerprint,
              };
              const forgedProof = {
                ...proofBody,
                proofFingerprint: sha256(stableJson(proofBody)),
              };

              expect(verifyGitHubObservationInclusionProofV1(
                forgedCheckpoint,
                forgedProof,
              )).toBe(false);
            });
          });
          EOF

      - name: Install committed dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Run focused and exhaustive gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test \
            test/github-observation-merkle-checkpoint.test.ts \
            test/github-observation-merkle-checkpoint-admission.test.ts \
            test/github-observation-merkle-checkpoint-credentials.test.ts \
            test/github-observation-merkle-checkpoint-sequence-binding.test.ts \
            test/github-observation-merkle-checkpoint-matrix.test.ts

      - name: Publish source-only repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/lark/955-observation-merkle-checkpoints:refs/remotes/origin/lark/955-observation-merkle-checkpoints"
          test "$(git rev-parse refs/remotes/origin/lark/955-observation-merkle-checkpoints)" = "$GITHUB_SHA"
          rm .github/workflows/rook-962-final-source-repair.yml
          git config user.name "Rook"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/github-observation-merkle-checkpoint.ts \
            docs/github-observation-merkle-checkpoints.md \
            test/github-observation-merkle-checkpoint-sequence-binding.test.ts \
            .github/workflows/rook-962-final-source-repair.yml
          git diff --cached --check
          git commit -m "Close Merkle identity and sequence boundaries"
          git push --force-with-lease=refs/heads/lark/955-observation-merkle-checkpoints:$GITHUB_SHA \
            origin HEAD:refs/heads/lark/955-observation-merkle-checkpoints
