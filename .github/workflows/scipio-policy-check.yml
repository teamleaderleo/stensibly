name: Scipio policy docs check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check policy links and diff whitespace
        run: |
          git diff --check origin/${{ github.base_ref }}...HEAD
          test -f docs/operations.md
          grep -Fq '[`docs/operations.md`](docs/operations.md)' STENSIBLY.md
