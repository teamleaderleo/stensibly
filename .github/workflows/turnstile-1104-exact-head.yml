name: Turnstile 1104 exact-head proof

on:
  push:
    branches:
      - cedar/github-create-issue-initial-metadata
    paths:
      - .github/workflows/turnstile-1104-exact-head.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turnstile-1104-exact-head-proof
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cedar/github-create-issue-initial-metadata
          fetch-depth: 3

      - name: Verify exact candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/github-issue-provider-mcp.ts)" = "86ce2f4f99948c43531cc2ba6cb06501c0970855"
          test "$(git rev-parse HEAD:test/mcp-github-issue-provider-write-composition.test.ts)" = "4bb757f0af91f7617980b26bc36fdd5e9e43a196"
          test "$(git rev-parse HEAD^)" = "f9e956ab0f09d01c098f55f86631b54ce29551f4"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run exact candidate checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun test ./test/mcp-github-issue-provider-write-composition.test.ts
          bun run test
          bun run test:convex
          bun run test:runtime-parity
          bun run worker:check

      - name: Publish workflow-free verified head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/turnstile-1104-exact-head.yml
          git diff --cached --check
          git config user.name "Turnstile"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Record exact-head proof for initial issue metadata"
          git push origin HEAD:cedar/github-create-issue-initial-metadata
