name: Refresh MCP SDK lock

on:
  push:
    branches:
      - keel/mcp-ambiguous-retry-idempotency
    paths:
      - package.json
      - .github/workflows/upgrade-mcp-sdk-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: keel/mcp-ambiguous-retry-idempotency
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate Bun lockfile
        run: bun install
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh MCP SDK lockfile"
          git push origin HEAD:keel/mcp-ambiguous-retry-idempotency
