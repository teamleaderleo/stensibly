name: W01 Apply Callback Egress Hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w01-apply-callback-egress-hardening.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  apply-test-deploy:
    name: Apply, test, deploy, and verify callback egress hardening
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact callback egress hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          pending = {}

          def text(path):
              return pending.get(path, Path(path).read_text())

          def replace_once(path, old, new):
              current = text(path)
              count = current.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              pending[path] = current.replace(old, new, 1)

          source = "src/hosted-auth.ts"
          test = "test/hosted-auth-github-http-client.test.ts"

          replace_once(source,
          '''const GITHUB_TOKEN_REQUEST_TIMEOUT_MS = 30_000;
          const GITHUB_IDENTITY_REQUEST_TIMEOUT_MS = 15_000;''',
          '''const GITHUB_TOKEN_PREFLIGHT_TIMEOUT_MS = 5_000;
          const GITHUB_TOKEN_REQUEST_TIMEOUT_MS = 30_000;
          const GITHUB_IDENTITY_REQUEST_TIMEOUT_MS = 15_000;''')

          replace_once(source,
          '''  | "missing_access_token";

          interface GitHubProviderFailureDetails {
            stage: GitHubProviderFailureStage;
            reason?: GitHubProviderFailureReason;
          }''',
          '''  | "missing_access_token";

          export type GitHubProviderFailureDetail =
            | "timeout_error"
            | "abort_error"
            | "subrequest_limit"
            | "request_context"
            | "connection_lost"
            | "dns_failure"
            | "tls_failure"
            | "type_error"
            | "error"
            | "non_error";

          interface GitHubProviderFailureDetails {
            stage: GitHubProviderFailureStage;
            reason?: GitHubProviderFailureReason;
            detail?: GitHubProviderFailureDetail;
          }''')

          replace_once(source,
          '''export interface GitHubOAuthClient {
            exchangeCode(input: {''',
          '''export interface GitHubOAuthClient {
            prepareExchange?(): Promise<void>;
            exchangeCode(input: {''')

          replace_once(source,
          '''    const stateCookie = parseOAuthStateCookie(getCookie(context, OAUTH_STATE_COOKIE) ?? "");
              clearOAuthStateCookie(context);

              const parsedState = stateCookie''',
          '''    const stateCookie = parseOAuthStateCookie(getCookie(context, OAUTH_STATE_COOKIE) ?? "");

              const parsedState = stateCookie''')

          replace_once(source,
          '''    ) {
                return authError(context, new AuthInputError("OAuth callback validation failed"), 400);
              }

              let consumed;''',
          '''    ) {
                clearOAuthStateCookie(context);
                return authError(context, new AuthInputError("OAuth callback validation failed"), 400);
              }

              if (normalized.githubClient.prepareExchange) {
                try {
                  await normalized.githubClient.prepareExchange();
                } catch (error) {
                  return providerBackendError(
                    context,
                    providerFailureDetails(error, "token_exchange"),
                  );
                }
              }
              clearOAuthStateCookie(context);

              let consumed;''')

          replace_once(source,
          '''  async exchangeCode(input: {
              code: string;''',
          '''  async prepareExchange(): Promise<void> {
              try {
                await this.fetchImpl("https://github.com/login/oauth/access_token", {
                  method: "GET",
                  headers: {
                    accept: "application/json",
                    "user-agent": "Stensibly",
                  },
                  cache: "no-store",
                  redirect: "manual",
                  signal: AbortSignal.timeout(GITHUB_TOKEN_PREFLIGHT_TIMEOUT_MS),
                });
              } catch (error) {
                throw providerNetworkFailure("token_exchange", error);
              }
            }

            async exchangeCode(input: {
              code: string;''')

          replace_once(source,
          '''        body: new URLSearchParams({
                    client_id: this.clientId,
                    client_secret: this.clientSecret,
                    code: input.code,
                    redirect_uri: input.redirectUri,
                    code_verifier: input.codeVerifier,
                  }),
                  signal: AbortSignal.timeout(GITHUB_TOKEN_REQUEST_TIMEOUT_MS),''',
          '''        body: new URLSearchParams({
                    client_id: this.clientId,
                    client_secret: this.clientSecret,
                    code: input.code,
                    redirect_uri: input.redirectUri,
                    code_verifier: input.codeVerifier,
                  }).toString(),
                  cache: "no-store",
                  redirect: "manual",
                  signal: AbortSignal.timeout(GITHUB_TOKEN_REQUEST_TIMEOUT_MS),''')

          replace_once(source,
          '''    } catch (error) {
                throw new ProviderFailure(
                  "token_exchange",
                  providerNetworkFailureReason(error),
                );
              }

              const payload = await response.json()''',
          '''    } catch (error) {
                throw providerNetworkFailure("token_exchange", error);
              }

              const payload = await response.json()''')

          replace_once(source,
          '''    } catch (error) {
                throw new ProviderFailure(
                  "identity_request",
                  providerNetworkFailureReason(error),
                );
              }
              if (!userResponse.ok)''',
          '''    } catch (error) {
                throw providerNetworkFailure("identity_request", error);
              }
              if (!userResponse.ok)''')

          replace_once(source,
          '''function providerNetworkFailureReason(error: unknown): GitHubProviderFailureReason {
            const name = typeof error === "object" && error !== null && "name" in error
              ? (error as { name?: unknown }).name
              : undefined;
            return name === "TimeoutError" ? "network_timeout" : "network_exception";
          }''',
          '''function providerNetworkFailure(
            stage: "token_exchange" | "identity_request",
            error: unknown,
          ): ProviderFailure {
            return new ProviderFailure(
              stage,
              providerNetworkFailureReason(error),
              providerNetworkFailureDetail(error),
            );
          }

          function providerNetworkFailureReason(error: unknown): GitHubProviderFailureReason {
            return providerErrorName(error) === "TimeoutError"
              ? "network_timeout"
              : "network_exception";
          }

          function providerNetworkFailureDetail(error: unknown): GitHubProviderFailureDetail {
            const name = providerErrorName(error);
            const message = providerErrorMessage(error).toLowerCase();
            if (name === "TimeoutError") return "timeout_error";
            if (name === "AbortError") return "abort_error";
            if (message.includes("too many subrequests")) return "subrequest_limit";
            if (message.includes("different request") || message.includes("request context")) {
              return "request_context";
            }
            if (message.includes("connection reset") || message.includes("connection lost")) {
              return "connection_lost";
            }
            if (message.includes("dns") || message.includes("resolve") || message.includes("getaddrinfo")) {
              return "dns_failure";
            }
            if (message.includes("tls") || message.includes("ssl") || message.includes("certificate")) {
              return "tls_failure";
            }
            if (name === "TypeError") return "type_error";
            if (name === "Error") return "error";
            return "non_error";
          }

          function providerErrorName(error: unknown): string | undefined {
            return typeof error === "object" && error !== null && "name" in error
              && typeof (error as { name?: unknown }).name === "string"
              ? (error as { name: string }).name
              : undefined;
          }

          function providerErrorMessage(error: unknown): string {
            return typeof error === "object" && error !== null && "message" in error
              && typeof (error as { message?: unknown }).message === "string"
              ? (error as { message: string }).message
              : "";
          }''')

          replace_once(source,
          '''  context.header(FAILURE_CATEGORY_HEADER, "request_failure");
            return context.json({
              error: "GitHub authentication failed",
              code: "provider_failure",
              stage: failure.stage,
              ...(failure.reason ? { reason: failure.reason } : {}),
            }, 502);''',
          '''  context.header(FAILURE_CATEGORY_HEADER, "request_failure");
            const colo = workerColo(context.req.raw);
            return context.json({
              error: "GitHub authentication failed",
              code: "provider_failure",
              stage: failure.stage,
              ...(failure.reason ? { reason: failure.reason } : {}),
              ...(failure.detail ? { detail: failure.detail } : {}),
              ...(colo ? { colo } : {}),
            }, 502);''')

          replace_once(source,
          '''  return error instanceof ProviderFailure
              ? { stage: error.stage, ...(error.reason ? { reason: error.reason } : {}) }
              : { stage: fallback };
          }

          class AuthInputError extends Error {}''',
          '''  return error instanceof ProviderFailure
              ? {
                stage: error.stage,
                ...(error.reason ? { reason: error.reason } : {}),
                ...(error.detail ? { detail: error.detail } : {}),
              }
              : { stage: fallback };
          }

          function workerColo(request: Request): string | undefined {
            const value = (request as Request & { cf?: { colo?: unknown } }).cf?.colo;
            return typeof value === "string" && /^[A-Z]{3}$/.test(value) ? value : undefined;
          }

          class AuthInputError extends Error {}''')

          replace_once(source,
          '''class ProviderFailure extends Error {
            readonly stage: GitHubProviderFailureStage;
            readonly reason?: GitHubProviderFailureReason;

            constructor(stage: GitHubProviderFailureStage, reason?: GitHubProviderFailureReason) {
              super("GitHub provider failure");
              Object.defineProperty(this, "name", { value: "ProviderFailure" });
              this.stage = stage;
              if (reason) Object.defineProperty(this, "reason", { value: reason });
            }
          }''',
          '''class ProviderFailure extends Error {
            readonly stage: GitHubProviderFailureStage;
            readonly reason?: GitHubProviderFailureReason;
            readonly detail?: GitHubProviderFailureDetail;

            constructor(
              stage: GitHubProviderFailureStage,
              reason?: GitHubProviderFailureReason,
              detail?: GitHubProviderFailureDetail,
            ) {
              super("GitHub provider failure");
              Object.defineProperty(this, "name", { value: "ProviderFailure" });
              this.stage = stage;
              if (reason) Object.defineProperty(this, "reason", { value: reason });
              if (detail) Object.defineProperty(this, "detail", { value: detail });
            }
          }''')

          replace_once(test,
          '''  HttpGitHubOAuthClient,
            type GitHubProviderFailureReason,''',
          '''  HttpGitHubOAuthClient,
            type GitHubProviderFailureDetail,
            type GitHubProviderFailureReason,''')

          replace_once(test,
          '''  test("separates provider timeouts from other network exceptions", async () => {''',
          '''  test("preflights the exact token endpoint without sending an authorization code", async () => {
              const requests: Array<{ input: RequestInfo | URL; init?: RequestInit }> = [];
              const client = githubClient(singleUseFetch(new Response(null, { status: 405 }), requests));

              await expect(client.prepareExchange()).resolves.toBeUndefined();
              expect(requests).toHaveLength(1);
              expect(String(requests[0]?.input)).toBe("https://github.com/login/oauth/access_token");
              expect(requests[0]?.init?.method).toBe("GET");
              expect(requests[0]?.init?.cache).toBe("no-store");
              expect(requests[0]?.init?.redirect).toBe("manual");
              expect(requests[0]?.init?.body).toBeUndefined();
            });

            test("separates provider timeouts from other network exceptions", async () => {''')

          replace_once(test,
          '''        reason: "network_timeout" as const,
                excluded: "timeout-sentinel",''',
          '''        reason: "network_timeout" as const,
                detail: "timeout_error" as const,
                excluded: "timeout-sentinel",''')

          replace_once(test,
          '''        reason: "network_exception" as const,
                excluded: "network-exception-sentinel",''',
          '''        reason: "network_exception" as const,
                detail: "type_error" as const,
                excluded: "network-exception-sentinel",''')

          replace_once(test,
          '''        testCase.reason,
              );
              expect(calls).toBe(1);''',
          '''        testCase.reason,
                testCase.detail,
              );
              expect(calls).toBe(1);''')

          replace_once(test,
          '''        testCase.reason,
              );
              expect(calls).toBe(2);''',
          '''        testCase.reason,
                testCase.detail,
              );
              expect(calls).toBe(2);''')

          replace_once(test,
          '''  reason?: GitHubProviderFailureReason,
          ): void {
            expect(error).toBeInstanceOf(Error);''',
          '''  reason?: GitHubProviderFailureReason,
            detail?: GitHubProviderFailureDetail,
          ): void {
            expect(error).toBeInstanceOf(Error);''')

          replace_once(test,
          '''    ...(reason ? { reason } : {}),
            });
            const serialized = JSON.stringify(error);
            expect(serialized).toBe(JSON.stringify({ stage, ...(reason ? { reason } : {}) }));''',
          '''    ...(reason ? { reason } : {}),
              ...(detail ? { detail } : {}),
            });
            const serialized = JSON.stringify(error);
            expect(serialized).toBe(JSON.stringify({
              stage,
              ...(reason ? { reason } : {}),
              ...(detail ? { detail } : {}),
            }));''')

          for path, value in pending.items():
              Path(path).write_text(value)
          PY

      - name: Run exact checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check

      - name: Commit hardened callback transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts
          git commit -m "Harden GitHub callback egress diagnostics"
          git push origin HEAD:main

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy

      - name: Verify bearer compatibility on both origins
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted -- --endpoint https://stensibly-api.leoli-082000.workers.dev
          bun run verify:hosted

      - name: Verify enabled OAuth contract on both origins
        run: |
          set -euo pipefail
          bun run verify:oauth -- \
            --endpoint https://stensibly-api.leoli-082000.workers.dev \
            --issuer https://api.stensibly.com \
            --expect enabled
          bun run verify:oauth -- --expect enabled

      - name: Record deployment evidence
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## W01 callback egress hardening deployed',
                '',
                `- source commit: \`${context.sha}\` plus generated hardening commit on \`main\``,
                `- workflow run: \`${context.runId}\``,
                '- exact token-endpoint preflight now runs before OAuth state consumption',
                '- callback state cookie remains available when the preflight itself fails',
                '- token POST uses an explicit serialized form body with no-store/manual transport controls',
                '- bounded failures now include a safe transport detail and Cloudflare colo',
                '- bearer compatibility and public OAuth verification passed on both origins',
                '',
                '— Bramble · operator-directed fix-forward'
              ].join('\n')
            });
