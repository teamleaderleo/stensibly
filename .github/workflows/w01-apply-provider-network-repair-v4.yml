name: Apply line-aware provider network repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/w01-apply-provider-network-repair-v4.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply line-aware repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def unique_index(lines: list[str], value: str, label: str) -> int:
              matches = [index for index, line in enumerate(lines) if line.strip() == value]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one line, found {len(matches)}")
              return matches[0]

          def next_index(lines: list[str], start: int, value: str, label: str) -> int:
              matches = [index for index in range(start + 1, len(lines)) if lines[index].strip() == value]
              if not matches:
                  raise SystemExit(f"{label}: line not found after index {start}")
              return matches[0]

          def indent_of(line: str) -> str:
              return line[: len(line) - len(line.lstrip())]

          hosted_path = Path("src/hosted-auth.ts")
          hosted = hosted_path.read_text().splitlines()

          index = unique_index(
              hosted,
              "const GITHUB_REQUEST_TIMEOUT_MS = 15_000;",
              "GitHub timeout constant",
          )
          hosted[index:index + 1] = [
              "const GITHUB_TOKEN_REQUEST_TIMEOUT_MS = 30_000;",
              "const GITHUB_IDENTITY_REQUEST_TIMEOUT_MS = 15_000;",
          ]

          index = unique_index(hosted, '| "network_failure"', "network failure reason")
          prefix = indent_of(hosted[index])
          hosted[index:index + 1] = [
              f'{prefix}| "network_timeout"',
              f'{prefix}| "network_exception"',
          ]

          token_endpoint = next(
              index for index, line in enumerate(hosted)
              if 'this.fetchImpl("https://github.com/login/oauth/access_token"' in line
          )
          token_signal = next_index(
              hosted,
              token_endpoint,
              "signal: AbortSignal.timeout(GITHUB_REQUEST_TIMEOUT_MS),",
              "token exchange timeout",
          )
          hosted[token_signal] = (
              f"{indent_of(hosted[token_signal])}"
              "signal: AbortSignal.timeout(GITHUB_TOKEN_REQUEST_TIMEOUT_MS),"
          )

          token_throw = unique_index(
              hosted,
              'throw new ProviderFailure("token_exchange", "network_failure");',
              "token exchange network catch",
          )
          if hosted[token_throw - 1].strip() != "} catch {" or hosted[token_throw + 1].strip() != "}":
              raise SystemExit("token exchange catch boundary changed")
          catch_indent = indent_of(hosted[token_throw - 1])
          body_indent = indent_of(hosted[token_throw])
          hosted[token_throw - 1:token_throw + 2] = [
              f"{catch_indent}}} catch (error) {{",
              f"{body_indent}throw new ProviderFailure(",
              f'{body_indent}  "token_exchange",',
              f"{body_indent}  providerNetworkFailureReason(error),",
              f"{body_indent});",
              f"{catch_indent}}}",
          ]

          identity_endpoint = next(
              index for index, line in enumerate(hosted)
              if 'this.fetchImpl("https://api.github.com/user"' in line
          )
          identity_signal = next_index(
              hosted,
              identity_endpoint,
              "signal: AbortSignal.timeout(GITHUB_REQUEST_TIMEOUT_MS),",
              "identity request timeout",
          )
          hosted[identity_signal] = (
              f"{indent_of(hosted[identity_signal])}"
              "signal: AbortSignal.timeout(GITHUB_IDENTITY_REQUEST_TIMEOUT_MS),"
          )

          identity_throw = unique_index(
              hosted,
              'throw new ProviderFailure("identity_request");',
              "identity request network catch",
          )
          if hosted[identity_throw - 1].strip() != "} catch {" or hosted[identity_throw + 1].strip() != "}":
              raise SystemExit("identity request catch boundary changed")
          catch_indent = indent_of(hosted[identity_throw - 1])
          body_indent = indent_of(hosted[identity_throw])
          hosted[identity_throw - 1:identity_throw + 2] = [
              f"{catch_indent}}} catch (error) {{",
              f"{body_indent}throw new ProviderFailure(",
              f'{body_indent}  "identity_request",',
              f"{body_indent}  providerNetworkFailureReason(error),",
              f"{body_indent});",
              f"{catch_indent}}}",
          ]

          reason_function = unique_index(
              hosted,
              "function tokenExchangeFailureReason(value: unknown): GitHubProviderFailureReason | null {",
              "token reason function",
          )
          hosted[reason_function:reason_function] = [
              "function providerNetworkFailureReason(error: unknown): GitHubProviderFailureReason {",
              '  const name = typeof error === "object" && error !== null && "name" in error',
              "    ? (error as { name?: unknown }).name",
              "    : undefined;",
              '  return name === "TimeoutError" ? "network_timeout" : "network_exception";',
              "}",
              "",
          ]
          hosted_path.write_text("\n".join(hosted) + "\n")

          test_path = Path("test/hosted-auth-github-http-client.test.ts")
          tests = test_path.read_text().splitlines()
          start = unique_index(
              tests,
              'test("classifies network failures at the active provider phase", async () => {',
              "network test start",
          )
          end = unique_index(
              tests,
              'test("requires an explicit X-OAuth-Scopes header", async () => {',
              "next network test",
          )
          replacement = '''  test("separates provider timeouts from other network exceptions", async () => {
            const cases = [
              {
                error: Object.assign(new Error("timeout-sentinel"), { name: "TimeoutError" }),
                reason: "network_timeout" as const,
                excluded: "timeout-sentinel",
              },
              {
                error: new TypeError("network-exception-sentinel"),
                reason: "network_exception" as const,
                excluded: "network-exception-sentinel",
              },
            ];

            for (const testCase of cases) {
              let calls = 0;
              const throwingFetch = (async () => {
                calls += 1;
                throw testCase.error;
              }) as unknown as typeof fetch;

              const exchangeClient = githubClient(throwingFetch);
              expectFailure(
                await captureFailure(exchangeClient.exchangeCode(EXCHANGE_INPUT)),
                "token_exchange",
                [testCase.excluded, EXCHANGE_INPUT.code],
                testCase.reason,
              );
              expect(calls).toBe(1);

              const identityClient = githubClient(throwingFetch);
              expectFailure(
                await captureFailure(identityClient.readIdentity(TOKEN)),
                "identity_request",
                [testCase.excluded, TOKEN],
                testCase.reason,
              );
              expect(calls).toBe(2);
            }
          });
'''.splitlines()
          tests[start:end] = replacement + [""]
          test_path.write_text("\n".join(tests) + "\n")
          PY

          rm .github/workflows/w01-apply-provider-network-repair-v4.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repair
        run: |
          bun test test/hosted-auth-github-http-client.test.ts
          bun run typecheck
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts .github/workflows/w01-apply-provider-network-repair-v4.yml
          git commit -m "Split GitHub provider network failures"
          git push origin HEAD:${{ github.head_ref }}
