name: Bootstrap provider network repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/w01-bootstrap-provider-network-repair.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract and apply exact repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/w01-apply-provider-network-repair.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          bad = "'''  | \"network_failure\"\n  | \"provider_rejection\";'''"
          good = "'''  | \"network_failure\"'''"
          if script.count(bad) != 1:
              raise SystemExit(f'expected one stale enum guard, found {script.count(bad)}')
          script = script.replace(bad, good, 1)
          exec(compile(script, 'provider-network-repair.py', 'exec'))
          PY

          rm .github/workflows/w01-apply-provider-network-repair.yml
          rm .github/workflows/w01-bootstrap-provider-network-repair.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repair
        run: |
          bun test test/hosted-auth-github-http-client.test.ts test/worker-observability.test.ts
          bun run typecheck
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hosted-auth.ts src/worker-observability.ts test/hosted-auth-github-http-client.test.ts test/worker-observability.test.ts .github/workflows/w01-apply-provider-network-repair.yml .github/workflows/w01-bootstrap-provider-network-repair.yml
          git commit -m "Split GitHub provider network failures"
          git push origin HEAD:${{ github.head_ref }}
