name: W01 Deploy Callback Egress Hardening

on:
  push:
    branches:
      - main
    paths:
      - src/hosted-auth.ts
      - test/hosted-auth-github-preflight.test.ts

permissions:
  contents: read
  issues: write

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, deploy, and verify callback egress hardening
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run exact production checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy
      - name: Verify bearer compatibility on both origins
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted -- --endpoint https://stensibly-api.leoli-082000.workers.dev
          bun run verify:hosted
      - name: Verify enabled OAuth contract on both origins
        run: |
          set -euo pipefail
          bun run verify:oauth -- \
            --endpoint https://stensibly-api.leoli-082000.workers.dev \
            --issuer https://api.stensibly.com \
            --expect enabled
          bun run verify:oauth -- --expect enabled
      - name: Record deployment evidence
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## W01 callback egress hardening deployed',
                '',
                `- source commit: \`${context.sha}\``,
                `- workflow run: \`${context.runId}\``,
                '- exact token-endpoint preflight now runs before OAuth state consumption',
                '- callback state remains retryable when preflight fails',
                '- token POST uses an explicit serialized form body with no-store/manual controls',
                '- bounded failures include a safe transport detail and Cloudflare colo',
                '- bearer compatibility and public OAuth verification passed on both origins',
                '',
                '— Bramble · operator-directed fix-forward'
              ].join('\n')
            });
