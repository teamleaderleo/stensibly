name: W01 promote verified dashboard thread stage once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  group: stensibly-dashboard-production
  cancel-in-progress: false

env:
  REQUIRED_SITE_SOURCE: 02e19ee886bcb76a39462eb2e21a37b32bead51c
  STAGED_ORIGIN: https://stensibly-11mfzhs6c-leo-lis-projects.vercel.app
  VERCEL_CLI_VERSION: 56.5.0
  DASHBOARD_URL: https://www.stensibly.com

jobs:
  promote-dashboard-thread:
    name: Reverify, promote, and verify attributable thread
    if: >-
      github.event.pull_request.number == 441 &&
      github.event.pull_request.head.ref == 'lantern/409-deploy-dashboard-thread' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://www.stensibly.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Validate exact site tree, retained stage, and protected inputs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "This one-time promotion generation cannot be rerun" >&2
            exit 1
          fi
          required_site_tree="$(git rev-parse "$REQUIRED_SITE_SOURCE:site")"
          current_site_tree="$(git rev-parse "$GITHUB_SHA:site")"
          if [[ "$current_site_tree" != "$required_site_tree" ]]; then
            echo "Dashboard site tree differs from the accepted activity-thread revision" >&2
            exit 1
          fi
          safe_stage="$(
            bun src/dashboard-deployment-diagnostics.ts \
              --safe-vercel-origin "$STAGED_ORIGIN"
          )"
          test "$safe_stage" = "$STAGED_ORIGIN"
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected production input: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run exact source and verifier gate
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
          bun run verify:dashboard -- --html-file site/index.html --github-annotation
          test ! -e .vercel

      - name: Pull and validate existing Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"
          jq --exit-status \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$VERCEL_ORG_ID" \
            '.projectId == $project and .orgId == $org' \
            .vercel/project.json > /dev/null

      - name: Reverify retained stage with propagation retries
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          verify_stage_once() {
            local attempt="$1"
            local work="/tmp/stage-check-${attempt}"
            rm -rf "$work"
            mkdir -p "$work"

            npx --yes vercel@${VERCEL_CLI_VERSION} curl / \
              --deployment "$STAGED_ORIGIN" \
              --fail --silent --show-error \
              > "$work/index.html" || return 1
            bun run verify:dashboard -- --html-file "$work/index.html" || return 1

            bun src/dashboard-assets.ts > "$work/assets.json"
            jq --exit-status '
              type == "array"
              and length > 0
              and ([.[].path] | length == (unique | length))
              and all(.[];
                (.path | type == "string")
                and (.path | test("^/[A-Za-z0-9._/-]+$"))
                and (.kind == "css" or .kind == "javascript" or .kind == "svg")
                and (.contentTypes | type == "array")
                and (.contentTypes | length > 0)
                and all(.contentTypes[]; type == "string" and test("^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$"))
                and (.marker | type == "string")
                and (.marker | length > 0)
                and (.marker | test("[\\t\\r\\n]") | not)
              )
            ' "$work/assets.json" > /dev/null || return 1

            while IFS=$'\t' read -r asset kind allowed_content_types marker; do
              output="$work/$(printf '%s' "$asset" | tr '/.' '__')"
              content_type="$(
                npx --yes vercel@${VERCEL_CLI_VERSION} curl "$asset" \
                  --deployment "$STAGED_ORIGIN" \
                  --fail --silent --show-error \
                  --output "$output" \
                  --write-out '%{content_type}\n'
              )" || return 1
              content_type="$(printf '%s\n' "$content_type" | tr -d '\r' | tail -n 1 | cut -c1-160)"
              media_type="${content_type%%;*}"
              media_type="$(printf '%s' "$media_type" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              printf '%s\n' "$allowed_content_types" \
                | tr ',' '\n' \
                | grep --fixed-strings --ignore-case --line-regexp --quiet -- "$media_type" \
                || return 1
              test -s "$output" || return 1
              grep --fixed-strings --quiet -- "$marker" "$output" || return 1
              if grep --extended-regexp --quiet 'stn\.tok_[A-Za-z0-9._-]+' "$output"; then
                return 1
              fi
            done < <(jq -r '.[] | [.path, .kind, (.contentTypes | join(",")), .marker] | @tsv' "$work/assets.json")

            cp "$work/assets.json" evidence/verified-assets.json
            return 0
          }

          for attempt in 1 2 3; do
            if verify_stage_once "$attempt"; then
              jq -n \
                --arg stagedOrigin "$STAGED_ORIGIN" \
                --argjson attempt "$attempt" \
                --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{staged_origin: $stagedOrigin, verification_attempt: $attempt, verified_at: $verifiedAt, contains_secret_values: false}' \
                > evidence/stage-verification.json
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 10)); fi
          done
          echo "Retained staged dashboard failed verification after three attempts" >&2
          exit 1

      - name: Promote the verified retained stage
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} promote \
            "$STAGED_ORIGIN" \
            --yes \
            --timeout=5m \
            --token="$VERCEL_TOKEN"

      - name: Verify production dashboard with propagation retries
        id: production_verify
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            args=(--url "$DASHBOARD_URL")
            if [[ "$attempt" -eq 5 ]]; then args+=(--github-annotation); fi
            if bun run verify:dashboard -- "${args[@]}"; then
              jq -n \
                --arg productionOrigin "$DASHBOARD_URL" \
                --argjson attempt "$attempt" \
                --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{production_origin: $productionOrigin, verification_attempt: $attempt, verified_at: $verifiedAt, contains_secret_values: false}' \
                > evidence/production-verification.json
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep $((attempt * 10)); fi
          done
          exit 1

      - name: Record bounded promotion result
        if: always()
        env:
          EXECUTION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n \
            --arg format "stensibly-dashboard-thread-promotion/v1" \
            --arg status "$EXECUTION_STATUS" \
            --arg source "$REQUIRED_SITE_SOURCE" \
            --arg staged "$STAGED_ORIGIN" \
            --arg production "$DASHBOARD_URL" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{format: $format, status: $status, source_sha: $source, staged_origin: $staged, production_origin: $production, completed_at: $completedAt, contains_secret_values: false}' \
            > evidence/result.json

      - name: Post bounded promotion result to issue 403
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/comment.md <<EOF
          ## Attributable dashboard thread promotion

          - Execution PR: #441
          - Workflow run: \`${GITHUB_RUN_ID}\` — \`${EXECUTION_STATUS}\`
          - Run URL: ${RUN_URL}
          - Accepted site source: \`${REQUIRED_SITE_SOURCE}\`
          - Retained staged deployment: ${STAGED_ORIGIN}
          - Production origin: ${DASHBOARD_URL}

          A successful result means the retained stage was reverified, promoted, and the production domain passed the current HTML and canonical-asset contract.

          — Lantern · Foundry
            Intention: make attributable bounded activity visible in the live dogfood dashboard
          EOF
          gh issue comment 403 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Upload bounded promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-dashboard-thread-promotion
          path: evidence
          if-no-files-found: warn
          retention-days: 3
