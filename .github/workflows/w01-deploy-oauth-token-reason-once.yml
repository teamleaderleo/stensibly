name: W01 deploy OAuth token reason diagnostic once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

env:
  SOURCE_BLOB: cb366beaaf3b6735eb1db1f277b86936d24aadaa
  HTTP_TEST_BLOB: dc32acfc2494e9bb5b14ab0ab8fce18aacf24741
  CALLBACK_TEST_BLOB: c9356b41a8f1eac5f9d2dd299789ffec3cb35b1b
  CANONICAL_ORIGIN: https://api.stensibly.com
  WORKER_ORIGIN: https://stensibly-api.leoli-082000.workers.dev

jobs:
  deploy-diagnostic:
    name: Deploy and verify bounded token-exchange reasons
    if: >-
      github.event.pull_request.number == 435 &&
      github.event.pull_request.head.ref == 'nightjar/429-deploy-token-reason-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Validate one-time source and protected inputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_READ_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "This one-time production generation cannot be rerun" >&2
            exit 1
          fi

          test "$(git hash-object src/hosted-auth.ts)" = "$SOURCE_BLOB" || {
            echo "Hosted auth source does not match the reviewed diagnostic" >&2
            exit 1
          }
          test "$(git hash-object test/hosted-auth-github-http-client.test.ts)" = "$HTTP_TEST_BLOB" || {
            echo "GitHub HTTP-client tests do not match the reviewed diagnostic" >&2
            exit 1
          }
          test "$(git hash-object test/hosted-auth.test.ts)" = "$CALLBACK_TEST_BLOB" || {
            echo "Hosted callback tests do not match the reviewed diagnostic" >&2
            exit 1
          }

          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STENSIBLY_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required protected input: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run exact source gate
        run: |
          set -euo pipefail
          bun run typecheck
          bun test
          bun run test:convex
          bun run worker:check

      - name: Capture pre-deployment recovery point
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          bunx wrangler deployments list --name stensibly-api --json > /tmp/deployments.json
          jq -e 'sort_by(.created_on) | last | (.versions | length) == 1 and .versions[0].percentage == 100' /tmp/deployments.json >/dev/null
          jq -r 'sort_by(.created_on) | last | .versions[0].version_id' /tmp/deployments.json > evidence/pre-version.txt
          jq 'sort_by(.created_on) | last | {deployment_id: .id, version_id: .versions[0].version_id, percentage: .versions[0].percentage, created_on: .created_on}' /tmp/deployments.json > evidence/pre-deployment.json

      - name: Verify current enabled baseline
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted | tee evidence/pre-bearer-canonical.txt
          bun run verify:hosted -- --endpoint "$WORKER_ORIGIN" | tee evidence/pre-bearer-worker.txt
          bun run verify:oauth -- --expect enabled | tee evidence/pre-oauth-canonical.txt
          bun run verify:oauth -- --endpoint "$WORKER_ORIGIN" --issuer "$CANONICAL_ORIGIN" --expect enabled | tee evidence/pre-oauth-worker.txt

      - name: Deploy accepted diagnostic to the dogfood Worker
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy

      - name: Verify deployed bearer and enabled OAuth state
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          verify_with_retry() {
            local label="$1"
            shift
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep 10
              fi
            done
            echo "$label failed after propagation retries" >&2
            return 1
          }

          verify_with_retry bearer-canonical bun run verify:hosted | tee evidence/post-bearer-canonical.txt
          verify_with_retry bearer-worker bun run verify:hosted -- --endpoint "$WORKER_ORIGIN" | tee evidence/post-bearer-worker.txt
          verify_with_retry oauth-canonical bun run verify:oauth -- --expect enabled | tee evidence/post-oauth-canonical.txt
          verify_with_retry oauth-worker bun run verify:oauth -- --endpoint "$WORKER_ORIGIN" --issuer "$CANONICAL_ORIGIN" --expect enabled | tee evidence/post-oauth-worker.txt

      - name: Record deployed revision
        if: success()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bunx wrangler deployments list --name stensibly-api --json > /tmp/post-deployments.json
          jq 'sort_by(.created_on) | last | {deployment_id: .id, version_id: .versions[0].version_id, percentage: .versions[0].percentage, created_on: .created_on}' /tmp/post-deployments.json > evidence/post-deployment.json
          jq -n \
            --arg version "w01-oauth-token-reason-deploy/v2" \
            --arg sourceSha "$DEPLOY_SHA" \
            --arg sourceBlob "$SOURCE_BLOB" \
            --arg httpTestBlob "$HTTP_TEST_BLOB" \
            --arg callbackTestBlob "$CALLBACK_TEST_BLOB" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, status: "deployed_verified", source_sha: $sourceSha, reviewed_blobs: {hosted_auth: $sourceBlob, http_client_test: $httpTestBlob, callback_test: $callbackTestBlob}, completed_at: $completedAt, oauth_state: "enabled", bearer_verified: true, contains_secret_values: false}' \
            > evidence/result.json

      - name: Restore exact pre-deployment Worker after failed verification
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          pre_version="$(cat evidence/pre-version.txt)"
          bunx wrangler rollback "$pre_version" --name stensibly-api --message "Restore pre-token-reason Worker after failed W01 verification"
          bun run verify:hosted | tee evidence/restored-bearer-canonical.txt
          bun run verify:hosted -- --endpoint "$WORKER_ORIGIN" | tee evidence/restored-bearer-worker.txt
          bun run verify:oauth -- --expect enabled | tee evidence/restored-oauth-canonical.txt
          bun run verify:oauth -- --endpoint "$WORKER_ORIGIN" --issuer "$CANONICAL_ORIGIN" --expect enabled | tee evidence/restored-oauth-worker.txt

      - name: Post bounded execution result to issue 402
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          deployment="unavailable"
          version="unavailable"
          if [[ -f evidence/post-deployment.json ]]; then
            deployment="$(jq -r '.deployment_id // "unavailable"' evidence/post-deployment.json)"
            version="$(jq -r '.version_id // "unavailable"' evidence/post-deployment.json)"
          fi
          cat > /tmp/comment.md <<EOF
          ## OAuth token-reason diagnostic execution

          - Execution PR: #435
          - Workflow run: \`${GITHUB_RUN_ID}\` — \`${EXECUTION_STATUS}\`
          - Run URL: ${RUN_URL}
          - Reviewed hosted-auth blob: \`${SOURCE_BLOB}\`
          - Active deployment recorded: \`${deployment}\`
          - Active version recorded: \`${version}\`

          A successful result means bearer compatibility and the 5/5 enabled OAuth contract passed on both fixed origins. Retry GitHub sign-in and retain only the bounded \`stage\` and \`reason\` if it fails.

          — Lantern · Foundry
            Intention: deploy the bounded token reason and continue from the real login failure
          EOF
          gh issue comment 402 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Upload bounded deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-oauth-token-reason-deploy
          path: evidence
          if-no-files-found: warn
          retention-days: 3
