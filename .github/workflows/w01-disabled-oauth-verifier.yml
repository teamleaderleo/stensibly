name: W01 disabled OAuth verifier evidence

on:
  pull_request:
    paths:
      - ".github/workflows/w01-disabled-oauth-verifier.yml"

permissions:
  contents: read

jobs:
  verify-disabled-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical and fallback disabled-state checks
        shell: bash
        run: |
          set +e
          bun run verify:oauth -- --expect disabled > canonical.txt 2>&1
          canonical_status=$?
          bun run verify:oauth -- \
            --endpoint https://stensibly-api.leoli-082000.workers.dev \
            --issuer https://api.stensibly.com \
            --expect disabled > fallback.txt 2>&1
          fallback_status=$?

          {
            echo "=== canonical endpoint ==="
            cat canonical.txt
            echo "canonical_exit=$canonical_status"
            echo
            echo "=== Worker fallback ==="
            cat fallback.txt
            echo "fallback_exit=$fallback_status"
          } > oauth-verifier-output.txt

          cat oauth-verifier-output.txt
          if [ "$canonical_status" -ne 0 ] || [ "$fallback_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload fixed verifier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-disabled-oauth-verifier-output
          path: oauth-verifier-output.txt
          if-no-files-found: error
          retention-days: 7
