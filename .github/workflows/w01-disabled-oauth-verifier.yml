name: W01 disabled OAuth verifier evidence

on:
  pull_request:
    paths:
      - ".github/workflows/w01-disabled-oauth-verifier.yml"

permissions:
  contents: read

jobs:
  verify-disabled-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify canonical endpoint is disabled
        run: bun run verify:oauth -- --expect disabled

      - name: Verify Worker fallback is disabled
        run: >-
          bun run verify:oauth --
          --endpoint https://stensibly-api.leoli-082000.workers.dev
          --issuer https://api.stensibly.com
          --expect disabled
