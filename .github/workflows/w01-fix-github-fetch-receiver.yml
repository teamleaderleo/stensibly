name: W01 Fix GitHub Fetch Receiver

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor == 'teamleaderleo' &&
      github.event.issue.number == 286 &&
      github.event.comment.body == '/bramble-fix-github-fetch-receiver'
    name: Apply and verify GitHub fetch receiver fix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bramble/github-fetch-receiver-fix
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply exact fix
        run: python3 .github/scripts/w01_fix_github_fetch_receiver.py
      - name: Run exact checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
      - name: Commit verified fix
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-preflight.test.ts
          git commit -m "Preserve Worker fetch invocation context"
          git push origin HEAD:bramble/github-fetch-receiver-fix
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record verified candidate
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## GitHub fetch receiver fix verified',
                '',
                `- exact candidate: \`${{ steps.commit.outputs.sha }}\``,
                `- workflow run: \`${context.runId}\``,
                '- native Worker fetch is invoked through a stable wrapper instead of as a client method',
                '- receiver-sensitive regression test passed',
                '- typecheck, Bun tests, Convex tests, and Worker bundle passed',
                '',
                '— Bramble · W01 fix-forward'
              ].join('\n')
            });

  deploy:
    if: >-
      github.actor == 'teamleaderleo' &&
      github.event.issue.number == 286 &&
      github.event.comment.body == '/bramble-deploy-github-fetch-receiver'
    name: Deploy and verify GitHub fetch receiver fix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate production candidate
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy
      - name: Verify bearer compatibility on both origins
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted -- --endpoint https://stensibly-api.leoli-082000.workers.dev
          bun run verify:hosted
      - name: Verify enabled OAuth contract on both origins
        run: |
          set -euo pipefail
          bun run verify:oauth -- --endpoint https://stensibly-api.leoli-082000.workers.dev --issuer https://api.stensibly.com --expect enabled
          bun run verify:oauth -- --expect enabled
      - name: Record deployment evidence
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## GitHub fetch receiver fix deployed',
                '',
                `- source commit: \`${context.sha}\``,
                `- workflow run: \`${context.runId}\``,
                '- bearer compatibility passed on both origins',
                '- enabled OAuth contract passed on both origins',
                '',
                '— Bramble · W01 fix-forward deployment'
              ].join('\n')
            });
