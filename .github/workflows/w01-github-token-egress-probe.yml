name: W01 GitHub Token Egress Probe

on:
  push:
    branches:
      - main
    paths:
      - src/cloudflare-worker.ts
      - .github/workflows/w01-github-token-egress-probe.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  deploy-probe-cleanup:
    name: Deploy, probe, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://api.stensibly.com/health
    env:
      DIAGNOSTIC_CAPABILITY: -YnH9yW8pN4yfuUKDSwjY1PvtG257gveyMeKKuNE0Y8
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run exact production checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check

      - name: Detect probe or cleanup mode
        id: mode
        shell: bash
        run: |
          if grep -q 'W01_GITHUB_TOKEN_EGRESS_CAPABILITY' src/cloudflare-worker.ts; then
            echo 'probe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'probe=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate protected deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_READ_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STENSIBLY_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy

      - name: Verify bearer compatibility on both origins
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted -- --endpoint https://stensibly-api.leoli-082000.workers.dev
          bun run verify:hosted

      - name: Verify enabled OAuth contract on both origins
        run: |
          set -euo pipefail
          bun run verify:oauth -- \
            --endpoint https://stensibly-api.leoli-082000.workers.dev \
            --issuer https://api.stensibly.com \
            --expect enabled
          bun run verify:oauth -- --expect enabled

      - name: Run bounded token egress probe
        id: probe
        if: steps.mode.outputs.probe == 'true'
        shell: bash
        run: |
          set -euo pipefail
          probe_origin() {
            local origin="$1"
            local output="$2"
            local status
            status=$(curl -sS --max-time 45 -o "$output" -w '%{http_code}' \
              -X POST \
              -H "x-stensibly-diagnostic: $DIAGNOSTIC_CAPABILITY" \
              "$origin/__w01/github-token-egress" || true)
            if ! jq -e . "$output" >/dev/null 2>&1; then
              printf '%s\n' '{"ok":false,"stage":"probe_http","reason":"invalid_response"}' > "$output"
            fi
            jq -c --arg status "${status:-000}" '. + {http_status:$status}' "$output" > "$output.next"
            mv "$output.next" "$output"
          }

          probe_origin https://api.stensibly.com canonical.json
          probe_origin https://stensibly-api.leoli-082000.workers.dev fallback.json

          canonical=$(cat canonical.json)
          fallback=$(cat fallback.json)
          {
            echo 'canonical<<EOF'
            echo "$canonical"
            echo 'EOF'
            echo 'fallback<<EOF'
            echo "$fallback"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if jq -e '.ok == true' canonical.json >/dev/null \
            && jq -e '.ok == true' fallback.json >/dev/null; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Record bounded probe evidence
        if: always() && steps.mode.outputs.probe == 'true'
        uses: actions/github-script@v8
        env:
          CANONICAL_RESULT: ${{ steps.probe.outputs.canonical }}
          FALLBACK_RESULT: ${{ steps.probe.outputs.fallback }}
        with:
          script: |
            const canonical = process.env.CANONICAL_RESULT || '{"ok":false,"stage":"workflow","reason":"probe_not_run"}';
            const fallback = process.env.FALLBACK_RESULT || '{"ok":false,"stage":"workflow","reason":"probe_not_run"}';
            const evidence = [
              '<!-- w01-token-egress-result:start -->',
              '## Latest bounded GitHub token egress result',
              '',
              `- source commit: \`${context.sha}\``,
              `- workflow run: \`${context.runId}\``,
              `- canonical: \`${canonical}\``,
              `- Worker fallback: \`${fallback}\``,
              '- request used the configured GitHub client credentials with a deliberately invalid authorization code; no credential, provider body, or token was retained',
              '<!-- w01-token-egress-result:end -->'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## W01 GitHub token egress probe',
                '',
                `- source commit: \`${context.sha}\``,
                `- workflow run: \`${context.runId}\``,
                `- canonical: \`${canonical}\``,
                `- Worker fallback: \`${fallback}\``,
                '- request used the configured GitHub client credentials with a deliberately invalid authorization code; no credential, provider body, or token was retained',
                '',
                '— Bramble · bounded provider diagnosis'
              ].join('\n')
            });
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286
            });
            const current = issue.data.body || '';
            const withoutPrior = current.replace(
              /\n?<!-- w01-token-egress-result:start -->[\s\S]*?<!-- w01-token-egress-result:end -->\n?/g,
              '\n'
            ).trimEnd();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: `${withoutPrior}\n\n${evidence}\n`
            });

      - name: Record probe cleanup deployment
        if: success() && steps.mode.outputs.probe == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## W01 GitHub token egress probe removed',
                '',
                `- cleanup source commit: \`${context.sha}\``,
                `- workflow run: \`${context.runId}\``,
                '- temporary diagnostic route removed',
                '- bearer compatibility and public OAuth verification passed on both origins after cleanup deployment',
                '',
                '— Bramble · bounded provider diagnosis cleanup'
              ].join('\n')
            });

      - name: Fail on unhealthy token egress
        if: steps.mode.outputs.probe == 'true' && steps.probe.outputs.ok != 'true'
        run: exit 1
