name: W01 manual OAuth rollout

on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: Exact fresh Tier 3 approval reference (issue-N-comment-N)
        required: true
        type: string
      rollout_generation:
        description: Unique bounded rollout generation (w01-...)
        required: true
        type: string
      confirm_rollout:
        description: Confirm this dispatch may perform the approved production rollout
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: w01-oauth-rollout
  cancel-in-progress: false

env:
  ROLLOUT_SOURCE_SHA: 5ee0852904dad614d46edbd10453e96e04ba409f
  CANONICAL_ORIGIN: https://api.stensibly.com
  WORKER_ORIGIN: https://stensibly-api.leoli-082000.workers.dev
  AUTH_RETURN_ORIGINS: https://www.stensibly.com
  AUTH_ALLOWED_GITHUB_SUBJECTS: "13091533"
  AUTH_BOOTSTRAP_ROLE: owner
  OAUTH_ACCESS_TOKEN_SECONDS: "600"
  OAUTH_AUTHORIZATION_CODE_SECONDS: "300"
  OAUTH_REFRESH_TOKEN_SECONDS: "2592000"
  APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
  ROLLOUT_GENERATION: ${{ inputs.rollout_generation }}

jobs:
  rollout:
    if: ${{ inputs.confirm_rollout == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.ROLLOUT_SOURCE_SHA }}
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check manual rollout prerequisites
        id: readiness
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_READ_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          # GitHub forbids creating secrets.GITHUB_OAUTH_CLIENT_ID.
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.STENSIBLY_GITHUB_OAUTH_CLIENT_ID }}
          # GitHub forbids creating secrets.GITHUB_OAUTH_CLIENT_SECRET.
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.STENSIBLY_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            STENSIBLY_READ_TOKEN \
            CONVEX_DEPLOY_KEY \
            GITHUB_OAUTH_CLIENT_ID \
            GITHUB_OAUTH_CLIENT_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ -n "${CONVEX_DEPLOY_KEY:-}" && "$CONVEX_DEPLOY_KEY" != prod:* ]]; then
            missing+=("CONVEX_DEPLOY_KEY_PRODUCTION_SCOPE")
          fi
          if [[ ! -f src/verify-oauth-abuse.ts ]] \
            || ! grep -q '"verify:oauth-abuse"' package.json; then
            missing+=("MERGED_GUARDED_ABUSE_HARNESS")
          fi
          if [[ ! "$APPROVAL_REFERENCE" =~ ^issue-[0-9]+-comment-[0-9]+$ ]]; then
            missing+=("INVALID_APPROVAL_REFERENCE")
          fi
          if [[ ! "$ROLLOUT_GENERATION" =~ ^w01-[A-Za-z0-9._-]{1,64}$ ]]; then
            missing+=("INVALID_ROLLOUT_GENERATION")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## W01 OAuth rollout waiting"
              echo
              echo "Missing or invalid prerequisites:"
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
              done
              echo
              echo "Dispatch again only with a fresh approval and corrected prerequisites."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Classify current public auth state
        if: steps.readiness.outputs.ready == 'true'
        id: state
        run: |
          set -euo pipefail

          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
            done
            return 1
          }

          if retry bun run verify:oauth \
            && retry bun run verify:oauth -- \
              --endpoint "$WORKER_ORIGIN" \
              --issuer "$CANONICAL_ORIGIN"; then
            echo "auth_state=enabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if retry bun run verify:oauth -- --expect disabled \
            && retry bun run verify:oauth -- \
              --endpoint "$WORKER_ORIGIN" \
              --issuer "$CANONICAL_ORIGIN" \
              --expect disabled; then
            echo "auth_state=disabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          inspect_surface() {
            local origin="$1"
            local body
            for attempt in 1 2 3; do
              if body="$(curl --fail --silent --show-error --max-time 10 "$origin/health")" \
                && jq -e '
                  .ok == true
                  and .service == "stensibly"
                  and (.surfaces | type == "array")
                ' >/dev/null <<< "$body"; then
                if jq -e '.surfaces | index("oauth") != null' >/dev/null <<< "$body"; then
                  printf '%s' oauth
                else
                  printf '%s' no_oauth
                fi
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
            done
            return 1
          }

          canonical_surface="$(inspect_surface "$CANONICAL_ORIGIN")" || {
            echo "Could not inspect the canonical Stensibly health surface" >&2
            exit 1
          }
          worker_surface="$(inspect_surface "$WORKER_ORIGIN")" || {
            echo "Could not inspect the Worker Stensibly health surface" >&2
            exit 1
          }

          if [[ "$canonical_surface" == oauth || "$worker_surface" == oauth ]]; then
            echo "auth_state=ambiguous_oauth" >> "$GITHUB_OUTPUT"
          else
            echo "auth_state=needs_hosted_auth" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop on ambiguous existing OAuth state
        if: steps.state.outputs.auth_state == 'ambiguous_oauth'
        run: |
          {
            echo "## W01 OAuth rollout held"
            echo
            echo "OAuth is advertised but enabled verification did not pass on both origins."
            echo "No binding deletion, deployment, or signing-secret rotation was attempted."
            echo "A separate fresh Tier 3 recovery decision is required."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Run exact candidate checks
        if: >-
          steps.readiness.outputs.ready == 'true'
          && (steps.state.outputs.auth_state == 'disabled'
          || steps.state.outputs.auth_state == 'needs_hosted_auth')
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check

      - name: Deploy current Convex functions
        if: >-
          steps.readiness.outputs.ready == 'true'
          && (steps.state.outputs.auth_state == 'disabled'
          || steps.state.outputs.auth_state == 'needs_hosted_auth')
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy

      - name: Configure hosted GitHub auth and prove disabled state
        if: steps.state.outputs.auth_state == 'needs_hosted_auth'
        id: phase1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.STENSIBLY_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.STENSIBLY_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg clientId "$GITHUB_OAUTH_CLIENT_ID" \
            --arg clientSecret "$GITHUB_OAUTH_CLIENT_SECRET" \
            --arg authOrigin "$CANONICAL_ORIGIN" \
            --arg returnOrigins "$AUTH_RETURN_ORIGINS" \
            --arg subjects "$AUTH_ALLOWED_GITHUB_SUBJECTS" \
            --arg role "$AUTH_BOOTSTRAP_ROLE" \
            '{
              GITHUB_OAUTH_CLIENT_ID: $clientId,
              GITHUB_OAUTH_CLIENT_SECRET: $clientSecret,
              STENSIBLY_AUTH_ORIGIN: $authOrigin,
              STENSIBLY_AUTH_RETURN_ORIGINS: $returnOrigins,
              STENSIBLY_AUTH_ALLOWED_GITHUB_SUBJECTS: $subjects,
              STENSIBLY_AUTH_BOOTSTRAP_ROLE: $role
            }' > "$secrets_file"

          bunx wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"
          trap - EXIT

          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
            done
            return 1
          }

          retry bun run verify:hosted
          retry bun run verify:hosted -- --endpoint "$WORKER_ORIGIN"
          retry bun run verify:oauth -- --expect disabled
          retry bun run verify:oauth -- \
            --endpoint "$WORKER_ORIGIN" \
            --issuer "$CANONICAL_ORIGIN" \
            --expect disabled

      - name: Enable MCP OAuth atomically
        if: >-
          steps.state.outputs.auth_state == 'disabled'
          || steps.phase1.outcome == 'success'
        id: enable
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.STENSIBLY_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.STENSIBLY_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          signing_secret="$(openssl rand -hex 32)"
          trap 'rm -f "$secrets_file"; unset signing_secret' EXIT
          jq -n \
            --arg clientId "$GITHUB_OAUTH_CLIENT_ID" \
            --arg clientSecret "$GITHUB_OAUTH_CLIENT_SECRET" \
            --arg authOrigin "$CANONICAL_ORIGIN" \
            --arg returnOrigins "$AUTH_RETURN_ORIGINS" \
            --arg subjects "$AUTH_ALLOWED_GITHUB_SUBJECTS" \
            --arg role "$AUTH_BOOTSTRAP_ROLE" \
            --arg signingSecret "$signing_secret" \
            --arg accessSeconds "$OAUTH_ACCESS_TOKEN_SECONDS" \
            --arg codeSeconds "$OAUTH_AUTHORIZATION_CODE_SECONDS" \
            --arg refreshSeconds "$OAUTH_REFRESH_TOKEN_SECONDS" \
            '{
              GITHUB_OAUTH_CLIENT_ID: $clientId,
              GITHUB_OAUTH_CLIENT_SECRET: $clientSecret,
              STENSIBLY_AUTH_ORIGIN: $authOrigin,
              STENSIBLY_AUTH_RETURN_ORIGINS: $returnOrigins,
              STENSIBLY_AUTH_ALLOWED_GITHUB_SUBJECTS: $subjects,
              STENSIBLY_AUTH_BOOTSTRAP_ROLE: $role,
              STENSIBLY_OAUTH_SIGNING_SECRET: $signingSecret,
              STENSIBLY_OAUTH_ACCESS_TOKEN_SECONDS: $accessSeconds,
              STENSIBLY_OAUTH_AUTHORIZATION_CODE_SECONDS: $codeSeconds,
              STENSIBLY_OAUTH_REFRESH_TOKEN_SECONDS: $refreshSeconds
            }' > "$secrets_file"

          bunx wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"
          unset signing_secret
          trap - EXIT

      - name: Verify bearer compatibility and enabled OAuth
        if: >-
          steps.state.outputs.auth_state == 'enabled'
          || steps.enable.outcome == 'success'
        id: verify_enabled
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
            done
            return 1
          }

          retry bun run verify:hosted
          retry bun run verify:hosted -- --endpoint "$WORKER_ORIGIN"
          retry bun run verify:oauth
          retry bun run verify:oauth -- \
            --endpoint "$WORKER_ORIGIN" \
            --issuer "$CANONICAL_ORIGIN"

      - name: Roll back OAuth bindings after a failed current enable attempt
        if: >-
          failure()
          && steps.state.outputs.auth_state != 'enabled'
          && steps.enable.outcome != 'skipped'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          rollback_file="$(mktemp)"
          trap 'rm -f "$rollback_file"' EXIT
          cat > "$rollback_file" <<'JSON'
          {
            "STENSIBLY_OAUTH_SIGNING_SECRET": null,
            "STENSIBLY_OAUTH_ACCESS_TOKEN_SECONDS": null,
            "STENSIBLY_OAUTH_AUTHORIZATION_CODE_SECONDS": null,
            "STENSIBLY_OAUTH_REFRESH_TOKEN_SECONDS": null
          }
          JSON
          bunx wrangler secret bulk "$rollback_file"
          rm -f "$rollback_file"
          trap - EXIT

          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
            done
            return 1
          }
          retry bun run verify:hosted
          retry bun run verify:hosted -- --endpoint "$WORKER_ORIGIN"
          retry bun run verify:oauth -- --expect disabled
          retry bun run verify:oauth -- \
            --endpoint "$WORKER_ORIGIN" \
            --issuer "$CANONICAL_ORIGIN" \
            --expect disabled

      - name: Record successful or already-enabled state
        if: steps.verify_enabled.outcome == 'success'
        run: |
          {
            echo "## W01 OAuth rollout complete"
            echo
            echo "- deployed source: \`$ROLLOUT_SOURCE_SHA\`"
            echo "- approval: \`$APPROVAL_REFERENCE\`"
            echo "- generation: \`$ROLLOUT_GENERATION\`"
            echo "- canonical origin: $CANONICAL_ORIGIN"
            echo "- Worker fallback: $WORKER_ORIGIN"
            echo "- bearer compatibility: passed on both origins"
            echo "- public OAuth enabled verification: passed on both origins"
          } >> "$GITHUB_STEP_SUMMARY"
