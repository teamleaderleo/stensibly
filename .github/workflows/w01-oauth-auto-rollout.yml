name: W01 automatic OAuth rollout — contained

# Contained by #367 after the merged workflow received an unresolved production-safety
# REPAIR. The original implementation remains attributable in PR #358 and commit
# c0008c32cccc6eb4ad6c443360cda49c7a3bb0df. Restore execution only through a new
# exact-head Tier 3 candidate that closes the evidence and partial-state findings.
# workflow_dispatch is retained only for operator visibility; the job cannot run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contained:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Rollout contained pending reviewed repair
        run: |
          echo "W01 OAuth rollout is contained by issue #367."
          exit 1
