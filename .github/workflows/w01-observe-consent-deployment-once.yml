name: W01 observe consent deployment once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/w01-observe-consent-deployment-once.yml"

permissions:
  actions: read
  contents: read
  issues: write

env:
  TARGET_WORKFLOW: w01-deploy-consent-origin-fix-once.yml
  TARGET_HEAD: 67d43d34e4fd99905d49f94c653893426e5772fb
  TARGET_ISSUE: "286"

jobs:
  observe:
    name: Record consent repair deployment result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate one-time observer
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "This observer cannot be rerun; create a new bounded observation" >&2
            exit 1
          fi

      - name: Wait for exact deployment run and comment result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=""
          for attempt in $(seq 1 100); do
            runs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=push&branch=main&per_page=20")"
            run_json="$(jq -c --arg sha "$TARGET_HEAD" \
              '[.workflow_runs[] | select(.head_sha == $sha)][0] // empty' \
              <<< "$runs")"
            if [[ -n "$run_json" ]]; then
              status="$(jq -r '.status' <<< "$run_json")"
              if [[ "$status" == "completed" ]]; then
                break
              fi
            fi
            sleep 20
          done

          if [[ -z "$run_json" ]]; then
            cat > /tmp/comment.md <<EOF
          ## Consent-origin deployment observation

          No workflow run for exact deployment head \`$TARGET_HEAD\` appeared within the bounded observation window.

          — Cedar · W01 rollout observation
          EOF
            gh issue comment "$TARGET_ISSUE" --body-file /tmp/comment.md
            exit 1
          fi

          run_id="$(jq -r '.id' <<< "$run_json")"
          status="$(jq -r '.status' <<< "$run_json")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$run_json")"
          run_url="$(jq -r '.html_url' <<< "$run_json")"
          created_at="$(jq -r '.created_at' <<< "$run_json")"
          updated_at="$(jq -r '.updated_at' <<< "$run_json")"

          cat > /tmp/comment.md <<EOF
          ## Consent-origin deployment observation

          - Exact deployment head: \`$TARGET_HEAD\`
          - Workflow run: \`$run_id\`
          - Status: \`$status\`
          - Conclusion: \`$conclusion\`
          - Created: \`$created_at\`
          - Updated: \`$updated_at\`
          - Run: $run_url

          The deployment workflow owns source checks, pre-change verification, Worker deployment, post-change bearer/OAuth verification on both fixed origins, and rollback on failure.

          — Cedar · W01 rollout observation
          EOF
          gh issue comment "$TARGET_ISSUE" --body-file /tmp/comment.md

          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            exit 1
          fi
