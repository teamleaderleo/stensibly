name: W01 observe OAuth diagnostic deployment once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/w01-observe-oauth-diagnostic-deploy-once.yml"

permissions:
  actions: read
  contents: read
  issues: write

env:
  DEPLOYMENT_SHA: 0bb34bafc614c12c40e948bdc78ff72860763907
  DEPLOYMENT_WORKFLOW: w01-deploy-oauth-diagnostic-once.yml
  CANONICAL_ORIGIN: https://api.stensibly.com
  WORKER_ORIGIN: https://stensibly-api.leoli-082000.workers.dev

jobs:
  observe:
    name: Observe deployment run and live enabled state
    if: contains(github.event.head_commit.added, '.github/workflows/w01-observe-oauth-diagnostic-deploy-once.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Wait for the exact deployment workflow run
        id: deployment_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          run_json=""
          for attempt in $(seq 1 40); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$DEPLOYMENT_WORKFLOW/runs?head_sha=$DEPLOYMENT_SHA&per_page=5")"
            run_json="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
            if [[ -n "$run_json" && "$(jq -r '.status' <<< "$run_json")" == "completed" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_json" ]]; then
            echo "No deployment workflow run found for $DEPLOYMENT_SHA" >&2
            exit 1
          fi
          status="$(jq -r '.status' <<< "$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
          run_id="$(jq -r '.id' <<< "$run_json")"
          if [[ "$status" != "completed" ]]; then
            echo "Deployment workflow run did not complete within the observation window" >&2
            exit 1
          fi
          jq '{id, name, event, status, conclusion, head_sha, run_attempt, created_at, updated_at, html_url}' \
            <<< "$run_json" > evidence/deployment-workflow-run.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [[ "$conclusion" != "success" ]]; then
            echo "Deployment workflow concluded $conclusion" >&2
            exit 1
          fi

      - name: Prove deployment job steps succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deployment_run.outputs.run_id }}
        run: |
          set -euo pipefail
          jobs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          jq '[.jobs[] | {name, status, conclusion, steps: [.steps[] | {name, status, conclusion}]}]' \
            <<< "$jobs" > evidence/deployment-workflow-jobs.json
          jq -e '
            [.jobs[] | select(.name == "Deploy and verify bounded OAuth callback diagnosis")] as $matches
            | ($matches | length) == 1
            and $matches[0].conclusion == "success"
            and ([ $matches[0].steps[] | select(.name == "Deploy accepted diagnostic to the dogfood Worker" and .conclusion == "success") ] | length) == 1
            and ([ $matches[0].steps[] | select(.name == "Verify deployed bearer and enabled OAuth state" and .conclusion == "success") ] | length) == 1
          ' <<< "$jobs" >/dev/null

      - name: Record active Worker deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler deployments list --name stensibly-api --json > /tmp/deployments.json
          jq -e 'sort_by(.created_on) | last | (.versions | length) == 1 and .versions[0].percentage == 100' /tmp/deployments.json >/dev/null
          jq 'sort_by(.created_on) | last | {deployment_id: .id, version_id: .versions[0].version_id, percentage: .versions[0].percentage, created_on: .created_on}' \
            /tmp/deployments.json > evidence/active-worker-deployment.json

      - name: Independently verify bearer and enabled OAuth on both origins
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted | tee evidence/bearer-canonical.txt
          bun run verify:hosted -- --endpoint "$WORKER_ORIGIN" | tee evidence/bearer-worker.txt
          bun run verify:oauth -- --expect enabled | tee evidence/oauth-canonical.txt
          bun run verify:oauth -- --endpoint "$WORKER_ORIGIN" --issuer "$CANONICAL_ORIGIN" --expect enabled | tee evidence/oauth-worker.txt

      - name: Post bounded deployment evidence to issue 402
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deployment_run.outputs.run_id }}
        run: |
          set -euo pipefail
          deployment_id="$(jq -r '.deployment_id' evidence/active-worker-deployment.json)"
          version_id="$(jq -r '.version_id' evidence/active-worker-deployment.json)"
          created_on="$(jq -r '.created_on' evidence/active-worker-deployment.json)"
          cat > evidence/issue-comment.md <<EOF
          ## OAuth callback diagnostic deployment verified

          - Source on main: \`$DEPLOYMENT_SHA\`
          - Deployment workflow run: \`$RUN_ID\` — success
          - Active Worker deployment: \`$deployment_id\`
          - Active Worker version: \`$version_id\` at 100%
          - Deployment observed at: \`$created_on\`
          - Bearer compatibility: passed on canonical and Worker origins
          - Public OAuth contract: 5/5 enabled on canonical and Worker origins

          The bounded callback \`stage\` diagnostic is live. Retry the real GitHub login and retain only one of \`token_exchange\`, \`unexpected_scope\`, \`identity_request\`, or \`identity_payload\` if the callback still fails.

          — Lantern · Foundry
            Intention: move from live diagnosis to the next concrete OAuth repair
          EOF
          gh issue comment 402 --body-file evidence/issue-comment.md

      - name: Upload bounded observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-oauth-diagnostic-deployment-observation
          path: evidence
          if-no-files-found: warn
          retention-days: 3
