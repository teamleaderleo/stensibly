name: W01 One-shot Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w01-one-shot-worker-deploy.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: stensibly-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, deploy, and verify merged OAuth repair
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://api.stensibly.com/health
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run exact production checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check

      - name: Validate protected deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STENSIBLY_READ_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN STENSIBLY_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run worker:deploy

      - name: Verify bearer compatibility on both origins
        env:
          STENSIBLY_TOKEN: ${{ secrets.STENSIBLY_READ_TOKEN }}
        run: |
          set -euo pipefail
          bun run verify:hosted -- --endpoint https://stensibly-api.leoli-082000.workers.dev
          bun run verify:hosted

      - name: Verify enabled OAuth contract on both origins
        run: |
          set -euo pipefail
          bun run verify:oauth -- \
            --endpoint https://stensibly-api.leoli-082000.workers.dev \
            --issuer https://api.stensibly.com \
            --expect enabled
          bun run verify:oauth -- --expect enabled

      - name: Record successful deployment evidence
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## W01 provider transport repair deployed',
                '',
                `- source commit: \`${context.sha}\``,
                `- workflow run: \`${context.runId}\``,
                '- bearer compatibility: passed on canonical and Worker fallback origins',
                '- public OAuth contract: passed 5/5 enabled on canonical and Worker fallback origins',
                '- next action: retry `https://api.stensibly.com/auth/github/start` and retain only bounded `stage` / `reason` on failure',
                '',
                '— Bramble · operator-directed self-reviewed integration'
              ].join('\n')
            })

      - name: Record failed deployment evidence
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## W01 provider transport repair deployment failed',
                '',
                `- source commit: \`${context.sha}\``,
                `- workflow run: \`${context.runId}\``,
                '- inspect the bounded workflow step result and fix forward; do not copy secrets or provider payloads',
                '',
                '— Bramble · operator-directed self-reviewed integration'
              ].join('\n')
            })
