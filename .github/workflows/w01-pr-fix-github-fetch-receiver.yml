name: W01 PR Fix GitHub Fetch Receiver

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/w01-github-fetch-receiver-trigger

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'bramble/github-fetch-receiver-fix'
    name: Apply and verify GitHub fetch receiver fix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply exact fix
        run: python3 .github/scripts/w01_fix_github_fetch_receiver.py
      - name: Run exact checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run test:convex
          bun run worker:check
      - name: Commit verified fix
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-preflight.test.ts
          git commit -m "Preserve Worker fetch invocation context"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record verified candidate
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 286,
              body: [
                '## GitHub fetch receiver fix verified',
                '',
                `- exact candidate: \`${{ steps.commit.outputs.sha }}\``,
                `- workflow run: \`${context.runId}\``,
                '- native Worker fetch is invoked through a stable wrapper instead of as a client method',
                '- receiver-sensitive regression test passed',
                '- typecheck, Bun tests, Convex tests, and Worker bundle passed',
                '',
                '— Bramble · W01 fix-forward'
              ].join('\n')
            });
