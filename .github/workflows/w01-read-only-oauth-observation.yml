name: W01 read-only OAuth observation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/w01-read-only-oauth-observation.yml"

permissions:
  contents: read

concurrency:
  group: w01-read-only-oauth-observation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    name: Observe ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: canonical
            endpoint: https://api.stensibly.com
          - target: worker-fallback
            endpoint: https://stensibly-api.leoli-082000.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run unauthenticated disabled-state verifier
        id: verify
        continue-on-error: true
        env:
          ENDPOINT: ${{ matrix.endpoint }}
        run: |
          set -euo pipefail
          {
            echo "source_revision=${GITHUB_SHA}"
            echo "target=${{ matrix.target }}"
            echo "endpoint=${ENDPOINT}"
            echo "issuer=https://api.stensibly.com"
            echo "expectation=disabled"
            echo "observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            bun run verify:oauth -- \
              --endpoint "$ENDPOINT" \
              --issuer https://api.stensibly.com \
              --expect disabled
          } 2>&1 | tee "oauth-observation-${{ matrix.target }}.txt"
      - name: Publish bounded observation summary
        if: always()
        run: |
          {
            echo "## Read-only OAuth observation — ${{ matrix.target }}"
            echo
            echo '```text'
            cat "oauth-observation-${{ matrix.target }}.txt" 2>/dev/null \
              || echo "Verifier did not produce output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-oauth-observation-${{ matrix.target }}
          path: oauth-observation-${{ matrix.target }}.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when the declared disabled contract did not pass
        if: steps.verify.outcome != 'success'
        run: exit 1
