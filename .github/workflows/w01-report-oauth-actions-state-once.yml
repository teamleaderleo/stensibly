name: W01 report OAuth Actions state once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/w01-report-oauth-actions-state-once.yml"

permissions:
  actions: read
  contents: read
  issues: write

env:
  DEPLOYMENT_SHA: 0bb34bafc614c12c40e948bdc78ff72860763907
  OBSERVER_SHA: e9c84926e9bb5e117c21e860a0a6f8f5c2610a97
  DEPLOYMENT_WORKFLOW: w01-deploy-oauth-diagnostic-once.yml
  OBSERVER_WORKFLOW: w01-observe-oauth-diagnostic-deploy-once.yml

jobs:
  report:
    name: Publish bounded OAuth Actions state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact workflow runs and post issue evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence

          fetch_run() {
            local workflow="$1"
            local sha="$2"
            local output="$3"
            local response run_json
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&per_page=10")"
            run_json="$(jq -c '.workflow_runs | sort_by(.created_at) | last // null' <<< "$response")"
            printf '%s\n' "$run_json" > "$output"
          }

          fetch_run "$DEPLOYMENT_WORKFLOW" "$DEPLOYMENT_SHA" evidence/deployment-run.json
          fetch_run "$OBSERVER_WORKFLOW" "$OBSERVER_SHA" evidence/observer-run.json

          deployment_id="$(jq -r '.id // "not_found"' evidence/deployment-run.json)"
          deployment_status="$(jq -r '.status // "not_found"' evidence/deployment-run.json)"
          deployment_conclusion="$(jq -r '.conclusion // "pending_or_not_found"' evidence/deployment-run.json)"
          observer_id="$(jq -r '.id // "not_found"' evidence/observer-run.json)"
          observer_status="$(jq -r '.status // "not_found"' evidence/observer-run.json)"
          observer_conclusion="$(jq -r '.conclusion // "pending_or_not_found"' evidence/observer-run.json)"

          if [[ "$deployment_id" != "not_found" ]]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$deployment_id/jobs?per_page=100" \
              | jq '[.jobs[] | {name, status, conclusion, steps: [.steps[] | {name, status, conclusion}]}]' \
              > evidence/deployment-jobs.json
          else
            printf '[]\n' > evidence/deployment-jobs.json
          fi

          if [[ "$observer_id" != "not_found" ]]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$observer_id/jobs?per_page=100" \
              | jq '[.jobs[] | {name, status, conclusion, steps: [.steps[] | {name, status, conclusion}]}]' \
              > evidence/observer-jobs.json
          else
            printf '[]\n' > evidence/observer-jobs.json
          fi

          deployment_steps="$(jq -r '[.[] | .name + ":" + (.conclusion // .status)] | join(", ")' evidence/deployment-jobs.json)"
          observer_steps="$(jq -r '[.[] | .name + ":" + (.conclusion // .status)] | join(", ")' evidence/observer-jobs.json)"

          cat > evidence/issue-comment.md <<EOF
          ## OAuth deployment Actions state

          - Deployment generation: \`$DEPLOYMENT_SHA\`
          - Deployment run: \`$deployment_id\` — status \`$deployment_status\`, conclusion \`$deployment_conclusion\`
          - Deployment jobs: \`${deployment_steps:-none}\`
          - Observer generation: \`$OBSERVER_SHA\`
          - Observer run: \`$observer_id\` — status \`$observer_status\`, conclusion \`$observer_conclusion\`
          - Observer jobs: \`${observer_steps:-none}\`

          This report contains workflow IDs, fixed statuses, conclusions, and job names only. It contains no secret values, provider payloads, OAuth codes, tokens, or session data.

          — Lantern · Foundry
            Intention: expose the exact failed or completed deployment step and continue fixing forward
          EOF

          gh issue comment 402 --body-file evidence/issue-comment.md

      - name: Upload bounded Actions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-oauth-actions-state
          path: evidence
          if-no-files-found: warn
          retention-days: 3
