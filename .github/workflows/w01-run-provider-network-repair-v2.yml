name: Run scoped provider network repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/w01-run-provider-network-repair-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Execute scoped patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 <<'PY' > .github/provider-network-repair-v4-error.txt 2>&1
          from pathlib import Path

          source = Path('.github/workflows/w01-apply-provider-network-repair-v4.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'provider-network-repair-v4.py', 'exec'))
          PY
          status=$?
          set -e
          exit "$status"

      - name: Commit bounded failure receipt
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/provider-network-repair-v4-error.txt
          git commit -m "Record scoped provider repair failure"
          git push origin HEAD:${{ github.head_ref }}

      - name: Fail after recording receipt
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - name: Install dependencies
        if: steps.patch.outcome == 'success'
        run: bun install --frozen-lockfile

      - name: Validate repair
        if: steps.patch.outcome == 'success'
        run: |
          bun test test/hosted-auth-github-http-client.test.ts
          bun run typecheck
          git diff --check

      - name: Commit validated source
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hosted-auth.ts test/hosted-auth-github-http-client.test.ts
          git commit -m "Split GitHub provider network failures"
          git push origin HEAD:${{ github.head_ref }}
