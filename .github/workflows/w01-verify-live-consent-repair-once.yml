name: W01 verify live consent repair once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/w01-verify-live-consent-repair-once.yml"

permissions:
  contents: read
  issues: write

env:
  ENDPOINT: https://api.stensibly.com/oauth/consent
  TARGET_ISSUE: "286"
  REPAIR_COMMIT: 02697a4ba15b9c129d854a90acc63ccabaa6fc2d

jobs:
  verify:
    name: Verify live consent compatibility behavior
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate one-time credential-free probe
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "This live probe cannot be rerun; create a new bounded generation" >&2
            exit 1
          fi

      - name: Poll for repaired live behavior and record result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/consent-probe

          probe() {
            local label="$1"
            local origin="$2"
            local site="$3"
            local output="/tmp/consent-probe/$label.json"
            local -a args=(
              --silent --show-error
              --connect-timeout 5 --max-time 10
              --output "$output" --write-out "%{http_code}"
              --request POST "$ENDPOINT"
              --header "Content-Type: application/x-www-form-urlencoded"
              --header "Sec-Fetch-Site: $site"
              --header "Sec-Fetch-Mode: navigate"
              --data ""
            )
            if [[ -n "$origin" ]]; then
              args+=(--header "Origin: $origin")
            fi
            local status
            status="$(curl "${args[@]}")"
            local error description
            error="$(jq -r '.error // "invalid_json"' "$output" 2>/dev/null || echo invalid_json)"
            description="$(jq -r '.error_description // "missing"' "$output" 2>/dev/null || echo missing)"
            printf '%s|%s|%s\n' "$status" "$error" "$description"
          }

          repaired=false
          omitted_result=""
          null_result=""
          for attempt in $(seq 1 100); do
            omitted_result="$(probe omitted "" same-origin || true)"
            null_result="$(probe null null same-origin || true)"
            if [[ "$omitted_result" == "400|invalid_request|Consent request validation failed" \
              && "$null_result" == "400|invalid_request|Consent request validation failed" ]]; then
              repaired=true
              break
            fi
            sleep 15
          done

          cross_site_result="$(probe cross-site "" cross-site || true)"
          if [[ "$cross_site_result" != "403|access_denied|Consent origin is not allowed" ]]; then
            repaired=false
          fi

          cat > /tmp/comment.md <<EOF
          ## Live consent-origin repair probe

          - Repair commit: \`$REPAIR_COMMIT\`
          - Omitted-Origin same-origin navigation: \`$omitted_result\`
          - Null-Origin same-origin navigation: \`$null_result\`
          - Cross-site navigation: \`$cross_site_result\`
          - Result: \`$([[ "$repaired" == "true" ]] && echo deployed_verified || echo pending_or_failed)\`

          This credential-free probe sent empty form bodies and carried no cookies, OAuth codes, tokens, client identifiers, or signed consent payloads.

          — Cedar · W01 live verification
          EOF
          gh issue comment "$TARGET_ISSUE" --body-file /tmp/comment.md

          if [[ "$repaired" != "true" ]]; then
            exit 1
          fi
