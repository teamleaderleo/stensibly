name: Build bounded item event envelope

on:
  push:
    branches:
      - wicket/149-item-event-envelope
    paths:
      - .github/wicket-149-run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - id: apply
        name: Apply bounded envelope slice
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git config user.name "Wicket Stensibly Worker"
          git config user.email "teamleaderleo@users.noreply.github.com"
          {
            python3 <<'PY'
          import subprocess

          original_raw = subprocess.check_output([
              "git",
              "show",
              "0eb11cd8bd26026fedab5dbf50ae2d0fb2e2eea9:.github/workflows/wicket-149-event-envelope.yml",
          ], text=True)
          body = original_raw.split("          python3 <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          script = "\n".join(
              line[10:] if line.startswith(" " * 10) else line
              for line in body.splitlines()
          )
          original = '''def replace_once(path: str, old: str, new: str) -> None:
    file = Path(path)
    source = file.read_text()
    if source.count(old) != 1:
        raise SystemExit(f"{path}: expected one anchor, found {source.count(old)}")
    file.write_text(source.replace(old, new))'''
          instrumented = '''_replace_index = 0

def replace_once(path: str, old: str, new: str) -> None:
    global _replace_index
    _replace_index += 1
    file = Path(path)
    source = file.read_text()
    count = source.count(old)
    if count != 1:
        raise SystemExit(
            f"anchor #{_replace_index} {path}: expected one anchor, found {count}; old={old[:240]!r}"
        )
    file.write_text(source.replace(old, new))'''
          if script.count(original) != 1:
              raise SystemExit("could not instrument original patch helper")
          script = script.replace(original, instrumented)
          exec(compile(script, "wicket-149-envelope", "exec"))
          PY
            git diff --check
          } 2>&1 | tee /tmp/wicket-149-result.txt
      - id: install
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: bun install 2>&1 | tee -a /tmp/wicket-149-result.txt
      - id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee -a /tmp/wicket-149-result.txt
      - id: bun_tests
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test 2>&1 | tee -a /tmp/wicket-149-result.txt
      - id: convex_tests
        if: steps.bun_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:convex 2>&1 | tee -a /tmp/wicket-149-result.txt
      - id: worker_check
        if: steps.convex_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bun run worker:check 2>&1 | tee -a /tmp/wicket-149-result.txt
      - name: Publish source candidate
        if: steps.worker_check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/wicket-149-run
          rm -f .github/wicket-149-result.txt
          git add \
            src/event-envelope.ts \
            src/schemas.ts \
            src/store.ts \
            src/ledger.ts \
            src/sqlite-ledger.ts \
            src/item-detail-sqlite.ts \
            convex/schema.ts \
            convex/lib/domain.ts \
            convex/events.ts \
            convex/lib/itemHistory.ts \
            site/item-detail.js \
            site/item-detail.d.ts \
            test/event-envelope.test.ts \
            convex/eventEnvelope.test.ts
          git commit -m "Add bounded item event envelopes"
          git push origin HEAD:wicket/149-item-event-envelope
      - name: Publish failure diagnostics
        if: always() && steps.worker_check.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/wicket-149-result.txt /tmp/wicket-149-result.saved || echo "executor stopped before diagnostics" > /tmp/wicket-149-result.saved
          git reset --hard HEAD
          git rm -f .github/wicket-149-run
          cp /tmp/wicket-149-result.saved .github/wicket-149-result.txt
          git add .github/wicket-149-result.txt
          git commit -m "Record item event envelope build failure"
          git push origin HEAD:wicket/149-item-event-envelope
