          import { afterEach, describe, expect, test } from "bun:test";
          import { readPublicEvent } from "../site/item-detail.js";
          import { ConflictError, StensiblyStore } from "../src/store.js";

          const stores: StensiblyStore[] = [];
          afterEach(() => {
            while (stores.length) stores.pop()?.close();
          });

          function store(): StensiblyStore {
            const value = new StensiblyStore(":memory:");
            stores.push(value);
            return value;
          }

          describe("item event envelopes", () => {
            test("assigns canonical per-item sequence and preserves explicit relationships", () => {
              const ledger = store();
              const item = ledger.createItem({
                project: "threads",
                kind: "task",
                title: "Trace replies",
                priority: 50,
              });
              const created = ledger.listEvents(item.id)[0];
              expect(created).toMatchObject({
                eventEnvelopeVersion: 1,
                aggregateSequence: 1,
                relationship: null,
              });

              const response = ledger.recordEvent({
                itemId: item.id,
                type: "review.responded",
                payload: { summary: "Addressed the review." },
                relationship: { kind: "responds_to", eventId: created!.id },
                idempotencyKey: "reply-once",
              });
              const replay = ledger.recordEvent({
                itemId: item.id,
                type: "review.responded",
                payload: { summary: "Addressed the review." },
                relationship: { kind: "responds_to", eventId: created!.id },
                idempotencyKey: "reply-once",
              });
              expect(replay.id).toBe(response.id);
              expect(replay.aggregateSequence).toBe(2);
              expect(ledger.listEvents(item.id)).toHaveLength(2);

              ledger.db.query("UPDATE events SET created_at = ?1 WHERE item_id = ?2")
                .run("2026-07-29T00:00:00.000Z", item.id);
              const ordered = ledger.listEvents(item.id);
              expect(ordered.map((event) => event.aggregateSequence)).toEqual([1, 2]);
              expect(ordered[1]?.relationship).toEqual({
                kind: "responds_to",
                eventId: created!.id,
              });

              expect(readPublicEvent(response, item.id)).toMatchObject({
                eventEnvelopeVersion: 1,
                aggregateSequence: 2,
                relationship: { kind: "responds_to", eventId: created!.id },
              });
            });

            test("rejects missing and cross-item relationship targets", () => {
              const ledger = store();
              const first = ledger.createItem({
                project: "threads",
                kind: "task",
                title: "First",
                priority: 50,
              });
              const second = ledger.createItem({
                project: "threads",
                kind: "task",
                title: "Second",
                priority: 50,
              });
              const firstEvent = ledger.listEvents(first.id)[0]!;

              expect(() => ledger.recordEvent({
                itemId: second.id,
                type: "review.responded",
                payload: {},
                relationship: { kind: "responds_to", eventId: firstEvent.id },
              })).toThrow(ConflictError);
              expect(() => ledger.recordEvent({
                itemId: second.id,
                type: "review.responded",
                payload: {},
                relationship: { kind: "related_to", eventId: "evt_missing" },
              })).toThrow("same item");
            });

            test("projects imported legacy rows without fabricated precision", () => {
              const ledger = store();
              const item = ledger.createItem({
                project: "threads",
                kind: "task",
                title: "Legacy",
                priority: 50,
              });
              ledger.db.query(`
                INSERT INTO events (
                  id, item_id, actor_id, type, payload_json, idempotency_key, created_at
                ) VALUES (?1, ?2, NULL, ?3, '{}', NULL, ?4)
              `).run("evt_legacy", item.id, "legacy.imported", "2020-01-01T00:00:00.000Z");

              const legacy = ledger.listEvents(item.id)
                .find((event) => event.id === "evt_legacy");
              expect(legacy).toMatchObject({
                eventEnvelopeVersion: null,
                aggregateSequence: null,
                relationship: null,
              });
              expect(readPublicEvent(legacy, item.id)).toMatchObject({
                eventEnvelopeVersion: null,
                aggregateSequence: null,
                relationship: null,
              });
            });
          });
          '''))

          Path("convex/eventEnvelope.test.ts").write_text(block(r'''
          import { beforeEach, describe, expect, test, vi } from "vitest";
          import { convexTest } from "convex-test";
          import { convexApi } from "./refs";
          import schema from "./schema";
          import { modules } from "./test.setup";

          const serviceSecret = "event-envelope-secret";
          const workspace = "test";
          const actor = { id: "wicket", name: "Wicket", kind: "agent" as const };

          beforeEach(() => {
            vi.stubEnv("STENSIBLY_SERVICE_SECRET", serviceSecret);
            vi.spyOn(Date, "now").mockReturnValue(1_000);
          });

          describe("hosted item event envelopes", () => {
            test("assigns sequence, replays idempotently, and validates same-item relationships", async () => {
              const t = convexTest(schema, modules);
              const firstItem = await createItem(t, "first");
              const initial = await listEvents(t, firstItem.id);
              const created = initial.events[0];
              expect(created).toMatchObject({
                eventEnvelopeVersion: 1,
                aggregateSequence: 1,
                relationship: null,
              });

              const progress = await record(t, firstItem.id, {
                type: "work.progressed",
                idempotencyKey: "progress-once",
              });
              const response = await record(t, firstItem.id, {
                type: "review.responded",
                idempotencyKey: "response-once",
                relationship: { kind: "responds_to", eventId: progress.id },
              });
              const replay = await record(t, firstItem.id, {
                type: "review.responded",
                idempotencyKey: "response-once",
                relationship: { kind: "responds_to", eventId: progress.id },
              });
              expect(replay).toEqual(response);
              expect(response).toMatchObject({
                aggregateSequence: 3,
                relationship: { kind: "responds_to", eventId: progress.id },
              });

              const listed = await listEvents(t, firstItem.id);
              expect(listed.events.map((event: any) => event.aggregateSequence)).toEqual([1, 2, 3]);

              const secondItem = await createItem(t, "second");
              await expect(record(t, secondItem.id, {
                type: "review.responded",
                relationship: { kind: "related_to", eventId: progress.id },
              })).rejects.toThrow("same item");
            });

            test("projects legacy rows with an explicit compatibility state", async () => {
              const t = convexTest(schema, modules);
              const item = await createItem(t, "legacy");
              await t.run(async (ctx) => {
                const row = (await ctx.db.query("items").collect())
                  .find((entry) => entry.externalId === item.id);
                if (!row) throw new Error("item disappeared");
                await ctx.db.insert("events", {
                  workspaceId: row.workspaceId,
                  projectId: row.projectId,
                  itemId: row._id,
                  externalId: "evt_legacy",
                  type: "legacy.imported",
                  payload: {},
                  createdAt: 500,
                });
              });

              const listed = await listEvents(t, item.id);
              expect(listed.events.find((event: any) => event.id === "evt_legacy"))
                .toMatchObject({
                  eventEnvelopeVersion: null,
                  aggregateSequence: null,
                  relationship: null,
                });
            });
          });

          async function createItem(t: ReturnType<typeof convexTest>, title: string) {
            return await t.mutation(convexApi.items.create, {
              serviceSecret,
              workspace,
              project: "threads",
              kind: "task",
              title,
              priority: 50,
              actor,
            }) as { id: string };
          }

          async function record(
            t: ReturnType<typeof convexTest>,
            id: string,
            input: {
              type: string;
              idempotencyKey?: string;
              relationship?: { kind: "responds_to" | "caused_by" | "related_to"; eventId: string };
            },
          ) {
            return await t.mutation(convexApi.events.record, {
              serviceSecret,
              workspace,
              id,
              actor,
              type: input.type,
              payload: {},
              idempotencyKey: input.idempotencyKey,
              relationship: input.relationship,
            }) as any;
          }

          async function listEvents(t: ReturnType<typeof convexTest>, id: string) {
            return await t.query(convexApi.events.list, {
              serviceSecret,
              workspace,
              id,
              limit: 100,
            }) as { events: any[] };
          }
          '''))
