                  .min(1)
                  .max(200)
                  .regex(/^evt_[A-Za-z0-9._:-]+$/),
              });

              export const recordEventSchema = z.object({
                actor: actorSchema.optional(),
              '''),
          )
          replace_once(
              "src/schemas.ts",
              '  payload: z.record(z.string(), z.unknown()).default({}),\n});\n',
