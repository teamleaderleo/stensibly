name: Build item event envelope candidate

on:
  pull_request:
    branches:
      - wicket/149-envelope-executor

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: wicket/149-item-event-envelope
      - uses: oven-sh/setup-bun@v2
      - name: Replay current main and apply bounded envelope slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wicket Stensibly Worker"
          git config user.email "teamleaderleo@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).lstrip("\n")

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {source.count(old)}")
              file.write_text(source.replace(old, new))

          Path("src/event-envelope.ts").write_text(block(r'''
          export const ITEM_EVENT_ENVELOPE_VERSION = 1 as const;
          export const itemEventRelationshipKinds = [
            "responds_to",
            "caused_by",
            "related_to",
          ] as const;

          export type ItemEventRelationshipKind = typeof itemEventRelationshipKinds[number];

          export interface ItemEventRelationship {
            kind: ItemEventRelationshipKind;
            eventId: string;
          }

          const relationshipKinds = new Set<string>(itemEventRelationshipKinds);
          const safeEventIdPattern = /^evt_[A-Za-z0-9._:-]+$/;
          const unsafeTextPattern = /[\u0000-\u001f\u007f-\u009f\u2028\u2029\u202a-\u202e\u2066-\u2069]/u;

          export function normalizeItemEventRelationship(
            value: ItemEventRelationship,
          ): ItemEventRelationship {
            if (!relationshipKinds.has(value.kind)) {
              throw new Error("Event relationship kind is invalid");
            }
            const eventId = value.eventId.trim();
            if (
              !eventId
              || eventId.length > 200
              || unsafeTextPattern.test(eventId)
              || !safeEventIdPattern.test(eventId)
            ) {
              throw new Error("Related event id is invalid");
            }
            return { kind: value.kind, eventId };
          }
          '''))

          replace_once(
              "src/schemas.ts",
              'import { isReservedItemControlEventType } from "./item-control-events.js";\n',
              'import { itemEventRelationshipKinds } from "./event-envelope.js";\n'
              'import { isReservedItemControlEventType } from "./item-control-events.js";\n',
          )
          replace_once(
              "src/schemas.ts",
              block('''
              export const recordEventSchema = z.object({
